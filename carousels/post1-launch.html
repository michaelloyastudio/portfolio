<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<title>Michael Loya Studio — Launch Carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }
  :root {
    --brand: #ff8e3d;
    --light-bg: #E8E0D4;
    --dark-bg: #0a0a0a;
    --warm-gray: #8a8580;
    --espresso: #0a0a0a;
  }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; }
  .sans { font-family: 'Space Grotesk', sans-serif; }

  .ig-frame {
    width: 420px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .ig-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
  }
  .ig-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .ig-avatar svg { width: 22px; height: auto; }
  .ig-handle { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .ig-sub { font-size: 11px; color: #8a8580; }
  .ig-viewport {
    width: 420px; height: 560px;
    overflow: hidden; position: relative; cursor: grab;
  }
  .ig-viewport:active { cursor: grabbing; }
  .ig-track {
    display: flex; height: 100%;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .slide {
    width: 420px; height: 560px;
    flex-shrink: 0; position: relative;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ig-dots { display: flex; justify-content: center; gap: 5px; padding: 12px 0; }
  .ig-dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
  .ig-dot.active { background: var(--brand); }
  .ig-actions { display: flex; align-items: center; padding: 10px 16px; gap: 16px; }
  .ig-actions svg { width: 24px; height: 24px; }
  .ig-bookmark { margin-left: auto; }
  .ig-caption { padding: 0 16px 16px; font-size: 13px; color: #1a1a1a; line-height: 1.5; }
  .ig-caption strong { font-weight: 600; }
  .ig-caption .time { display: block; margin-top: 6px; font-size: 10px; color: #8a8580; text-transform: uppercase; letter-spacing: 0.5px; }

  h2.export-title {
    color: #E8E0D4; font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
    margin-top: 60px; margin-bottom: 20px; opacity: 0.5;
  }
  .export-btn {
    background: var(--brand); color: #fff; border: none;
    padding: 14px 32px; border-radius: 28px;
    font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; margin-bottom: 30px; transition: opacity 0.2s;
  }
  .export-btn:hover { opacity: 0.85; }
  .export-btn:disabled { opacity: 0.5; cursor: wait; }
  .export-hidden { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>

<div class="ig-frame">
  <div class="ig-header">
    <div class="ig-avatar">
      <svg viewBox="0 0 375.83 292.72" xmlns="http://www.w3.org/2000/svg"><polyline points="9.75 170.75 71.41 171.24 107.42 96.06 146.07 215.19 191.08 9.75 249.85 282.96 298.53 171.95 366.08 172.45" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="24"/></svg>
    </div>
    <div>
      <div class="ig-handle">michaelloyastudio</div>
      <div class="ig-sub">Building something</div>
    </div>
  </div>
  <div class="ig-viewport" id="viewport">
    <div class="ig-track" id="track"></div>
  </div>
  <div class="ig-dots" id="dots"></div>
  <div class="ig-actions">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    <svg class="ig-bookmark" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div class="ig-caption">
    <strong>michaelloyastudio</strong> Building my portfolio from scratch. No templates — just code. Still cooking, but come watch. 🔗 in bio<br>
    <span class="time">2 hours ago</span>
  </div>
</div>

<h2 class="export-title">↓ Export all slides as 1080×1440 PNGs</h2>
<button class="export-btn" id="exportBtn" onclick="exportAll()">Download All Slides</button>
<div class="export-hidden" id="exportStage"></div>

<script>
const TOTAL = 7;

// Inline SVG logo strings
const logoDark = `<svg viewBox="0 0 375.83 292.72" xmlns="http://www.w3.org/2000/svg" style="height:28px;width:auto;"><polyline points="9.75 170.75 71.41 171.24 107.42 96.06 146.07 215.19 191.08 9.75 249.85 282.96 298.53 171.95 366.08 172.45" fill="none" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/></svg>`;
const logoCream = `<svg viewBox="0 0 375.83 292.72" xmlns="http://www.w3.org/2000/svg" style="height:28px;width:auto;"><polyline points="9.75 170.75 71.41 171.24 107.42 96.06 146.07 215.19 191.08 9.75 249.85 282.96 298.53 171.95 366.08 172.45" fill="none" stroke="#E8E0D4" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/></svg>`;
const logoWhite = `<svg viewBox="0 0 375.83 292.72" xmlns="http://www.w3.org/2000/svg" style="height:28px;width:auto;"><polyline points="9.75 170.75 71.41 171.24 107.42 96.06 146.07 215.19 191.08 9.75 249.85 282.96 298.53 171.95 366.08 172.45" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="22"/></svg>`;

function progressBar(i, total, light) {
  const pct = ((i + 1) / total) * 100;
  const track = light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.1)';
  const fill = light ? '#0a0a0a' : '#E8E0D4';
  const label = light ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';
  return `<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;">
    <div style="flex:1;height:2px;background:${track};border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${fill};border-radius:2px;"></div>
    </div>
    <span class="sans" style="font-size:10px;color:${label};font-weight:500;">${i+1}/${total}</span>
  </div>`;
}

function arrow(light) {
  const stroke = light ? 'rgba(0,0,0,0.15)' : 'rgba(255,255,255,0.2)';
  return `<div style="position:absolute;right:0;top:0;bottom:0;width:40px;z-index:9;display:flex;align-items:center;justify-content:center;">

  </div>`;
}

        <span class="sans" style="font-size:11px;color:#8a8580;margin-left:auto;">Cover art, motion, merch</span>
      </div>

        <div><p class="sans" style="font-size:12px;font-weight:600;color:#E8E0D4;">The Grid</p><p class="sans" style="font-size:11px;color:#8a8580;margin-top:2px;">Beat maker</p></div>
      </div>
      <div style="padding:14px;border:1px solid rgba(255,255,255,0.06);border-radius:8px;display:flex;align-items:center;gap:10px;">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px;border-radius:4px;flex-shrink:0;"><rect width="400" height="400" fill="#0a0a0a"/><g transform="translate(200,200) scale(1.2)"><rect x="-120" y="-110" width="240" height="220" rx="8" fill="#131313" stroke="#333" stroke-width="0.8"/><clipPath id="tc2"><rect x="-120" y="-110" width="240" height="22" rx="8"/></clipPath><rect x="-120" y="-110" width="240" height="22" fill="#1a1a1a" clip-path="url(#tc2)"/><circle cx="-104" cy="-99" r="3" fill="#FF4466" opacity="0.7"/><circle cx="-93" cy="-99" r="3" fill="#FFD700" opacity="0.7"/><circle cx="-82" cy="-99" r="3" fill="#44FF66" opacity="0.7"/><rect x="-100" y="-72" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/><rect x="-90" y="-64" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.85"/><rect x="-90" y="-20" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/><rect x="-90" y="-12" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/><rect x="10" y="-72" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#ff8e3d" stroke-width="0.6"/><rect x="20" y="-64" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.9"/><rect x="20" y="-20" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/><rect x="20" y="-12" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/><rect x="-100" y="10" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/><rect x="-90" y="18" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.8"/><rect x="10" y="10" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/><rect x="20" y="18" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.75"/><rect x="80" y="-103" width="24" height="3" rx="1.5" fill="#ff8e3d" opacity="0.5"/></g></svg>

  // 6 — Sneak peek (Dark)
  `<div class="slide" style="background:#0a0a0a;padding:48px 40px;justify-content:center;align-items:center;text-align:center;">
    ${logoBig('#E8E0D4', 60)}

  // 7 — CTA (Light, no arrow)
  `<div class="slide" style="background:#E8E0D4;padding:48px 40px;justify-content:center;align-items:center;text-align:center;">
    ${logoBig('#0a0a0a', 50)}
    <h2 class="serif" style="font-size:28px;color:#0a0a0a;margin-top:24px;line-height:1.1;">Come see.</h2>
    <p class="sans" style="font-size:13px;color:#8a8580;margin-top:12px;line-height:1.6;">Link in bio.</p>
    ${progressBar(6, TOTAL, true)}
  </div>`,
];

// Render
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
track.innerHTML = slides.join('');
for (let i = 0; i < TOTAL; i++) {
  const dot = document.createElement('div');
  dot.className = 'ig-dot' + (i === 0 ? ' active' : '');
  dotsEl.appendChild(dot);
}

// Swipe
let current = 0, startX = 0, isDragging = false;
const viewport = document.getElementById('viewport');
function go(dir) {
  if (dir < 0 && current < TOTAL - 1) current++;
  else if (dir > 0 && current > 0) current--;
  track.style.transform = `translateX(-${current * 420}px)`;
  document.querySelectorAll('.ig-dot').forEach((d, i) => d.classList.toggle('active', i === current));
}
viewport.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; });
viewport.addEventListener('mousemove', e => { if (!isDragging) return; });
viewport.addEventListener('mouseup', e => { if (!isDragging) return; isDragging = false; const d = e.clientX - startX; if (Math.abs(d) > 40) go(d < 0 ? -1 : 1); });
viewport.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
viewport.addEventListener('touchend', e => { const d = e.changedTouches[0].clientX - startX; if (Math.abs(d) > 40) go(d < 0 ? -1 : 1); });

// Export
async function exportAll() {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true; btn.textContent = 'Exporting...';
  const stage = document.getElementById('exportStage');
  const SCALE = 2160 / 420; // exports 2160x2880 (3:4 @ 2x)
  for (let i = 0; i < slides.length; i++) {
    const w = document.createElement('div');
    w.style.width = '420px'; w.style.height = '560px';
    w.style.position = 'relative'; w.style.overflow = 'hidden';
    w.innerHTML = slides[i];
    stage.appendChild(w);
    try {
      const canvas = await html2canvas(w, { width: 420, height: 560, scale: SCALE, useCORS: true, backgroundColor: null });
      const link = document.createElement('a');
      link.download = `slide-${i + 1}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      await new Promise(r => setTimeout(r, 400));
    } catch(e) { console.error('Export failed for slide', i + 1, e); }
    stage.removeChild(w);
  }
  btn.disabled = false; btn.textContent = 'Download All Slides';
}
</script>
</body>
