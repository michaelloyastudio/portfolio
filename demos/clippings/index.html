<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clippings</title>
<link rel="stylesheet" href="style.css">
<script>
/* Site demo of the Clippings panel (the real panel.js / style.css, copied from ~/Developer/clippings) with a web
   set of the letters (letters/: only the PAY UP / OR ELSE characters, 4 per case, 220px WebP). The text is fixed; click a letter, shuffle and align work as in
   After Effects; Boil shakes the preview; Add does nothing. */
/* Every visit starts the same, nothing remembered: PAY UP / OR ELSE, centred, no boil, seed 7, which shows
   the exact pieces on the Tools tile and the Gumroad pictures (letters/letters.js is ordered so it does). */
try { localStorage.setItem('clippings.opts.v5', JSON.stringify({ text: 'PAY UP\nOR ELSE', align: 'center', mix: true, boil: false, seed: 7, pins: {} })); } catch (e) {}
</script>
<style>html, body { overflow: hidden; } #text { resize: none; cursor: default; caret-color: transparent; user-select: none; }</style>

</head>
<body>

<header><h1>Clippings</h1></header>

<section class="preview">
  <canvas id="stage" title="Click a letter to swap it"></canvas>
  <button id="shuffle" class="shuffle" title="Swap every letter">
    <svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.6 4-3.5M13 9.5C14.2 8 15.4 7 17 7h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg>
  </button>
</section>

<section class="type">
  <textarea id="text" rows="2" spellcheck="false" placeholder="Sample Text"></textarea>
</section>

<section class="chips">
  <div class="align" id="align">
    <button data-a="left" title="Align left"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg></button>
    <button data-a="center" title="Align center"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg></button>
    <button data-a="right" title="Align right"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg></button>
  </div>
  <button class="chip" id="boil">Boil</button>
</section>

<section class="go">
  <button id="add" class="big primary">Add</button>
</section>

<div id="toast"></div>

<script src="letters/letters.js?v=2"></script>
<script src="panel.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, boilT = null, P = window.ClippingsPanel;
  // no hover help tips on the site: the panel's own title attributes come off (panel.js sets some at load)
  document.querySelectorAll('[title]').forEach(function (e) { e.removeAttribute('title'); });
  // The text is fixed (PAY UP / OR ELSE): the demo only has a small set of pieces (letters/, 4 per
  // case), so it never shows the whole pack. Clicking a letter, shuffle, align, Boil and Add still work.
  $('text').readOnly = true;
  $('text').tabIndex = -1;
  // Add: clickable, does nothing here (in AE it drops the note into the comp)
  $('add').onclick = function () {};
  // Boil: the same pieces, shaking in place (a stop-motion jitter on each letter's spot and tilt). Done on
  // the preview's canvas so panel.js stays the real one: while boiling, each letter's translate / rotate
  // gets a small random nudge, and the note is redrawn a few times a second.
  var ctx = $('stage').getContext('2d'), tr = ctx.translate, ro = ctx.rotate, shaking = false;
  ctx.translate = function (x, y) { return shaking ? tr.call(this, x + (Math.random() * 2 - 1) * 1.6, y + (Math.random() * 2 - 1) * 1.6) : tr.call(this, x, y); };
  ctx.rotate = function (a) { return ro.call(this, shaking ? a + (Math.random() * 2 - 1) * 0.03 : a); };
  function boil() {
    clearInterval(boilT);
    shaking = !!P.opts.boil;
    if (shaking) boilT = setInterval(P.draw, 110);
    else P.draw();
  }
  $('boil').addEventListener('click', function () { setTimeout(boil, 0); });
  boil();
})();
</script>
</body>
</html>
