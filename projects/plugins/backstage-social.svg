<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- What the 9:16 video inside backstage-square.mp4 looks like in the TikTok feed, as a whole
       phone. Measured off a real post on an iPhone (1320x2868 screenshot, Nov 2026): the app scales
       9:16 to COVER the screen above its bottom bar, 1473 px wide on a 1320 screen, so about 5% of
       each side never shows, and the bar takes the last 257 px. Everything below is in those SCREEN
       pixels (0.323124 card px each, screen origin at card 326.73, 76.585), so positions copy
       straight off a screenshot. That lines up with the video at x302 y74 476x846; it sits at y117
       (centred) and site.css lifts it 43 px on hover. The card is repainted round the phone and
       its shadow redrawn. No platform branding. -->
  <defs>
    <symbol id="pfp" viewBox="0 0 200 200"><image width="200" height="200" href="data:image/jpeg;base64,"/></symbol>
    <clipPath id="avatar" clipPathUnits="userSpaceOnUse"><circle cx="1228" cy="1490" r="64"/></clipPath>
    <clipPath id="disc" clipPathUnits="userSpaceOnUse"><circle cx="1228" cy="2515" r="36"/></clipPath>
    <path id="phone" d="M0 180a180 180 0 0 1 180-180h960a180 180 0 0 1 180 180v2508a180 180 0 0 1-180 180h-960a180 180 0 0 1-180-180z"/>
    <clipPath id="screen"><use href="#phone"/></clipPath>
    <mask id="outside">
      <rect width="1080" height="1080" fill="#fff"/>
      <use href="#phone" transform="translate(326.73 76.585) scale(0.323124)" fill="#000"/>
    </mask>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- the card again, everywhere but the phone, with the phone's own shadow -->
  <g mask="url(#outside)">
    <rect width="1080" height="1080" fill="#E8E0D4"/>
    <use href="#phone" transform="translate(326.73 76.585) scale(0.323124)" fill="#000" filter="url(#card)"/>
  </g>

  <g transform="translate(326.73 76.585) scale(0.323124)" clip-path="url(#screen)"
     font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#fff">
    <rect x="0" y="0" width="1320" height="560" fill="url(#top)"/>
    <rect x="0" y="1880" width="1320" height="731" fill="url(#bot)"/>

    <!-- status bar + island -->
    <rect x="471" y="33" width="378" height="111" rx="55.5" fill="#000"/>
    <text x="221" y="117" font-size="52" font-weight="600" text-anchor="middle">9:41</text>
    <!-- cellular: four bars, bottoms level -->
    <rect x="937" y="102" width="11" height="14" rx="3"/>
    <rect x="953" y="94" width="11" height="22" rx="3"/>
    <rect x="969" y="86" width="11" height="30" rx="3"/>
    <rect x="985" y="78" width="11" height="38" rx="3"/>
    <!-- wifi: a 90° fan of two bands over a wedge, all from one point -->
    <g transform="translate(1053 116)">
      <path d="M0 0L-12.7-12.7A18 18 0 0 1 12.7-12.7Z"/>
      <path d="M-19.8-19.8A28 28 0 0 1 19.8-19.8" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <path d="M-29-29A41 41 0 0 1 29-29" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    </g>
    <!-- battery -->
    <rect x="1104" y="79" width="80" height="37" rx="11" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="4"/>
    <rect x="1110" y="85" width="62" height="25" rx="6"/>
    <path d="M1190 90v15a8 8 0 0 0 0-15z" fill-opacity=".4"/>

    <g filter="url(#sh)">
      <!-- feed tabs + search -->
      <text x="628" y="268" font-size="50" font-weight="600" fill-opacity=".65" text-anchor="end">Following</text>
      <text x="676" y="268" font-size="50" font-weight="700">For You</text>
      <rect x="736" y="292" width="64" height="8" rx="4"/>
      <circle cx="1238" cy="240" r="25" fill="none" stroke="#fff" stroke-width="7"/>
      <path d="M1257 259l19 19" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

      <!-- right rail, centred on x 1228 -->
      <!-- Mike's real profile picture (his YouTube/TikTok pfp, 04_Admin/07_Brand.../Profile_Pics) -->
      <g clip-path="url(#avatar)"><use href="#pfp" x="1162" y="1424" width="132" height="132"/></g>
      <circle cx="1228" cy="1490" r="66" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="1228" cy="1555" r="31" fill="#fe2c55"/>
      <path d="M1215 1555h26M1228 1542v26" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

      <path d="M1228 1738c-41-30-50-43-50-61 0-17 13-29 27-29 10 0 19 6 23 14 4-8 13-14 23-14 14 0 27 12 27 29 0 18-9 31-50 61z"/>
      <text x="1228" y="1788" font-size="37" font-weight="700" text-anchor="middle">24.1K</text>

      <path d="M1228 1857c-27 0-49 18-49 41 0 13 6 24 16 31l-6 21 24-11c5 1 10 1 15 1 27 0 49-18 49-42s-22-41-49-41z"/>
      <circle cx="1208" cy="1898" r="5" fill="#555"/><circle cx="1228" cy="1898" r="5" fill="#555"/><circle cx="1248" cy="1898" r="5" fill="#555"/>
      <text x="1228" y="1987" font-size="37" font-weight="700" text-anchor="middle">312</text>

      <path d="M1194 2058h68v83l-34-24-34 24z"/>
      <text x="1228" y="2185" font-size="37" font-weight="700" text-anchor="middle">1.2K</text>

      <path d="M1232 2272v-21l45 40-45 40v-21c-30 0-48 9-62 27 4-34 27-61 62-65z"/>
      <text x="1228" y="2381" font-size="37" font-weight="700" text-anchor="middle">Share</text>

      <circle cx="1228" cy="2515" r="56" fill="#222" stroke="#2e2e2e" stroke-width="14"/>
      <g clip-path="url(#disc)"><use href="#pfp" x="1192" y="2479" width="72" height="72"/></g>

      <!-- bottom left: who, caption, tags -->
      <!-- the block sits on the bottom: one caption line, so the name drops a line too -->
      <text x="36" y="2489" font-size="49" font-weight="700">michaelloya.studio</text>
      <text x="36" y="2575" font-size="43">Timeline and BTS preview for a recent commission</text>
    </g>

    <!-- the app's bottom bar: five tabs, then the home indicator -->
    <rect x="0" y="2611" width="1320" height="257" fill="#000"/>
    <rect x="0" y="2611" width="1320" height="2" fill="#fff" fill-opacity=".12"/>
    <g font-size="30" text-anchor="middle">
      <!-- Home (current) -->
      <path d="M132 2640l-34 29v34h22v-21h24v21h22v-34z"/>
      <text x="132" y="2750" font-weight="600">Home</text>
      <!-- Friends -->
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity=".85">
        <circle cx="386" cy="2656" r="13"/><path d="M362 2702c2-17 12-26 24-26s22 9 24 26"/>
        <circle cx="413" cy="2660" r="10"/><path d="M418 2678c11 1 19 9 20 23"/>
      </g>
      <text x="396" y="2750" fill-opacity=".85">Friends</text>
      <!-- create -->
      <rect x="606" y="2636" width="108" height="70" rx="18"/>
      <path d="M660 2655v32M644 2671h32" stroke="#000" stroke-width="7" stroke-linecap="round"/>
      <!-- Inbox -->
      <path d="M902 2648h44a9 9 0 0 1 9 9v30a9 9 0 0 1-9 9h-17l-12 11v-11h-15a9 9 0 0 1-9-9v-30a9 9 0 0 1 9-9z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-opacity=".85"/>
      <text x="924" y="2750" fill-opacity=".85">Inbox</text>
      <!-- Profile -->
      <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity=".85">
        <circle cx="1188" cy="2658" r="15"/><path d="M1160 2704c2-19 14-29 28-29s26 10 28 29"/>
      </g>
      <text x="1188" y="2750" fill-opacity=".85">Profile</text>
    </g>
    <rect x="459" y="2829" width="402" height="15" rx="7.5"/>
  </g>
</svg>
