<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Layout Editor — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #E8E0D4;
    color: #1a1a1a;
    font-family: 'Space Grotesk', sans-serif;
    user-select: none;
    cursor: default;
  }

  /* ── Title (matches studio scene) ── */
  .ed-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'din-2014-rounded-variable', sans-serif;
    font-size: 4.75rem;
    font-weight: 400;
    color: #1a1a1a;
    white-space: nowrap;
    pointer-events: none;
    z-index: 5;
    text-align: center;
    opacity: 0.45;
  }
  .ed-title-line {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 90px;
  }
  .ed-title-line span { color: #8a8580; }
  .ed-title-line img { height: 62px; width: auto; margin-right: 0.6rem; margin-top: 6px; }
  .ed-tagline {
    display: block;
    text-align: center;
    margin-top: 0.9rem;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    font-weight: 400;
    letter-spacing: 0.85em;
    text-transform: uppercase;
    color: #8a8580;
    padding-left: 0.85em;
  }

  /* ── Cards ── */
  .ed-card {
    position: absolute;
    border-radius: 8px;
    cursor: grab;
    transition: box-shadow 0.15s ease, outline 0.1s ease;
    will-change: transform;
    z-index: 10;
    outline: 2px solid transparent;
  }
  .ed-card.dragging { cursor: grabbing; box-shadow: 0 12px 32px rgba(0,0,0,0.25); z-index: 100; }
  .ed-card.selected { outline-color: #ff8e3d; }
  .ed-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .ed-card .ed-handle {
    position: absolute;
    width: 16px;
    height: 16px;
    bottom: -8px;
    right: -8px;
    background: #ff8e3d;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: nwse-resize;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 2;
  }
  .ed-card .ed-readout {
    position: absolute;
    bottom: -22px;
    left: 0;
    font-size: 10px;
    font-family: 'Space Grotesk', monospace;
    color: #3d2b1f;
    background: rgba(232,224,212,0.92);
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s ease;
  }
  .ed-card.selected .ed-readout,
  .ed-card.dragging .ed-readout { opacity: 1; }
  .ed-card .ed-label {
    position: absolute;
    top: -22px;
    left: 0;
    font-size: 11px;
    font-weight: 600;
    color: #3d2b1f;
    background: rgba(232,224,212,0.92);
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── Toolbar ── */
  .ed-toolbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a0a0a;
    color: #E8E0D4;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.78rem;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .ed-toolbar .ed-vp {
    color: #8a8580;
    font-family: monospace;
    letter-spacing: 0.05em;
  }
  .ed-btn {
    background: #ff8e3d;
    color: #0a0a0a;
    border: none;
    padding: 0.5rem 0.9rem;
    border-radius: 5px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }
  .ed-btn:hover { transform: translateY(-1px); }
  .ed-btn:active { transform: translateY(0); }
  .ed-btn.ghost { background: #2a2a2a; color: #E8E0D4; }
  .ed-btn.ghost:hover { background: #3a3a3a; }

  /* ── Output panel ── */
  .ed-output {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: #0a0a0a;
    color: #E8E0D4;
    padding: 1rem 1.2rem;
    border-radius: 8px;
    max-width: 720px;
    width: calc(100vw - 32px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    z-index: 1000;
    transition: transform 0.25s ease;
  }
  .ed-output.visible { transform: translateX(-50%) translateY(0); }
  .ed-output pre {
    background: #1a1a1a;
    color: #E8E0D4;
    padding: 0.8rem;
    border-radius: 5px;
    font-size: 0.72rem;
    line-height: 1.5;
    overflow: auto;
    max-height: 280px;
    font-family: 'JetBrains Mono', Menlo, monospace;
  }
  .ed-output-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
  }
  .ed-output-row h3 {
    font-size: 0.85rem;
    font-weight: 600;
    color: #E8E0D4;
  }
  .ed-output-actions { display: flex; gap: 8px; }

  /* ── Help ── */
  .ed-help {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: rgba(10,10,10,0.85);
    color: #8a8580;
    padding: 0.55rem 0.8rem;
    border-radius: 5px;
    font-size: 0.7rem;
    z-index: 999;
    line-height: 1.5;
  }
  .ed-help b { color: #E8E0D4; font-weight: 600; }
  .ed-help kbd {
    background: #2a2a2a;
    color: #E8E0D4;
    padding: 1px 5px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 0.65rem;
    border: 1px solid #444;
  }
</style>
</head>
<body>

<!-- Title (matches studio scene) -->
<div class="ed-title">
  <div class="ed-title-line">
    <img src="assets/brand/logo-black.svg" alt="">Michael Loya&nbsp;<span>Studio</span>
  </div>
  <div class="ed-tagline">Sound and Vision</div>
</div>

<!-- Toolbar -->
<div class="ed-toolbar">
  <span class="ed-vp" id="edVp">1440 × 900</span>
  <button class="ed-btn ghost" id="edReset">Reset</button>
  <button class="ed-btn" id="edExport">Copy positions</button>
</div>

<!-- Output panel -->
<div class="ed-output" id="edOutput">
  <div class="ed-output-row">
    <h3>positions[]</h3>
    <div class="ed-output-actions">
      <button class="ed-btn" id="edCopy">Copy</button>
      <button class="ed-btn ghost" id="edClose">Close</button>
    </div>
  </div>
  <pre id="edCode"></pre>
</div>

<!-- Help -->
<div class="ed-help">
  <b>Drag</b> images to move · <b>orange dot</b> to resize · <kbd>R</kbd> reset · <kbd>E</kbd> export
</div>

<script>
// ── Data: matches the projects array order in index.html ──
const PROJECTS = [
  { name: 'Capstone',         cover: 'projects/capstone/cover.jpg' },
  { name: 'Loya and Co.',     cover: 'projects/loya-and-co/dnd-final.jpeg' },
  { name: 'BODYARMOR',        cover: 'projects/bodyarmor-powerade/bapa.png' },
  { name: 'University Union', cover: 'projects/university-union/uu.png' },
  { name: 'LYRC',             cover: 'projects/lyrc/lyrc.png' },
  { name: 'Album Covers',     cover: 'projects/album-covers/whitenoise.jpg' },
  { name: 'hardnbaflicks',    cover: 'projects/hardnbaflicks/cover.jpg' },
  { name: 'Miscellaneous',    cover: 'projects/miscellaneous/freshmen.jpg' },
  { name: 'AI Song',          cover: 'projects/ai-song/limits-cover.jpg' },
  { name: 'Photography',      cover: 'projects/photography/photo-01.jpg' },
];

// Default positions (current production layout). User can edit these visually.
const DEFAULT_POS = [
  { x: 0.418, y: 0.205, z: -50,  s: 200 },
  { x: 0.616, y: 0.214, z: -100, s: 195 },
  { x: 0.802, y: 0.299, z: -70,  s: 190 },
  { x: 0.879, y: 0.621, z: -30,  s: 185 },
  { x: 0.709, y: 0.803, z: -90,  s: 180 },
  { x: 0.511, y: 0.845, z: -110, s: 175 },
  { x: 0.333, y: 0.818, z: -50,  s: 170 },
  { x: 0.174, y: 0.690, z: -80,  s: 165 },
  { x: 0.101, y: 0.435, z: -120, s: 160 },
  { x: 0.235, y: 0.239, z: -60,  s: 155 },
];

// Working positions (mutated by drag/resize)
let positions = JSON.parse(JSON.stringify(DEFAULT_POS));
const cardEls = [];

// ── Build cards ──
function buildCards() {
  // Clean any existing cards first (used on reset).
  cardEls.forEach(c => c.remove());
  cardEls.length = 0;
  PROJECTS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'ed-card';
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="ed-label">${i + 1}. ${p.name}</div>
      <img src="${p.cover}" alt="${p.name}" loading="lazy">
      <div class="ed-readout"></div>
      <div class="ed-handle"></div>
    `;
    document.body.appendChild(card);
    cardEls.push(card);
  });
  applyAll();
  wireDrag();
}

// ── Apply position+size of one card from positions[i] ──
function applyOne(i) {
  const card = cardEls[i];
  if (!card) return;
  const pos = positions[i];
  const w = window.innerWidth, h = window.innerHeight;
  const left = pos.x * w - pos.s / 2;
  const top  = pos.y * h - pos.s / 2;
  card.style.transform = `translate3d(${left}px, ${top}px, 0)`;
  card.style.width = pos.s + 'px';
  card.style.height = pos.s + 'px';
  card.querySelector('.ed-readout').textContent =
    `x:${pos.x.toFixed(3)}  y:${pos.y.toFixed(3)}  s:${pos.s}`;
}
function applyAll() { positions.forEach((_, i) => applyOne(i)); }

// ── Drag + resize ──
function wireDrag() {
  let active = null; // { idx, mode: 'drag'|'resize', startX, startY, startPos }
  cardEls.forEach((card, i) => {
    card.addEventListener('mousedown', (e) => {
      const isHandle = e.target.classList.contains('ed-handle');
      active = {
        idx: i,
        mode: isHandle ? 'resize' : 'drag',
        startX: e.clientX,
        startY: e.clientY,
        startPos: { ...positions[i] },
      };
      card.classList.add(isHandle ? 'dragging' : 'dragging');
      // Highlight selected card
      cardEls.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      e.preventDefault();
    });
  });
  window.addEventListener('mousemove', (e) => {
    if (!active) return;
    const dx = e.clientX - active.startX;
    const dy = e.clientY - active.startY;
    const w = window.innerWidth, h = window.innerHeight;
    const p = positions[active.idx];
    if (active.mode === 'drag') {
      p.x = active.startPos.x + dx / w;
      p.y = active.startPos.y + dy / h;
      // Clamp to viewport with a tiny bleed allowance
      p.x = Math.max(0, Math.min(1, p.x));
      p.y = Math.max(0, Math.min(1, p.y));
      // Round to 3 decimals (we re-round on export anyway)
      p.x = Math.round(p.x * 1000) / 1000;
      p.y = Math.round(p.y * 1000) / 1000;
    } else {
      // Resize: drag handle = expand uniformly. Use larger of dx/dy.
      const delta = Math.max(dx, dy);
      p.s = Math.max(60, Math.round(active.startPos.s + delta));
    }
    applyOne(active.idx);
  });
  window.addEventListener('mouseup', () => {
    if (!active) return;
    cardEls[active.idx].classList.remove('dragging');
    active = null;
  });
}

// ── Toolbar ──
function updateVp() {
  document.getElementById('edVp').textContent = `${innerWidth} × ${innerHeight}`;
}
window.addEventListener('resize', () => {
  updateVp();
  applyAll();
});
updateVp();

document.getElementById('edReset').addEventListener('click', () => {
  positions = JSON.parse(JSON.stringify(DEFAULT_POS));
  applyAll();
});

function buildExportText() {
  const lines = positions.map((p, i) => {
    const x = p.x.toFixed(3);
    const y = p.y.toFixed(3);
    const z = p.z;
    const s = p.s;
    const name = PROJECTS[i].name;
    return `    { x: ${x}, y: ${y}, z: ${z >= 0 ? ' ' + z : z}, s: ${s} },  // ${i}  ${name}`;
  });
  return 'const positions = [\n' + lines.join('\n') + '\n  ];';
}

function showOutput() {
  document.getElementById('edCode').textContent = buildExportText();
  document.getElementById('edOutput').classList.add('visible');
}

document.getElementById('edExport').addEventListener('click', showOutput);
document.getElementById('edClose').addEventListener('click', () => {
  document.getElementById('edOutput').classList.remove('visible');
});
document.getElementById('edCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(buildExportText());
    const btn = document.getElementById('edCopy');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1200);
  } catch (e) {
    console.error('copy failed', e);
  }
});

// ── Keyboard shortcuts ──
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'r' || e.key === 'R') { document.getElementById('edReset').click(); }
  if (e.key === 'e' || e.key === 'E') { showOutput(); }
  if (e.key === 'Escape') { document.getElementById('edOutput').classList.remove('visible'); }
});

// ── Click empty area deselects ──
document.body.addEventListener('mousedown', (e) => {
  if (e.target === document.body) {
    cardEls.forEach(c => c.classList.remove('selected'));
  }
});

buildCards();
</script>

</body>
</html>
