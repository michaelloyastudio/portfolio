<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Shop — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --card: #111;
  --card-border: #222;
  --espresso: #3d2b1f;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: url('../assets/cursors/cursor-dark.svg') 16 8, default;
}

a, button, .product-card, .size-btn, .filter-btn, .cart-toggle, .close-btn, .checkout-btn, .remove-btn, .add-to-cart-btn {
  cursor: url('../assets/cursors/crosshair-dark.svg') 8 10, pointer !important;
}

h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* Product grid scrolls inside main, page itself never scrolls.
   main is the scroll container — full viewport width so wheel events
   anywhere on the page (not just hovering items) scroll the grid. */
main { flex: 1; overflow-y: auto; scrollbar-width: none; padding-top: 5rem; }
main::-webkit-scrollbar { display: none; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { display: none; }
html { scrollbar-width: none; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3rem 2.5rem;
  z-index: 100;
  background: var(--bg);
}

.header-logo-link {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  height: 32px;
}
.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }
  .header-logo-link, .header-logo-link.loaded { display: none !important; }

.header-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.header-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.2rem;
  letter-spacing: 0.05em;
}
.header-sub {
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1.2rem;
}

.cart-toggle {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none;
  border: none;
  color: var(--text-muted);
  position: relative;
  transition: color 0.2s;
}
.cart-toggle:hover { color: var(--accent); }
.cart-count {
  position: absolute;
  top: -6px; right: -14px;
  background: var(--accent);
  color: #000;
  font-size: 0.5rem;
  font-weight: 600;
  width: 16px; height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.cart-count.hidden { display: none; }

/* ── MARQUEE ── */
.marquee-wrap {
  position: fixed;
  top: 62px; left: 0; right: 0;
  z-index: 99;
  background: var(--espresso);
  overflow: hidden;
  height: 24px;
  display: flex;
  align-items: center;
}
.marquee {
  display: flex;
  white-space: nowrap;
  animation: marquee 25s linear infinite;
}
.marquee span {
  font-size: 0.55rem;
  color: var(--accent);
  letter-spacing: 0.15em;
  padding: 0 3rem;
}
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── MAIN ── */
main {
  padding: 70px 2.5rem 4rem;
  /* Full-viewport-width scroll container — no max-width here so wheel
     events on the side margins still scroll. The grid itself caps at
     1200px via .product-grid-wrap. */
  flex: 1;
  opacity: 0;
  transition: opacity 0.6s ease;
}
main.loaded { opacity: 1; transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.product-grid-wrap {
  max-width: 1200px;
  margin: 0 auto;
}
/* Sticky bar holds the title + filters at the top of the scroll
   container so they stay visible while the grid scrolls underneath. */
.hero-bar {
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 50;
  padding-bottom: 1rem;
  margin-bottom: 1rem;
  /* Pull up over main's padding-top so the sticky edge starts right
     at the bottom of the fixed page header. */
  margin-top: -70px;
  padding-top: 70px;
}

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 2rem 0 1rem;
}
.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.title-row.loaded { opacity: 1; transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.title-row { transform: translateY(10px); }
.title-row.loaded { transform: translateY(0); }
.page-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 3.3rem;
  letter-spacing: 0.05em;
  color: var(--text);
}
.page-subtitle {
  font-size: 1rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.hero-desc {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  margin-top: 0.8rem;
  line-height: 1.8;
  opacity: 0;
  transform: translateY(10px);
}
.hero-desc.visible {
  animation: heroDescIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes heroDescIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── DIVIDER ANIMATIONS ── */
.divider-accent {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  margin: 0.2rem 0 1rem;
  transform: scaleX(0);
}
.divider-accent.visible {
  animation: dividerGrow 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes dividerGrow {
  to { transform: scaleX(1); }
}

/* ── FILTER ANIMATIONS ── */
.filters {
  opacity: 0;
  transform: translateY(8px);
  display: flex;
  gap: 0.6rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  justify-content: center;
}
.filters.visible {
  animation: filtersIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes filtersIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: var(--card-border);
  margin: 1.5rem 0;
}
.filter-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.5rem 1.2rem;
  background: transparent;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  color: var(--text-muted);
  transition: color 0.2s;
  position: relative;
}
.filter-btn {
  transition: color 0.25s ease;
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}

/* ── PRODUCT GRID ── */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1.2rem;
}

/* ── PRODUCT CARD ── */
.product-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 10px;
  overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.35s ease;
  will-change: transform;
  perspective: 800px;
}
.product-card:hover {
  border-color: #444;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,142,61,0.1);
}
.product-card.cascade-in {
  opacity: 0;
  transform: translateY(40px) scale(0.92);
  filter: blur(6px);
  animation: cascadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.product-card.cascade-out {
  animation: cascadeOut 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
}
@keyframes cascadeIn {
  to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}
@keyframes cascadeOut {
  to { opacity: 0; transform: translateY(-15px) scale(0.95); filter: blur(4px); }
}
.product-img {
  width: 100%;
  aspect-ratio: 1;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.product-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.product-card:hover .product-img img {
  transform: scale(1.08);
}
.product-img .placeholder-icon {
  font-size: 2rem;
  color: #ccc;
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
}
.product-tag {
  position: absolute;
  top: 10px; left: 10px;
  background: var(--accent);
  color: #000;
  font-size: 0.5rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.08em;
}
.product-tag-sold {
  background: #333;
  color: var(--text-muted);
}
.product-info {
  padding: 1rem;
}
.product-name {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  margin-bottom: 0.25rem;
}
.product-detail {
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  margin-bottom: 0.6rem;
}
.product-price {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--accent);
}
.product-price-original {
  text-decoration: line-through;
  color: var(--text-muted);
  font-weight: 400;
  font-size: 0.6rem;
  margin-left: 0.5rem;
}

/* ── MODAL ── */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.modal-backdrop.visible {
  opacity: 1;
}
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  max-width: 420px;
  width: 90%;
  overflow: hidden;
  opacity: 0;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  z-index: 201;
}
.modal-backdrop.visible .modal {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.modal-img {
  width: 100%;
  aspect-ratio: 1;
  background: #fff;
  overflow: hidden;
}
.modal-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: url('../assets/cursors/crosshair-dark.svg') 8 10, pointer !important;
}

/* ── LIGHTBOX ── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 400;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.lightbox.visible {
  display: flex;
  opacity: 1;
}
.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 8px;
  transform: scale(0.9);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.lightbox.visible img {
  transform: scale(1);
}
.lightbox-close {
  position: absolute;
  top: 20px; right: 24px;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 50%;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  cursor: url('../assets/cursors/crosshair-dark.svg') 8 10, pointer !important;
}
.lightbox-close:hover { background: var(--accent); }
.modal-body {
  padding: 1.2rem 1.4rem 1.4rem;
}
.modal-name {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.3rem;
  letter-spacing: 0.03em;
  margin-bottom: 0.3rem;
}
.modal-desc {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  line-height: 1.8;
  margin-bottom: 0.8rem;
}
.modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-price {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--accent);
}
.modal-buy-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.65rem 1.1rem;
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 600;
  transition: background 0.15s ease, transform 0.1s ease;
  cursor: url('../assets/cursors/crosshair-dark.svg') 8 10, pointer !important;
}
.modal-buy-btn:hover {
  background: #ffa35c;
}
.modal-buy-btn:active {
  transform: translateY(1px);
}
.modal-close {
  position: absolute;
  top: 12px; right: 14px;
  background: rgba(0,0,0,0.5);
  border: none;
  color: #fff;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  z-index: 1;
}
.modal-close:hover { background: var(--accent); }
.sold-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}

/* ── CART DRAWER ── */
.cart-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 299;
  display: none;
  backdrop-filter: blur(4px);
}
.cart-backdrop.visible { display: block; }

.cart-drawer {
  position: fixed;
  top: 0; right: -400px;
  width: 400px;
  height: 100%;
  background: var(--bg);
  z-index: 300;
  border-left: 1px solid var(--card-border);
  display: flex;
  flex-direction: column;
  transition: right 0.3s ease;
}
.cart-drawer.open { right: 0; }
.cart-drawer-header {
  padding: 1.5rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--card-border);
}
.cart-drawer-header h3 {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.2rem;
  letter-spacing: 0.05em;
}
.close-btn {
  font-size: 1rem;
  background: none;
  border: none;
  color: var(--text-muted);
  transition: color 0.2s;
}
.close-btn:hover { color: var(--accent); }
.cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 2rem;
}
.cart-item {
  display: flex;
  gap: 1rem;
  padding: 1rem 0;
  border-bottom: 1px solid var(--card-border);
  align-items: center;
}
.cart-item-img {
  width: 56px; height: 56px;
  background: #fff;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.cart-item-img img {
  width: 75%; height: 75%;
  object-fit: contain;
}
.cart-item-info { flex: 1; }
.cart-item-name {
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  margin-bottom: 0.15rem;
}
.cart-item-size {
  font-size: 0.5rem;
  color: var(--text-muted);
}
.cart-item-price {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent);
}
.remove-btn {
  font-size: 0.8rem;
  background: none;
  border: none;
  color: #555;
  transition: color 0.15s;
}
.remove-btn:hover { color: var(--accent); }
.cart-empty {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-align: center;
  padding: 3rem 0;
  letter-spacing: 0.05em;
}
.cart-footer {
  padding: 1.5rem 2rem;
  border-top: 1px solid var(--card-border);
}
.cart-total {
  display: flex;
  justify-content: space-between;
  margin-bottom: 1rem;
  font-size: 0.75rem;
  letter-spacing: 0.08em;
}
.cart-total-price { color: var(--accent); font-weight: 600; }
.checkout-btn {
  width: 100%;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.9rem;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  transition: all 0.2s;
}
.checkout-btn:hover { background: #ffa05a; }
.checkout-btn:active { transform: scale(0.97); }

/* ── BOOT SCREEN ── */
#bootScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 100000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  transition: opacity 0.6s ease;
}
#bootScreen.fade-out { opacity: 0; pointer-events: none; }

.boot-box-wrap {
  position: relative;
  width: 80px;
  height: 80px;
}

/* Orange shopping bag */
.boot-bag {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 36px;
  background: var(--accent);
  border-radius: 2px 2px 4px 4px;
  opacity: 0;
  animation: bootBagIn 0.4s ease 0.2s forwards, bagSquash1 0.3s ease 1.0s, bagSquash2 0.3s ease 1.6s;
}
/* Bag handle */
.boot-bag::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 12px;
  border: 2.5px solid var(--accent);
  border-bottom: none;
  border-radius: 9px 9px 0 0;
  background: transparent;
}
/* Bag fold line */
.boot-bag::after {
  content: '';
  position: absolute;
  top: 6px;
  left: 4px;
  right: 4px;
  height: 1.5px;
  background: rgba(0,0,0,0.15);
  border-radius: 1px;
}
@keyframes bootBagIn {
  0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
  100% { opacity: 1; transform: translateX(-50%) scale(1); }
}

/* Items: positioned at center of bag, animated with transform for smooth arc */
.boot-bag {
  z-index: 2;
}
.boot-item {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  left: 35px;
  top: 50px;
  opacity: 0;
  z-index: 1;
}
.boot-item:nth-child(2) {
  background: #E8E0D4;
  animation: bootTossLeft 0.6s cubic-bezier(0.2, 0, 0.8, 1) 0.6s forwards;
}
.boot-item:nth-child(3) {
  background: #1a1a1a;
  border: 1.5px solid var(--text-muted);
  animation: bootTossRight 0.6s cubic-bezier(0.2, 0, 0.8, 1) 1.2s forwards;
}

/* Left toss: parabolic arc using many keyframes */
@keyframes bootTossLeft {
  0%   { opacity: 1; transform: translate(-60px, 0px) rotate(0deg); }
  10%  { opacity: 1; transform: translate(-50px, -18px) rotate(40deg); }
  20%  { opacity: 1; transform: translate(-38px, -32px) rotate(80deg); }
  30%  { opacity: 1; transform: translate(-26px, -40px) rotate(120deg); }
  40%  { opacity: 1; transform: translate(-14px, -42px) rotate(160deg); }
  50%  { opacity: 1; transform: translate(-4px, -38px) rotate(200deg); }
  60%  { opacity: 1; transform: translate(4px, -28px) rotate(240deg); }
  70%  { opacity: 1; transform: translate(8px, -14px) rotate(280deg); }
  78%  { opacity: 1; transform: translate(5px, 0px) rotate(320deg); }
  79%  { opacity: 0; transform: translate(5px, 0px) rotate(320deg); }
  100% { opacity: 0; transform: translate(5px, 0px) rotate(360deg); }
}

/* Right toss: parabolic arc from opposite side */
@keyframes bootTossRight {
  0%   { opacity: 1; transform: translate(60px, 0px) rotate(0deg); }
  10%  { opacity: 1; transform: translate(50px, -18px) rotate(-40deg); }

// ── 3D TILT ──
function tiltCard(e, card) {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const rotateX = ((y - centerY) / centerY) * -6;
  const rotateY = ((x - centerX) / centerX) * 6;
  card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
}
function resetTilt(card) {
  card.style.transform = '';
}

  if (cat === currentFilter) return;
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  
  // Animate out existing cards
  const cards = document.querySelectorAll('.product-card');
  cards.forEach((card, i) => {
    card.style.animationDelay = `${i * 30}ms`;
    card.classList.remove('cascade-in');
    card.classList.add('cascade-out');
  });
  
  // After exit animation, render new
  setTimeout(() => {
    renderGrid(true);
  }, cards.length * 30 + 250);
}

  backdrop.style.display = 'block';
  requestAnimationFrame(() => { requestAnimationFrame(() => backdrop.classList.add('visible')); });
}

function closeModal(e) {
  if (e && e.type === 'click') {
    const backdrop = document.getElementById('modalBackdrop');
    const modal = document.getElementById('modal');
    const isBackdropClick = e.target === backdrop;
    const isCloseBtn = e.target.closest('.modal-close');
    if (!isBackdropClick && !isCloseBtn) return;
  }
  const backdrop = document.getElementById('modalBackdrop');
  if (!backdrop.classList.contains('visible')) return;
  backdrop.classList.remove('visible');
  setTimeout(() => { 
    backdrop.style.display = 'none';
    document.getElementById('modal').innerHTML = '';
  }, 350);
}

  const lb = document.getElementById('lightbox');

  setTimeout(() => lb.style.display = 'none', 300);

function navigateBack(e) {

  setTimeout(() => { window.close(); if (!window.closed) window.location.href = '../index.html'; }, 600);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const lb = document.getElementById('lightbox');
    if (lb.classList.contains('visible')) { closeLightbox(e); return; }
    closeModal(e);
    return;
  }
  // Arrow keys navigate between products (only in modal, not lightbox)
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const lb = document.getElementById('lightbox');
    if (lb.classList.contains('visible')) return; // don't navigate during lightbox
    const backdrop = document.getElementById('modalBackdrop');
    if (!backdrop.classList.contains('visible')) return; // only when modal is open
    const filtered = currentFilter === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === currentFilter);
    const currentId = parseInt(document.getElementById('modal').dataset.productId);
    const idx = filtered.findIndex(p => p.id === currentId);
    if (idx === -1) return;
    const nextIdx = e.key === 'ArrowRight' ? (idx + 1) % filtered.length : (idx - 1 + filtered.length) % filtered.length;
    openDetail(filtered[nextIdx].id);
  }
});

/* ── TRIM PATHS HOVER (entry-point aware) ── */
(function(){
  const DURATION = 400;
  const EASE = t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t;

  function initTrimPaths(btn, strokeColor, activeClass) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    Object.assign(svg.style, {
      position:'absolute', top:'0', left:'0', pointerEvents:'none', overflow:'visible'
    });
    // Two paths that both start from the cursor entry point and go in opposite directions
    const pathCW = document.createElementNS('http://www.w3.org/2000/svg','path');
    const pathCCW = document.createElementNS('http://www.w3.org/2000/svg','path');
    [pathCW, pathCCW].forEach(p => {
      p.setAttribute('fill','none');
      p.setAttribute('stroke', strokeColor);
      p.setAttribute('stroke-width','1');
      p.setAttribute('stroke-linecap','round');
      p.setAttribute('stroke-linejoin','round');
      p.style.transition = 'opacity 0.25s ease';
      svg.appendChild(p);
    });
    btn.style.position = btn.style.position || 'relative';
    btn.appendChild(svg);

    let fullPerim = 0, halfPerim = 0;
    let state = 'idle';
    let progress = 0;
    let wantsOut = false;
    let rafId = null, lastTime = 0;
    let cachedW = 0, cachedH = 0, cachedR = 0;

    // Build a full-perimeter rounded rect path starting from a given point on the perimeter
    // Returns two paths: CW and CCW from that point, each covering half the perimeter
    function perimPoint(t, w, h, r) {
      // t is 0..totalPerim, going CW from top-left corner (after radius)
      // Segments: top edge, TR corner, right edge, BR corner, bottom edge, BL corner, left edge, TL corner
      const top = w - 2*r, right = h - 2*r, bot = w - 2*r, left = h - 2*r;
      const qtr = Math.PI * r / 2; // quarter circle arc length
      const segs = [top, qtr, right, qtr, bot, qtr, left, qtr];
      let acc = 0;
      for (let i = 0; i < segs.length; i++) {
        if (t <= acc + segs[i]) {
          const frac = (t - acc) / segs[i];
          switch(i) {
            case 0: return { x: 0.5 + r + frac * top, y: 0.5 }; // top edge
            case 1: { const a = -Math.PI/2 + frac * Math.PI/2; return { x: w - 0.5 - r + Math.cos(a)*r, y: 0.5 + r + Math.sin(a)*r }; } // TR
            case 2: return { x: w - 0.5, y: 0.5 + r + frac * right }; // right edge
            case 3: { const a = frac * Math.PI/2; return { x: w - 0.5 - r + Math.cos(a)*r, y: h - 0.5 - r + Math.sin(a)*r }; } // BR
            case 4: return { x: w - 0.5 - r - frac * bot, y: h - 0.5 }; // bottom edge
            case 5: { const a = Math.PI/2 + frac * Math.PI/2; return { x: 0.5 + r + Math.cos(a)*r, y: h - 0.5 - r + Math.sin(a)*r }; } // BL
            case 6: return { x: 0.5, y: h - 0.5 - r - frac * left }; // left edge
            case 7: { const a = Math.PI + frac * Math.PI/2; return { x: 0.5 + r + Math.cos(a)*r, y: 0.5 + r + Math.sin(a)*r }; } // TL
          }
        }

    function xyToPerimT(lx, ly, w, h, r) {

        { cx: w-0.5-r, cy: h-0.5-r }, // BR
        { cx: 0.5+r, cy: h-0.5-r },  // BL

      let best = null, bestDist = Infinity;
      edges.forEach(e => {
        const d = Math.hypot(lx - e.x, ly - e.y);
        if (d < bestDist) { bestDist = d; best = e; }
      });
      // Check corner arcs
      corners.forEach((c, ci) => {
        const dx = lx - c.cx, dy = ly - c.cy;
        const d = Math.hypot(dx, dy);
        const px = c.cx + (dx/d)*r, py = c.cy + (dy/d)*r;
        const pd = Math.hypot(lx - px, ly - py);
        if (pd < bestDist) { bestDist = pd; best = { side: 'corner', ci, x: px, y: py, angle: Math.atan2(dy, dx) }; }
      });

      const top = w - 2*r, right = h - 2*r, bot = w - 2*r, left = h - 2*r;
      const qtr = Math.PI * r / 2;

      if (best.side === 'top') return (best.x - 0.5 - r);
      if (best.side === 'corner' && best.ci === 1) { let a = best.angle + Math.PI/2; if (a < 0) a += 2*Math.PI; return top + (a / (Math.PI/2)) * qtr; }
      if (best.side === 'right') return top + qtr + (best.y - 0.5 - r);
      if (best.side === 'corner' && best.ci === 2) { let a = best.angle; if (a < 0) a += 2*Math.PI; return top + qtr + right + (a / (Math.PI/2)) * qtr; }
      if (best.side === 'bottom') return top + qtr + right + qtr + (w - 0.5 - r - best.x);
      if (best.side === 'corner' && best.ci === 3) { let a = best.angle - Math.PI/2; if (a < 0) a += 2*Math.PI; return top + qtr + right + qtr + bot + (a / (Math.PI/2)) * qtr; }
      if (best.side === 'left') return top + qtr + right + qtr + bot + qtr + (h - 0.5 - r - best.y);
      if (best.side === 'corner' && best.ci === 0) { let a = best.angle - Math.PI; if (a < 0) a += 2*Math.PI; return top + qtr + right + qtr + bot + qtr + left + (a / (Math.PI/2)) * qtr; }
      return 0;
    }

    // Build a rounded rect path that starts from parameter t and goes in given direction for half the perimeter
    function buildPathFromT(startT, w, h, r, direction) {
      const steps = 48; // segments for smooth curves
      const len = fullPerim / 2;
      let d = '';
      for (let i = 0; i <= steps; i++) {
        const frac = i / steps;
        let t = direction === 'cw'
          ? (startT + frac * len) % fullPerim
          : (startT - frac * len + fullPerim * 2) % fullPerim;
        const pt = perimPoint(t, w, h, r);
        d += (i === 0 ? 'M' : 'L') + pt.x.toFixed(2) + ',' + pt.y.toFixed(2);
      }
      return d;
    }

    var entryT = 0;

    function measure() {
      const cs = getComputedStyle(btn);
      const bw = parseFloat(cs.borderLeftWidth) || 1;
      const w = btn.offsetWidth, h = btn.offsetHeight;
      cachedW = w; cachedH = h;
      svg.style.top = (-bw) + 'px';
      svg.style.left = (-bw) + 'px';
      svg.setAttribute('width', w); svg.setAttribute('height', h);
      cachedR = Math.min(parseFloat(cs.borderRadius) || 6, w/2, h/2);
      const top = w - 2*cachedR, right = h - 2*cachedR;
      const qtr = Math.PI * cachedR / 2;
      fullPerim = 2*(top + right) + 4*qtr;
      halfPerim = fullPerim / 2;
    }

    function rebuildPaths() {
      const w = cachedW, h = cachedH, r = cachedR;
      pathCW.setAttribute('d', buildPathFromT(entryT, w, h, r, 'cw'));
      pathCCW.setAttribute('d', buildPathFromT(entryT, w, h, r, 'ccw'));
      const len = pathCW.getTotalLength();
      [pathCW, pathCCW].forEach(p => {
        p.style.strokeDasharray = (len + 1);
        if (state === 'idle') p.style.strokeDashoffset = len + 1;
      });
      halfPerim = len;
    }

    function tick(now) {
      if (!lastTime) { lastTime = now; rafId = requestAnimationFrame(tick); return; }
      const dt = now - lastTime;
      lastTime = now;
      const speed = 1 / DURATION;

      if (state === 'drawing-in') {
        progress = Math.min(1, progress + speed * dt);
        const off = (halfPerim + 1) * (1 - EASE(progress));
        pathCW.style.strokeDashoffset = off;
        pathCCW.style.strokeDashoffset = off;
        if (waitForHalf && progress >= 0.5) { startFadeOut(); }
        if (progress >= 1) {
          if (wantsOut) {
            wantsOut = false;
            state = 'drawing-out';
            progress = 1;
          } else {
            state = 'drawn';
            rafId = null; lastTime = 0; return;
          }
        }
      }

      if (state === 'drawing-out') {
        progress = Math.max(0, progress - speed * dt);
        const off = -(halfPerim + 1) * (1 - EASE(progress));
        pathCW.style.strokeDashoffset = off;
        pathCCW.style.strokeDashoffset = off;
        if (progress <= 0) {
          state = 'idle';
          pathCW.style.strokeDashoffset = halfPerim + 1;
          pathCCW.style.strokeDashoffset = halfPerim + 1;
          rafId = null; lastTime = 0; return;
        }
      }

      rafId = requestAnimationFrame(tick);
    }

    function startAnim() {
      if (!rafId) { lastTime = 0; rafId = requestAnimationFrame(tick); }
    }

    measure();
    new ResizeObserver(measure).observe(btn);

    function hideStroke() {
      state = 'idle'; progress = 0; wantsOut = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      lastTime = 0;
      pathCW.style.strokeDashoffset = halfPerim + 1;
      pathCCW.style.strokeDashoffset = halfPerim + 1;
    }

    var isHovering = false;
    var isFading = false;
    var waitForHalf = false;

    function resetStrokes() {
      state = 'idle'; progress = 0; wantsOut = false; waitForHalf = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      lastTime = 0;
      pathCW.style.strokeDashoffset = halfPerim + 1;
      pathCCW.style.strokeDashoffset = halfPerim + 1;
    }

    function startFadeOut() {
      isFading = true;
      waitForHalf = false;
      [pathCW, pathCCW].forEach(p => { p.style.opacity = '0'; });
      btn.style.color = '';
    }

    function onFadeEnd() {
      isFading = false;
      resetStrokes();
      if (isHovering) {
        [pathCW, pathCCW].forEach(p => { p.style.opacity = '1'; });
        btn.style.color = 'var(--text)';
        rebuildPaths();
        state = 'drawing-in'; progress = 0; startAnim();
      }
    }

    [pathCW, pathCCW].forEach(p => {
      p.addEventListener('transitionend', function(e) {
        if (e.propertyName === 'opacity' && isFading) onFadeEnd();
      });
    });

    btn.addEventListener('mouseenter', function(e){
      if (activeClass && btn.classList.contains(activeClass)) return;
      isHovering = true;
      waitForHalf = false;
      if (isFading) return;
      // Calculate entry point on perimeter
      const rect = btn.getBoundingClientRect();
      const lx = e.clientX - rect.left;
      const ly = e.clientY - rect.top;
      entryT = xyToPerimT(lx, ly, cachedW, cachedH, cachedR);
      rebuildPaths();
      [pathCW, pathCCW].forEach(p => { p.style.opacity = '1'; });
      btn.style.color = 'var(--text)';
      if (state === 'idle') { state = 'drawing-in'; progress = 0; startAnim(); }
    });
    btn.addEventListener('mouseleave', function(){
      if (activeClass && btn.classList.contains(activeClass)) return;
      isHovering = false;
      if (progress >= 0.5 || state === 'drawn') {
        startFadeOut();
      } else {
        waitForHalf = true;
      }
    });
    btn.addEventListener('click', function(){
      if (activeClass) hideStroke();
    });
    if (activeClass) {
      new MutationObserver(function() {
        if (btn.classList.contains(activeClass)) hideStroke();
      }).observe(btn, { attributes: true, attributeFilter: ['class'] });
    }
  }

  document.querySelectorAll('.filter-btn').forEach(b =>
    initTrimPaths(b, 'var(--text)', 'active')
  );
})();
</script>
<script>
// ── MUSIC NOTE CURSOR TRAIL ──
(function() {
  const notes = ['♪', '♫', '♩', '♬'];
  const pool = [];
  const POOL_SIZE = 60;
  let lastX = 0, lastY = 0, lastSpawn = 0;
  const SPAWN_INTERVAL = 35;
  const MIN_DIST = 6;
  for (let i = 0; i < POOL_SIZE; i++) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;font-size:14px;opacity:0;transition:none;user-select:none;will-change:transform,opacity;';
    el.style.color = '#8a8580';
    document.body.appendChild(el);
    pool.push({ el, active: false });
  }
  function spawn(x, y) {
    const note = pool.find(n => !n.active);
    if (!note) return;
    note.active = true;
    note.el.textContent = notes[Math.random() * notes.length | 0];
    note.el.style.fontSize = (10 + Math.random() * 8) + 'px';
    const offsetX = (Math.random() - 0.5) * 16;
    note.el.style.left = (x + offsetX) + 'px';
    note.el.style.top = y + 'px';
    note.el.style.opacity = '0.7';
    note.el.style.transform = 'translateY(0) rotate(' + ((Math.random() - 0.5) * 30) + 'deg)';
    note.el.style.transition = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const drift = (Math.random() - 0.5) * 20;
        note.el.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
        note.el.style.transform = 'translateY(-' + (40 + Math.random() * 30) + 'px) rotate(' + ((Math.random() - 0.5) * 60) + 'deg) translateX(' + drift + 'px)';
        note.el.style.opacity = '0';
      });
    });
    setTimeout(() => { note.active = false; }, 1050);
  }
  document.addEventListener('mousemove', function(e) {
    const now = Date.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (now - lastSpawn > SPAWN_INTERVAL && dist > MIN_DIST) {
      spawn(e.clientX, e.clientY);
      lastX = e.clientX; lastY = e.clientY;
      lastSpawn = now;
    }
  });
})();
</script>
