<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Smoke — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --parchment: #E8E0D4;
  --accent: #ff8e3d;
  --warm-gray: #8a8580;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--parchment); font-family:'Space Grotesk',sans-serif; height:100vh; overflow:hidden; user-select:none; -webkit-user-select:none; cursor:pointer; }
#c { display:block; width:100%; height:100%; }
#ui {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  text-align:center; pointer-events:none; z-index:10;
}
#hint {
  font-size:0.7rem; color:var(--warm-gray); text-transform:uppercase;
  letter-spacing:2px; opacity:0; transition:opacity 0.6s;
  background:rgba(10,10,10,0.7); padding:8px 20px; border-radius:4px;
  backdrop-filter:blur(6px);
}
#hint.show { opacity:1; }
#title-card {
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 1s; cursor:pointer;
}
#title-card.hide { opacity:0; pointer-events:none; }
#title-card h1 { font-family:'din-2014-rounded-variable',sans-serif;word-spacing:-0.05em; font-size:3.8rem; font-weight:400; letter-spacing:1px; }
#title-card .sub { font-size:0.65rem; color:var(--warm-gray); text-transform:uppercase; letter-spacing:4px; margin-top:8px; }
#title-card .start { font-size:0.7rem; color:var(--accent); text-transform:uppercase; letter-spacing:2px; margin-top:3rem; animation:pulse 2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
#cig-count {
  position:fixed; top:20px; right:24px; z-index:10;
  font-size:0.65rem; color:var(--warm-gray); text-transform:uppercase;
  letter-spacing:1.5px; background:rgba(10,10,10,0.7); padding:6px 14px;
  border-radius:4px; backdrop-filter:blur(6px);
}
#cig-count span { color:var(--accent); font-weight:600; }
</style>
</head>
<body>

<div id="title-card" onclick="startApp()">
  <h1>The Smoke</h1>
  <div class="sub">A Cigarette Simulation</div>
  <div class="start">Click to begin</div>
</div>

<canvas id="c"></canvas>
<div id="ui"><div id="hint"></div></div>
<div id="cig-count" style="display:none">Pack: <span id="pack-count">20</span>/20</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';

// ─── CONSTANTS ───
const PARCHMENT = 0xE8E0D4;
const ACCENT = 0xff8e3d;
const BG = 0x0a0a0a;
const ESPRESSO = 0x3d2b1f;

// ─── STATE MACHINE ───
const S = {
  IDLE_PACK: 0,   // Pack sitting, click to pull cig
  PULLING: 1,     // Cig being pulled from pack
  HOLDING: 2,     // Holding unlit cig, lighter appears
  LIGHTING: 3,    // Lighter flame on, lighting tip
  SMOKING: 4,     // Lit, click to drag/puff
  ASHING: 5,      // Shake to ash
  FINISHING: 6,   // Cig too short, auto-toss
};
let state = S.IDLE_PACK;
let cigLength = 1.0; // 1.0 = full, 0.0 = done
let ashLength = 0;
let packCount = 20;
let puffing = false;
let isLit = false;
let started = false;

// ─── SCENE SETUP ───
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.08);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 5);
camera.lookAt(0, 0.5, 0);

// ─── LIGHTING ───
const ambLight = new THREE.AmbientLight(0x332211, 0.4);
scene.add(ambLight);

const keyLight = new THREE.PointLight(ACCENT, 15, 12);
keyLight.position.set(2, 4, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x4466aa, 3, 8);
fillLight.position.set(-3, 2, -1);
scene.add(fillLight);

const rimLight = new THREE.PointLight(PARCHMENT, 2, 6);
rimLight.position.set(0, 1, -3);
scene.add(rimLight);

// ─── TABLE SURFACE ───
const tableGeo = new THREE.BoxGeometry(10, 0.15, 10);
const tableMat = new THREE.MeshStandardMaterial({
  color: ESPRESSO,
  roughness: 0.7,
  metalness: 0.05,
});
const table = new THREE.Mesh(tableGeo, tableMat);
table.position.y = -0.075;
table.receiveShadow = true;
scene.add(table);

// ─── CIGARETTE PACK ───
const packGroup = new THREE.Group();
scene.add(packGroup);

// Pack body
const packGeo = new THREE.BoxGeometry(0.7, 1.1, 0.35);
const packMat = new THREE.MeshStandardMaterial({
  color: PARCHMENT,
  roughness: 0.5,
  metalness: 0.02,
});
const pack = new THREE.Mesh(packGeo, packMat);
pack.castShadow = true;
pack.position.y = 0.55;
packGroup.add(pack);

// Pack accent stripe
const stripeGeo = new THREE.BoxGeometry(0.71, 0.3, 0.36);
const stripeMat = new THREE.MeshStandardMaterial({ color: ACCENT, roughness: 0.4, metalness: 0.1 });
const stripe = new THREE.Mesh(stripeGeo, stripeMat);
stripe.position.y = 0.55;
packGroup.add(stripe);

// Pack foil top (open)
const foilGeo = new THREE.BoxGeometry(0.6, 0.08, 0.28);
const foilMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, roughness: 0.2, metalness: 0.8 });
const foil = new THREE.Mesh(foilGeo, foilMat);
foil.position.y = 1.14;
packGroup.add(foil);

// Cigs visible in pack (row of white cylinders poking out top)
const cigRowGroup = new THREE.Group();
const cigInPackGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.2, 8);
const cigInPackMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.6 });
function updatePackCigs() {
  cigRowGroup.clear();
  const count = Math.min(packCount, 10); // visible row
  for (let i = 0; i < count; i++) {
    const c = new THREE.Mesh(cigInPackGeo, cigInPackMat);
    c.position.set(-0.22 + i * 0.049, 1.22, 0);
    cigRowGroup.add(c);
  }
}
updatePackCigs();
packGroup.add(cigRowGroup);
packGroup.position.set(-0.6, 0, 0);
packGroup.rotation.y = 0.15;

// ─── SINGLE CIGARETTE ───
const cigGroup = new THREE.Group();
cigGroup.visible = false;
scene.add(cigGroup);

// Paper tube
const paperGeo = new THREE.CylinderGeometry(0.035, 0.035, 2.0, 12);
const paperMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.65 });
const paper = new THREE.Mesh(paperGeo, paperMat);
paper.rotation.z = Math.PI / 2;
cigGroup.add(paper);

// Filter
const filterGeo = new THREE.CylinderGeometry(0.037, 0.037, 0.45, 12);
const filterMat = new THREE.MeshStandardMaterial({ color: 0xcc9955, roughness: 0.5 });
const filter = new THREE.Mesh(filterGeo, filterMat);
filter.rotation.z = Math.PI / 2;
filter.position.x = -1.2;
cigGroup.add(filter);

// Ember tip
const emberGeo = new THREE.SphereGeometry(0.04, 8, 8);
const emberMat = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xff2200, emissiveIntensity: 0 });
const ember = new THREE.Mesh(emberGeo, emberMat);
ember.position.x = 1.0;
ember.visible = false;
cigGroup.add(ember);

// Ember glow light
const emberLight = new THREE.PointLight(0xff4400, 0, 1.5);
emberLight.position.x = 1.0;
cigGroup.add(emberLight);

// Ash segment
const ashGeo = new THREE.CylinderGeometry(0.036, 0.034, 0.01, 8);
const ashMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
const ashMesh = new THREE.Mesh(ashGeo, ashMat);
ashMesh.rotation.z = Math.PI / 2;
ashMesh.visible = false;
cigGroup.add(ashMesh);

// ─── LIGHTER ───
const lighterGroup = new THREE.Group();
lighterGroup.visible = false;
scene.add(lighterGroup);

// Body
const ltrBodyGeo = new THREE.BoxGeometry(0.22, 0.55, 0.12);
const ltrBodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.7 });
const ltrBody = new THREE.Mesh(ltrBodyGeo, ltrBodyMat);
lighterGroup.add(ltrBody);

// Metal top
const ltrTopGeo = new THREE.BoxGeometry(0.22, 0.08, 0.12);
const ltrTopMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.2, metalness: 0.9 });
const ltrTop = new THREE.Mesh(ltrTopGeo, ltrTopMat);
ltrTop.position.y = 0.3;
lighterGroup.add(ltrTop);

// Flame (sprite)
const flameGroup = new THREE.Group();
flameGroup.visible = false;
lighterGroup.add(flameGroup);

// Flame core
const flameCoreGeo = new THREE.ConeGeometry(0.04, 0.2, 8);
const flameCoreMat = new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.9 });
const flameCore = new THREE.Mesh(flameCoreGeo, flameCoreMat);
flameCore.position.y = 0.45;
flameGroup.add(flameCore);

// Flame outer
const flameOuterGeo = new THREE.ConeGeometry(0.06, 0.3, 8);
const flameOuterMat = new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.5 });
const flameOuter = new THREE.Mesh(flameOuterGeo, flameOuterMat);
flameOuter.position.y = 0.43;
flameGroup.add(flameOuter);

// Flame light
const flameLight = new THREE.PointLight(0xff8844, 0, 3);
flameLight.position.y = 0.5;
lighterGroup.add(flameLight);

// ─── SMOKE PARTICLES ───
const smokeParticles = [];
const smokeTex = createSmokeTex();

function createSmokeTex() {
  const size = 64;
  const c2 = document.createElement('canvas');
  c2.width = c2.height = size;
  const ctx = c2.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(200,190,175,0.6)');
  grad.addColorStop(0.5, 'rgba(200,190,175,0.2)');
  grad.addColorStop(1, 'rgba(200,190,175,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c2);
  return tex;
}

function spawnSmoke(origin, velocity, size, life) {
  const spriteMat = new THREE.SpriteMaterial({
    map: smokeTex,
    transparent: true,
    opacity: 0.4,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.copy(origin);
  sprite.scale.set(size, size, 1);
  scene.add(sprite);
  smokeParticles.push({
    sprite,
    vel: velocity.clone(),
    life,
    maxLife: life,
    size,
    rotSpeed: (Math.random() - 0.5) * 0.5,
  });
}

function updateSmoke(dt) {
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.sprite);
      p.sprite.material.dispose();
      smokeParticles.splice(i, 1);
      continue;
    }
    const t = 1 - p.life / p.maxLife;
    p.sprite.position.add(p.vel.clone().multiplyScalar(dt));
    p.vel.y += dt * 0.15; // rise
    p.vel.x += (Math.random() - 0.5) * dt * 0.3; // drift
    const scale = p.size * (1 + t * 3);
    p.sprite.scale.set(scale, scale, 1);
    p.sprite.material.opacity = 0.35 * (1 - t * t);
    p.sprite.material.rotation += p.rotSpeed * dt;
  }
}

// ─── ASH PARTICLES ───
const ashParticles = [];

function spawnAshBits(origin) {
  for (let i = 0; i < 8; i++) {
    const geo = new THREE.SphereGeometry(0.008 + Math.random() * 0.008, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0x888888 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(origin);
    scene.add(mesh);
    ashParticles.push({
      mesh,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 0.8,
        Math.random() * 0.3 - 0.5,
        (Math.random() - 0.5) * 0.8,
      ),
      life: 1.5 + Math.random(),
    });
  }
}

function updateAsh(dt) {
  for (let i = ashParticles.length - 1; i >= 0; i--) {
    const p = ashParticles[i];
    p.life -= dt;
    if (p.life <= 0 || p.mesh.position.y < -0.1) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      ashParticles.splice(i, 1);
      continue;
    }
    p.vel.y -= dt * 2.5; // gravity
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
  }
}

// ─── ANIMATION TARGETS ───
let camTarget = { x:0, y:2.5, z:5, lx:0, ly:0.5, lz:0 };
let camCurrent = { ...camTarget };

// Cig positions for different states
const CIG_IN_PACK = { x:-0.5, y:1.35, z:0, rx:0, ry:0, rz:0 };
const CIG_HELD = { x:0.3, y:1.0, z:1.5, rx:0, ry:0, rz:0.1 };
const CIG_MOUTH = { x:0, y:1.2, z:2.0, rx:0, ry:0, rz:0.05 };
const CIG_LIGHT_POS = { x:0.2, y:1.1, z:1.8, rx:0, ry:0, rz:0.08 };

let cigTarget = { ...CIG_IN_PACK };
let cigCurrent = { ...CIG_IN_PACK };

let lighterTarget = { x:0.5, y:0.8, z:1.6 };
let lighterCurrent = { x:2, y:0, z:1.6 };

// ─── SMOOTH LERP ───
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpObj(cur, tgt, t) {
  for (const k in tgt) cur[k] = lerp(cur[k], tgt[k], t);
}

// ─── HINT SYSTEM ───
let hintTimer = 0;
function showHint(text, dur) {
  const el = document.getElementById('hint');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove('show'), (dur || 3) * 1000);
}

// ─── STATE TRANSITIONS ───
let stateTime = 0;
let smokeTimer = 0;
let puffTimer = 0;
let autoAshTimer = 0;

function transitionTo(newState) {
  state = newState;
  stateTime = 0;

  switch (state) {
    case S.IDLE_PACK:
      cigGroup.visible = false;
      lighterGroup.visible = false;
      flameGroup.visible = false;
      isLit = false;
      ember.visible = false;
      emberLight.intensity = 0;
      ashLength = 0;
      ashMesh.visible = false;
      cigLength = 1.0;
      camTarget = { x:0, y:2.5, z:5, lx:0, ly:0.5, lz:0 };
      if (packCount > 0) showHint('Click to pull a cigarette', 4);
      else showHint('Pack is empty', 3);
      break;

    case S.PULLING:
      if (packCount <= 0) { transitionTo(S.IDLE_PACK); return; }
      packCount--;
      document.getElementById('pack-count').textContent = packCount;
      updatePackCigs();
      cigGroup.visible = true;
      cigTarget = { ...CIG_IN_PACK };
      cigCurrent = { ...CIG_IN_PACK };
      // Animate pull up
      setTimeout(() => {
        cigTarget = { ...CIG_HELD };
        camTarget = { x:0.2, y:1.8, z:4, lx:0.2, ly:1.0, lz:1.5 };
      }, 100);
      setTimeout(() => transitionTo(S.HOLDING), 1200);
      break;

    case S.HOLDING:
      showHint('Click to light', 3);
      lighterGroup.visible = true;
      lighterTarget = { x:0.6, y:0.8, z:1.8 };
      lighterCurrent = { x:1.5, y:0.2, z:1.8 };
      break;

    case S.LIGHTING:
      flameGroup.visible = true;
      flameLight.intensity = 4;
      cigTarget = { ...CIG_LIGHT_POS };
      lighterTarget = { x:CIG_LIGHT_POS.x + 0.85, y:CIG_LIGHT_POS.y + 0.15, z:CIG_LIGHT_POS.z };
      camTarget = { x:0.1, y:1.5, z:3.5, lx:0.2, ly:1.1, lz:1.8 };
      setTimeout(() => {
        isLit = true;
        ember.visible = true;
        emberMat.emissiveIntensity = 2;
        emberLight.intensity = 0.5;
      }, 800);
      setTimeout(() => {
        flameGroup.visible = false;
        flameLight.intensity = 0;
        lighterGroup.visible = false;
        cigTarget = { ...CIG_MOUTH };
        camTarget = { x:0, y:1.8, z:3.8, lx:0, ly:1.1, lz:1.5 };
        transitionTo(S.SMOKING);
      }, 1800);
      break;

    case S.SMOKING:
      showHint('Click to puff · Shake to ash', 4);
      autoAshTimer = 0;
      break;

    case S.ASHING:
      // Ash falls
      const ashWorld = new THREE.Vector3();
      ember.getWorldPosition(ashWorld);
      spawnAshBits(ashWorld);
      ashLength = 0;
      ashMesh.visible = false;
      setTimeout(() => transitionTo(S.SMOKING), 600);
      break;

    case S.FINISHING:
      showHint('Finished', 2);
      isLit = false;
      emberMat.emissiveIntensity = 0;
      emberLight.intensity = 0;
      // Toss animation
      cigTarget = { x:0.5, y:-0.5, z:2, rx:2, ry:1, rz:3 };
      setTimeout(() => transitionTo(S.IDLE_PACK), 2000);
      break;
  }
}

// ─── INPUT ───
let shakeHistory = [];
let lastAccel = { x:0, y:0, z:0 };

canvas.addEventListener('click', () => {
  if (!started) return;
  switch (state) {
    case S.IDLE_PACK:
      transitionTo(S.PULLING);
      break;
    case S.HOLDING:
      transitionTo(S.LIGHTING);
      break;
    case S.SMOKING:
      doPuff();
      break;
  }
});

// Desktop shake: mouse waggle
let lastMouseX = 0;
let mouseShakes = 0;
let lastShakeDir = 0;
let shakeResetTimer = 0;

canvas.addEventListener('mousemove', (e) => {
  if (state !== S.SMOKING) return;
  const dx = e.clientX - lastMouseX;
  lastMouseX = e.clientX;
  const dir = Math.sign(dx);
  if (dir !== 0 && dir !== lastShakeDir) {
    mouseShakes++;
    lastShakeDir = dir;
    shakeResetTimer = 0;
  }
  if (mouseShakes >= 4 && ashLength > 0.05) {
    mouseShakes = 0;
    transitionTo(S.ASHING);
  }
});

// Mobile shake via DeviceMotion
window.addEventListener('devicemotion', (e) => {
  if (state !== S.SMOKING) return;
  const a = e.accelerationIncludingGravity;
  if (!a) return;
  const delta = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y);
  lastAccel = { x:a.x, y:a.y, z:a.z };
  if (delta > 15 && ashLength > 0.05) {
    transitionTo(S.ASHING);
  }
});

// Touch tap for puff
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!started) return;
  switch (state) {
    case S.IDLE_PACK: transitionTo(S.PULLING); break;
    case S.HOLDING: transitionTo(S.LIGHTING); break;
    case S.SMOKING: doPuff(); break;
  }
}, { passive:false });

function doPuff() {
  if (!isLit || puffing) return;
  puffing = true;
  puffTimer = 0;

  // Glow up ember
  emberMat.emissiveIntensity = 5;
  emberLight.intensity = 2;

  // Pull cig closer (to mouth)
  cigTarget = { ...CIG_MOUTH, z: CIG_MOUTH.z + 0.2 };

  setTimeout(() => {
    // Exhale: spawn smoke
    const smokeOrigin = new THREE.Vector3(0, 1.4, 2.5);
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        spawnSmoke(
          smokeOrigin.clone().add(new THREE.Vector3((Math.random()-0.5)*0.1, Math.random()*0.05, (Math.random()-0.5)*0.1)),
          new THREE.Vector3((Math.random()-0.5)*0.15, 0.3 + Math.random()*0.1, (Math.random()-0.5)*0.1),
          0.15 + Math.random() * 0.1,
          3 + Math.random() * 2,
        );
      }, i * 80);
    }

    // Return cig
    cigTarget = { ...CIG_MOUTH };
    emberMat.emissiveIntensity = 1.5;
    emberLight.intensity = 0.5;

    // Burn down
    cigLength -= 0.08;
    ashLength += 0.08;

    puffing = false;

    if (cigLength <= 0.15) {
      transitionTo(S.FINISHING);
    } else if (ashLength > 0.25) {
      showHint('Shake to ash', 2);
    }
  }, 600);
}

// ─── UPDATE CIGARETTE MESH ───
function updateCigMesh() {
  // Scale paper tube based on remaining length
  const paperLen = Math.max(0.1, cigLength * 2.0);
  paper.scale.set(1, cigLength, 1);
  paper.position.x = -1.0 + cigLength;

  // Filter stays
  filter.position.x = -1.22;

  // Ember at tip
  ember.position.x = -1.0 + cigLength * 2.0;

  // Ash
  if (ashLength > 0.01) {
    ashMesh.visible = true;
    ashMesh.scale.set(1, ashLength * 20, 1);
    ashMesh.position.x = ember.position.x + ashLength * 0.5;
  }
}

// ─── IDLE SMOKE (when lit but not puffing) ───
function idleSmoke(dt) {
  smokeTimer += dt;
  if (smokeTimer > 0.4 && isLit && !puffing) {
    smokeTimer = 0;
    const emberWorld = new THREE.Vector3();
    ember.getWorldPosition(emberWorld);
    spawnSmoke(
      emberWorld.clone().add(new THREE.Vector3(0, 0.05, 0)),
      new THREE.Vector3((Math.random()-0.5)*0.05, 0.2, (Math.random()-0.5)*0.05),
      0.06 + Math.random() * 0.04,
      2.5 + Math.random() * 1.5,
    );
  }
}

// ─── FLAME ANIMATION ───
function animateFlame(t) {
  if (!flameGroup.visible) return;
  flameCore.scale.y = 1 + Math.sin(t * 20) * 0.15;
  flameCore.scale.x = 1 + Math.sin(t * 15 + 1) * 0.1;
  flameOuter.scale.y = 1 + Math.sin(t * 18 + 2) * 0.2;
  flameOuter.position.x = Math.sin(t * 12) * 0.005;
  flameLight.intensity = 3 + Math.sin(t * 25) * 1;
}

// ─── EMBER PULSE ───
function animateEmber(t) {
  if (!isLit) return;
  const base = puffing ? 4 : 1.2;
  const pulse = Math.sin(t * 3) * 0.3;
  emberMat.emissiveIntensity = base + pulse;
  emberLight.intensity = (base + pulse) * 0.3;
}

// ─── MAIN LOOP ───
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();
  stateTime += dt;

  // Shake timer reset
  shakeResetTimer += dt;
  if (shakeResetTimer > 0.5) { mouseShakes = 0; shakeResetTimer = 0; }

  // Camera smooth
  lerpObj(camCurrent, camTarget, dt * 2.5);
  camera.position.set(camCurrent.x, camCurrent.y, camCurrent.z);
  camera.lookAt(camCurrent.lx, camCurrent.ly, camCurrent.lz);

  // Cig smooth
  lerpObj(cigCurrent, cigTarget, dt * 4);
  cigGroup.position.set(cigCurrent.x, cigCurrent.y, cigCurrent.z);
  cigGroup.rotation.set(cigCurrent.rx || 0, cigCurrent.ry || 0, cigCurrent.rz || 0);

  // Lighter smooth
  lerpObj(lighterCurrent, lighterTarget, dt * 4);
  lighterGroup.position.set(lighterCurrent.x, lighterCurrent.y, lighterCurrent.z);

  // Pack idle bob
  packGroup.position.y = Math.sin(t * 0.8) * 0.01;
  packGroup.rotation.y = 0.15 + Math.sin(t * 0.5) * 0.02;

  // Cigarette idle sway when smoking
  if (state === S.SMOKING && !puffing) {
    cigTarget.rz = 0.05 + Math.sin(t * 1.2) * 0.02;
    cigTarget.y = CIG_MOUTH.y + Math.sin(t * 0.8) * 0.01;
  }

  // Updates
  updateCigMesh();
  updateSmoke(dt);
  updateAsh(dt);
  idleSmoke(dt);
  animateFlame(t);
  animateEmber(t);

  renderer.render(scene, camera);
}

// ─── RESIZE ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── START ───
window.startApp = function() {
  if (started) return;
  started = true;
  document.getElementById('title-card').classList.add('hide');
  document.getElementById('cig-count').style.display = '';
  transitionTo(S.IDLE_PACK);
};

animate();

</script>
