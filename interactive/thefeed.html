<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/xxxxxxx.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{background:transparent;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;}
body{display:flex;justify-content:center;align-items:flex-start;padding-top:1rem;min-height:100vh;cursor:url('cursor.svg') 16 8,default;}
a,button,.grid-item,.profile-pic-wrap,.carousel-arrow,.post-detail-header .back,.post-detail-header .dots,.s-close,.stories-tap-left,.stories-tap-right,.stories-mute{cursor:url('crosshair.svg') 8 10,pointer;}
::-webkit-scrollbar{display:none;}
*{scrollbar-width:none;-ms-overflow-style:none;}

/* iPhone Frame */
.iphone{position:relative;width:375px;height:770px;background:#2c2c2e;border-radius:50px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 2px 4px rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.6),0 20px 60px rgba(0,0,0,.5);flex-shrink:0;}
.iphone::before{content:'';position:absolute;inset:0;border-radius:50px;background:linear-gradient(135deg,rgba(255,255,255,.06) 0%,transparent 50%,rgba(0,0,0,.1) 100%);pointer-events:none;z-index:1;}

/* Side Buttons */
.btn-silent{position:absolute;left:-3px;top:130px;width:3px;height:28px;background:linear-gradient(90deg,#1a1a1c,#3a3a3c);border-radius:2px 0 0 2px;box-shadow:-1px 0 2px rgba(0,0,0,.4);}
.btn-vol-up{position:absolute;left:-3px;top:175px;width:3px;height:48px;background:linear-gradient(90deg,#1a1a1c,#3a3a3c);border-radius:2px 0 0 2px;box-shadow:-1px 0 2px rgba(0,0,0,.4);}
.btn-vol-down{position:absolute;left:-3px;top:232px;width:3px;height:48px;background:linear-gradient(90deg,#1a1a1c,#3a3a3c);border-radius:2px 0 0 2px;box-shadow:-1px 0 2px rgba(0,0,0,.4);}
.btn-power{position:absolute;right:-3px;top:190px;width:3px;height:68px;background:linear-gradient(270deg,#1a1a1c,#3a3a3c);border-radius:0 2px 2px 0;box-shadow:1px 0 2px rgba(0,0,0,.4);}

/* Screen */
.screen{position:absolute;top:14px;left:14px;right:14px;bottom:14px;border-radius:40px;background:#000;overflow:hidden;z-index:2;}

/* Dynamic Island */
.dynamic-island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:50;border:1px solid rgba(255,255,255,.04);}

/* Home Indicator */
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;z-index:50;}

/* Status Bar */
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 0;height:50px;position:relative;z-index:10;}
.status-bar .time{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.status-bar .icons{display:flex;align-items:center;gap:5px;}
.status-bar .icons svg{width:16px;height:16px;fill:#fff;}

/* App Container */
.app{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;}
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;}

/* Bottom Tab Bar */
.tab-bar{height:60px;background:#000;border-top:1px solid #262626;display:flex;align-items:flex-start;justify-content:space-around;padding-top:8px;flex-shrink:0;z-index:30;}
.tab-bar .tab{display:flex;align-items:center;justify-content:center;width:40px;height:40px;opacity:.5;}
.tab-bar .tab.active{opacity:1;}
.tab-bar .tab svg{width:24px;height:24px;fill:#fff;}

/* Views */
.view{display:none;flex-direction:column;min-height:100%;}
.view.active{display:flex;}

/* Profile View */
.profile-header{padding:10px 16px 0;}
.profile-username-row{display:flex;align-items:center;gap:6px;padding:4px 0 12px;}
.profile-username-row .username{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.profile-username-row .verified{width:18px;height:18px;flex-shrink:0;}
.profile-top{display:flex;align-items:center;padding:0 16px 12px;gap:20px;}
.profile-pic-wrap{position:relative;width:80px;height:80px;flex-shrink:0;cursor:url('crosshair.svg') 8 10,pointer;}
.story-ring{position:absolute;inset:-3px;border-radius:50%;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);padding:3px;}
.story-ring-inner{width:100%;height:100%;border-radius:50%;background:#000;padding:2px;}
.profile-pic{width:100%;height:100%;border-radius:50%;background:#262626;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.profile-pic-placeholder{font-size:28px;font-weight:700;color:#666;}
.profile-stats{display:flex;gap:16px;flex:1;justify-content:center;}
.profile-stat{text-align:center;}
.profile-stat .num{font-size:17px;font-weight:700;}
.profile-stat .label{font-size:12px;color:#aaa;margin-top:1px;}
.profile-bio{padding:0 16px 12px;}
.profile-bio .name{font-weight:700;font-size:13px;margin-bottom:2px;}
.profile-bio .text{font-size:13px;line-height:1.4;color:#eee;}
.profile-bio .link{color:#e0f1ff;font-size:13px;margin-top:1px;}
.profile-actions{display:flex;gap:6px;padding:0 16px 14px;}
.profile-actions .btn{flex:1;height:34px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;}
.profile-actions .btn-follow{background:#3897f0;color:#fff;}
.profile-actions .btn-message{background:#262626;color:#fff;}

/* Content Tabs */
.content-tabs{display:flex;border-bottom:1px solid #262626;}
.content-tab{flex:1;height:44px;display:flex;align-items:center;justify-content:center;opacity:.4;position:relative;}
.content-tab.active{opacity:1;}
.content-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:#fff;}
.content-tab svg{width:24px;height:24px;fill:#fff;}

/* Post Grid */
.post-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;}
.grid-item{aspect-ratio:1;overflow:hidden;cursor:url('crosshair.svg') 8 10,pointer;background:#111;}
.grid-item img{width:100%;height:100%;object-fit:cover;}

/* Post Detail View */
.post-detail{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.post-detail.open{transform:translateX(0);}
.post-detail-header{display:flex;align-items:center;height:50px;padding:0 12px;gap:10px;position:sticky;top:0;background:#000;z-index:5;margin-top:50px;}
.post-detail-header .back{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:url('crosshair.svg') 8 10,pointer;}
.post-detail-header .back svg{width:22px;height:22px;fill:#fff;}
.post-detail-header .avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.post-detail-header .avatar img{width:100%;height:100%;object-fit:cover;}
.post-detail-header .uname{font-size:13px;font-weight:600;flex:1;}
.post-detail-header .dots{font-size:18px;letter-spacing:2px;cursor:url('crosshair.svg') 8 10,pointer;}

/* Carousel */
.carousel-wrap{position:relative;width:100%;overflow:hidden;background:#111;}
.carousel-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform;}
.carousel-slide{flex:0 0 100%;aspect-ratio:4/5;}
.carousel-slide img{width:100%;height:100%;object-fit:cover;}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);border:none;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:url('crosshair.svg') 8 10,pointer;z-index:3;backdrop-filter:blur(4px);}
.carousel-arrow.left{left:8px;}
.carousel-arrow.right{right:8px;}
.carousel-arrow:disabled{opacity:0;pointer-events:none;}
.carousel-dots{display:flex;justify-content:center;gap:4px;padding:10px 0;}
.carousel-dots .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);}
.carousel-dots .dot.active{background:#3897f0;}

/* Post Actions */
.post-actions{display:flex;align-items:center;padding:10px 14px 6px;gap:14px;}
.post-actions svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;cursor:url('crosshair.svg') 8 10,pointer;}
.post-actions .spacer{flex:1;}
.post-actions .bookmark svg{stroke:#fff;}
.post-likes{padding:0 14px;font-size:13px;font-weight:600;}
.post-caption{padding:6px 14px 14px;font-size:13px;line-height:1.4;}
.post-caption .cap-user{font-weight:700;}

/* Feed View */
.feed-view .feed-post{margin-bottom:12px;border-bottom:1px solid #262626;padding-bottom:12px;}
.feed-post-header{display:flex;align-items:center;height:52px;padding:0 12px;gap:10px;}
.feed-post-header .avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.feed-post-header .avatar img{width:100%;height:100%;object-fit:cover;}
.feed-post-header .uname{font-size:13px;font-weight:600;flex:1;}
.feed-post-header .dots{letter-spacing:2px;}

/* Placeholder Tab */
.placeholder-view{display:flex;align-items:center;justify-content:center;flex:1;color:#555;font-size:14px;padding:60px 20px;text-align:center;margin-top:50px;}

/* Stories Overlay */
.stories-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:45;display:none;}
.stories-overlay.open{display:block;}
.stories-progress{display:flex;gap:3px;padding:10px 10px 6px;z-index:6;position:relative;}
.stories-progress .bar-bg{flex:1;height:2px;background:rgba(255,255,255,.25);border-radius:1px;overflow:hidden;}
.stories-progress .bar-fill{height:100%;background:#fff;width:0%;border-radius:1px;}
.stories-header{display:flex;align-items:center;gap:10px;padding:4px 12px;z-index:6;position:relative;}
.stories-header .s-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.stories-header .s-uname{font-size:13px;font-weight:600;flex:1;}
.stories-header .s-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:url('crosshair.svg') 8 10,pointer;font-size:20px;color:#fff;}
.stories-content{position:absolute;top:4px;left:4px;right:4px;bottom:60px;overflow:hidden;border-radius:14px;}
.stories-content>img,.stories-content>video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:#111;z-index:1;}
.stories-tap-left{position:absolute;top:0;left:0;width:40%;height:70%;z-index:3;cursor:url('crosshair.svg') 8 10,pointer;}
.stories-tap-right{position:absolute;top:0;right:0;width:60%;height:70%;z-index:3;cursor:url('crosshair.svg') 8 10,pointer;}
.stories-mute{position:absolute;bottom:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:none;display:flex;align-items:center;justify-content:center;z-index:6;cursor:url('crosshair.svg') 8 10,pointer;backdrop-filter:blur(4px);}
.stories-mute svg{width:18px;height:18px;fill:#fff;}
/* Stories reply bar */
.stories-reply{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:5;}
.stories-reply input{flex:1;height:38px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px;font-family:inherit;padding:0 14px;outline:none;}
.stories-reply input::placeholder{color:rgba(255,255,255,.5);}
.stories-reply .sr-icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stories-reply .sr-icon svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;}

/* Like animation */
@keyframes heartPop{0%{transform:scale(0);opacity:1;}50%{transform:scale(1.2);opacity:1;}100%{transform:scale(1);opacity:0;}}
.heart-pop{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:10;}
.heart-pop svg{width:80px;height:80px;fill:#ed4956;}
</style>
</head>
<body>

  <div class="screen">

              <svg class="verified" viewBox="0 0 40 40" fill="none"><path d="M19.998 3.094L14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v6.354h6.234L14.638 40l5.36-3.094L25.358 40l2.972-5.15h6.234v-6.354L40 25.359 36.906 20 40 14.641l-5.436-3.137V5.15h-6.234L25.358 0l-5.36 3.094z" fill="#3897f0"/><path d="M17.204 27.822l-6.678-6.678 2.674-2.674 4.004 4.004 9.012-9.012 2.674 2.674-11.686 11.686z" fill="#fff"/></svg>

<script>
(function(){
const IMG = '../img/all/lyrc/';

// Clock
function updateClock(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes();
  document.getElementById('clock').textContent=`${h%12||12}:${m<10?'0':''}${m}`;
}

// Carousel Init
function initCarousel(wrap){
  if(!wrap) return;
  const track=wrap.querySelector('.carousel-track');
  const slides=wrap.querySelectorAll('.carousel-slide');
  const leftArr=wrap.querySelector('.carousel-arrow.left');
  const rightArr=wrap.querySelector('.carousel-arrow.right');
  const dotsWrap=wrap.nextElementSibling;
  let idx=0;
  const total=slides.length;
  let startX=0,diffX=0,dragging=false;

  function go(i){
    idx=Math.max(0,Math.min(total-1,i));
    track.style.transform=`translateX(-${idx*100}%)`;
    if(leftArr) leftArr.disabled=idx===0;
    if(rightArr) rightArr.disabled=idx===total-1;
    if(dotsWrap && dotsWrap.classList.contains('carousel-dots')){
      dotsWrap.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('active',j===idx));
    }
  }

  if(leftArr) leftArr.addEventListener('click',e=>{e.stopPropagation();go(idx-1);});
  if(rightArr) rightArr.addEventListener('click',e=>{e.stopPropagation();go(idx+1);});

  wrap.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;diffX=0;dragging=true;track.style.transition='none';},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(!dragging) return;diffX=e.touches[0].clientX-startX;track.style.transform=`translateX(calc(-${idx*100}% + ${diffX}px))`;},{passive:true});
  wrap.addEventListener('touchend',()=>{
    dragging=false;track.style.transition='transform .35s cubic-bezier(.4,0,.2,1)';
    if(Math.abs(diffX)>40){go(diffX>0?idx-1:idx+1);}else{go(idx);}
  });
}

// Stories
let storyIdx=0,storyRaf=null,storyStart=0,storyDuration=10000,storyMuted=true;
const overlay=document.getElementById('storiesOverlay');
const sContent=document.getElementById('storiesContent');
const sProgress=document.getElementById('storiesProgress');
const sMute=document.getElementById('storiesMute');

document.getElementById('profilePicBtn').addEventListener('click',()=>openStories(0));

function updateStoryClock(){
  const sc=document.getElementById('storyClock');
  if(sc){const d=new Date(),h=d.getHours(),m=d.getMinutes();sc.textContent=`${h%12||12}:${m<10?'0':''}${m}`;}
}
function openStories(idx){
  storyIdx=idx;
  sProgress.innerHTML=stories.map(()=>'<div class="bar-bg"><div class="bar-fill"></div></div>').join('');
  overlay.classList.add('open');
  updateStoryClock();
  showStory();
}

function closeStories(){
  overlay.classList.remove('open');
  cancelAnimationFrame(storyRaf);
  const vid=sContent.querySelector('video');
  if(vid) vid.pause();
}

document.getElementById('storiesClose').addEventListener('click',closeStories);
document.getElementById('storyTapLeft').addEventListener('click',()=>{if(storyIdx>0){storyIdx--;showStory();}});
document.getElementById('storyTapRight').addEventListener('click',()=>{
  if(storyIdx<stories.length-1){storyIdx++;showStory();}else{closeStories();}
});

sMute.addEventListener('click',()=>{
  storyMuted=!storyMuted;
  const vid=sContent.querySelector('video');
  if(vid) vid.muted=storyMuted;
  document.getElementById('muteIcon').innerHTML=storyMuted
    ?'<path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    :'<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-3.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
});

function showStory(){
  cancelAnimationFrame(storyRaf);
  const s=stories[storyIdx];
  const bars=sProgress.querySelectorAll('.bar-fill');
  bars.forEach((b,i)=>{b.style.width=i<storyIdx?'100%':i>storyIdx?'0%':'0%';});

  // Remove old media
  const oldVid=sContent.querySelector('video');
  if(oldVid) oldVid.pause();
  const oldMedia=sContent.querySelectorAll('img,video');
  oldMedia.forEach(m=>m.remove());

  if(s.type==='video'){
    sMute.style.display='flex';
    const vid=document.createElement('video');
    vid.src=IMG+s.src;
    vid.autoplay=true;
    vid.muted=storyMuted;
    vid.playsInline=true;
    vid.setAttribute('playsinline','');
    vid.setAttribute('webkit-playsinline','');
    sContent.insertBefore(vid,sContent.firstChild);

    vid.addEventListener('loadedmetadata',()=>{
      storyDuration=vid.duration*1000;
      storyStart=performance.now();
      animateBar();
    });
    vid.addEventListener('ended',()=>{
      if(storyIdx<stories.length-1){storyIdx++;showStory();}else closeStories();
    });
  } else {
    sMute.style.display='none';
    const img=document.createElement('img');
    img.src=IMG+s.src;
    sContent.insertBefore(img,sContent.firstChild);
    storyDuration=10000;
    storyStart=performance.now();
    animateBar();
  }
}

function animateBar(){
  const bar=sProgress.querySelectorAll('.bar-fill')[storyIdx];
  if(!bar) return;
  function tick(now){
    const elapsed=now-storyStart;
    const pct=Math.min(elapsed/storyDuration,1);
    bar.style.width=pct*100+'%';
    if(pct<1){storyRaf=requestAnimationFrame(tick);}
    else{
      if(storyIdx<stories.length-1){storyIdx++;showStory();}else closeStories();
    }
  }
  storyRaf=requestAnimationFrame(tick);
}

})();
