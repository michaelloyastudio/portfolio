<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <g transform="translate(200,200)">
    <!-- Flask body -->
    <path d="M-30,-80 L-30,-20 L-75,70 Q-80,82 -70,90 L70,90 Q80,82 75,70 L30,-20 L30,-80 Z" fill="none" stroke="#E8E0D4" stroke-width="3" stroke-linejoin="round"/>
    <!-- Flask neck -->
    <rect x="-35" y="-90" width="70" height="12" rx="4" fill="none" stroke="#E8E0D4" stroke-width="3"/>
    <!-- Liquid fill -->
    <path d="M-60,40 Q-40,25 -20,40 Q0,55 20,40 Q40,25 60,40 L75,70 Q80,82 70,90 L-70,90 Q-80,82 -75,70 Z" fill="#ff8e3d" opacity="0.8"/>
    <!-- Bubbles -->
    <circle cx="-20" cy="55" r="5" fill="#ff8e3d" opacity="0.4"/>
    <circle cx="15" cy="45" r="3" fill="#ff8e3d" opacity="0.3"/>
    <circle cx="-5" cy="30" r="4" fill="#ff8e3d" opacity="0.2"/>
    <circle cx="25" cy="60" r="6" fill="#ff8e3d" opacity="0.35"/>
    <!-- Sparkle accents -->
    <line x1="-90" y1="-60" x2="-80" y2="-60" stroke="#ff8e3d" stroke-width="2" stroke-linecap="round"/>
    <line x1="-85" y1="-65" x2="-85" y2="-55" stroke="#ff8e3d" stroke-width="2" stroke-linecap="round"/>
    <line x1="85" y1="-40" x2="95" y2="-40" stroke="#ff8e3d" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="-45" x2="90" y2="-35" stroke="#ff8e3d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="-70" r="2" fill="#ff8e3d" opacity="0.6"/>
    <circle cx="-75" cy="-30" r="1.5" fill="#ff8e3d" opacity="0.5"/>
    <!-- "LAB" text -->
    <text x="0" y="120" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#E8E0D4" letter-spacing="8">LAB</text>
  </g>
</svg>