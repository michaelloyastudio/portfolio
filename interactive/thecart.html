<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Cart — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
* { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --green: #44ff66;
  --yellow: #ffdd44;
  --orange: #ff8e3d;
  --red: #ff4444;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
  overflow-x: hidden;
}

body:focus, body *:focus { outline: none !important; }

a, button, .clickable { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  z-index: 100;
}

.header-logo-link {
  display: block;
  height: 32px;
  position: relative;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px;
  padding-top: 90px;
  gap: 20px;
  position: relative;
  transition: filter 1s ease, transform 1s ease;
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}

.title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2.5rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.6rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ── WHEEL CONTAINER ── */
.wheel-container {
  position: relative;
  width: min(80vw, 400px);
  height: min(80vw, 400px);
  margin: 10px 0;
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  filter: drop-shadow(0 0 30px rgba(255,142,61,0.15));
}

.wheel.spinning {
  transition: transform 5s cubic-bezier(0.15, 0.6, 0.2, 1);
}

.wheel-glow {
  position: absolute;
  inset: -20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,142,61,0.1) 0%, transparent 70%);
  pointer-events: none;
  opacity: 0.5;
  transition: opacity 0.5s;
}

.wheel-pointer {
  position: absolute;
  top: -15px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-top: 30px solid var(--accent);
  filter: drop-shadow(0 2px 8px rgba(255,142,61,0.5));
  z-index: 10;
}

.wheel-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--bg);
  border: 3px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.wheel-center-text {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
}

/* ── MODE SELECTOR ── */
.mode-selector {
  display: flex;
  gap: 4px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 8px;
  padding: 4px;
  margin-bottom: 4px;
}

.mode-btn {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: all 0.2s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.active { background: rgba(255,142,61,0.15); color: var(--accent); }

/* ── INTERVAL MODE ── */
.interval-mode {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  width: 100%;
  max-width: 400px;
}

.interval-mode.active { display: flex; }

.interval-status {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.8rem;
  color: var(--text);
  text-align: center;
  min-height: 2.2rem;
}

.interval-status.rip { color: var(--accent); }
.interval-status.wait { color: var(--text-muted); }

.interval-timer-container {
  position: relative;
  width: 220px;
  height: 220px;
}

.interval-timer-container svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.interval-timer-bg {
  fill: none;
  stroke: #222;
  stroke-width: 6;
}

.interval-timer-progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 565.48;
  stroke-dashoffset: 0;
  transition: stroke 0.3s;
}

.interval-timer-progress.ripping { stroke: var(--accent); }
.interval-timer-progress.waiting { stroke: var(--text-muted); }

.interval-time-display {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.interval-time-number {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 3.5rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.interval-time-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.interval-round-count {
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.interval-start-btn {
  padding: 14px 48px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.2s;
}

.interval-start-btn:hover { background: #ffa05e; transform: translateY(-1px); }
.interval-start-btn.stop { background: var(--red); }
.interval-start-btn.stop:hover { background: #ff6666; }

.interval-stats {
  display: flex;
  gap: 24px;
}

.interval-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.interval-stat-value {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.interval-stat-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* Roulette mode wrapper */
.roulette-mode { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.roulette-mode.hidden { display: none; }

/* ── SPIN BUTTON ── */
.spin-btn {
  padding: 16px 48px;
  border-radius: 50px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

.spin-btn:hover {
  background: var(--accent);
  color: var(--bg);
  box-shadow: 0 0 30px rgba(255,142,61,0.4);
}

.spin-btn:disabled {
  opacity: 0.3;
  pointer-events: none;
}

/* ── SESSION STATS ── */
.stats-panel {
  display: flex;
  gap: 30px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 12px;
  padding: 15px 25px;
  margin-top: auto;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--accent);
  font-family: 'Space Grotesk', monospace;
}

.stat-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ── INTENSITY METER ── */
.intensity-container {
  width: 100%;
  max-width: 350px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.intensity-bar {
  height: 8px;
  background: #1a1a1a;
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.intensity-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--green), var(--yellow), var(--orange), var(--red), #ff00ff);
  border-radius: 4px;
  transition: width 0.5s ease;
}

.intensity-label {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  text-align: center;
  transition: color 0.5s;
}

.intensity-label.high { color: var(--accent); }
.intensity-label.max { color: var(--red); animation: pulse 0.5s infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ── CHALLENGE MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.challenge-modal {
  background: var(--panel);
  border: 1px solid #333;
  border-radius: 20px;
  padding: 40px;
  max-width: 90vw;
  width: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  transform: scale(0.9);
  transition: transform 0.3s;
}

.modal-overlay.visible .challenge-modal {
  transform: scale(1);
}

.challenge-name {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2rem;
  text-align: center;
}

.challenge-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.5;
}

.challenge-intensity {
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid;
}

.challenge-intensity.green { color: var(--green); border-color: var(--green); }
.challenge-intensity.yellow { color: var(--yellow); border-color: var(--yellow); }
.challenge-intensity.orange { color: var(--orange); border-color: var(--orange); }
.challenge-intensity.red { color: var(--red); border-color: var(--red); }

/* ── TIMER ── */
.timer-container {
  position: relative;
  width: 200px;
  height: 200px;
  display: none;
}

.timer-container.active { display: block; }

.timer-ring {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.timer-bg {
  fill: none;
  stroke: #222;
  stroke-width: 8;
}

.timer-progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 565.48;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.1s linear;
}

.timer-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
}

.timer-hit-count {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ── RIP IT BUTTON ── */
.rip-btn {
  padding: 20px 60px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: var(--bg);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.2s;
  box-shadow: 0 0 30px rgba(255,142,61,0.4);
}

.rip-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 50px rgba(255,142,61,0.6);
}

.rip-btn:active {
  transform: scale(0.98);
}

.rip-btn.hidden { display: none; }

.done-btn {
  padding: 16px 48px;
  border-radius: 50px;
  border: 2px solid var(--green);
  background: transparent;
  color: var(--green);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  transition: all 0.3s;
}

.done-btn:hover {
  background: var(--green);
  color: var(--bg);
}

.done-btn.hidden { display: none; }

/* ── RESULT MODAL ── */
.result-message {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2.5rem;
  text-align: center;
  color: var(--accent);
}

.result-stats {
  display: flex;
  gap: 25px;
}

.result-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.result-stat-value {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text);
}

.result-stat-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ── SMOKE OVERLAY ── */
.smoke-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity 2s ease;
  background: radial-gradient(ellipse at center, transparent 0%, rgba(100,100,100,0.1) 100%);
}

/* ── PARTICLES ── */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 45;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  animation: float 8s infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 0.5; }
  100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

/* ── BLINKER FLASH ── */
.blinker-flash {
  position: fixed;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  pointer-events: none;
  z-index: 300;
}

.blinker-flash.active {
  animation: blinkerFlash 0.15s infinite;
}

@keyframes blinkerFlash {
  0%, 100% { opacity: 0; }
  50% { opacity: 0.3; }
}

/* ── SCREEN SHAKE ── */
.shake {
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
  20%, 40%, 60%, 80% { transform: translateX(10px); }
}

/* ── BOOT SCREEN ── */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s ease;
}

.boot-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.boot-title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2.5rem;
  opacity: 0;
  transform: translateY(10px);
  animation: bootTitleIn 0.6s ease forwards 0.3s;
}

.boot-subtitle {
  font-size: 0.6rem;
  color: var(--text-muted);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  opacity: 0;
  animation: bootTitleIn 0.6s ease forwards 0.6s;
}

@keyframes bootTitleIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .title { font-size: 2rem; }
  .wheel-container { width: 85vw; height: 85vw; }
  .stats-panel { gap: 20px; padding: 12px 18px; }
  .stat-value { font-size: 1.2rem; }
  .challenge-modal { padding: 30px 20px; }
  .timer-container { width: 160px; height: 160px; }
  .timer-text { font-size: 2.5rem; }
}

/* ── LOAD ANIMATIONS ── */
.main { opacity: 0; transition: opacity 0.5s; }
.main.loaded { opacity: 1; }

/* ── TRIPPY MODE ── */
.trippy { animation: trippy 3s infinite; }
@keyframes trippy {
  0%, 100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(30deg); }
}
</style>
</head>
<body>

<!-- Boot Screen -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-title">The Cart</div>
  <div class="boot-subtitle">Session Roulette</div>
</div>

<!-- Smoke Overlay -->
<div class="smoke-overlay" id="smokeOverlay"></div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<!-- Blinker Flash -->
<div class="blinker-flash" id="blinkerFlash"></div>

<!-- Header -->
<header class="header">
  <a href="../index.html" class="header-logo-link">
    <img src="logo-gray.svg" alt="ML" class="header-logo logo-default">
    <img src="logo-orange.svg" alt="ML" class="header-logo logo-hover">
  </a>
</header>

<!-- Main Content -->
<main class="main" id="main">
  <div class="title-row">
    <h1 class="title">The Cart</h1>
    <span class="subtitle" id="subtitleText">Session Roulette</span>
  </div>

  <!-- Mode Selector -->
  <div class="mode-selector">
    <button class="mode-btn active" id="modeRoulette" onclick="switchMode('roulette')">Roulette</button>
    <button class="mode-btn" id="modeInterval" onclick="switchMode('interval')">Interval</button>
  </div>

  <!-- Interval Mode -->
  <div class="interval-mode" id="intervalMode">
    <div class="interval-status" id="intervalStatus">Ready?</div>
    <div class="interval-timer-container">
      <svg viewBox="0 0 200 200">
        <circle class="interval-timer-bg" cx="100" cy="100" r="90"/>
        <circle class="interval-timer-progress" id="intervalProgress" cx="100" cy="100" r="90"/>
      </svg>
      <div class="interval-time-display">
        <span class="interval-time-number" id="intervalTimeNum">3</span>
        <span class="interval-time-label" id="intervalTimeLabel">seconds</span>
      </div>
    </div>
    <div class="interval-round-count" id="intervalRoundCount">Round 0</div>
    <button class="interval-start-btn" id="intervalStartBtn" onclick="toggleInterval()">Start Session</button>
    <div class="interval-stats">
      <div class="interval-stat">
        <span class="interval-stat-value" id="intervalHits">0</span>
        <span class="interval-stat-label">Hits</span>
      </div>
      <div class="interval-stat">
        <span class="interval-stat-value" id="intervalTotalTime">0s</span>
        <span class="interval-stat-label">Total Hold</span>
      </div>
      <div class="interval-stat">
        <span class="interval-stat-value" id="intervalElapsed">0:00</span>
        <span class="interval-stat-label">Session</span>
      </div>
      <div class="interval-stat">
        <span class="interval-stat-value" id="intervalHighScore">0</span>
        <span class="interval-stat-label">Best Streak</span>
      </div>
    </div>
  </div>

  <!-- Roulette Mode -->
  <div class="roulette-mode" id="rouletteMode">

  <!-- Wheel -->
  <div class="wheel-container">
    <div class="wheel-glow" id="wheelGlow"></div>
    <div class="wheel-pointer"></div>
    <svg class="wheel" id="wheel" viewBox="0 0 400 400"></svg>
    <div class="wheel-center">
      <span class="wheel-center-text">Rip</span>
    </div>
  </div>

  <!-- Spin Button -->
  <button class="spin-btn" id="spinBtn">Spin The Wheel</button>

  <!-- Intensity Meter -->
  <div class="intensity-container">
    <div class="intensity-bar">
      <div class="intensity-fill" id="intensityFill"></div>
    </div>
    <div class="intensity-label" id="intensityLabel">Sober</div>
  </div>

  <!-- Stats Panel -->
  <div class="stats-panel">
    <div class="stat">
      <span class="stat-value" id="roundStat">0</span>
      <span class="stat-label">Round</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="totalTimeStat">0s</span>
      <span class="stat-label">Total Hold</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="biggestHitStat">0s</span>
      <span class="stat-label">Biggest Hit</span>
    </div>
  </div>

  </div><!-- end roulette-mode -->
</main>

<!-- Challenge Modal -->
<div class="modal-overlay" id="challengeModal">
  <div class="challenge-modal">
    <span class="challenge-intensity" id="challengeIntensity">Mild</span>
    <h2 class="challenge-name" id="challengeName">Baby Hit</h2>
    <p class="challenge-desc" id="challengeDesc">Take a 2 second hit</p>

    <div class="timer-container" id="timerContainer">
      <svg class="timer-ring" viewBox="0 0 200 200">
        <circle class="timer-bg" cx="100" cy="100" r="90"/>
        <circle class="timer-progress" id="timerProgress" cx="100" cy="100" r="90"/>
      </svg>
      <span class="timer-text" id="timerText">0</span>
      <span class="timer-hit-count" id="hitCount"></span>
    </div>

    <button class="rip-btn" id="ripBtn">Rip It</button>
    <button class="done-btn hidden" id="doneBtn">Done</button>
  </div>
</div>

<!-- Result Modal -->
<div class="modal-overlay" id="resultModal">
  <div class="challenge-modal">
    <h2 class="result-message" id="resultMessage">Destroyed.</h2>
    <div class="result-stats">
      <div class="result-stat">
        <span class="result-stat-value" id="resultRound">1</span>
        <span class="result-stat-label">Round</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="resultTotal">3s</span>
        <span class="result-stat-label">Total Hold</span>
      </div>
      <div class="result-stat">
        <span class="result-stat-value" id="resultBiggest">3s</span>
        <span class="result-stat-label">Biggest</span>
      </div>
    </div>
    <button class="spin-btn" id="spinAgainBtn">Spin Again</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// THE CART — SESSION ROULETTE
// ═══════════════════════════════════════════════════

const CHALLENGES = [
  // GREEN (Mild)
  { name: 'Baby Hit', desc: 'Take a gentle 2 second hit. Ease into it.', time: 2, hits: 1, intensity: 'green', color: '#44ff66' },
  { name: 'Standard', desc: 'A solid 3 second rip. Nothing fancy.', time: 3, hits: 1, intensity: 'green', color: '#44ff66' },
  { name: 'Deep Breath', desc: 'Breathe in through your nose first, then a 4 second hit.', time: 4, hits: 1, intensity: 'green', color: '#44ff66' },

  // YELLOW (Medium)
  { name: 'Ghost It', desc: 'Take a hit, let the vapor escape your mouth, then inhale it back.', time: 0, hits: 0, intensity: 'yellow', color: '#ffdd44' },
  { name: 'French Inhale', desc: 'Let the smoke pour from your mouth while inhaling through your nose. Classy.', time: 0, hits: 0, intensity: 'yellow', color: '#ffdd44' },
  { name: 'Double Up', desc: 'Two 3-second hits back to back. No breaks.', time: 3, hits: 2, intensity: 'yellow', color: '#ffdd44' },
  { name: 'Hold Your Breath', desc: 'A 6 second hold. Feel the burn.', time: 6, hits: 1, intensity: 'yellow', color: '#ffdd44' },

  // ORANGE (Spicy)
  { name: 'Blinker', desc: 'Hold until the cart blinks. 10 seconds of commitment.', time: 10, hits: 1, intensity: 'orange', color: '#ff8e3d', blinker: true },
  { name: 'Tornado', desc: 'Exhale onto a flat surface and swipe to create a tornado. Art.', time: 0, hits: 0, intensity: 'orange', color: '#ff8e3d' },
  { name: 'Triple Threat', desc: 'Three 3-second hits back to back. Good luck.', time: 3, hits: 3, intensity: 'orange', color: '#ff8e3d' },

  // RED (Death)
  { name: 'Double Blinker', desc: 'TWO blinker hits back to back. You asked for this.', time: 10, hits: 2, intensity: 'red', color: '#ff4444', blinker: true },
  { name: 'The Obliterator', desc: '15 seconds. One breath. Astral projection guaranteed.', time: 15, hits: 1, intensity: 'red', color: '#ff4444', obliterator: true }
];

const INTENSITY_LABELS = ['Sober', 'Buzzed', 'Floating', 'Faded', 'Zooted', 'Cooked', 'Obliterated', 'Astral Projecting'];
const RESULT_MESSAGES = [
  'Lightweight.', 'Not bad.', 'Feeling it?', 'Destroyed.', 'Still alive?',
  'Lungs of steel.', 'Absolute unit.', 'Call 911.', 'RIP.', 'Legend.'
];

// Audio context
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playSound(type) {
  const ctx = initAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  switch(type) {
    case 'tick':
      osc.frequency.value = 800;
      gain.gain.value = 0.1;
      osc.start();
      osc.stop(ctx.currentTime + 0.05);
      break;
    case 'ding':
      osc.frequency.value = 1200;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
      break;
    case 'whoosh':
      const noise = ctx.createBufferSource();
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      }
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1000;
      noise.connect(filter);
      filter.connect(gain);
      gain.gain.value = 0.15;
      noise.start();
      break;
    case 'segment':
      osc.frequency.value = 400 + Math.random() * 200;
      gain.gain.value = 0.05;
      osc.start();
      osc.stop(ctx.currentTime + 0.02);
      break;
    case 'buzz':
      osc.type = 'sawtooth';
      osc.frequency.value = 100;
      gain.gain.value = 0.15;
      osc.start();
      osc.stop(ctx.currentTime + 0.1);
      break;
    case 'achievement':
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc.connect(gain);
      osc2.connect(gain2);
      gain.connect(ctx.destination);
      gain2.connect(ctx.destination);
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      osc2.frequency.setValueAtTime(659, ctx.currentTime);
      osc2.frequency.setValueAtTime(784, ctx.currentTime + 0.1);
      osc2.frequency.setValueAtTime(1047, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      gain2.gain.setValueAtTime(0.15, ctx.currentTime);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start();
      osc2.start();
      osc.stop(ctx.currentTime + 0.4);
      osc2.stop(ctx.currentTime + 0.4);
      break;
  }
}

// State
let session = {
  round: 0,
  totalTime: 0,
  biggestHit: 0,
  intensity: 0
};

let currentChallenge = null;
let currentHit = 0;
let timerInterval = null;
let wheelRotation = 0;
let isSpinning = false;

// Elements
const wheel = document.getElementById('wheel');
const spinBtn = document.getElementById('spinBtn');
const challengeModal = document.getElementById('challengeModal');
const resultModal = document.getElementById('resultModal');
const timerContainer = document.getElementById('timerContainer');
const timerProgress = document.getElementById('timerProgress');
const timerText = document.getElementById('timerText');
const hitCount = document.getElementById('hitCount');
const ripBtn = document.getElementById('ripBtn');
const doneBtn = document.getElementById('doneBtn');
const blinkerFlash = document.getElementById('blinkerFlash');
const smokeOverlay = document.getElementById('smokeOverlay');
const wheelGlow = document.getElementById('wheelGlow');
const intensityFill = document.getElementById('intensityFill');
const intensityLabel = document.getElementById('intensityLabel');

// Initialize wheel
function createWheel() {
  const segments = CHALLENGES.length;
  const anglePerSegment = 360 / segments;
  let svg = '';

  CHALLENGES.forEach((challenge, i) => {
    const startAngle = i * anglePerSegment;
    const endAngle = (i + 1) * anglePerSegment;
    const startRad = (startAngle - 90) * Math.PI / 180;
    const endRad = (endAngle - 90) * Math.PI / 180;

    const x1 = 200 + 180 * Math.cos(startRad);
    const y1 = 200 + 180 * Math.sin(startRad);
    const x2 = 200 + 180 * Math.cos(endRad);
    const y2 = 200 + 180 * Math.sin(endRad);

    const largeArc = anglePerSegment > 180 ? 1 : 0;

    // Segment path
    svg += `<path d="M200,200 L${x1},${y1} A180,180 0 ${largeArc},1 ${x2},${y2} Z"
            fill="${challenge.color}" fill-opacity="0.2" stroke="${challenge.color}" stroke-width="2"/>`;

    // Text
    const textAngle = (startAngle + endAngle) / 2;
    const textRad = (textAngle - 90) * Math.PI / 180;
    const textX = 200 + 120 * Math.cos(textRad);
    const textY = 200 + 120 * Math.sin(textRad);

    svg += `<text x="${textX}" y="${textY}" fill="${challenge.color}" font-family="Space Grotesk"
            font-size="10" text-anchor="middle" dominant-baseline="middle"
            transform="rotate(${textAngle}, ${textX}, ${textY})">${challenge.name}</text>`;
  });

  wheel.innerHTML = svg;
}

// Spin wheel
function spinWheel() {
  if (isSpinning) return;
  isSpinning = true;
  spinBtn.disabled = true;

  playSound('whoosh');

  // Random rotation (5-8 full spins + random segment)
  const spins = 5 + Math.random() * 3;
  const segmentAngle = 360 / CHALLENGES.length;
  const randomSegment = Math.floor(Math.random() * CHALLENGES.length);
  const targetAngle = spins * 360 + randomSegment * segmentAngle + segmentAngle / 2;

  wheelRotation += targetAngle;
  wheel.style.transform = `rotate(${wheelRotation}deg)`;

  // Tick sounds during spin
  let tickCount = 0;
  const tickInterval = setInterval(() => {
    if (tickCount < 30) {
      playSound('segment');
      tickCount++;
    } else {
      clearInterval(tickInterval);
    }
  }, 100);

  // Show challenge after spin
  setTimeout(() => {
    isSpinning = false;
    clearInterval(tickInterval);

    // Calculate which segment we landed on
    const normalizedRotation = wheelRotation % 360;
    const segmentIndex = Math.floor((360 - normalizedRotation + 15) / segmentAngle) % CHALLENGES.length;

    currentChallenge = CHALLENGES[segmentIndex];
    currentHit = 0;
    showChallenge();
  }, 5000);
}

// Show challenge modal
function showChallenge() {
  document.getElementById('challengeName').textContent = currentChallenge.name;
  document.getElementById('challengeDesc').textContent = currentChallenge.desc;
  document.getElementById('challengeIntensity').textContent =
    currentChallenge.intensity === 'green' ? 'Mild' :
    currentChallenge.intensity === 'yellow' ? 'Medium' :
    currentChallenge.intensity === 'orange' ? 'Spicy' : 'Death';
  document.getElementById('challengeIntensity').className = 'challenge-intensity ' + currentChallenge.intensity;

  if (currentChallenge.time > 0) {
    ripBtn.classList.remove('hidden');
    doneBtn.classList.add('hidden');
    timerContainer.classList.remove('active');
    timerText.textContent = currentChallenge.time;
    timerProgress.style.strokeDashoffset = '0';

    if (currentChallenge.hits > 1) {
      hitCount.textContent = `Hit 1 of ${currentChallenge.hits}`;
    } else {
      hitCount.textContent = '';
    }
  } else {
    ripBtn.classList.add('hidden');
    doneBtn.classList.remove('hidden');
    timerContainer.classList.remove('active');
  }

  challengeModal.classList.add('visible');
}

// Start timer
function startTimer() {
  ripBtn.classList.add('hidden');
  timerContainer.classList.add('active');

  currentHit++;
  if (currentChallenge.hits > 1) {
    hitCount.textContent = `Hit ${currentHit} of ${currentChallenge.hits}`;
  }

  let timeLeft = currentChallenge.time;
  const totalTime = currentChallenge.time;
  const circumference = 565.48;

  timerText.textContent = timeLeft;
  timerProgress.style.stroke = currentChallenge.color;

  // Blinker effect at end
  const doBlinker = currentChallenge.blinker && timeLeft <= 2;

  timerInterval = setInterval(() => {
    timeLeft -= 0.1;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerText.textContent = '0';
      timerProgress.style.strokeDashoffset = circumference;

      // Blinker flash
      if (currentChallenge.blinker) {
        blinkerFlash.classList.add('active');
        playSound('buzz');
        setTimeout(() => blinkerFlash.classList.remove('active'), 500);
      }

      // Obliterator shake
      if (currentChallenge.obliterator) {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 500);
      }

      playSound('ding');

      // Track stats
      session.totalTime += currentChallenge.time;
      if (currentChallenge.time > session.biggestHit) {
        session.biggestHit = currentChallenge.time;
      }

      // Check for more hits
      if (currentHit < currentChallenge.hits) {
        setTimeout(() => {
          ripBtn.classList.remove('hidden');
          timerContainer.classList.remove('active');
          timerText.textContent = currentChallenge.time;
          timerProgress.style.strokeDashoffset = '0';
          hitCount.textContent = `Hit ${currentHit + 1} of ${currentChallenge.hits}`;
        }, 500);
      } else {
        setTimeout(completeChallenge, 800);
      }
      return;
    }

    timerText.textContent = Math.ceil(timeLeft);
    const offset = ((totalTime - timeLeft) / totalTime) * circumference;
    timerProgress.style.strokeDashoffset = offset;

    // Tick sound
    if (Math.ceil(timeLeft) !== Math.ceil(timeLeft + 0.1)) {
      playSound('tick');
    }

    // Blinker flash near end
    if (currentChallenge.blinker && timeLeft <= 2) {
      blinkerFlash.classList.add('active');
    }
  }, 100);
}

// Complete non-timer challenge
function completeDoneChallenge() {
  playSound('achievement');
  completeChallenge();
}

// Challenge complete
function completeChallenge() {
  blinkerFlash.classList.remove('active');
  challengeModal.classList.remove('visible');

  session.round++;
  updateIntensity();
  updateStats();

  // Show result
  document.getElementById('resultMessage').textContent =
    RESULT_MESSAGES[Math.floor(Math.random() * RESULT_MESSAGES.length)];
  document.getElementById('resultRound').textContent = session.round;
  document.getElementById('resultTotal').textContent = session.totalTime + 's';
  document.getElementById('resultBiggest').textContent = session.biggestHit + 's';

  playSound('achievement');
  resultModal.classList.add('visible');
}

// Update intensity
function updateIntensity() {
  // Intensity based on total time and rounds
  const intensityScore = Math.min(100, session.totalTime * 2 + session.round * 5);
  session.intensity = intensityScore;

  intensityFill.style.width = intensityScore + '%';

  const labelIndex = Math.min(Math.floor(intensityScore / 12.5), INTENSITY_LABELS.length - 1);
  intensityLabel.textContent = INTENSITY_LABELS[labelIndex];

  if (intensityScore > 80) {
    intensityLabel.className = 'intensity-label max';
  } else if (intensityScore > 50) {
    intensityLabel.className = 'intensity-label high';
  } else {
    intensityLabel.className = 'intensity-label';
  }

  // Visual effects
  smokeOverlay.style.opacity = intensityScore / 200;
  wheelGlow.style.opacity = 0.5 + intensityScore / 200;

  // Trippy mode at high intensity
  if (intensityScore > 70) {
    document.querySelector('.main').classList.add('trippy');
  }

  // Tilt at very high intensity
  if (intensityScore > 85) {
    document.querySelector('.main').style.transform = `rotate(${(intensityScore - 85) * 0.3}deg)`;
  }

  // Add particles
  if (session.round % 2 === 0) {
    addParticles(3 + Math.floor(intensityScore / 20));
  }
}

// Update stats display
function updateStats() {
  document.getElementById('roundStat').textContent = session.round;
  document.getElementById('totalTimeStat').textContent = session.totalTime + 's';
  document.getElementById('biggestHitStat').textContent = session.biggestHit + 's';
}

// Add smoke particles
function addParticles(count) {
  const container = document.getElementById('particles');
  for (let i = 0; i < count; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 3 + 's';
    particle.style.animationDuration = (6 + Math.random() * 4) + 's';
    container.appendChild(particle);

    // Remove after animation
    setTimeout(() => particle.remove(), 12000);
  }
}

// Spin again
function spinAgain() {
  resultModal.classList.remove('visible');
  spinBtn.disabled = false;
}

// Event listeners
spinBtn.addEventListener('click', spinWheel);
ripBtn.addEventListener('click', startTimer);
doneBtn.addEventListener('click', completeDoneChallenge);
document.getElementById('spinAgainBtn').addEventListener('click', spinAgain);

// ═══════════════════════════════════════════════════
// MODE SWITCHING
// ═══════════════════════════════════════════════════

function switchMode(mode) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  if (mode === 'roulette') {
    document.getElementById('modeRoulette').classList.add('active');
    document.getElementById('rouletteMode').classList.remove('hidden');
    document.getElementById('intervalMode').classList.remove('active');
    document.getElementById('subtitleText').textContent = 'Session Roulette';
  } else {
    document.getElementById('modeInterval').classList.add('active');
    document.getElementById('rouletteMode').classList.add('hidden');
    document.getElementById('intervalMode').classList.add('active');
    document.getElementById('subtitleText').textContent = 'Interval Training';
    // Stop interval if switching away while running
  }
}

// ═══════════════════════════════════════════════════
// INTERVAL MODE
// ═══════════════════════════════════════════════════

const INTERVAL_HIT_TIME = 3;    // 3 second hit
const INTERVAL_REST_TIME = 7;   // 7 second rest (10 total cycle)
const CIRCUMFERENCE = 565.48;

let intervalRunning = false;
let intervalTimer = null;
let intervalPhase = 'idle'; // 'idle', 'ripping', 'waiting'
let intervalTimeLeft = 0;
let intervalHitCount = 0;
let intervalTotalHold = 0;
let intervalSessionStart = 0;
let intervalElapsedTimer = null;
let intervalHighScore = parseInt(localStorage.getItem('cartIntervalHighScore')) || 0;

function toggleInterval() {
  if (intervalRunning) {
    stopInterval();
  } else {
    startInterval();
  }
}

function startInterval() {
  initAudio();
  intervalRunning = true;
  intervalHitCount = 0;
  intervalTotalHold = 0;
  intervalSessionStart = Date.now();

  const btn = document.getElementById('intervalStartBtn');
  btn.textContent = 'End Session';
  btn.classList.add('stop');

  document.getElementById('intervalHighScore').textContent = intervalHighScore;
  updateIntervalStats();

  // Start elapsed timer
  intervalElapsedTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - intervalSessionStart) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    document.getElementById('intervalElapsed').textContent = mins + ':' + String(secs).padStart(2, '0');
  }, 1000);

  // Start first rip
  startRipPhase();
}

function stopInterval() {
  intervalRunning = false;
  clearInterval(intervalTimer);
  clearInterval(intervalElapsedTimer);
  intervalTimer = null;
  intervalPhase = 'idle';

  const btn = document.getElementById('intervalStartBtn');
  btn.textContent = 'Start Session';
  btn.classList.remove('stop');

  // Check high score
  if (intervalHitCount > intervalHighScore) {
    intervalHighScore = intervalHitCount;
    localStorage.setItem('cartIntervalHighScore', intervalHighScore);
    document.getElementById('intervalHighScore').textContent = intervalHighScore;
  }

  const status = document.getElementById('intervalStatus');
  const isNewRecord = intervalHitCount > 0 && intervalHitCount >= intervalHighScore;
  status.textContent = isNewRecord ? 'New Record!' : (intervalHitCount > 0 ? RESULT_MESSAGES[Math.min(Math.floor(intervalHitCount / 3), RESULT_MESSAGES.length - 1)] : 'Ready?');
  status.className = 'interval-status' + (isNewRecord ? ' rip' : '');

  document.getElementById('intervalTimeNum').textContent = '—';
  document.getElementById('intervalTimeLabel').textContent = 'done';
  document.getElementById('intervalProgress').style.strokeDashoffset = '0';
  document.getElementById('intervalProgress').classList.remove('ripping', 'waiting');
}

function startRipPhase() {
  if (!intervalRunning) return;
  intervalPhase = 'ripping';
  intervalTimeLeft = INTERVAL_HIT_TIME;
  intervalHitCount++;

  const status = document.getElementById('intervalStatus');
  status.textContent = 'RIP IT';
  status.className = 'interval-status rip';

  const progress = document.getElementById('intervalProgress');
  progress.classList.add('ripping');
  progress.classList.remove('waiting');
  progress.style.stroke = '';

  document.getElementById('intervalRoundCount').textContent = 'Round ' + intervalHitCount;
  document.getElementById('intervalTimeNum').style.color = 'var(--accent)';

  playSound('ding');

  // Flash the page
  if (blinkerFlash) {
    blinkerFlash.classList.add('active');
    setTimeout(() => blinkerFlash.classList.remove('active'), 200);
  }

  runIntervalTimer(INTERVAL_HIT_TIME, () => {
    intervalTotalHold += INTERVAL_HIT_TIME;
    updateIntervalStats();
    playSound('achievement');

    // Update session intensity visuals
    const fakeIntensity = Math.min(100, intervalHitCount * 8);
    smokeOverlay.style.opacity = fakeIntensity / 200;
    intensityFill.style.width = fakeIntensity + '%';
    const labelIdx = Math.min(Math.floor(fakeIntensity / 12.5), INTENSITY_LABELS.length - 1);
    intensityLabel.textContent = INTENSITY_LABELS[labelIdx];

    if (intervalHitCount % 3 === 0) addParticles(3);

    startWaitPhase();
  });
}

function startWaitPhase() {
  if (!intervalRunning) return;
  intervalPhase = 'waiting';
  intervalTimeLeft = INTERVAL_REST_TIME;

  const status = document.getElementById('intervalStatus');
  status.textContent = 'Breathe...';
  status.className = 'interval-status wait';

  const progress = document.getElementById('intervalProgress');
  progress.classList.remove('ripping');
  progress.classList.add('waiting');

  document.getElementById('intervalTimeNum').style.color = 'var(--text-muted)';

  runIntervalTimer(INTERVAL_REST_TIME, () => {
    startRipPhase();
  });
}

function runIntervalTimer(duration, onComplete) {
  clearInterval(intervalTimer);
  let timeLeft = duration;
  const totalTime = duration;

  document.getElementById('intervalTimeNum').textContent = Math.ceil(timeLeft);
  document.getElementById('intervalTimeLabel').textContent = intervalPhase === 'ripping' ? 'hold' : 'rest';
  document.getElementById('intervalProgress').style.strokeDashoffset = '0';

  intervalTimer = setInterval(() => {
    if (!intervalRunning) { clearInterval(intervalTimer); return; }

    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(intervalTimer);
      document.getElementById('intervalTimeNum').textContent = '0';
      document.getElementById('intervalProgress').style.strokeDashoffset = CIRCUMFERENCE;
      onComplete();
      return;
    }

    document.getElementById('intervalTimeNum').textContent = Math.ceil(timeLeft);
    const offset = ((totalTime - timeLeft) / totalTime) * CIRCUMFERENCE;
    document.getElementById('intervalProgress').style.strokeDashoffset = offset;

    // Tick on second change
    if (Math.ceil(timeLeft) !== Math.ceil(timeLeft + 0.1)) {
      playSound('tick');
    }
  }, 100);
}

function updateIntervalStats() {
  document.getElementById('intervalHits').textContent = intervalHitCount;
  document.getElementById('intervalTotalTime').textContent = intervalTotalHold + 's';
}

// Initialize
createWheel();
document.getElementById('intervalHighScore').textContent = intervalHighScore;

// Boot sequence
setTimeout(() => {
  document.getElementById('bootScreen').classList.add('fade-out');
  setTimeout(() => {
    document.querySelector('.main').classList.add('loaded');
    document.getElementById('bootScreen').remove();
  }, 600);
}, 1500);

// Initial particles
addParticles(5);
</script>

</body>
