<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Rapper — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --parchment: #E8E0D4;
  --accent: #ff8e3d;
  --espresso: #3d2b1f;
  --warm-gray: #8a8580;
  --card-bg: #1a1a1a;
  --card-border: #2e2e2e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--parchment); font-family:'Space Grotesk',sans-serif; min-height:100vh; overflow-x:hidden; user-select:none; -webkit-user-select:none; }
h1,h2,h3 { font-family:'din-2014-rounded-variable',sans-serif; font-weight:400; }

/* ═══ LAYOUT ═══ */
.app { display:flex; flex-direction:column; height:100vh; }

/* HEADER */
.header {
  text-align:center; padding:16px 20px 8px; flex-shrink:0;
}
.header h1 { font-size:1.8rem; letter-spacing:1px; }
.header .sub { font-size:0.65rem; color:var(--warm-gray); text-transform:uppercase; letter-spacing:3px; }

/* CHARACTER VIEWPORT */
.viewport {
  flex:1; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; min-height:0;
}
#char-canvas { max-height:100%; max-width:100%; }

/* RAPPER NAME */
.rapper-name {
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  font-family:'din-2014-rounded-variable',sans-serif; font-size:1.4rem;
  background:rgba(10,10,10,0.8); padding:6px 20px; border-radius:4px;
  border:1px solid var(--card-border); backdrop-filter:blur(8px);
  cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.rapper-name:hover { border-color:var(--accent); }
.rapper-name .tap-hint { font-size:0.55rem; color:var(--warm-gray); display:block; text-align:center; margin-top:2px; text-transform:uppercase; letter-spacing:1px; }

/* CATEGORY TABS */
.cat-tabs {
  display:flex; justify-content:center; gap:4px; padding:8px 12px;
  flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.cat-tab {
  padding:8px 14px; border-radius:6px; font-size:0.65rem;
  text-transform:uppercase; letter-spacing:1.2px; cursor:pointer;
  background:var(--card-bg); border:1px solid var(--card-border);
  transition:all 0.2s; white-space:nowrap; color:var(--warm-gray);
}
.cat-tab.active { border-color:var(--accent); color:var(--accent); background:rgba(255,142,61,0.08); }
.cat-tab:hover { border-color:var(--accent); }

/* OPTIONS PANEL */
.options-panel {
  flex-shrink:0; padding:8px 16px 20px;
  display:flex; gap:8px; overflow-x:auto; justify-content:center;
  -webkit-overflow-scrolling:touch; flex-wrap:wrap;
}
.opt {
  min-width:56px; height:56px; border-radius:10px;
  border:2px solid var(--card-border); cursor:pointer;
  transition:all 0.2s; display:flex; align-items:center;
  justify-content:center; font-size:1.4rem; background:var(--card-bg);
  flex-shrink:0; position:relative;
}
.opt:hover { border-color:var(--accent); transform:translateY(-2px); }
.opt.active { border-color:var(--accent); box-shadow:0 0 12px rgba(255,142,61,0.2); }
.opt-swatch {
  width:56px; height:56px; border-radius:10px; border:2px solid var(--card-border);
  cursor:pointer; transition:all 0.2s; flex-shrink:0;
}
.opt-swatch:hover { border-color:var(--accent); transform:translateY(-2px); }
.opt-swatch.active { border-color:var(--accent); box-shadow:0 0 12px rgba(255,142,61,0.2); }
.opt-label {
  font-size:0.5rem; text-transform:uppercase; letter-spacing:1px;
  color:var(--warm-gray); text-align:center; margin-top:2px;
  max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.opt-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }

/* EXPORT BAR */
.export-bar {
  display:flex; justify-content:center; gap:8px; padding:0 16px 16px; flex-shrink:0;
}
.exp-btn {
  padding:10px 24px; border-radius:6px; font-size:0.7rem;
  text-transform:uppercase; letter-spacing:1.5px; cursor:pointer;
  font-family:'Space Grotesk',sans-serif; font-weight:600; transition:all 0.2s;
  border:1px solid var(--card-border); background:var(--card-bg); color:var(--parchment);
}
.exp-btn:hover { border-color:var(--accent); color:var(--accent); }
.exp-btn.primary { background:var(--accent); color:#0a0a0a; border-color:var(--accent); }
.exp-btn.primary:hover { filter:brightness(1.1); }

/* TOAST */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-80px);
  background:var(--card-bg); border:1px solid var(--accent); color:var(--parchment);
  padding:10px 24px; border-radius:6px; font-size:0.8rem; z-index:999;
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none;
}
.toast.show { transform:translateX(-50%) translateY(0); }

@media (max-width:600px) {
  .header h1 { font-size:1.4rem; }
  .cat-tabs { gap:3px; padding:6px 8px; }
  .cat-tab { padding:6px 10px; font-size:0.6rem; }
  .opt, .opt-swatch { min-width:48px; height:48px; width:48px; }
  .options-panel { gap:6px; padding:6px 12px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>The Rapper</h1>
    <div class="sub">Build Your Avatar</div>
  </div>

  <div class="viewport">
    <canvas id="char-canvas" width="400" height="560"></canvas>
    <div class="rapper-name" id="rapper-name" onclick="randomName()">
      <span id="name-text">Lil Loaded</span>
      <span class="tap-hint">tap for new name</span>
    </div>
  </div>

  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="options-panel" id="options-panel"></div>

  <div class="export-bar">
    <button class="exp-btn" onclick="randomizeAll()">🎲 Randomize</button>
    <button class="exp-btn primary" onclick="exportAvatar()">Save Image</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════
   THE RAPPER — Avatar Creator
   Michael Loya Studio
   ════════════════════════════════════════ */

const C = document.getElementById('char-canvas');
const X = C.getContext('2d');

// ─── AVATAR STATE ───
const avatar = {
  skin: 0,
  hair: 0,
  eyes: 0,
  mouth: 0,
  top: 0,
  chain: 0,
  glasses: 0,
  bottoms: 0,
  shoes: 0,
  bg: 0,
};

// ─── OPTIONS DATA ───
const SKINS = [
  { name:"Light", color:"#FDDCB5" },
  { name:"Fair", color:"#E8B88A" },
  { name:"Medium", color:"#C68E5B" },
  { name:"Tan", color:"#A0714A" },
  { name:"Brown", color:"#7B5239" },
  { name:"Dark", color:"#5A3825" },
  { name:"Deep", color:"#3D2517" },
  { name:"Ebony", color:"#2A1A10" },
];

const HAIRS = [
  { name:"Buzz Cut", id:"buzz" },
  { name:"Fade", id:"fade" },
  { name:"Waves", id:"waves" },
  { name:"Afro", id:"afro" },
  { name:"Dreads", id:"dreads" },
  { name:"Braids", id:"braids" },
  { name:"Mohawk", id:"mohawk" },
  { name:"Durag", id:"durag" },
  { name:"Beanie", id:"beanie" },
  { name:"Bald", id:"bald" },
];

const EYES_LIST = [
  { name:"Normal", id:"normal" },
  { name:"Sleepy", id:"sleepy" },
  { name:"Mean", id:"mean" },
  { name:"Wide", id:"wide" },
  { name:"Wink", id:"wink" },
  { name:"Stars", id:"stars" },
];

const MOUTHS = [
  { name:"Neutral", id:"neutral" },
  { name:"Smirk", id:"smirk" },
  { name:"Grill", id:"grill" },
  { name:"Open", id:"open" },
  { name:"Teeth", id:"teeth" },
  { name:"Tongue", id:"tongue" },
];

const TOPS = [
  { name:"Hoodie", id:"hoodie", color:"#222" },
  { name:"Puffer", id:"puffer", color:"#1a1a1a" },
  { name:"Leather", id:"leather", color:"#2a1a10" },
  { name:"Jersey", id:"jersey", color:"#cc2222" },
  { name:"Fur Coat", id:"fur", color:"#8b7355" },
  { name:"Tank Top", id:"tank", color:"#f5f5f5" },
  { name:"Flannel", id:"flannel", color:"#b22222" },
  { name:"Denim Jacket", id:"denim", color:"#4a6fa5" },
  { name:"Varsity", id:"varsity", color:"#1a3a6a" },
  { name:"No Shirt", id:"none", color:"transparent" },
];

const CHAINS = [
  { name:"None", id:"none" },
  { name:"Cuban Link", id:"cuban" },
  { name:"Pendant", id:"pendant" },
  { name:"Double Chain", id:"double" },
  { name:"Rope Chain", id:"rope" },
  { name:"Cross", id:"cross" },
];

const GLASSES_LIST = [
  { name:"None", id:"none" },
  { name:"Shades", id:"shades" },
  { name:"Clout", id:"clout" },
  { name:"Aviator", id:"aviator" },
  { name:"Round", id:"round" },
  { name:"Ski Mask", id:"ski" },
];

const BOTTOMS = [
  { name:"Jeans", id:"jeans", color:"#2a3a5a" },
  { name:"Black Jeans", id:"bjeans", color:"#1a1a1a" },
  { name:"Sweats", id:"sweats", color:"#333" },
  { name:"Cargos", id:"cargos", color:"#5a5040" },
  { name:"Shorts", id:"shorts", color:"#222" },
  { name:"Baggy", id:"baggy", color:"#3a3a4a" },
];

const SHOES_LIST = [
  { name:"Jordans", id:"jordans", color:"#cc2222" },
  { name:"AF1s", id:"af1", color:"#f5f5f5" },
  { name:"Yeezys", id:"yeezys", color:"#d4cfc4" },
  { name:"Timbs", id:"timbs", color:"#c4922a" },
  { name:"Slides", id:"slides", color:"#222" },
  { name:"Dunks", id:"dunks", color:"#2255aa" },
];

const BGS = [
  { name:"Dark", color:"#0a0a0a" },
  { name:"Studio", color:"#1a1215" },
  { name:"Stage", color:"#0f0a1a" },
  { name:"Brick", color:"#2a1a15" },
  { name:"Purple", color:"#1a0f2a" },
  { name:"Green Screen", color:"#0a2a0a" },
  { name:"Blue", color:"#0a1a2a" },
  { name:"Red", color:"#2a0a0a" },
];

const CATEGORIES = [
  { key:"skin", label:"Skin", options:SKINS, type:"swatch" },
  { key:"hair", label:"Hair", options:HAIRS, type:"icon" },
  { key:"eyes", label:"Eyes", options:EYES_LIST, type:"icon" },
  { key:"mouth", label:"Mouth", options:MOUTHS, type:"icon" },
  { key:"top", label:"Top", options:TOPS, type:"icon" },
  { key:"chain", label:"Chains", options:CHAINS, type:"icon" },
  { key:"glasses", label:"Glasses", options:GLASSES_LIST, type:"icon" },
  { key:"bottoms", label:"Bottoms", options:BOTTOMS, type:"icon" },
  { key:"shoes", label:"Shoes", options:SHOES_LIST, type:"icon" },
  { key:"bg", label:"BG", options:BGS, type:"swatch" },
];

let currentCat = 0;

// ─── RAPPER NAME GENERATOR ───
const PREFIXES = ["Lil","Big","Young","King","MC","DJ","Chief","Slim","Baby","OG","Yung","Don","Kid","Rich","A$AP","Lil Baby","Polo","Pop","NLE","Rod","Luh"];
const NAMES = ["Loaded","Savage","Money","Drip","Flame","Smoke","Ice","Wave","Cash","Stack","Blaze","Frost","Ghost","Shadow","Venom","Phoenix","Storm","Chaos","Logic","Juice","Dolla","Reaper","Swag","Nova","Flex","Havoc","Chronic","Mayhem","Fury","Glitch"];

function randomName() {
  const pre = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
  const name = NAMES[Math.floor(Math.random() * NAMES.length)];
  document.getElementById('name-text').textContent = pre + ' ' + name;
}

// ─── UI BUILDING ───
function buildTabs() {
  const tabs = document.getElementById('cat-tabs');
  tabs.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const t = document.createElement('div');
    t.className = 'cat-tab' + (i === currentCat ? ' active' : '');
    t.textContent = cat.label;
    t.onclick = () => { currentCat = i; buildTabs(); buildOptions(); };
    tabs.appendChild(t);
  });
}

function buildOptions() {
  const panel = document.getElementById('options-panel');
  panel.innerHTML = '';
  const cat = CATEGORIES[currentCat];
  const opts = cat.options;

  opts.forEach((opt, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'opt-wrap';

    if (cat.type === 'swatch') {
      const el = document.createElement('div');
      el.className = 'opt-swatch' + (avatar[cat.key] === i ? ' active' : '');
      el.style.background = opt.color;
      if (opt.color === '#0a0a0a') el.style.border = '2px solid #333';
      el.onclick = () => { avatar[cat.key] = i; buildOptions(); draw(); };
      wrap.appendChild(el);
    } else {
      const el = document.createElement('div');
      el.className = 'opt' + (avatar[cat.key] === i ? ' active' : '');
      // Preview emoji/icon
      const icons = {
        // Hair
        buzz:"💈", fade:"💇", waves:"🌊", afro:"✊", dreads:"🔗", braids:"🪢", mohawk:"⚡", durag:"🧢", beanie:"🎿", bald:"🪨",
        // Eyes
        normal:"👁️", sleepy:"😴", mean:"😠", wide:"👀", wink:"😉", stars:"🤩",
        // Mouth
        neutral:"😐", smirk:"😏", grill:"🤑", open:"😮", teeth:"😁", tongue:"😛",
        // Tops
        hoodie:"🧥", puffer:"🧥", leather:"🧥", jersey:"👕", fur:"🦊", tank:"🎽", flannel:"👔", denim:"👖", varsity:"🧥", none:"🚫",
        // Chains
        cuban:"⛓️", pendant:"📿", double:"⛓️⛓️", rope:"🪢", cross:"✝️",
        // Glasses
        shades:"🕶️", clout:"😎", aviator:"🕶️", round:"🤓", ski:"🎿",
        // Bottoms
        jeans:"👖", bjeans:"👖", sweats:"🩳", cargos:"👖", shorts:"🩳", baggy:"👖",
        // Shoes
        jordans:"👟", af1:"👟", yeezys:"👟", timbs:"🥾", slides:"🩴", dunks:"👟",
      };
      el.textContent = icons[opt.id] || opt.name[0];
      el.onclick = () => { avatar[cat.key] = i; buildOptions(); draw(); };
      wrap.appendChild(el);
    }

    const label = document.createElement('div');
    label.className = 'opt-label';
    label.textContent = opt.name;
    wrap.appendChild(label);
    panel.appendChild(wrap);
  });
}

// ─── DRAWING ───
function draw() {
  const w = C.width, h = C.height;
  X.clearRect(0, 0, w, h);

  const skin = SKINS[avatar.skin].color;
  const bg = BGS[avatar.bg].color;
  const topOpt = TOPS[avatar.top];
  const bottomOpt = BOTTOMS[avatar.bottoms];
  const shoeOpt = SHOES_LIST[avatar.shoes];
  const hairOpt = HAIRS[avatar.hair];
  const eyeOpt = EYES_LIST[avatar.eyes];
  const mouthOpt = MOUTHS[avatar.mouth];
  const chainOpt = CHAINS[avatar.chain];
  const glassOpt = GLASSES_LIST[avatar.glasses];

  // Center coords
  const cx = w / 2;
  const headY = 110;
  const headR = 52;
  const bodyY = 200;
  const legY = 340;
  const footY = 470;

  // ── Background
  X.fillStyle = bg;
  X.fillRect(0, 0, w, h);

  // BG effects
  if (avatar.bg === 1) { // Studio - spotlight
    const sg = X.createRadialGradient(cx, 50, 10, cx, 250, 300);
    sg.addColorStop(0, 'rgba(255,200,150,0.08)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    X.fillStyle = sg;
    X.fillRect(0, 0, w, h);
  } else if (avatar.bg === 2) { // Stage
    const sg = X.createRadialGradient(cx, h, 50, cx, h * 0.3, 400);
    sg.addColorStop(0, 'rgba(120,80,200,0.1)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    X.fillStyle = sg;
    X.fillRect(0, 0, w, h);
    // Stage floor
    X.fillStyle = 'rgba(255,255,255,0.03)';
    X.fillRect(0, h * 0.85, w, h * 0.15);
  } else if (avatar.bg === 3) { // Brick
    X.fillStyle = 'rgba(180,100,60,0.06)';
    for (let by = 0; by < h; by += 18) {
      const off = (Math.floor(by / 18) % 2) * 30;
      for (let bx = off; bx < w; bx += 60) {
        X.fillRect(bx + 1, by + 1, 56, 15);
      }
    }
  }

  // ── SHOES
  drawShoes(cx, footY, shoeOpt);

  // ── LEGS / BOTTOMS
  drawBottoms(cx, legY, footY, bottomOpt, skin);

  // ── BODY / TOP
  drawTop(cx, bodyY, topOpt, skin);

  // ── ARMS
  drawArms(cx, bodyY, topOpt, skin);

  // ── CHAINS (under head, over top)
  drawChain(cx, bodyY - 20, chainOpt);

  // ── NECK
  X.fillStyle = skin;
  X.fillRect(cx - 12, headY + headR - 5, 24, 25);

  // ── HEAD
  drawHead(cx, headY, headR, skin);

  // ── HAIR
  drawHair(cx, headY, headR, hairOpt);

  // ── EYES
  drawEyes(cx, headY, eyeOpt);

  // ── GLASSES (over eyes)
  drawGlasses(cx, headY, glassOpt);

  // ── MOUTH
  drawMouth(cx, headY + 20, mouthOpt);

  // ── EARS
  X.fillStyle = skin;
  X.beginPath(); X.arc(cx - headR - 3, headY + 2, 8, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(cx + headR + 3, headY + 2, 8, 0, Math.PI * 2); X.fill();
}

function drawHead(cx, cy, r, skin) {
  X.fillStyle = skin;
  X.beginPath();
  X.ellipse(cx, cy, r, r * 1.1, 0, 0, Math.PI * 2);
  X.fill();
  // Jawline shadow
  X.fillStyle = 'rgba(0,0,0,0.08)';
  X.beginPath();
  X.ellipse(cx, cy + r * 0.6, r * 0.8, r * 0.4, 0, 0, Math.PI);
  X.fill();
}

function drawEyes(cx, cy, opt) {
  const eyeW = 18;
  const eyeSpacing = 20;

  const drawEye = (x, y, wink) => {
    if (wink) {
      // Closed eye line
      X.strokeStyle = '#111';
      X.lineWidth = 2;
      X.beginPath();
      X.moveTo(x - 7, y);
      X.quadraticCurveTo(x, y - 3, x + 7, y);
      X.stroke();
      return;
    }

    // Eye white
    X.fillStyle = '#fff';
    X.beginPath();
    X.ellipse(x, y, 9, opt.id === 'wide' ? 8 : opt.id === 'sleepy' ? 4 : 6, 0, 0, Math.PI * 2);
    X.fill();

    // Pupil
    X.fillStyle = '#1a1a1a';
    const pr = opt.id === 'wide' ? 5 : opt.id === 'sleepy' ? 3 : 4;
    X.beginPath();
    X.arc(x, y, pr, 0, Math.PI * 2);
    X.fill();

    // Highlight
    X.fillStyle = '#fff';
    X.beginPath();
    X.arc(x + 2, y - 2, 1.5, 0, Math.PI * 2);
    X.fill();

    // Eyebrow
    if (opt.id === 'mean') {
      X.strokeStyle = '#111';
      X.lineWidth = 3;
      X.beginPath();
      X.moveTo(x - 10, y - 12 + (x < cx ? 4 : 0));
      X.lineTo(x + 10, y - 12 + (x < cx ? 0 : 4));
      X.stroke();
    } else {
      X.strokeStyle = 'rgba(0,0,0,0.4)';
      X.lineWidth = 2.5;
      X.beginPath();
      X.moveTo(x - 9, y - 11);
      X.quadraticCurveTo(x, y - 15, x + 9, y - 11);
      X.stroke();
    }

    if (opt.id === 'stars') {
      X.fillStyle = '#FFD700';
      X.font = '10px serif';
      X.textAlign = 'center';
      X.fillText('★', x, y + 4);
    }
  };

  drawEye(cx - eyeSpacing, cy - 5, false);
  drawEye(cx + eyeSpacing, cy - 5, opt.id === 'wink');
}

function drawMouth(cx, cy, opt) {
  X.lineWidth = 2;

  if (opt.id === 'neutral') {
    X.strokeStyle = '#111';
    X.beginPath();
    X.moveTo(cx - 12, cy);
    X.lineTo(cx + 12, cy);
    X.stroke();
  } else if (opt.id === 'smirk') {
    X.strokeStyle = '#111';
    X.beginPath();
    X.moveTo(cx - 12, cy + 2);
    X.quadraticCurveTo(cx + 5, cy - 6, cx + 14, cy - 4);
    X.stroke();
  } else if (opt.id === 'grill') {
    // Teeth with gold
    X.fillStyle = '#111';
    X.beginPath();
    X.moveTo(cx - 14, cy - 2);
    X.quadraticCurveTo(cx, cy + 8, cx + 14, cy - 2);
    X.closePath();
    X.fill();
    // Gold teeth
    X.fillStyle = '#FFD700';
    for (let t = -10; t <= 10; t += 5) {
      X.fillRect(cx + t - 2, cy - 1, 4, 5);
    }
  } else if (opt.id === 'open') {
    X.fillStyle = '#111';
    X.beginPath();
    X.ellipse(cx, cy + 2, 10, 7, 0, 0, Math.PI * 2);
    X.fill();
    // Tongue hint
    X.fillStyle = '#cc5555';
    X.beginPath();
    X.ellipse(cx, cy + 6, 6, 3, 0, 0, Math.PI);
    X.fill();
  } else if (opt.id === 'teeth') {
    X.fillStyle = '#111';
    X.beginPath();
    X.moveTo(cx - 14, cy);
    X.quadraticCurveTo(cx, cy + 10, cx + 14, cy);
    X.closePath();
    X.fill();
    // White teeth
    X.fillStyle = '#fff';
    X.fillRect(cx - 12, cy, 24, 4);
  } else if (opt.id === 'tongue') {
    X.strokeStyle = '#111';
    X.beginPath();
    X.moveTo(cx - 12, cy);
    X.quadraticCurveTo(cx, cy + 6, cx + 12, cy);
    X.stroke();
    // Tongue
    X.fillStyle = '#cc5555';
    X.beginPath();
    X.ellipse(cx, cy + 8, 7, 5, 0, 0, Math.PI);
    X.fill();
  }
}

function drawHair(cx, cy, r, opt) {
  const id = opt.id;
  X.fillStyle = '#111';

  if (id === 'bald') return;

  if (id === 'buzz') {
    X.fillStyle = '#222';
    X.beginPath();
    X.ellipse(cx, cy - 8, r + 2, r * 0.85, 0, Math.PI, Math.PI * 2);
    X.fill();
  } else if (id === 'fade') {
    // Top hair
    X.beginPath();
    X.ellipse(cx, cy - 15, r - 5, r * 0.55, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Fade gradient sides
    X.fillStyle = 'rgba(17,17,17,0.4)';
    X.beginPath();
    X.ellipse(cx, cy - 5, r + 2, r * 0.7, 0, Math.PI * 1.1, Math.PI * 1.9);
    X.fill();
  } else if (id === 'waves') {
    X.beginPath();
    X.ellipse(cx, cy - 10, r + 2, r * 0.8, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Wave lines
    X.strokeStyle = 'rgba(60,60,60,0.5)';
    X.lineWidth = 1.5;
    for (let w = -3; w <= 3; w++) {
      X.beginPath();
      X.moveTo(cx - r + 10, cy - 20 + w * 6);
      for (let wx = 0; wx < r * 2 - 20; wx += 10) {
        X.quadraticCurveTo(cx - r + 15 + wx, cy - 24 + w * 6 + (wx % 20 ? 4 : -4), cx - r + 20 + wx, cy - 20 + w * 6);
      }
      X.stroke();
    }
  } else if (id === 'afro') {
    X.beginPath();
    X.arc(cx, cy - 15, r + 22, 0, Math.PI * 2);
    X.fill();
    // Texture
    X.fillStyle = 'rgba(40,40,40,0.3)';
    for (let i = 0; i < 30; i++) {
      const ax = cx + (Math.random() - 0.5) * (r + 20) * 2;
      const ay = cy - 15 + (Math.random() - 0.5) * (r + 20) * 2;
      if (Math.hypot(ax - cx, ay - (cy - 15)) < r + 20) {
        X.beginPath();
        X.arc(ax, ay, 2 + Math.random() * 3, 0, Math.PI * 2);
        X.fill();
      }
    }
  } else if (id === 'dreads') {
    // Top
    X.beginPath();
    X.ellipse(cx, cy - 12, r + 5, r * 0.8, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Hanging dreads
    for (let d = -5; d <= 5; d++) {
      const dx = cx + d * 10;
      const dy = cy + r * 0.3;
      const dlen = 40 + Math.abs(d) * 8 + Math.random() * 15;
      X.strokeStyle = '#111';
      X.lineWidth = 5;
      X.beginPath();
      X.moveTo(dx, dy);
      X.quadraticCurveTo(dx + d * 3, dy + dlen * 0.5, dx + d * 5, dy + dlen);
      X.stroke();
      // Dread texture
      X.strokeStyle = 'rgba(60,40,20,0.3)';
      X.lineWidth = 3;
      X.stroke();
    }
  } else if (id === 'braids') {
    X.beginPath();
    X.ellipse(cx, cy - 10, r + 3, r * 0.7, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Cornrows
    X.strokeStyle = 'rgba(50,50,50,0.6)';
    X.lineWidth = 1;
    for (let b = -4; b <= 4; b++) {
      X.beginPath();
      X.moveTo(cx + b * 8, cy - r * 1.05);
      X.lineTo(cx + b * 10, cy + r * 0.3);
      X.stroke();
    }
    // Hanging braids
    for (let b = -3; b <= 3; b++) {
      X.strokeStyle = '#111';
      X.lineWidth = 4;
      X.beginPath();
      X.moveTo(cx + b * 12, cy + r * 0.3);
      X.lineTo(cx + b * 14, cy + r * 0.3 + 50);
      X.stroke();
    }
  } else if (id === 'mohawk') {
    X.beginPath();
    X.moveTo(cx - 10, cy - r * 0.8);
    X.lineTo(cx, cy - r * 1.8);
    X.lineTo(cx + 10, cy - r * 0.8);
    X.closePath();
    X.fill();
    // Side fades
    X.fillStyle = 'rgba(17,17,17,0.3)';
    X.beginPath();
    X.ellipse(cx, cy - 5, r + 2, r * 0.65, 0, Math.PI * 1.15, Math.PI * 1.85);
    X.fill();
  } else if (id === 'durag') {
    // Durag wrap
    X.fillStyle = '#1a1a6a';
    X.beginPath();
    X.ellipse(cx, cy - 10, r + 6, r * 0.85, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Knot/tail
    X.fillStyle = '#1a1a6a';
    X.beginPath();
    X.moveTo(cx + r, cy - 5);
    X.quadraticCurveTo(cx + r + 25, cy - 15, cx + r + 30, cy + 10);
    X.lineTo(cx + r + 20, cy + 5);
    X.quadraticCurveTo(cx + r + 15, cy - 5, cx + r, cy - 2);
    X.fill();
    // Seam line
    X.strokeStyle = 'rgba(255,255,255,0.15)';
    X.lineWidth = 1;
    X.beginPath();
    X.moveTo(cx, cy - r * 0.95);
    X.lineTo(cx, cy - 10);
    X.stroke();
  } else if (id === 'beanie') {
    X.fillStyle = '#333';
    X.beginPath();
    X.ellipse(cx, cy - 15, r + 8, r * 0.9, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Fold
    X.fillStyle = '#444';
    X.fillRect(cx - r - 8, cy - r * 0.4, (r + 8) * 2, 12);
    // Ribbing
    X.strokeStyle = 'rgba(255,255,255,0.06)';
    X.lineWidth = 1;
    for (let rb = cx - r - 5; rb < cx + r + 5; rb += 4) {
      X.beginPath();
      X.moveTo(rb, cy - r * 0.4);
      X.lineTo(rb, cy - r * 0.4 + 12);
      X.stroke();
    }
  }
}

function drawTop(cx, bodyY, opt, skin) {
  const torsoW = 55;
  const torsoH = 120;

  if (opt.id === 'none') {
    // Bare chest
    X.fillStyle = skin;
    X.beginPath();
    X.roundRect(cx - torsoW, bodyY, torsoW * 2, torsoH, 8);
    X.fill();
    // Pec line
    X.strokeStyle = 'rgba(0,0,0,0.1)';
    X.lineWidth = 1;
    X.beginPath();
    X.moveTo(cx, bodyY + 10);
    X.lineTo(cx, bodyY + 50);
    X.stroke();
    return;
  }

  X.fillStyle = opt.color;
  X.beginPath();
  X.roundRect(cx - torsoW, bodyY, torsoW * 2, torsoH, 8);
  X.fill();

  // Detail by type
  if (opt.id === 'hoodie') {
    // Hood collar
    X.fillStyle = '#2a2a2a';
    X.beginPath();
    X.ellipse(cx, bodyY + 5, 25, 12, 0, Math.PI, Math.PI * 2);
    X.fill();
    // Pocket
    X.fillStyle = 'rgba(255,255,255,0.03)';
    X.beginPath();
    X.roundRect(cx - 30, bodyY + 65, 60, 25, 4);
    X.fill();
    // Strings
    X.strokeStyle = 'rgba(255,255,255,0.15)';
    X.lineWidth = 1.5;
    X.beginPath(); X.moveTo(cx - 8, bodyY + 5); X.lineTo(cx - 10, bodyY + 40); X.stroke();
    X.beginPath(); X.moveTo(cx + 8, bodyY + 5); X.lineTo(cx + 10, bodyY + 40); X.stroke();
  } else if (opt.id === 'puffer') {
    // Horizontal sections
    for (let s = 0; s < 5; s++) {
      X.fillStyle = s % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
      X.fillRect(cx - torsoW, bodyY + s * 24, torsoW * 2, 24);
    }
    // Zipper
    X.strokeStyle = 'rgba(200,200,200,0.3)';
    X.lineWidth = 2;
    X.beginPath();
    X.moveTo(cx, bodyY);
    X.lineTo(cx, bodyY + torsoH);
    X.stroke();
  } else if (opt.id === 'leather') {
    // Collar
    X.fillStyle = '#35241a';
    X.beginPath();
    X.moveTo(cx - 20, bodyY);
    X.lineTo(cx - 30, bodyY + 30);
    X.lineTo(cx, bodyY + 10);
    X.lineTo(cx + 30, bodyY + 30);
    X.lineTo(cx + 20, bodyY);
    X.stroke();
    // Zipper
    X.strokeStyle = 'rgba(200,200,200,0.4)';
    X.lineWidth = 2;
    X.beginPath(); X.moveTo(cx - 5, bodyY + 10); X.lineTo(cx - 5, bodyY + torsoH); X.stroke();
  } else if (opt.id === 'jersey') {
    // Number
    X.fillStyle = '#fff';
    X.font = 'bold 36px "Space Grotesk"';
    X.textAlign = 'center';
    X.fillText('23', cx, bodyY + 70);
    // Trim
    X.fillStyle = '#fff';
    X.fillRect(cx - torsoW, bodyY, torsoW * 2, 3);
  } else if (opt.id === 'fur') {
    // Fur texture
    X.fillStyle = 'rgba(160,140,100,0.3)';
    for (let fy = bodyY; fy < bodyY + torsoH; fy += 6) {
      for (let fx = cx - torsoW; fx < cx + torsoW; fx += 5) {
        if (Math.random() > 0.4) {
          X.fillRect(fx, fy, 3, 4 + Math.random() * 3);
        }
      }
    }
  } else if (opt.id === 'tank') {
    // Thin straps
    X.fillStyle = 'rgba(0,0,0,0.05)';
    X.fillRect(cx - torsoW, bodyY, torsoW * 2, torsoH);
  } else if (opt.id === 'flannel') {
    // Plaid pattern
    X.strokeStyle = 'rgba(0,0,0,0.2)';
    X.lineWidth = 1;
    for (let px = cx - torsoW; px < cx + torsoW; px += 12) {
      X.beginPath(); X.moveTo(px, bodyY); X.lineTo(px, bodyY + torsoH); X.stroke();
    }
    for (let py = bodyY; py < bodyY + torsoH; py += 12) {
      X.beginPath(); X.moveTo(cx - torsoW, py); X.lineTo(cx + torsoW, py); X.stroke();
    }
    // Buttons
    X.fillStyle = 'rgba(200,200,200,0.4)';
    for (let by = bodyY + 15; by < bodyY + torsoH - 10; by += 20) {
      X.beginPath(); X.arc(cx, by, 2, 0, Math.PI * 2); X.fill();
    }
  } else if (opt.id === 'varsity') {
    // Leather sleeves
    X.fillStyle = '#3d2b1f';
    // V neckline
    X.fillStyle = '#fff';
    X.lineWidth = 3;
    X.strokeStyle = '#fff';
    X.beginPath();
    X.moveTo(cx - 15, bodyY);
    X.lineTo(cx, bodyY + 25);
    X.lineTo(cx + 15, bodyY);
    X.stroke();
    // Letter
    X.font = 'bold 28px "din-2014-rounded-variable"';
    X.textAlign = 'center';
    X.fillText('M', cx, bodyY + 70);
  }
}

function drawArms(cx, bodyY, topOpt, skin) {
  const armW = 18;
  const armColor = topOpt.id === 'none' || topOpt.id === 'tank' ? skin : topOpt.color;

  // Left arm
  X.fillStyle = armColor;
  X.save();
  X.translate(cx - 58, bodyY + 10);
  X.rotate(0.12);
  X.beginPath();
  X.roundRect(-armW/2, 0, armW, 100, 6);
  X.fill();
  X.restore();

  // Right arm
  X.fillStyle = armColor;
  X.save();
  X.translate(cx + 58, bodyY + 10);
  X.rotate(-0.12);
  X.beginPath();
  X.roundRect(-armW/2, 0, armW, 100, 6);
  X.fill();
  X.restore();

  // Hands
  X.fillStyle = skin;
  X.beginPath(); X.arc(cx - 72, bodyY + 115, 10, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(cx + 72, bodyY + 115, 10, 0, Math.PI * 2); X.fill();
}

function drawBottoms(cx, legY, footY, opt, skin) {
  const legW = 22;
  const legGap = 14;
  const legH = footY - legY - 10;

  X.fillStyle = opt.color;

  if (opt.id === 'shorts') {
    // Short length
    const shortH = legH * 0.5;
    X.beginPath();
    X.roundRect(cx - legGap - legW, legY, legW * 2 + legGap * 2, shortH, 4);
    X.fill();
    // Exposed legs
    X.fillStyle = skin;
    X.fillRect(cx - legGap - legW + 5, legY + shortH, legW - 2, legH - shortH);
    X.fillRect(cx + legGap - 3, legY + shortH, legW - 2, legH - shortH);
  } else if (opt.id === 'baggy') {
    // Wide legs
    X.beginPath();
    X.moveTo(cx - legGap - legW - 8, legY);
    X.lineTo(cx - legGap - legW - 15, footY - 10);
    X.lineTo(cx - legGap + legW + 5, footY - 10);
    X.lineTo(cx - legGap + legW, legY);
    X.fill();
    X.beginPath();
    X.moveTo(cx + legGap - legW, legY);
    X.lineTo(cx + legGap - legW - 5, footY - 10);
    X.lineTo(cx + legGap + legW + 15, footY - 10);
    X.lineTo(cx + legGap + legW + 8, legY);
    X.fill();
  } else {
    // Regular legs
    X.beginPath();
    X.roundRect(cx - legGap - legW, legY, legW, legH, 4);
    X.fill();
    X.beginPath();
    X.roundRect(cx + legGap, legY, legW, legH, 4);
    X.fill();
    // Waistband connection
    X.fillRect(cx - legGap - legW, legY, legW * 2 + legGap * 2, 15);

    if (opt.id === 'cargos') {
      // Cargo pockets
      X.fillStyle = 'rgba(0,0,0,0.1)';
      X.fillRect(cx - legGap - legW + 2, legY + legH * 0.4, legW - 4, 15);
      X.fillRect(cx + legGap + 2, legY + legH * 0.4, legW - 4, 15);
    }
  }
}

function drawShoes(cx, footY, opt) {
  const shoeW = 28;
  const shoeH = 14;
  const gap = 14;

  X.fillStyle = opt.color;

  if (opt.id === 'slides') {
    // Flat slides
    X.beginPath();
    X.roundRect(cx - gap - shoeW - 5, footY, shoeW + 10, shoeH - 2, 4);
    X.fill();
    X.beginPath();
    X.roundRect(cx + gap - 5, footY, shoeW + 10, shoeH - 2, 4);
    X.fill();
    // Strap
    X.fillStyle = 'rgba(255,255,255,0.1)';
    X.fillRect(cx - gap - shoeW, footY - 4, shoeW + 5, 6);
    X.fillRect(cx + gap, footY - 4, shoeW + 5, 6);
  } else if (opt.id === 'timbs') {
    // Boot shape (taller)
    X.beginPath();
    X.roundRect(cx - gap - shoeW, footY - 15, shoeW, shoeH + 18, 4);
    X.fill();
    X.beginPath();
    X.roundRect(cx + gap, footY - 15, shoeW, shoeH + 18, 4);
    X.fill();
    // Sole
    X.fillStyle = 'rgba(0,0,0,0.3)';
    X.fillRect(cx - gap - shoeW - 2, footY + shoeH, shoeW + 4, 4);
    X.fillRect(cx + gap - 2, footY + shoeH, shoeW + 4, 4);
  } else {
    // Regular sneaker shape
    X.beginPath();
    X.roundRect(cx - gap - shoeW - 3, footY, shoeW + 6, shoeH, 4);
    X.fill();
    X.beginPath();
    X.roundRect(cx + gap - 3, footY, shoeW + 6, shoeH, 4);
    X.fill();
    // Sole
    X.fillStyle = opt.id === 'af1' ? '#ddd' : 'rgba(255,255,255,0.15)';
    X.fillRect(cx - gap - shoeW - 3, footY + shoeH - 3, shoeW + 6, 3);
    X.fillRect(cx + gap - 3, footY + shoeH - 3, shoeW + 6, 3);

    if (opt.id === 'jordans') {
      // Swoosh
      X.strokeStyle = '#fff';
      X.lineWidth = 1.5;
      X.beginPath();
      X.moveTo(cx - gap - 5, footY + 6);
      X.quadraticCurveTo(cx - gap - shoeW + 5, footY + 10, cx - gap - shoeW, footY + 4);
      X.stroke();
    }
  }
}

function drawChain(cx, y, opt) {
  if (opt.id === 'none') return;

  X.strokeStyle = '#FFD700';
  X.lineWidth = 3;

  if (opt.id === 'cuban') {
    // Thick cuban link
    X.lineWidth = 5;
    X.beginPath();
    X.moveTo(cx - 30, y);
    X.quadraticCurveTo(cx, y + 25, cx + 30, y);
    X.stroke();
    // Link detail
    X.strokeStyle = 'rgba(255,200,0,0.4)';
    X.lineWidth = 2;
    for (let cl = -25; cl <= 25; cl += 6) {
      const cy2 = y + 25 - Math.abs(cl) * 0.6;
      X.beginPath();
      X.moveTo(cx + cl, cy2 - 2);
      X.lineTo(cx + cl, cy2 + 2);
      X.stroke();
    }
  } else if (opt.id === 'pendant') {
    X.lineWidth = 2.5;
    X.beginPath();
    X.moveTo(cx - 25, y);
    X.quadraticCurveTo(cx, y + 30, cx + 25, y);
    X.stroke();
    // Pendant
    X.fillStyle = '#FFD700';
    X.beginPath();
    X.arc(cx, y + 32, 8, 0, Math.PI * 2);
    X.fill();
    // Dollar sign
    X.fillStyle = '#b8860b';
    X.font = 'bold 10px "Space Grotesk"';
    X.textAlign = 'center';
    X.fillText('$', cx, y + 36);
  } else if (opt.id === 'double') {
    X.lineWidth = 3;
    X.beginPath();
    X.moveTo(cx - 25, y);
    X.quadraticCurveTo(cx, y + 18, cx + 25, y);
    X.stroke();
    X.lineWidth = 2;
    X.beginPath();
    X.moveTo(cx - 30, y + 2);
    X.quadraticCurveTo(cx, y + 30, cx + 30, y + 2);
    X.stroke();
  } else if (opt.id === 'rope') {
    X.lineWidth = 2;
    // Twisted rope effect
    X.beginPath();
    X.moveTo(cx - 28, y);
    for (let rx = -28; rx <= 28; rx += 3) {
      const ry = y + 22 - Math.abs(rx) * 0.5 + Math.sin(rx * 0.5) * 2;
      X.lineTo(cx + rx, ry);
    }
    X.stroke();
  } else if (opt.id === 'cross') {
    X.lineWidth = 2.5;
    X.beginPath();
    X.moveTo(cx - 25, y);
    X.quadraticCurveTo(cx, y + 28, cx + 25, y);
    X.stroke();
    // Cross pendant
    X.fillStyle = '#FFD700';
    X.fillRect(cx - 3, y + 26, 6, 16);
    X.fillRect(cx - 7, y + 30, 14, 5);
  }
}

function drawGlasses(cx, cy, opt) {
  if (opt.id === 'none') return;

  const ey = cy - 5;

  if (opt.id === 'shades') {
    X.fillStyle = '#111';
    X.beginPath();
    X.roundRect(cx - 35, ey - 9, 28, 16, 3);
    X.fill();
    X.beginPath();
    X.roundRect(cx + 7, ey - 9, 28, 16, 3);
    X.fill();
    // Bridge
    X.strokeStyle = '#333';
    X.lineWidth = 2;
    X.beginPath();
    X.moveTo(cx - 7, ey);
    X.lineTo(cx + 7, ey);
    X.stroke();
    // Arms
    X.beginPath(); X.moveTo(cx - 35, ey - 5); X.lineTo(cx - 52, ey - 2); X.stroke();
    X.beginPath(); X.moveTo(cx + 35, ey - 5); X.lineTo(cx + 52, ey - 2); X.stroke();
  } else if (opt.id === 'clout') {
    X.fillStyle = '#fff';
    X.strokeStyle = '#ddd';
    X.lineWidth = 2;
    X.beginPath(); X.ellipse(cx - 20, ey, 16, 12, 0, 0, Math.PI * 2); X.fill(); X.stroke();
    X.beginPath(); X.ellipse(cx + 20, ey, 16, 12, 0, 0, Math.PI * 2); X.fill(); X.stroke();
    // Dark lenses
    X.fillStyle = 'rgba(0,0,0,0.85)';
    X.beginPath(); X.ellipse(cx - 20, ey, 14, 10, 0, 0, Math.PI * 2); X.fill();
    X.beginPath(); X.ellipse(cx + 20, ey, 14, 10, 0, 0, Math.PI * 2); X.fill();
    // Bridge
    X.strokeStyle = '#fff';
    X.lineWidth = 2.5;
    X.beginPath(); X.moveTo(cx - 5, ey); X.lineTo(cx + 5, ey); X.stroke();
  } else if (opt.id === 'aviator') {
    X.strokeStyle = '#c0a040';
    X.lineWidth = 1.5;
    // Teardrop shape
    X.beginPath();
    X.moveTo(cx - 32, ey - 8);
    X.quadraticCurveTo(cx - 35, ey + 10, cx - 20, ey + 12);
    X.quadraticCurveTo(cx - 8, ey + 10, cx - 8, ey - 4);
    X.lineTo(cx - 32, ey - 8);
    X.stroke();
    X.beginPath();
    X.moveTo(cx + 32, ey - 8);
    X.quadraticCurveTo(cx + 35, ey + 10, cx + 20, ey + 12);
    X.quadraticCurveTo(cx + 8, ey + 10, cx + 8, ey - 4);
    X.lineTo(cx + 32, ey - 8);
    X.stroke();
    // Tinted lenses
    X.fillStyle = 'rgba(80,60,20,0.4)';
    X.fill();
    // Bridge
    X.beginPath(); X.moveTo(cx - 8, ey - 2); X.lineTo(cx + 8, ey - 2); X.stroke();
  } else if (opt.id === 'round') {
    X.strokeStyle = '#333';
    X.lineWidth = 2;
    X.beginPath(); X.arc(cx - 20, ey, 13, 0, Math.PI * 2); X.stroke();
    X.beginPath(); X.arc(cx + 20, ey, 13, 0, Math.PI * 2); X.stroke();
    // Lenses
    X.fillStyle = 'rgba(200,200,255,0.15)';
    X.beginPath(); X.arc(cx - 20, ey, 12, 0, Math.PI * 2); X.fill();
    X.beginPath(); X.arc(cx + 20, ey, 12, 0, Math.PI * 2); X.fill();
    // Bridge
    X.beginPath(); X.moveTo(cx - 7, ey); X.lineTo(cx + 7, ey); X.stroke();
  } else if (opt.id === 'ski') {
    // Ski mask / balaclava
    X.fillStyle = '#111';
    X.beginPath();
    X.ellipse(cx, cy, 55, 60, 0, 0, Math.PI * 2);
    X.fill();
    // Eye cutout
    X.fillStyle = SKINS[avatar.skin].color;
    X.beginPath();
    X.ellipse(cx, ey, 40, 12, 0, 0, Math.PI * 2);
    X.fill();
    // Mouth cutout
    X.beginPath();
    X.ellipse(cx, cy + 20, 15, 8, 0, 0, Math.PI * 2);
    X.fill();
  }
}

// ─── RANDOMIZE ───
function randomizeAll() {
  CATEGORIES.forEach(cat => {
    avatar[cat.key] = Math.floor(Math.random() * cat.options.length);
  });
  randomName();
  buildOptions();
  draw();
  toast('Randomized! 🎲');
}

// ─── EXPORT ───
function exportAvatar() {
  // Draw at higher res for export
  const expCanvas = document.createElement('canvas');
  expCanvas.width = 800;
  expCanvas.height = 1120;
  const origCanvas = C;
  const origW = C.width;
  const origH = C.height;

  // Temporarily resize
  C.width = 800;
  C.height = 1120;
  X.scale(2, 2);
  draw();
  X.setTransform(1, 0, 0, 1, 0, 0);

  // Add name
  const name = document.getElementById('name-text').textContent;
  X.fillStyle = 'rgba(0,0,0,0.6)';
  X.fillRect(0, 1050, 800, 70);
  X.fillStyle = '#E8E0D4';
  X.font = '600 28px "Space Grotesk", sans-serif';
  X.textAlign = 'center';
  X.fillText(name, 400, 1090);

  C.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name.replace(/\s+/g, '_').toLowerCase() + '_avatar.png';
    a.click();
    URL.revokeObjectURL(url);
    toast('Saved! 📸');

    // Restore
    C.width = origW;
    C.height = origH;
    draw();
  }, 'image/png');
}

// ─── TOAST ───
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── INIT ───
randomizeAll(); // Start with a random rapper
buildTabs();
buildOptions();
draw();

// Generate initial name
randomName();
</script>
