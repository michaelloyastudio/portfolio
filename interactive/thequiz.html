<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Quiz — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
* { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --higher: #4ade80;
  --lower: #f87171;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

body:focus, body *:focus { outline: none !important; }

a, button, .clickable { cursor: url('crosshair.svg') 8 10, pointer !important; }

h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 2.5rem;
  z-index: 100;
}

.header-logo-link {
  display: block;
  height: 32px;
  position: relative;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }
  .header-logo-link, .header-logo-link.loaded { display: none !important; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px;
  padding-top: 100px;
  gap: 30px;
  opacity: 0;
}

.main.loaded { animation: mainFadeIn 0.8s ease forwards; }

@keyframes mainFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  opacity: 0;
  transform: translateY(-15px);
}

.title-row.loaded {
  animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes slideDown {
  to { opacity: 1; transform: translateY(0); }
}

.title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 3.3rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── SCORE BAR ── */
.score-bar {
  display: flex;
  align-items: center;
  gap: 30px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 10px;
  padding: 12px 24px;
  opacity: 0;
  transform: scale(0.95);
}

.score-bar.loaded {
  animation: scaleIn 0.4s ease forwards;
}

@keyframes scaleIn {
  to { opacity: 1; transform: scale(1); }
}

.score-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.score-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.score-value {
  font-size: 1.5rem;
  font-weight: 600;
  font-family: 'Space Grotesk', monospace;
  color: var(--accent);
}

.score-divider {
  width: 1px;
  height: 30px;
  background: #333;
}

/* ── GAME AREA ── */
.game-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  max-width: 1000px;
  width: 100%;
  padding: 20px;
}

.album-card {
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 16px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  transition: transform 0.3s ease, opacity 0.3s ease;
  min-width: 280px;
  max-width: 320px;
}

.album-card.left {
  animation: slideFromLeft 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.album-card.right {
  animation: slideFromRight 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.album-card.slide-out-left {
  animation: slideOutLeft 0.4s ease forwards;
}

.album-card.slide-to-left {
  animation: slideToLeft 0.5s ease forwards;
}

@keyframes slideFromLeft {
  from { opacity: 0; transform: translateX(-50px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideFromRight {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideOutLeft {
  to { opacity: 0; transform: translateX(-100px); }
}

@keyframes slideToLeft {
  from { transform: translateX(0); }
  to { transform: translateX(-30px); }
}

.album-cover {
  width: 250px;
  height: 250px;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  position: relative;
}

.album-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.album-cover-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.2rem;
  color: var(--text);
}

.album-info {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.album-name {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.4rem;
  color: var(--text);
}

.album-artist {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.album-sales {
  font-size: 2rem;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
  color: var(--accent);
  margin-top: 8px;
  min-height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.album-sales.hidden {
  color: #333;
  letter-spacing: 0.2em;
}

.album-sales.revealed {
  animation: salesReveal 0.6s ease forwards;
}

@keyframes salesReveal {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.sales-label {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ── VS DIVIDER ── */
.vs-divider {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.5rem;
  color: var(--text-muted);
  padding: 0 10px;
}

/* ── BUTTONS ── */
.button-row {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}

.game-btn {
  padding: 16px 40px;
  border-radius: 12px;
  border: 2px solid;
  background: transparent;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: all 0.2s ease;
}

.game-btn:hover {
  transform: translateY(-2px);
}

.game-btn:active {
  transform: translateY(0);
}

.btn-higher {
  border-color: var(--higher);
  color: var(--higher);
}

.btn-higher:hover {
  background: rgba(74, 222, 128, 0.15);
  box-shadow: 0 8px 30px rgba(74, 222, 128, 0.2);
}

.btn-lower {
  border-color: var(--lower);
  color: var(--lower);
}

.btn-lower:hover {
  background: rgba(248, 113, 113, 0.15);
  box-shadow: 0 8px 30px rgba(248, 113, 113, 0.2);
}

.btn-play-again {
  border-color: var(--accent);
  color: var(--accent);
  padding: 16px 50px;
}

.btn-play-again:hover {
  background: rgba(255, 142, 61, 0.15);
  box-shadow: 0 8px 30px rgba(255, 142, 61, 0.2);
}

/* ── GAME OVER ── */
.game-over {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  animation: fadeIn 0.5s ease forwards;
}

.game-over.active {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.game-over-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.5rem;
  color: var(--lower);
}

.final-score {
  font-size: 4rem;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
  color: var(--accent);
}

.final-score-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

/* ── RED FLASH ── */
.red-flash {
  position: fixed;
  inset: 0;
  background: rgba(248, 113, 113, 0.3);
  opacity: 0;
  pointer-events: none;
  z-index: 150;
}

.red-flash.active {
  animation: flash 0.4s ease;
}

@keyframes flash {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* ── GREEN FLASH ── */
.green-flash {
  position: fixed;
  inset: 0;
  background: rgba(74, 222, 128, 0.15);
  opacity: 0;
  pointer-events: none;
  z-index: 150;
}

.green-flash.active {
  animation: flashGreen 0.3s ease;
}

@keyframes flashGreen {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* ── BOOT SCREEN ── */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s ease;
}

.boot-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.boot-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.2rem;
  opacity: 0;
  transform: translateY(10px);
  animation: bootTitleIn 0.6s ease forwards 0.3s;
}

.boot-subtitle {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0;
  animation: bootTitleIn 0.6s ease forwards 0.5s;
}

@keyframes bootTitleIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.footer.loaded { opacity: 1; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .game-area {
    flex-direction: column;
    gap: 20px;
  }

  .vs-divider {
    transform: rotate(90deg);
    padding: 0;
  }

  .album-cover {
    width: 200px;
    height: 200px;
  }

  .album-card {
    min-width: auto;
    max-width: 280px;
    padding: 16px;
  }

  .title {
    font-size: 2.2rem;
  }

  .button-row {
    flex-direction: column;
    gap: 12px;
  }

  .game-btn {
    padding: 14px 60px;
  }
}
</style>
</head>

  <div class="boot-subtitle">First Week Sales</div>

<div class="red-flash" id="redFlash"></div>
<div class="green-flash" id="greenFlash"></div>

  <div class="button-row" id="buttonRow">

  <div class="game-over" id="gameOver">

</main>

<footer class="footer" id="footer">

</footer>

// ═══════════════════════════════════════
// SOUND EFFECTS (Web Audio API)
// ═══════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playCorrectSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Rising chime — two quick ascending tones
  [520, 780].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, now + i * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + i * 0.12);
    osc.stop(now + i * 0.12 + 0.4);
  });
}

function playWrongSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Low buzzy descending tone
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(280, now);
  osc.frequency.exponentialRampToValueAtTime(120, now + 0.4);
  gain.gain.setValueAtTime(0.15, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.55);
}

function playCountSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Quick tick for the counting animation
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 1200;
  gain.gain.setValueAtTime(0.04, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.06);
}

function playClickSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Subtle click
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 600;
  gain.gain.setValueAtTime(0.1, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playRevealSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Dramatic reveal — quick sweep up
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(200, now);
  osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.45);
}

function playGameOverSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  // Descending three-note failure
  [400, 320, 240].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, now + i * 0.18);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + i * 0.18);
    osc.stop(now + i * 0.18 + 0.4);
  });
}

let currentScore = 0;
let highScore = parseInt(localStorage.getItem('quizHighScore')) || 0;
let usedAlbums = [];
let leftAlbumData = null;
let rightAlbumData = null;
let isAnimating = false;

function formatSales(num) {
  return num.toLocaleString();
}

function getRandomAlbum() {
  const available = albums.filter(a => !usedAlbums.includes(a.name + a.artist));
  if (available.length === 0) {
    usedAlbums = [];
    return albums[Math.floor(Math.random() * albums.length)];
  }
  const album = available[Math.floor(Math.random() * available.length)];
  usedAlbums.push(album.name + album.artist);
  return album;
}

function createCoverElement(album) {
  if (album.cover) {
    const img = document.createElement('img');
    img.src = album.cover;
    img.alt = album.name + ' - ' + album.artist;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'cover';
    img.style.borderRadius = 'inherit';
    img.onerror = function() {
      // Fallback to gradient placeholder if image fails
      const placeholder = document.createElement('div');
      placeholder.className = 'album-cover-placeholder';
      placeholder.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #333 100%)';
      placeholder.textContent = album.name;
      this.replaceWith(placeholder);
    };
    return img;
  }
  const placeholder = document.createElement('div');
  placeholder.className = 'album-cover-placeholder';
  placeholder.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #333 100%)';
  placeholder.textContent = album.name;
  return placeholder;
}

function updateAlbumDisplay(side, album, showSales = true) {
  const cover = document.getElementById(side + 'Cover');
  const name = document.getElementById(side + 'Name');
  const artist = document.getElementById(side + 'Artist');
  const sales = document.getElementById(side + 'Sales');

  cover.innerHTML = '';
  cover.appendChild(createCoverElement(album));
  name.textContent = album.name;
  artist.textContent = album.artist;

  if (showSales) {
    sales.textContent = formatSales(album.sales);
    sales.classList.remove('hidden');
  } else {
    sales.textContent = '???';
    sales.classList.add('hidden');
  }
}

function animateNumber(element, target, duration = 800) {
  const start = 0;
  const startTime = performance.now();

  element.classList.remove('hidden');
  element.classList.add('revealed');

  let lastTick = 0;
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const current = Math.floor(start + (target - start) * eased);
    element.textContent = formatSales(current);

    // Tick sound every ~100ms during counting
    if (progress < 1 && currentTime - lastTick > 100) {
      playCountSound();
      lastTick = currentTime;
    }

    if (progress < 1) {
      requestAnimationFrame(update);
    }
  }

  requestAnimationFrame(update);
}

function guess(choice) {
  if (isAnimating) return;
  isAnimating = true;
  playClickSound();

  const isHigher = rightAlbumData.sales >= leftAlbumData.sales;
  const isCorrect = (choice === 'higher' && isHigher) || (choice === 'lower' && !isHigher);

  const rightSales = document.getElementById('rightSales');
  playRevealSound();
  animateNumber(rightSales, rightAlbumData.sales);

  setTimeout(() => {
    if (isCorrect) {
      playCorrectSound();
      document.getElementById('greenFlash').classList.add('active');
      setTimeout(() => document.getElementById('greenFlash').classList.remove('active'), 300);

      currentScore++;
      document.getElementById('currentScore').textContent = currentScore;

      if (currentScore > highScore) {
        highScore = currentScore;
        localStorage.setItem('quizHighScore', highScore);
        document.getElementById('highScore').textContent = highScore;
      }

      setTimeout(() => {
        transitionAlbums();
      }, 800);
    } else {
      playWrongSound();
      gameOver();
    }
  }, 900);
}

function transitionAlbums() {
  const leftCard = document.getElementById('leftAlbum');
  const rightCard = document.getElementById('rightAlbum');

  leftCard.classList.remove('left');
  leftCard.classList.add('slide-out-left');

  rightCard.classList.remove('right');
  rightCard.classList.add('slide-to-left');

  setTimeout(() => {
    leftAlbumData = rightAlbumData;
    rightAlbumData = getRandomAlbum();

    updateAlbumDisplay('left', leftAlbumData, true);
    updateAlbumDisplay('right', rightAlbumData, false);

    leftCard.classList.remove('slide-out-left');
    leftCard.classList.add('left');

    rightCard.classList.remove('slide-to-left');
    rightCard.classList.add('right');

    isAnimating = false;
  }, 500);
}

function gameOver() {
  document.getElementById('redFlash').classList.add('active');
  setTimeout(() => document.getElementById('redFlash').classList.remove('active'), 400);
  setTimeout(() => playGameOverSound(), 500);

  setTimeout(() => {
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('buttonRow').style.display = 'none';
    document.getElementById('finalScore').textContent = currentScore;
    document.getElementById('gameOver').classList.add('active');
    isAnimating = false;
  }, 1000);
}

function startGame() {
  currentScore = 0;
  usedAlbums = [];
  isAnimating = false;

  document.getElementById('currentScore').textContent = '0';
  document.getElementById('highScore').textContent = highScore;

  leftAlbumData = getRandomAlbum();
  rightAlbumData = getRandomAlbum();

  updateAlbumDisplay('left', leftAlbumData, true);
  updateAlbumDisplay('right', rightAlbumData, false);

  document.getElementById('gameOver').classList.remove('active');
  document.getElementById('gameArea').style.display = 'flex';
  document.getElementById('buttonRow').style.display = 'flex';

  const leftCard = document.getElementById('leftAlbum');
  const rightCard = document.getElementById('rightAlbum');
  leftCard.classList.remove('slide-out-left', 'slide-to-left');
  rightCard.classList.remove('slide-out-left', 'slide-to-left');
  leftCard.classList.add('left');
  rightCard.classList.add('right');
}

// Boot sequence
window.addEventListener('load', () => {
  document.getElementById('highScore').textContent = highScore;

  setTimeout(() => {
    document.getElementById('bootScreen').classList.add('fade-out');

    setTimeout(() => {
      document.getElementById('main').classList.add('loaded');
      document.getElementById('titleRow').classList.add('loaded');
      document.getElementById('scoreBar').classList.add('loaded');
      document.getElementById('footer').classList.add('loaded');

      startGame();
    }, 300);
  }, 1200);
});

// Init audio on first interaction
document.addEventListener('click', () => getAudioCtx(), { once: true });
document.addEventListener('touchstart', () => getAudioCtx(), { once: true });
</script>

<script>
// ── MUSIC NOTE CURSOR TRAIL ──
(function() {
  const notes = ['♪', '♫', '♩', '♬'];
  const pool = [];
  const POOL_SIZE = 60;
  let lastX = 0, lastY = 0, lastSpawn = 0;
  const SPAWN_INTERVAL = 35;
  const MIN_DIST = 6;
  for (let i = 0; i < POOL_SIZE; i++) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;font-size:14px;opacity:0;transition:none;user-select:none;will-change:transform,opacity;';
    el.style.color = '#8a8580';
    document.body.appendChild(el);
    pool.push({ el, active: false });
  }
  function spawn(x, y) {
    const note = pool.find(n => !n.active);
    if (!note) return;
    note.active = true;
    note.el.textContent = notes[Math.random() * notes.length | 0];
    note.el.style.fontSize = (10 + Math.random() * 8) + 'px';
    const offsetX = (Math.random() - 0.5) * 16;
    note.el.style.left = (x + offsetX) + 'px';
    note.el.style.top = y + 'px';
    note.el.style.opacity = '0.7';
    note.el.style.transform = 'translateY(0) rotate(' + ((Math.random() - 0.5) * 30) + 'deg)';
    note.el.style.transition = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const drift = (Math.random() - 0.5) * 20;
        note.el.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
        note.el.style.transform = 'translateY(-' + (40 + Math.random() * 30) + 'px) rotate(' + ((Math.random() - 0.5) * 60) + 'deg) translateX(' + drift + 'px)';
        note.el.style.opacity = '0';
      });
    });
    setTimeout(() => { note.active = false; }, 1050);
  }
  document.addEventListener('mousemove', function(e) {
    const now = Date.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (now - lastSpawn > SPAWN_INTERVAL && dist > MIN_DIST) {
      spawn(e.clientX, e.clientY);
      lastX = e.clientX; lastY = e.clientY;
      lastSpawn = now;
    }
  });
})();
</script>
