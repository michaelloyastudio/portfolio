<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapper Tycoon — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --parchment: #E8E0D4;
  --accent: #ff8e3d;
  --espresso: #3d2b1f;
  --warm-gray: #8a8580;
  --black: #0a0a0a;
  --spotify-green: #1DB954;
  --z-blue: #1DA1F2;
  --bank-gold: #FFD700;
  --neon-blue: #00d4ff;
  --neon-purple: #9d4edd;
  --neon-green: #39ff14;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--parchment);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  cursor: url('../cursor.svg') 16 8, default;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

a, button, .clickable, input, select { cursor: url('../crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'Instrument Serif', serif; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8rem 2rem;
  z-index: 1000;
  background: rgba(10, 10, 10, 0.9);
  backdrop-filter: blur(10px);
}

.header-logo-link {
  display: block;
  position: relative;
  height: 24px;
}

.header-logo {
  height: 24px;
  transition: opacity 0.2s ease;
}

.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN LAYOUT ── */
.game-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 50px 20px 0;
  position: relative;
  overflow: hidden;
}

/* ── WALL ── */
.wall {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 45%;
  background: linear-gradient(180deg, #1a1714 0%, #0f0d0b 100%);
  z-index: 0;
}

/* Wall poster removed */

/* Gold plaques on wall */
.wall-plaques {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 180px;
  z-index: 1;
}

.gold-plaque {
  width: 70px;
  height: 90px;
  background: linear-gradient(145deg, #FFD700, #B8860B);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.gold-plaque.visible { opacity: 1; transform: scale(1); }

.gold-plaque-disc {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(145deg, #333, #111);
  border: 3px solid #FFD700;
  position: relative;
}

.gold-plaque-disc::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  background: #FFD700;
  border-radius: 50%;
}

.gold-plaque-label {
  margin-top: 6px;
  font-size: 0.4rem;
  color: #3d2b1f;
  font-weight: 700;
  text-align: center;
}

/* ── COMPUTER SCREEN (MAIN UI) ── */
.computer-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: -30px;
}

.monitor {
  width: min(900px, 90vw);
  height: min(520px, 65vh);
  background: #0a0a0a;
  border-radius: 16px 16px 0 0;
  border: 12px solid #1a1a1a;
  border-bottom: none;
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 0 60px rgba(255, 142, 61, 0.1),
    inset 0 0 30px rgba(0,0,0,0.5);
}

.monitor::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 8px;
  background: #333;
  border-radius: 50%;
}

.monitor-chin {
  width: min(920px, 92vw);
  height: 25px;
  background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
  border-radius: 0 0 10px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.monitor-logo {
  width: 30px;
  height: 6px;
  background: #333;
  border-radius: 3px;
}

.monitor-stand {
  width: 80px;
  height: 50px;
  background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
  clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
}

.monitor-base {
  width: 180px;
  height: 12px;
  background: #1a1a1a;
  border-radius: 6px;
}

/* ── DESK ── */
.desk {
  width: 100%;
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.desk-surface {
  width: 100%;
  height: 60px;
  background: linear-gradient(180deg, #5a4a3a 0%, #3d2b1f 100%);
  position: relative;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

.desk-surface::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.1) 50%, transparent 95%);
}

/* ── DESK ITEMS ── */
.desk-items {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: min(900px, 90vw);
  height: 100px;
  z-index: 6;
  pointer-events: none;
}

.desk-item {
  position: absolute;
  opacity: 0;
  transform: translateY(20px) scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.desk-item.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Headphones */
.headphones {
  right: 20px;
  bottom: 20px;
}

.headphone-band {
  width: 50px;
  height: 25px;
  border: 5px solid #333;
  border-bottom: none;
  border-radius: 25px 25px 0 0;
}

.headphone-cup {
  width: 20px;
  height: 28px;
  background: linear-gradient(180deg, #444, #222);
  border-radius: 6px;
  position: absolute;
}

.headphone-cup.left { left: -5px; top: 18px; }
.headphone-cup.right { right: -5px; top: 18px; }

/* Mic */
.mic {
  left: 30px;
  bottom: 15px;
}

.mic-head {
  width: 35px;
  height: 50px;
  background: linear-gradient(180deg, #444 0%, #222 100%);
  border-radius: 18px 18px 8px 8px;
  position: relative;
}

.mic-head::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  right: 4px;
  height: 30px;
  background: repeating-linear-gradient(0deg, #333 0px, #333 2px, #222 2px, #222 4px);
  border-radius: 14px 14px 4px 4px;
}

.mic-stand {
  width: 5px;
  height: 35px;
  background: #333;
  margin: 0 auto;
}

/* Speakers */
.speaker {
  width: 40px;
  height: 65px;
  background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  bottom: 10px;
}

.speaker-cone {
  width: 24px;
  height: 24px;
  background: radial-gradient(circle, #444 0%, #222 60%, #111 100%);
  border-radius: 50%;
}

.speaker-tweeter {
  width: 12px;
  height: 12px;
  background: radial-gradient(circle, #555 0%, #333 100%);
  border-radius: 50%;
}

.speaker-left { left: 120px; }
.speaker-right { right: 120px; }

/* ── OS SCREEN ── */
.os-screen {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
  display: flex;
  flex-direction: column;
}

/* OS Menubar */
.os-menubar {
  height: 28px;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  font-size: 0.7rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.os-left { display: flex; align-items: center; gap: 12px; }
.os-right { display: flex; align-items: center; gap: 12px; }
.os-time { color: var(--parchment); }
.os-balance { color: var(--bank-gold); font-weight: 600; }
.os-contract { color: var(--accent); font-size: 0.6rem; }

/* OS Desktop */
.os-desktop {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: auto;
  gap: 8px;
  padding: 15px;
  align-content: start;
}

.app-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 10px;
  transition: all 0.2s;
  position: relative;
}

.app-icon:hover {
  background: rgba(255,255,255,0.08);
  transform: scale(1.05);
}

.app-icon-img {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.app-icon-label {
  font-size: 0.65rem;
  color: var(--parchment);
  text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.notification-badge {
  position: absolute;
  top: 0;
  right: 0;
  min-width: 20px;
  height: 20px;
  background: #ff3b30;
  border-radius: 10px;
  font-size: 0.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  padding: 0 5px;
  animation: pulse 2s infinite;
  box-shadow: 0 2px 8px rgba(255, 59, 48, 0.5);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.app-locked {
  opacity: 0.35;
  pointer-events: none;
}

.app-locked::after {
  content: '🔒';
  position: absolute;
  font-size: 1rem;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* App icon colors */
.app-mlstudio { background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); border: 2px solid var(--accent); }
.app-spootify { background: linear-gradient(135deg, #1DB954, #169c46); }
.app-z { background: linear-gradient(135deg, #1DA1F2, #0d8bd9); }
.app-mikeazon { background: linear-gradient(135deg, #FF9900, #FF6600); }
.app-merchdrop { background: linear-gradient(135deg, #8B5CF6, #6366F1); }
.app-dms { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }

/* Desktop Folders */
.desktop-folder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 10px;
  transition: all 0.2s;
  opacity: 0.7;
}

.desktop-folder:hover {
  background: rgba(255,255,255,0.08);
  opacity: 1;
}

.folder-icon {
  width: 48px;
  height: 40px;
  background: linear-gradient(180deg, #5a9fd4 0%, #4a8bc2 40%, #4a8bc2 100%);
  border-radius: 2px 8px 8px 8px;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.folder-icon::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 0;
  width: 20px;
  height: 8px;
  background: #5a9fd4;
  border-radius: 4px 4px 0 0;
}

.folder-label {
  font-size: 0.65rem;
  color: var(--parchment);
  text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

/* Calendar Widget */
.calendar-widget {
  grid-column: 5 / 7;
  grid-row: 1 / 3;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.cal-month {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent);
}

.cal-day-label {
  font-size: 0.45rem;
  color: #666;
  text-align: center;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  font-size: 0.55rem;
  color: #888;
  text-align: center;
  padding: 3px 0;
  border-radius: 4px;
  line-height: 1.4;
}

.cal-day.today {
  background: var(--accent);
  color: #000;
  font-weight: 700;
  border-radius: 50%;
}

.cal-day.has-event {
  color: var(--parchment);
  font-weight: 600;
}

.cal-day.has-event::after {
  content: '';
  display: block;
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  margin: 0 auto;
}

.cal-events {
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  overflow: hidden;
}

.cal-event {
  font-size: 0.55rem;
  padding: 3px 6px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.cal-event-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cal-event-text {
  color: #bbb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* OS Dock */
.os-dock {
  height: 50px;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  margin: 10px 15px 15px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,0.1);
}

.dock-item {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: all 0.2s;
  position: relative;
}

.dock-item:hover {
  transform: scale(1.15) translateY(-5px);
}

.dock-item.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  width: 4px;
  height: 4px;
  background: var(--parchment);
  border-radius: 50%;
}

.dock-divider {
  width: 1px;
  height: 30px;
  background: rgba(255,255,255,0.2);
  margin: 0 5px;
}

/* Stats in dock area */
.dock-stats {
  display: flex;
  gap: 15px;
  margin-left: auto;
  padding-right: 10px;
}

.dock-stat {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
}

.dock-stat-icon { font-size: 0.9rem; }
.dock-stat-value { color: var(--accent); font-weight: 600; }

/* ── APP WINDOWS ── */
.app-window {
  position: absolute;
  inset: 28px 0 0 0;
  background: #111;
  display: none;
  flex-direction: column;
  animation: windowOpen 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 100;
}

.app-window.active { display: flex; }

@keyframes windowOpen {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.app-header {
  height: 36px;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

.window-controls {
  display: flex;
  gap: 8px;
}

.window-btn {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: none;
  transition: transform 0.2s, filter 0.2s;
}

.window-btn:hover { transform: scale(1.15); filter: brightness(1.2); }

.window-close { background: #ff5f56; }
.window-minimize { background: #ffbd2e; }
.window-maximize { background: #27c93f; }

.app-title {
  font-size: 0.8rem;
  color: var(--parchment);
  font-weight: 500;
  flex: 1;
  text-align: center;
  margin-right: 60px;
}

.app-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ══════════════════════════════════════════════════════════════
   BEATMAKER APP - RHYTHM GAME
   ══════════════════════════════════════════════════════════════ */
/* FL Studio inspired dark UI */
.mlstudio-app {
  background: #2a2a2a;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.mlstudio-toolbar {
  height: 32px;
  background: #3c3c3c;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  border-bottom: 1px solid #555;
}

.mlstudio-transport {
  display: flex;
  gap: 4px;
}

.mlstudio-transport-btn {
  width: 24px;
  height: 24px;
  background: #2a2a2a;
  border: 1px solid #555;
  border-radius: 3px;
  color: #aaa;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
}

.mlstudio-transport-btn:hover { background: #444; color: var(--accent); }
.mlstudio-transport-btn.active { background: var(--accent); color: #000; }

.mlstudio-bpm {
  background: #1a1a1a;
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 3px;
  border: 1px solid #555;
  font-family: 'Space Grotesk', monospace;
}

.mlstudio-title-gen {
  flex: 1;
  text-align: center;
  font-size: 0.8rem;
  color: var(--accent);
  font-weight: 600;
}

.mlstudio-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Channel Rack style setup */
.mlstudio-setup {
  padding: 12px 15px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: #333;
  border-bottom: 1px solid #555;
}

.mlstudio-field {
  flex: 1;
}

.mlstudio-label {
  font-size: 0.6rem;
  color: #999;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  display: block;
}

.mlstudio-select {
  width: 100%;
  background: #1a1a1a;
  border: 1px solid #555;
  color: var(--parchment);
  padding: 8px 10px;
  border-radius: 3px;
  font-size: 0.75rem;
  font-family: inherit;
}

.mlstudio-select:focus {
  outline: none;
  border-color: var(--accent);
}

.mlstudio-btn {
  padding: 8px 18px;
  background: var(--accent);
  border: none;
  border-radius: 3px;
  color: #000;
  font-weight: 700;
  font-size: 0.75rem;
  transition: all 0.15s;
  white-space: nowrap;
}

.mlstudio-btn:hover:not(:disabled) {
  filter: brightness(1.15);
  box-shadow: 0 2px 10px rgba(255, 142, 61, 0.3);
}

.mlstudio-btn:disabled {
  opacity: 0.4;
}

.mlstudio-btn-rest {
  background: #555;
  color: #ccc;
}

.mlstudio-btn-rest:hover:not(:disabled) {
  background: #666;
  filter: none;
  box-shadow: none;
}

/* Channel rack look for queue */
.mlstudio-channel-rack {
  background: #222;
  border-top: 1px solid #555;
  padding: 8px;
  max-height: 120px;
  overflow-y: auto;
}

.mlstudio-channel-rack-title {
  font-size: 0.6rem;
  color: #777;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  padding-left: 4px;
}

.mlstudio-channel {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  background: #2a2a2a;
  border: 1px solid #3a3a3a;
  border-radius: 2px;
  margin-bottom: 3px;
  font-size: 0.7rem;
}

.mlstudio-channel-led {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
}

.mlstudio-channel-name { flex: 1; color: #ccc; }
.mlstudio-channel-grade {
  padding: 1px 6px;
  border-radius: 2px;
  font-weight: 700;
  font-size: 0.6rem;
}

.mlstudio-channel-grade.S { background: rgba(255,215,0,0.2); color: #FFD700; }
.mlstudio-channel-grade.A { background: rgba(57,255,20,0.2); color: var(--neon-green); }
.mlstudio-channel-grade.B { background: rgba(0,212,255,0.2); color: var(--neon-blue); }
.mlstudio-channel-grade.C { background: rgba(255,142,61,0.2); color: var(--accent); }
.mlstudio-channel-grade.D { background: rgba(255,149,0,0.2); color: #ff9500; }
.mlstudio-channel-grade.F { background: rgba(255,95,86,0.2); color: #ff5f56; }

/* Rhythm Game */
.rhythm-game {
  flex: 1;
  display: none;
  flex-direction: column;
  padding: 20px;
}

.rhythm-game.active { display: flex; }

.rhythm-stats {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin-bottom: 15px;
}

.rhythm-stat {
  text-align: center;
}

.rhythm-stat-value {
  font-size: 1.8rem;
  font-weight: 700;
}

.rhythm-stat-value.perfect { color: var(--neon-green); }
.rhythm-stat-value.good { color: var(--neon-blue); }
.rhythm-stat-value.miss { color: #ff5f56; }

.rhythm-stat-label {
  font-size: 0.6rem;
  color: var(--warm-gray);
  text-transform: uppercase;
}

/* Rhythm Track */
.rhythm-track-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

.rhythm-track {
  width: 100%;
  max-width: 500px;
  height: 80px;
  background: rgba(0,0,0,0.5);
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255,142,61,0.3);
}

/* Hit zone */
.hit-zone {
  position: absolute;
  left: 60px;
  top: 0;
  bottom: 0;
  width: 60px;
  background: linear-gradient(90deg, 
    transparent 0%, 
    rgba(255,142,61,0.3) 30%, 
    rgba(255,142,61,0.5) 50%,
    rgba(255,142,61,0.3) 70%,
    transparent 100%);
  border-left: 3px solid var(--accent);
  border-right: 3px solid var(--accent);
  z-index: 5;
}

.hit-zone-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  border: 3px solid var(--accent);
  border-radius: 50%;
  background: rgba(255,142,61,0.1);
}

/* Beat markers */
.beat-marker {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
  z-index: 10;
  transition: transform 0.05s;
}

.beat-marker::before {
  content: '🎵';
  font-size: 1.2rem;
}

/* Hit feedback */
.hit-feedback {
  position: absolute;
  left: 90px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.5rem;
  font-weight: 700;
  opacity: 0;
  animation: hitFeedback 0.5s ease-out forwards;
  z-index: 20;
  text-shadow: 0 0 20px currentColor;
}

.hit-feedback.perfect { color: var(--neon-green); }
.hit-feedback.good { color: var(--neon-blue); }
.hit-feedback.miss { color: #ff5f56; }

@keyframes hitFeedback {
  0% { opacity: 1; transform: translateY(-50%) scale(1.5); }
  100% { opacity: 0; transform: translateY(-100%) scale(1); }
}

/* Track flash on hit */
.rhythm-track.flash-perfect {
  animation: flashPerfect 0.15s;
}

.rhythm-track.flash-good {
  animation: flashGood 0.15s;
}

.rhythm-track.flash-miss {
  animation: flashMiss 0.15s;
}

@keyframes flashPerfect {
  50% { box-shadow: inset 0 0 40px rgba(57, 255, 20, 0.5), 0 0 30px rgba(57, 255, 20, 0.3); }
}

@keyframes flashGood {
  50% { box-shadow: inset 0 0 40px rgba(0, 212, 255, 0.5), 0 0 30px rgba(0, 212, 255, 0.3); }
}

@keyframes flashMiss {
  50% { box-shadow: inset 0 0 40px rgba(255, 95, 86, 0.5), 0 0 30px rgba(255, 95, 86, 0.3); }
}

.rhythm-instruction {
  text-align: center;
  color: var(--warm-gray);
  font-size: 0.75rem;
  margin-top: 15px;
}

.rhythm-instruction kbd {
  background: #333;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: inherit;
  color: var(--parchment);
}

/* Progress indicator */
.rhythm-progress {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 15px;
}

.rhythm-progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #333;
  transition: all 0.2s;
}

.rhythm-progress-dot.hit { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
.rhythm-progress-dot.good { background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
.rhythm-progress-dot.miss { background: #ff5f56; box-shadow: 0 0 10px #ff5f56; }
.rhythm-progress-dot.current { background: var(--accent); transform: scale(1.3); }

/* Song Result Card */
.song-result {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 30px;
  text-align: center;
}

.song-result.active { display: flex; }

.result-grade {

}

.result-song-name {

.result-stats {

// ═══════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════════════
function formatNumber(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toLocaleString();
}

function formatMoney(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}

function randomChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateSongName(topic) {
  const parts = SONG_NAME_PARTS[topic];
  return randomChoice(parts.prefixes) + ' ' + randomChoice(parts.suffixes);
}

function getQualityGrade(quality) {
  if (quality >= 90) return 'S';
  if (quality >= 75) return 'A';
  if (quality >= 60) return 'B';
  if (quality >= 45) return 'C';
  if (quality >= 30) return 'D';
  return 'F';
}

// SAVE / LOAD
// ═══════════════════════════════════════════════════════════════
function saveGame() {
  gameState.lastSave = Date.now();
  localStorage.setItem('rapperTycoonV2', JSON.stringify(gameState));
}

function loadGame() {
  const saved = localStorage.getItem('rapperTycoonV2');
  if (saved) {
    const loaded = JSON.parse(saved);
    gameState = { ...defaultState, ...loaded };
    
    // Calculate offline progress (50% efficiency)
    const offlineTime = (Date.now() - gameState.lastUpdate) / 1000;
    if (offlineTime > 0 && gameState.streamIncomePerSec > 0) {
      const offlineEarnings = (gameState.streamIncomePerSec + gameState.merchIncomePerSec) * offlineTime * 0.5;
      gameState.balance += offlineEarnings;
    }
    
    gameState.lastUpdate = Date.now();
    gameState.displayBalance = gameState.balance;
    gameState.displayFans = gameState.fans;
    
    applyVisualUpgrades();
    return true;
  }
  return false;
}

function resetGame() {
  if (confirm('Reset all progress? This cannot be undone!')) {
    localStorage.removeItem('rapperTycoonV2');
    location.reload();
  }
}

// CALENDAR WIDGET
// ═══════════════════════════════════════════════════════════════
function renderCalendarWidget() {
  // Map game days to a fake calendar starting Jan 1
  const startDate = new Date(2026, 0, 1); // Jan 1 2026
  const currentDate = new Date(startDate);
  currentDate.setDate(currentDate.getDate() + gameState.gameDay - 1);
  
  const month = currentDate.toLocaleString('en', { month: 'long' });
  const year = currentDate.getFullYear();
  const todayDate = currentDate.getDate();
  
  // Get first day and total days of current month
  const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
  const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  
  // Days of week header
  const dayLabels = ['S','M','T','W','T','F','S'].map(d => 
    `<div class="cal-day-label">${d}</div>`
  ).join('');
  
  // Day grid
  let daysHtml = '';
  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    daysHtml += '<div class="cal-day"></div>';
  }
  
  // Some fake event days based on game progress
  const eventDays = new Set();
  if (gameState.releasedSongs.length > 0) eventDays.add(Math.min(todayDate + 2, daysInMonth));
  if (gameState.contract) eventDays.add(Math.min(todayDate + 5, daysInMonth));
  if (gameState.fans > 5000) eventDays.add(Math.min(todayDate + 7, daysInMonth));
  
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === todayDate;
    const hasEvent = eventDays.has(d);
    daysHtml += `<div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}">${d}</div>`;
  }
  
  // Upcoming events
  const events = [];
  if (gameState.releasedSongs.length > 0) {
    events.push({ color: '#1DB954', text: 'Release day promo' });
  }
  if (gameState.contract) {
    events.push({ color: '#FFD700', text: `${gameState.contract.label} deadline` });
  }
  if (gameState.fans > 5000) {
    events.push({ color: '#E1306C', text: 'Fan meetup' });
  }
  if (events.length === 0) {
    events.push({ color: '#555', text: 'No upcoming events' });
  }
  
  const eventsHtml = events.slice(0, 3).map(e => `
    <div class="cal-event">
      <div class="cal-event-dot" style="background:${e.color}"></div>
      <span class="cal-event-text">${e.text}</span>
    </div>
  `).join('');
  
  return `
    <div class="calendar-widget">
      <div class="cal-header">
        <span class="cal-month">${month} ${year}</span>
      </div>
      <div class="cal-grid">
        ${dayLabels}
        ${daysHtml}
      </div>
      <div class="cal-events">
        ${eventsHtml}
      </div>
    </div>
  `;
}

function openApp(appName) {
  const screen = document.getElementById('osScreen');
  
  // Remove existing windows
  screen.querySelectorAll('.app-window').forEach(w => w.remove());
  
  const window = document.createElement('div');
  window.className = 'app-window active';
  
  let content = '';
  let title = '';
  
  switch (appName) {
    case 'mlstudio':
      title = '🥕 ML Studio';
      content = renderMLStudio();
      break;
    case 'spootify':
      title = '🎧 Spootify';
      content = renderSpootify();
      break;
    case 'z':
      title = '𝕏 Z';
      content = renderZ();
      break;
    case 'mikeazon':
      title = '📦 Mikeazon';
      content = renderMikeazon();
      break;
    case 'merchdrop':
      title = '👕 MerchDrop';
      content = renderMerchDrop();
      break;
    case 'dms':
      title = `💬 DMs ${gameState.dms.length > 0 ? `(${gameState.dms.length})` : ''}`;
      content = renderDMs();
      break;
  }
  
  window.innerHTML = `
    <div class="app-header">
      <div class="window-controls">
        <button class="window-btn window-close clickable"></button>
        <button class="window-btn window-minimize clickable"></button>
        <button class="window-btn window-maximize clickable"></button>
      </div>
      <span class="app-title">${title}</span>
    </div>
    <div class="app-content">${content}</div>
  `;
  
  screen.appendChild(window);
  
  // Close button
  window.querySelector('.window-close')?.addEventListener('click', () => {
    window.classList.remove('active');
    setTimeout(() => window.remove(), 200);
    // Stop rhythm game if closing beatmaker
    if (appName === 'mlstudio') {
      stopRhythmGame();
    }
  });
  
  // Bind app-specific events
  bindAppEvents(appName, window);
}

function bindAppEvents(appName, window) {
  switch (appName) {
    case 'mlstudio':
      window.querySelector('#startSongBtn')?.addEventListener('click', startRhythmGame);
      window.querySelector('#restBtn')?.addEventListener('click', restEnergy);

      });
      break;
      
    case 'z':
      window.querySelector('#postBtn')?.addEventListener('click', makePost);
      window.querySelector('#postBtn2')?.addEventListener('click', makePost);

    case 'mikeazon':
      window.querySelectorAll('.mikeazon-buy-btn').forEach(btn => {

// ═══════════════════════════════════════════════════════════════
// RHYTHM GAME
// ═══════════════════════════════════════════════════════════════
function startRhythmGame() {
  if (gameState.energy < 20) return;
  
  gameState.energy -= 20;
  
  const topic = document.getElementById('songTopic')?.value || 'flex';
  const style = document.getElementById('songStyle')?.value || 'trap';
  const songName = generateSongName(topic);
  
  rhythmGame = {
    active: true,
    topic,
    style,
    songName,
    beats: [],
    currentBeat: 0,
    totalBeats: 14,
    perfect: 0,
    good: 0,
    miss: 0,
    beatSpeed: 2000, // faster base speed
  };
  
  // Update UI
  document.getElementById('songTitleGen').textContent = `"${songName}"`;
  document.getElementById('beatmakerSetup').style.display = 'none';
  document.getElementById('rhythmGame').classList.add('active');
  document.getElementById('songResult').classList.remove('active');
  
  // Reset counters
  document.getElementById('perfectCount').textContent = '0';
  document.getElementById('goodCount').textContent = '0';
  document.getElementById('missCount').textContent = '0';
  
  // Create progress dots
  const progressEl = document.getElementById('rhythmProgress');
  if (progressEl) progressEl.innerHTML = Array(rhythmGame.totalBeats).fill('<div class="rhythm-progress-dot"></div>').join('');
  
  // Start spawning beats with varying rhythm patterns
  let beatsSpawned = 0;
  // Different rhythm patterns: gaps in ms between beats
  const patterns = [
    [400, 400, 800, 400, 400, 800, 300, 300, 300, 900, 400, 600, 500, 700], // syncopated
    [500, 500, 500, 300, 300, 800, 400, 400, 600, 600, 350, 350, 700, 500], // swing
    [300, 700, 300, 700, 500, 500, 400, 400, 300, 300, 800, 400, 600, 400], // offbeat
  ];
  const pattern = patterns[Math.floor(Math.random() * patterns.length)];
  
  function spawnNextBeat() {
    if (beatsSpawned >= rhythmGame.totalBeats || !rhythmGame.active) return;
    spawnBeat();
    beatsSpawned++;
    if (beatsSpawned < rhythmGame.totalBeats) {
      setTimeout(spawnNextBeat, pattern[beatsSpawned % pattern.length]);
    }
  }
  spawnNextBeat();
  
  // Input handlers
  document.addEventListener('keydown', handleRhythmInput);
  document.getElementById('rhythmTrack')?.addEventListener('click', handleRhythmInput);
}

function spawnBeat() {
  const track = document.getElementById('rhythmTrack');
  if (!track) return;
  
  const beat = document.createElement('div');
  beat.className = 'beat-marker';
  beat.style.right = '-50px';
  beat.dataset.id = Date.now();
  
  track.appendChild(beat);
  rhythmGame.beats.push({
    element: beat,
    id: beat.dataset.id,
    hit: false
  });
  
  // Animate the beat across the track
  let startTime = performance.now();
  const animate = () => {
    if (!rhythmGame.active) {
      beat.remove();
      return;
    }
    
    const elapsed = performance.now() - startTime;
    const progress = elapsed / rhythmGame.beatSpeed;
    const trackWidth = track.offsetWidth;
    const position = trackWidth - (progress * (trackWidth + 90));
    
    if (position < -50) {
      // Missed
      if (!rhythmGame.beats.find(b => b.id === beat.dataset.id)?.hit) {
        recordHit('miss');
      }
      beat.remove();
      return;
    }
    
    beat.style.right = `${trackWidth - position - 40}px`;
    requestAnimationFrame(animate);
  };
  
  requestAnimationFrame(animate);
}

function handleRhythmInput(e) {
  if (!rhythmGame.active) return;
  if (e.type === 'keydown' && e.code !== 'Space') return;
  if (e.type === 'keydown') e.preventDefault();
  
  const track = document.getElementById('rhythmTrack');
  if (!track) return;
  
  const hitZoneLeft = 60;
  const hitZoneRight = 120;
  const hitZoneCenter = 90;
  
  // Find the closest unhit beat in range
  let closestBeat = null;
  let closestDist = Infinity;
  
  rhythmGame.beats.forEach(b => {
    if (b.hit) return;
    const rect = b.element.getBoundingClientRect();
    const trackRect = track.getBoundingClientRect();
    const beatCenter = rect.left - trackRect.left + rect.width / 2;
    
    const dist = Math.abs(beatCenter - hitZoneCenter);
    if (beatCenter >= hitZoneLeft - 20 && beatCenter <= hitZoneRight + 20 && dist < closestDist) {
      closestDist = dist;
      closestBeat = b;
    }
  });
  
  if (closestBeat) {
    closestBeat.hit = true;
    
    // Determine accuracy
    if (closestDist < 15) {
      recordHit('perfect');
    } else if (closestDist < 35) {
      recordHit('good');
    } else {
      recordHit('miss');
    }
    
    closestBeat.element.remove();
  }
}

function recordHit(type) {
  const track = document.getElementById('rhythmTrack');
  
  if (type === 'perfect') {
    rhythmGame.perfect++;
    document.getElementById('perfectCount').textContent = rhythmGame.perfect;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-perfect');
    showHitFeedback('PERFECT!', 'perfect');
  } else if (type === 'good') {
    rhythmGame.good++;
    document.getElementById('goodCount').textContent = rhythmGame.good;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-good');
    showHitFeedback('GOOD', 'good');
  } else {
    rhythmGame.miss++;
    document.getElementById('missCount').textContent = rhythmGame.miss;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-miss');
    showHitFeedback('MISS', 'miss');
  }
  
  // Update progress
  rhythmGame.currentBeat++;
  const dots = document.querySelectorAll('.rhythm-progress-dot');
  if (dots[rhythmGame.currentBeat - 1]) {
    dots[rhythmGame.currentBeat - 1].classList.add(type === 'perfect' ? 'hit' : type);
  }
  
  // Check if done
  if (rhythmGame.currentBeat >= rhythmGame.totalBeats) {
    setTimeout(finishRhythmGame, 500);
  }
}

function showHitFeedback(text, type) {
  const track = document.getElementById('rhythmTrack');
  if (!track) return;
  
  const feedback = document.createElement('div');
  feedback.className = `hit-feedback ${type}`;
  feedback.textContent = text;
  track.appendChild(feedback);
  
  setTimeout(() => feedback.remove(), 500);
}

function finishRhythmGame() {
  rhythmGame.active = false;
  document.removeEventListener('keydown', handleRhythmInput);
  
  // Calculate quality
  const baseQuality = (rhythmGame.perfect * 3 + rhythmGame.good * 1 - rhythmGame.miss * 2);
  const maxQuality = rhythmGame.totalBeats * 3;
  const performanceRatio = Math.max(0, baseQuality) / maxQuality;
  
  // Apply stat multipliers
  const statMultiplier = 1 + ((gameState.bars + gameState.flow + gameState.production) / 300);
  const quality = Math.min(100, Math.max(10, Math.round(performanceRatio * 100 * statMultiplier)));
  const grade = getQualityGrade(quality);
  
  // Store current song
  rhythmGame.currentSong = {
    name: rhythmGame.songName,
    topic: rhythmGame.topic,
    style: rhythmGame.style,
    quality,
    grade,
    created: Date.now()
  };
  
  // Show result
  document.getElementById('rhythmGame').classList.remove('active');
  document.getElementById('songResult').classList.add('active');
  
  const gradeEl = document.getElementById('resultGrade');
  gradeEl.textContent = grade;
  gradeEl.className = `result-grade ${grade}`;
  
  document.getElementById('resultSongName').textContent = rhythmGame.songName;
  document.getElementById('resultQuality').textContent = quality;
  
  const estStreams = Math.floor((quality / 100) * (1 + gameState.fans / 1000) * 50);
  document.getElementById('resultStreams').textContent = `~${formatNumber(estStreams)}`;
  
  document.getElementById('resultBreakdown').innerHTML = `
    <span class="perfect">✨ ${rhythmGame.perfect} Perfect</span>
    <span class="good">👍 ${rhythmGame.good} Good</span>
    <span class="miss">❌ ${rhythmGame.miss} Miss</span>
  `;
}

function stopRhythmGame() {
  rhythmGame.active = false;
  clearInterval(rhythmGame.spawnInterval);
  document.removeEventListener('keydown', handleRhythmInput);
}

function releaseCurrentSong() {
  if (!rhythmGame.currentSong) return;
  
  const song = rhythmGame.currentSong;
  song.streams = 0;
  song.releaseDate = Date.now();
  gameState.releasedSongs.push(song);
  
  // Fan boost (boosted rates)
  let fanBoost = Math.floor(song.quality * (gameState.hype / 100) * 15 + 50);
  if (gameState.contract) {
    fanBoost = Math.floor(fanBoost * gameState.contract.promoMultiplier);
    gameState.contract.songsRemaining--;
    
    // Check if contract ended
    if (gameState.contract.songsRemaining <= 0) {
      gameState.dms.push({
        type: 'notification',
        sender: `🏢 ${gameState.contract.label}`,
        text: `Your contract with us has ended. You\'re now independent! Keep grinding.`,
        positive: true
      });
      gameState.contract = null;
    }
  }
  
  gameState.fans += fanBoost;
  gameState.hype = Math.min(100, gameState.hype + 8);
  
  rhythmGame.currentSong = null;
  
  recalculateIncome();
  checkMilestoneEvents();
  saveGame();
  
  openApp('spootify');
}

function saveCurrentSong() {
  if (!rhythmGame.currentSong) return;
  
  gameState.songs.push(rhythmGame.currentSong);
  rhythmGame.currentSong = null;
  
  checkMilestoneEvents();
  saveGame();
  
  // Reset ML Studio
  document.getElementById('beatmakerSetup').style.display = 'flex';
  document.getElementById('songResult').classList.remove('active');
  document.getElementById('songTitleGen').textContent = '';
  
  openApp('mlstudio');
}

// ═══════════════════════════════════════════════════════════════
// GAME ACTIONS
// ═══════════════════════════════════════════════════════════════
function releaseSong(songName) {
  const songIndex = gameState.songs.findIndex(s => s.name === songName);
  if (songIndex === -1) return;
  
  const song = gameState.songs.splice(songIndex, 1)[0];
  song.streams = 0;
  song.releaseDate = Date.now();
  gameState.releasedSongs.push(song);
  
  // Fan boost (boosted rates)
  let fanBoost = Math.floor(song.quality * (gameState.hype / 100) * 15 + 50);
  if (gameState.contract) {
    fanBoost = Math.floor(fanBoost * gameState.contract.promoMultiplier);
    gameState.contract.songsRemaining--;
    
    if (gameState.contract.songsRemaining <= 0) {
      gameState.dms.push({
        type: 'notification',
        sender: `🏢 ${gameState.contract.label}`,
        text: `Your contract with us has ended. You're now independent!`,
        positive: true
      });
      gameState.contract = null;
    }
  }
  
  gameState.fans += fanBoost;
  gameState.hype = Math.min(100, gameState.hype + 8);
  
  recalculateIncome();
  checkMilestoneEvents();
  saveGame();
  openApp('spootify');
}

function makePost() {
  if (Date.now() < gameState.postCooldown) return;
  
  const captions = [
    '🔥 New heat cooking...',
    '💯 Grinding 24/7',
    '🎤 Studio vibes',
    `${formatNumber(gameState.fans)} of yall are real ones 🙏`,
    '⚡ Energy different today',
    '🏆 We up next fr',
    'Album mode activated 🎵',
    'Thank yall for the support 💪',
    'Can\'t stop won\'t stop 🚀',
    'Late night session 🌙'
  ];
  
  gameState.posts.push(randomChoice(captions));
  gameState.hype = Math.min(100, gameState.hype + 10);
  gameState.postCooldown = Date.now() + 20000;
  
  saveGame();
  openApp('z');
}

function buyUpgrade(upgradeId) {
  const upgrade = UPGRADES[upgradeId];
  if (!upgrade || gameState.balance < upgrade.price || gameState.upgrades[upgradeId]) return;
  
  gameState.balance -= upgrade.price;
  gameState.upgrades[upgradeId] = true;
  
  if (upgrade.stat) {
    gameState[upgrade.stat] = Math.min(100, gameState[upgrade.stat] + upgrade.boost);
  }
  
  applyVisualUpgrades();
  recalculateIncome();
  saveGame();
  openApp('mikeazon');
}

function createMerch() {
  if (gameState.balance < 1000) return;
  
  const types = [
    { icon: '👕', name: 'Tee' },
    { icon: '🧥', name: 'Hoodie' },
    { icon: '🧢', name: 'Cap' },
    { icon: '🖼️', name: 'Poster' }
  ];
  
  const type = randomChoice(types);
  gameState.balance -= 1000;
  gameState.merch.push({
    ...type,
    name: `${type.name} #${gameState.merch.length + 1}`,
    sales: 0,
    created: Date.now()
  });
  
  recalculateIncome();
  saveGame();
  openApp('merchdrop');
}

function handleDM(dmIndex, choice) {
  const dm = gameState.dms[dmIndex];
  if (!dm) return;
  
  if (dm.type === 'contract') {
    if (choice === 'sign') {
      gameState.contract = {
        label: dm.label,
        songsRemaining: dm.songs,
        songsTotal: dm.songs,
        cut: dm.cut,
        promoMultiplier: dm.promoMultiplier
      };
      gameState.balance += dm.upfront;
    }
    // Mark as triggered so it doesn't show again
    const eventKey = Object.keys(MILESTONE_EVENTS).find(k => {
      const e = MILESTONE_EVENTS[k].event;
      return e.type === 'contract' && e.label === dm.label;
    });
    if (eventKey) gameState.triggeredEvents[eventKey] = true;
  } else if (dm.type === 'choice') {
    const choiceData = dm.choices[parseInt(choice)];
    if (choiceData?.effect) {
      Object.entries(choiceData.effect).forEach(([key, value]) => {
        gameState[key] = Math.max(0, gameState[key] + value);
      });
    }
  } else if (dm.type === 'notification' && dm.reward) {
    Object.entries(dm.reward).forEach(([key, value]) => {
      gameState[key] = Math.max(0, gameState[key] + value);
    });
  }
  
  gameState.dms.splice(dmIndex, 1);
  checkMilestones();
  saveGame();
  renderOS();
  
  if (gameState.dms.length > 0) {
    openApp('dms');
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME TIME SYSTEM (1 real second = 10 game minutes)
// ═══════════════════════════════════════════════════════════════
const GAME_TIME_SPEED = 1; // 1 real second = 1 game minute

function getGameTimeStr() {
  const totalMs = gameState.gameTimeMs;
  const totalMinutes = Math.floor(totalMs / (60 * 1000));
  let hours = Math.floor(totalMinutes / 60) % 24;
  const minutes = totalMinutes % 60;
  const ampm = hours >= 12 ? 'PM' : 'AM';
  const displayHours = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
  return `Day ${gameState.gameDay} ${displayHours}:${String(minutes).padStart(2, '0')} ${ampm}`;
}

function advanceGameTime(realDeltaSec) {
  const gameMinutesElapsed = realDeltaSec * GAME_TIME_SPEED;
  gameState.gameTimeMs += gameMinutesElapsed * 60 * 1000;
  
  // Check for day rollover
  const totalHours = gameState.gameTimeMs / (60 * 60 * 1000);
  if (totalHours >= 24) {
    gameState.gameDay += Math.floor(totalHours / 24);
    gameState.gameTimeMs = gameState.gameTimeMs % (24 * 60 * 60 * 1000);
  }
}

// ═══════════════════════════════════════════════════════════════
// REST FUNCTION
// ═══════════════════════════════════════════════════════════════
function restEnergy() {
  if (gameState.energy >= 100) return;
  gameState.energy = Math.min(100, gameState.energy + 30);
  // Resting costs game time (2 hours) and slight hype decay
  gameState.gameTimeMs += 2 * 60 * 60 * 1000;
  gameState.hype = Math.max(0, gameState.hype - 3);
  // Check day rollover
  const totalHours = gameState.gameTimeMs / (60 * 60 * 1000);
  if (totalHours >= 24) {
    gameState.gameDay += Math.floor(totalHours / 24);
    gameState.gameTimeMs = gameState.gameTimeMs % (24 * 60 * 60 * 1000);
  }
  saveGame();
  openApp('mlstudio');
}

// ═══════════════════════════════════════════════════════════════
// INCOME CALCULATION (boosted rates)
// ═══════════════════════════════════════════════════════════════
function recalculateIncome() {
  let streamIncome = 0;
  
  gameState.releasedSongs.forEach(song => {
    // Base rate per song based on quality (5x boost from original)
    const baseRate = (song.quality / 100) * 0.005;
    // Fan multiplier
    const fanMultiplier = 1 + (gameState.fans / 5000);
    // Hype multiplier
    const hypeMultiplier = 0.5 + (gameState.hype / 150);
    
    streamIncome += baseRate * fanMultiplier * hypeMultiplier;
  });
  
  // Merch income (boosted)
  let merchIncome = 0;
  if (gameState.merch.length > 0) {
    merchIncome = gameState.merch.length * (gameState.fans / 20000) * 0.05;
  }
  
  gameState.streamIncomePerSec = streamIncome;
  gameState.merchIncomePerSec = merchIncome;
}

// ═══════════════════════════════════════════════════════════════
// EVENT SYSTEM
// ═══════════════════════════════════════════════════════════════
function checkMilestoneEvents() {
  Object.entries(MILESTONE_EVENTS).forEach(([key, milestone]) => {
    if (milestone.trigger() && !gameState.triggeredEvents[key]) {
      gameState.triggeredEvents[key] = true;
      gameState.dms.push({ ...milestone.event });
      renderOS();
    }
  });
}

function checkMilestones() {
  Object.entries(MILESTONES).forEach(([id, m]) => {
    const achieved = m.fans ? gameState.fans >= m.fans : gameState.totalStreams >= m.streams;
    if (!gameState.triggeredEvents[`milestone_${id}`] && achieved) {
      gameState.triggeredEvents[`milestone_${id}`] = true;
      showMilestone(m);
    }
  });
}

function showMilestone(milestone) {
  const popup = document.getElementById('milestonePopup');
  document.getElementById('milestoneIcon').textContent = milestone.icon;
  document.getElementById('milestoneTitle').textContent = milestone.title;
  document.getElementById('milestoneDesc').textContent = milestone.desc;
  
  popup.classList.add('active');
  spawnConfetti();
  
  document.getElementById('milestoneClose')?.addEventListener('click', () => {
    popup.classList.remove('active');
  });
  
  setTimeout(() => popup.classList.remove('active'), 4000);
}

function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#ff8e3d', '#1DB954', '#E1306C', '#FFD700', '#8B5CF6', '#00d4ff'];
  
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.background = randomChoice(colors);
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
      container.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4000);
    }, i * 25);
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
function gameLoop() {
  const now = Date.now();
  const delta = (now - gameState.lastUpdate) / 1000;
  gameState.lastUpdate = now;
  
  // Advance game time
  advanceGameTime(delta);
  
  // Income
  const labelCut = gameState.contract ? (gameState.streamIncomePerSec * (gameState.contract.cut / 100)) : 0;
  const netIncome = gameState.streamIncomePerSec + gameState.merchIncomePerSec - labelCut;
  gameState.balance += netIncome * delta;
  
  // Stream counts (boosted)
  gameState.releasedSongs.forEach(song => {
    const streamRate = (song.quality / 100) * (1 + gameState.fans / 500) * 25;
    song.streams = (song.streams || 0) + streamRate * delta;
    gameState.totalStreams += streamRate * delta;
  });
  
  // Merch sales (boosted)
  gameState.merch.forEach(m => {
    m.sales = (m.sales || 0) + (gameState.fans / 5000) * delta * 0.3;
  });
  
  // Hype decay
  gameState.hype = Math.max(0, gameState.hype - 0.003 * delta);
  
  // Energy regen (slower - makes rest button meaningful)
  gameState.energy = Math.min(100, gameState.energy + 0.03 * delta);
  
  // Smooth display values
  gameState.displayBalance += (gameState.balance - gameState.displayBalance) * 0.15;
  gameState.displayFans += (gameState.fans - gameState.displayFans) * 0.15;
  
  // Real-time UI updates
  const menuBalanceEl = document.getElementById('menuBalance');
  if (menuBalanceEl) menuBalanceEl.textContent = formatMoney(gameState.displayBalance);
  
  const bankBalanceEl = document.querySelector('.bank-balance-value');
  if (bankBalanceEl) bankBalanceEl.textContent = formatMoney(gameState.displayBalance);
  
  const fansEl = document.getElementById('dockFans');
  if (fansEl) fansEl.textContent = formatNumber(Math.floor(gameState.displayFans));
  
  const hypeEl = document.getElementById('dockHype');
  if (hypeEl) hypeEl.textContent = Math.round(gameState.hype);
  
  const energyEl = document.getElementById('dockEnergy');
  if (energyEl) energyEl.textContent = Math.round(gameState.energy);
  
  // Update game clock
  const timeEl = document.getElementById('menuTime');
  if (timeEl) timeEl.textContent = getGameTimeStr();
  
  // Check events
  checkMilestoneEvents();
  checkMilestones();
  
  // Auto-save
  if (now - gameState.lastSave > 10000) {
    saveGame();
  }
  
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════════════════════════
function init() {
  loadGame();
  renderOS();
  recalculateIncome();
  applyVisualUpgrades();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('DOMContentLoaded', init);
</script>
