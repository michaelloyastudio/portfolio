<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapper Tycoon — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --parchment: #E8E0D4;
  --accent: #ff8e3d;
  --espresso: #3d2b1f;
  --warm-gray: #8a8580;
  --black: #0a0a0a;
  --spotify-green: #1DB954;
  --z-blue: #1DA1F2;
  --bank-gold: #FFD700;
  --neon-blue: #00d4ff;
  --neon-purple: #9d4edd;
  --neon-green: #39ff14;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--parchment);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  cursor: url('../cursor.svg') 16 8, default;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

a, button, .clickable, input, select { cursor: url('../crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'Instrument Serif', serif; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8rem 2rem;
  z-index: 1000;
  background: rgba(10, 10, 10, 0.9);
  backdrop-filter: blur(10px);
}

.header-logo-link {
  display: block;
  position: relative;
  height: 24px;
}

.header-logo {
  height: 24px;
  transition: opacity 0.2s ease;
}

.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN LAYOUT ── */
.game-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 50px 20px 0;
  position: relative;
  overflow: visible;
}

/* ── BEDROOM WALL ── */
.wall {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(180deg, #6b3a4a 0%, #5a2e3e 100%);
  z-index: 0;
}

/* ── WALL SHELVES ── */
.wall-shelf {
  position: absolute;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wall-shelf-left { top: 40px; left: 6%; }
.wall-shelf-right { top: 40px; right: 6%; }

.shelf-board {
  width: 120px;
  height: 8px;
  background: #3d2b1f;
  border-radius: 2px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
}

.shelf-items {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  position: relative;
  top: -8px;
  padding: 0 6px;
}

.shelf-book {
  border-radius: 1px;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

.shelf-binder {
  border-radius: 2px;
  position: relative;
  box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

.shelf-binder::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 4px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 2px;
}

/* ── WALL CLOCK ── */
.wall-clock {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  height: 65px;
  background: #1a1a1a;
  border-radius: 50%;
  border: 4px solid #222;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 12px rgba(0,0,0,0.4);
}

.clock-face {
  width: 52px;
  height: 52px;
  background: #f5f0e8;
  border-radius: 50%;
  position: relative;
}

.clock-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 5px;
  height: 5px;
  background: #222;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

.clock-hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform-origin: bottom center;
  border-radius: 2px;
}

.clock-hand-hour {
  width: 3px;
  height: 14px;
  background: #222;
  transform: translateX(-50%) rotate(210deg);
}

.clock-hand-minute {
  width: 2px;
  height: 19px;
  background: #333;
  transform: translateX(-50%) rotate(45deg);
}

.clock-mark {
  position: absolute;
  width: 2px;
  height: 4px;
  background: #999;
  top: 3px;
  left: 50%;
  transform-origin: 50% 23px;
}

/* ── FRAMED PICTURE ── */
.wall-picture {
  position: absolute;
  top: 30px;
  right: 18%;
  width: 75px;
  height: 55px;
  background: #222;
  border: 4px solid #3d3530;
  z-index: 1;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.4);
}

.picture-scene {
  width: 100%;
  height: 100%;
  position: relative;
}

.picture-sky { position: absolute; top: 0; left: 0; right: 0; height: 55%; background: #5b9bd5; }
.picture-sun { position: absolute; top: 8px; right: 10px; width: 12px; height: 12px; background: #ffd700; border-radius: 50%; }
.picture-hills { position: absolute; bottom: 0; left: 0; right: 0; height: 55%; background: #4caf50; border-radius: 50% 60% 0 0; }

.wall-picture-hook {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 10px solid #3d3530;
}

/* ── DESK LAMP ── */
.desk-lamp {
  left: 60px;
  bottom: 15px;
}

.lamp-shade {
  width: 32px;
  height: 20px;
  background: linear-gradient(180deg, #ff8e3d, #e07828);
  border-radius: 50% 50% 0 0;
  position: relative;
  box-shadow: 0 6px 20px rgba(255,142,61,0.15);
}

.lamp-shade::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(0,0,0,0.15);
  border-radius: 0 0 2px 2px;
}

.lamp-neck {
  width: 4px;
  height: 24px;
  background: #8a8580;
  margin: 0 auto;
}

.lamp-base-piece {
  width: 22px;
  height: 5px;
  background: #8a8580;
  border-radius: 2px;
  margin: 0 auto;
}

/* ── PENCIL CUP ── */
.pencil-cup {
  right: 65px;
  bottom: 12px;
}

.cup-body {
  width: 18px;
  height: 22px;
  background: linear-gradient(180deg, #e8a020, #c88010);
  border-radius: 0 0 3px 3px;
  position: relative;
  display: flex;
  justify-content: center;
}

.cup-pencils {
  display: flex;
  gap: 2px;
  position: absolute;
  bottom: 14px;
}

.cup-pencil {
  width: 3px;
  height: 16px;
  border-radius: 1px 1px 0 0;
}

/* ── GOLD PLAQUES ── */
.wall-plaques {
  position: absolute;
  top: 55px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 140px;
  z-index: 1;
}

.gold-plaque {
  width: 55px;
  height: 70px;
  background: linear-gradient(145deg, #FFD700, #B8860B);
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 12px rgba(255, 215, 0, 0.2);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.gold-plaque.visible { opacity: 1; transform: scale(1); }

.gold-plaque-disc {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: linear-gradient(145deg, #333, #111);
  border: 2px solid #FFD700;
  position: relative;
}

.gold-plaque-disc::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  background: #FFD700;
  border-radius: 50%;
}

.gold-plaque-label {
  margin-top: 4px;
  font-size: 0.35rem;
  color: #3d2b1f;
  font-weight: 700;
  text-align: center;
}

/* ── COMPUTER AREA ── */
.computer-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: -20px;
  margin-top: -40px;
}

/* Laptop (default) */
.monitor {
  width: min(1050px, 94vw);
  height: min(620px, 72vh);
  background: #0a0a0a;
  border-radius: 12px 12px 0 0;
  border: 8px solid #222;
  border-bottom: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 -5px 30px rgba(0,0,0,0.5);
  transition: all 0.5s;
}

.monitor::before {
  content: '';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  height: 6px;
  background: #333;
  border-radius: 50%;
}

/* Laptop base (keyboard) — visible by default, hidden when desktop upgrade */
.laptop-base {
  width: min(1100px, 98vw);
  height: 18px;
  background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
  border-radius: 0 0 8px 8px;
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.laptop-base::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 4px;
  background: #333;
  border-radius: 2px;
}

/* Desktop stand (hidden by default, shown with upgrade) */
.monitor-stand {
  width: 60px;
  height: 40px;
  background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
  clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
  display: none;
}

.monitor-base {
  width: 140px;
  height: 10px;
  background: #1a1a1a;
  border-radius: 5px;
  display: none;
}

/* Side monitors (hidden, shown with multi-monitor upgrade) */
.side-monitor {
  position: absolute;
  width: 200px;
  height: 140px;
  background: #0a0a0a;
  border: 5px solid #222;
  border-radius: 6px;
  top: 50%;
  transform: translateY(-60%);
  z-index: 9;
  overflow: hidden;
  display: none;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

.side-monitor.visible { display: block; }

.side-monitor-left {
  right: calc(50% + min(475px, 46vw) + 10px);
  transform: translateY(-60%) perspective(400px) rotateY(15deg);
}

.side-monitor-right {
  left: calc(50% + min(475px, 46vw) + 10px);
  transform: translateY(-60%) perspective(400px) rotateY(-15deg);
}

.side-monitor-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.5rem;
  color: #444;
}

/* RGB glow (hidden, shown with RGB upgrade) */
.rgb-glow {
  position: absolute;
  inset: -5px;
  border-radius: 16px;
  z-index: -1;
  opacity: 0;
  transition: opacity 0.5s;
  animation: rgbRotate 3s linear infinite;
  background: conic-gradient(#ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0000);
  filter: blur(15px);
}

.rgb-glow.visible { opacity: 0.4; }

@keyframes rgbRotate {
  to { filter: blur(15px) hue-rotate(360deg); }
}

/* ── DESK ── */
.desk {
  width: 100%;
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.desk-surface {
  width: 100%;
  height: 20px;
  background: linear-gradient(180deg, #5a4a3a 0%, #4a3a2a 100%);
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 2;
}

.desk-surface::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.08) 50%, transparent 95%);
}

.desk-body {
  width: 100%;
  height: 70px;
  display: flex;
  justify-content: center;
  position: relative;
}

.desk-pedestal {
  width: 180px;
  height: 70px;
  background: linear-gradient(180deg, #4a5568, #3a4556);
  border-radius: 0 0 4px 4px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 10px;
}

.desk-pedestal-left { position: absolute; left: 12%; }
.desk-pedestal-right { position: absolute; right: 12%; }

.desk-drawer {
  flex: 1;
  background: linear-gradient(180deg, #556677, #4a5a6a);
  border-radius: 2px;
  position: relative;
}

.desk-drawer::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 16px;
  height: 3px;
  background: #8a9ab0;
  border-radius: 2px;
}

.desk-gap {
  width: calc(76% - 360px);
  min-width: 100px;
  height: 70px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* ── DESK ITEMS ── */
.desk-items {
  position: absolute;
  bottom: 55px;
  left: 50%;
  transform: translateX(-50%);
  width: min(1050px, 94vw);
  height: 80px;
  z-index: 11;
  pointer-events: none;
}

.desk-item {
  position: absolute;
  opacity: 0;
  transform: translateY(10px) scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.desk-item.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* Headphones */
.headphones {
  right: 15px;
  bottom: 15px;
}

.headphone-band {
  width: 40px;
  height: 20px;
  border: 4px solid #444;
  border-bottom: none;
  border-radius: 20px 20px 0 0;
}

.headphone-cup {
  width: 16px;
  height: 22px;
  background: linear-gradient(180deg, #555, #333);
  border-radius: 5px;
  position: absolute;
}

.headphone-cup.left { left: -3px; top: 14px; }
.headphone-cup.right { right: -3px; top: 14px; }

/* Mic */
.mic {
  left: 25px;
  bottom: 10px;
}

.mic-head {
  width: 28px;
  height: 40px;
  background: linear-gradient(180deg, #555 0%, #333 100%);
  border-radius: 14px 14px 6px 6px;
  position: relative;
}

.mic-head::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  right: 4px;
  height: 22px;
  background: repeating-linear-gradient(0deg, #444 0px, #444 2px, #333 2px, #333 4px);
  border-radius: 10px 10px 3px 3px;
}

.mic-stand {
  width: 4px;
  height: 28px;
  background: #444;
  margin: 0 auto;
}

/* Studio mic (condenser style, shown with studioMic upgrade) */
.mic.studio .mic-head {
  width: 32px;
  height: 45px;
  background: linear-gradient(180deg, #888 0%, #555 100%);
  border-radius: 16px;
  border: 2px solid #999;
}

.mic.studio .mic-head::before {
  background: repeating-linear-gradient(0deg, #777 0px, #777 1px, #666 1px, #666 3px);
  border-radius: 12px;
  height: 28px;
}

.mic.studio .mic-stand {
  width: 5px;
  height: 32px;
  background: #666;
}

/* Speakers */
.speaker {
  width: 35px;
  height: 55px;
  background: linear-gradient(180deg, #333 0%, #1a1a1a 100%);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  bottom: 8px;
}

.speaker-cone {
  width: 20px;
  height: 20px;
  background: radial-gradient(circle, #555 0%, #333 60%, #1a1a1a 100%);
  border-radius: 50%;
}

.speaker-tweeter {
  width: 10px;
  height: 10px;
  background: radial-gradient(circle, #666 0%, #444 100%);
  border-radius: 50%;
}

.speaker-left { left: 90px; }
.speaker-right { right: 90px; }

/* Coffee mug removed */

/* ── OS SCREEN ── */
.os-screen {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
  display: flex;
  flex-direction: column;
}

/* ── LOGIN SCREEN ── */
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
  gap: 18px;
  user-select: none;
}

.login-avatar-row {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 360px;
}

.login-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.06);
  border: 3px solid transparent;
  transition: all 0.2s;
  overflow: hidden;
  padding: 4px;
}

.login-avatar svg { width: 100%; height: 100%; }

.login-avatar:hover { background: rgba(255,255,255,0.12); transform: scale(1.1); }
.login-avatar.selected { border-color: var(--accent); background: rgba(255,142,61,0.15); transform: scale(1.12); }

.login-selected-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.08);
  border: 3px solid rgba(255,255,255,0.15);
  margin-bottom: 6px;
  overflow: hidden;
  padding: 6px;
}

.login-selected-avatar svg { width: 100%; height: 100%; }

.login-fields {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 220px;
}

.login-input {
  width: 100%;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(0,0,0,0.4);
  color: var(--parchment);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  outline: none;
  transition: border-color 0.2s;
}

.login-input:focus { border-color: var(--accent); }
.login-input::placeholder { color: rgba(255,255,255,0.25); }

.login-btn {
  padding: 8px 0;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
  transition: opacity 0.2s;
  margin-top: 4px;
}

.login-btn:hover { opacity: 0.85; }
.login-btn:disabled { opacity: 0.35; }

/* OS Menubar */
.os-menubar {
  height: 28px;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  font-size: 0.7rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.os-left { display: flex; align-items: center; gap: 12px; }
.os-right { display: flex; align-items: center; gap: 12px; }
.os-time { color: var(--parchment); }
.os-balance { color: var(--bank-gold); font-weight: 600; }
.os-contract { color: var(--accent); font-size: 0.6rem; }

/* OS Desktop */
.os-desktop {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: auto;
  gap: 8px;
  padding: 15px;
  align-content: start;
  background: 
    radial-gradient(ellipse 120% 60% at 30% 80%, #1a6b3a 0%, transparent 70%),
    radial-gradient(ellipse 100% 50% at 70% 90%, #2d8a4e 0%, transparent 60%),
    radial-gradient(ellipse 140% 40% at 50% 95%, #3da565 0%, transparent 50%),
    radial-gradient(ellipse 80% 80% at 80% 30%, #4a90d9 0%, transparent 50%),
    linear-gradient(180deg, #1a3a5c 0%, #2a6090 25%, #4aa0d5 45%, #7ec8e3 60%, #4db877 75%, #2d8a4e 100%);
}

.app-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 10px;
  transition: all 0.2s;
  position: relative;
}

.app-icon:hover {
  background: rgba(255,255,255,0.08);
  transform: scale(1.05);
}

.app-icon-img {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  position: relative;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.app-icon-label {
  font-size: 0.65rem;
  color: var(--parchment);
  text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.notification-badge {
  position: absolute;
  top: 0;
  right: 0;
  min-width: 20px;
  height: 20px;
  background: #ff3b30;
  border-radius: 10px;
  font-size: 0.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  padding: 0 5px;
  animation: pulse 2s infinite;
  box-shadow: 0 2px 8px rgba(255, 59, 48, 0.5);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.app-locked {
  opacity: 0.35;
  pointer-events: none;
}

.app-locked::after {
  content: '🔒';
  position: absolute;
  font-size: 1rem;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* App icon colors */
.app-mlstudio { background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); border: 2px solid var(--accent); }
.app-spootify { background: linear-gradient(135deg, #1DB954, #169c46); }
.app-z { background: linear-gradient(135deg, #1DA1F2, #0d8bd9); }
.app-mikeazon { background: linear-gradient(135deg, #FF9900, #FF6600); }
.app-merchdrop { background: linear-gradient(135deg, #8B5CF6, #6366F1); }
.app-dms { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
.app-settings { background: linear-gradient(135deg, #6B7280, #4B5563); }

/* Desktop Folders */
.desktop-folder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border-radius: 10px;
  transition: all 0.2s;
  opacity: 0.7;
}

.desktop-folder:hover {
  background: rgba(255,255,255,0.08);
  opacity: 1;
}

.folder-icon {
  width: 48px;
  height: 40px;
  background: linear-gradient(180deg, #5a9fd4 0%, #4a8bc2 40%, #4a8bc2 100%);
  border-radius: 2px 8px 8px 8px;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.folder-icon::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 0;
  width: 20px;
  height: 8px;
  background: #5a9fd4;
  border-radius: 4px 4px 0 0;
}

.folder-label {
  font-size: 0.65rem;
  color: var(--parchment);
  text-align: center;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

/* Calendar Widget */
.calendar-widget {
  grid-column: 5 / 7;
  grid-row: 1 / 3;
  background: rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.cal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.cal-month {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent);
}

.cal-day-label {
  font-size: 0.45rem;
  color: #666;
  text-align: center;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  font-size: 0.55rem;
  color: #888;
  text-align: center;
  padding: 3px 0;
  border-radius: 4px;
  line-height: 1.4;
}

.cal-day.today {
  background: var(--accent);
  color: #000;
  font-weight: 700;
  border-radius: 50%;
}

.cal-day.has-event {
  color: var(--parchment);
  font-weight: 600;
}

.cal-day.has-event::after {
  content: '';
  display: block;
  width: 3px;
  height: 3px;
  background: var(--accent);
  border-radius: 50%;
  margin: 0 auto;
}

.cal-events {
  margin-top: 6px;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  overflow: hidden;
}

.cal-event {
  font-size: 0.55rem;
  padding: 3px 6px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.cal-event-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

.cal-event-text {
  color: #bbb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Finder-style folder window */
.finder-app {
  background: #1e1e1e;
  height: 100%;
  display: flex;
  flex-direction: column;
}

.finder-toolbar {
  height: 36px;
  background: #2d2d2d;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 12px;
  border-bottom: 1px solid #444;
}

.finder-nav-btns {
  display: flex;
  gap: 4px;
}

.finder-nav-btn {
  width: 22px;
  height: 22px;
  background: #3a3a3a;
  border: 1px solid #555;
  border-radius: 4px;
  color: #999;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.finder-path {
  flex: 1;
  font-size: 0.7rem;
  color: #999;
  display: flex;
  align-items: center;
  gap: 4px;
}

.finder-path-sep { color: #555; }

.finder-sidebar {
  width: 140px;
  background: rgba(0,0,0,0.3);
  border-right: 1px solid #333;
  padding: 10px;
  flex-shrink: 0;
}

.finder-sidebar-label {
  font-size: 0.5rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.finder-sidebar-item {
  font-size: 0.65rem;
  color: #bbb;
  padding: 4px 6px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 2px;
}

.finder-sidebar-item.active {
  background: rgba(59,130,246,0.3);
  color: #fff;
}

.finder-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.finder-content {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.finder-file {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  transition: background 0.15s;
  margin-bottom: 2px;
}

.finder-file:hover { background: rgba(255,255,255,0.05); }

.finder-file-icon {
  font-size: 1.5rem;
}

.finder-file-info { flex: 1; }
.finder-file-name { font-size: 0.75rem; color: #e0e0e0; }
.finder-file-meta { font-size: 0.55rem; color: #666; }

.finder-empty {
  text-align: center;
  color: #555;
  padding: 40px;
  font-size: 0.75rem;
}

/* OS Dock */
.os-dock {
  height: 50px;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(20px);
  margin: 10px 15px 15px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,0.1);
}

.dock-item {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: all 0.2s;
  position: relative;
}

.dock-item:hover {
  transform: scale(1.15) translateY(-5px);
}

.dock-item.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  width: 4px;
  height: 4px;
  background: var(--parchment);
  border-radius: 50%;
}

.dock-divider {
  width: 1px;
  height: 30px;
  background: rgba(255,255,255,0.2);
  margin: 0 5px;
}

/* Stats in dock area */
.dock-stats {
  display: flex;
  gap: 15px;
  margin-left: auto;
  padding-right: 10px;
}

.dock-stat {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
}

.dock-stat-icon { font-size: 0.9rem; }
.dock-stat-value { color: var(--accent); font-weight: 600; }

/* ── APP WINDOWS ── */
.app-window {
  position: absolute;
  inset: 28px 0 0 0;
  background: #111;
  display: none;
  flex-direction: column;
  animation: windowOpen 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 100;
}

.app-window.active { display: flex; }

@keyframes windowOpen {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.app-header {
  height: 36px;
  background: #1a1a1a;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}

.window-controls {
  display: flex;
  gap: 8px;
}

.window-btn {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: none;
  transition: transform 0.2s, filter 0.2s;
}

.window-btn:hover { transform: scale(1.15); filter: brightness(1.2); }

.window-close { background: #ff5f56; }
.window-minimize { background: #ffbd2e; }
.window-maximize { background: #27c93f; }

.app-title {
  font-size: 0.8rem;
  color: var(--parchment);
  font-weight: 500;
  flex: 1;
  text-align: center;
  margin-right: 60px;
}

.app-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ── PIANO ROLL RHYTHM GAME ── */
.rhythm-game {
  flex: 1;
  display: none;
  flex-direction: column;
  background: #1a1a1a;
}

.rhythm-game.active { display: flex; }

/* Piano roll header bar */
.pianoroll-header {
  height: 24px;
  background: #333;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 10px;
  border-bottom: 1px solid #555;
  font-size: 0.6rem;
  color: #999;
}

.pianoroll-rec-dot {
  width: 8px;
  height: 8px;
  background: #ff3b30;
  border-radius: 50%;
  animation: recBlink 0.8s infinite;
}

@keyframes recBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.rhythm-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 8px;
  background: #222;
  border-bottom: 1px solid #333;
}

.rhythm-stat { text-align: center; }

.rhythm-stat-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
}

.rhythm-stat-value.perfect { color: var(--neon-green); }
.rhythm-stat-value.good { color: var(--neon-blue); }
.rhythm-stat-value.miss { color: #ff5f56; }

.rhythm-stat-label {
  font-size: 0.5rem;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Piano roll area */
.rhythm-track-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* Piano keys on left */
.pianoroll-keys {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 35px;
  background: #1a1a1a;
  z-index: 15;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #444;
}

.pianoroll-key {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.45rem;
  color: #666;
  border-bottom: 1px solid #333;
}

.pianoroll-key.white { background: #ddd; color: #333; }
.pianoroll-key.black { background: #222; color: #888; }

/* Piano roll track area */
.pianoroll-area {
  flex: 1;
  display: flex;
  position: relative;
}

.rhythm-track {
  flex: 1;
  background: 
    repeating-linear-gradient(0deg, #1e1e1e 0px, #1e1e1e 19px, #2a2a2a 19px, #2a2a2a 20px),
    repeating-linear-gradient(90deg, transparent 0px, transparent 59px, #2a2a2a 59px, #2a2a2a 60px);
  position: relative;
  overflow: hidden;
  border: none;
  border-radius: 0;
}

/* Playhead line */
.hit-zone {
  position: absolute;
  left: 80px;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent), 0 0 16px rgba(255,142,61,0.2);
  z-index: 12;
}

/* Beat notes */
.beat-marker {
  position: absolute;
  width: 50px;
  height: 16px;
  border-radius: 2px;
  background: linear-gradient(90deg, #5a9fd4, #4a8bc2);
  display: block;
  box-shadow: 0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.1);
}

.beat-marker::before { content: none; }

/* Hit feedback */
.hit-feedback {
  position: absolute;
  left: 80px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  font-weight: 700;
  opacity: 0;
  animation: hitFeedback 0.4s ease-out forwards;
  z-index: 20;
  text-shadow: 0 0 15px currentColor;
  font-family: 'Space Grotesk', sans-serif;
}

.hit-feedback.perfect { color: var(--neon-green); }
.hit-feedback.good { color: var(--neon-blue); }
.hit-feedback.miss { color: #ff5f56; }

@keyframes hitFeedback {
  0% { opacity: 1; transform: translateY(-50%) scale(1.3); }
  100% { opacity: 0; transform: translateY(-80%) scale(0.9); }
}

.rhythm-track.flash-perfect { animation: flashPerfect 0.12s; }
.rhythm-track.flash-good { animation: flashGood 0.12s; }
.rhythm-track.flash-miss { animation: flashMiss 0.12s; }

@keyframes flashPerfect {
  50% { box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.3); }
}

@keyframes flashGood {
  50% { box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.3); }
}

@keyframes flashMiss {
  50% { box-shadow: inset 0 0 30px rgba(255, 95, 86, 0.3); }
}

.rhythm-instruction {
  text-align: center;
  color: #666;
  font-size: 0.65rem;
  padding: 6px;
  background: #222;
  border-top: 1px solid #333;
}

.rhythm-instruction kbd {
  background: #444;
  padding: 2px 8px;
  border-radius: 3px;
  font-family: inherit;
  color: var(--parchment);
  border: 1px solid #555;
}

/* Progress dots */
.rhythm-progress {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 6px;
  background: #222;
}

.rhythm-progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: #333;
  transition: all 0.15s;
}

.rhythm-progress-dot.hit { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
.rhythm-progress-dot.good { background: var(--neon-blue); box-shadow: 0 0 6px var(--neon-blue); }
.rhythm-progress-dot.miss { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }

/* Song Result Card */
.song-result {
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 30px;
  text-align: center;
}

.song-result.active { display: flex; }

.result-grade {
  font-size: 5rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 10px;
  text-shadow: 0 0 40px currentColor;
}

.result-grade.S { color: #FFD700; }
.result-grade.A { color: var(--neon-green); }
.result-grade.B { color: var(--neon-blue); }
.result-grade.C { color: var(--accent); }
.result-grade.D { color: #ff9500; }
.result-grade.F { color: #ff5f56; }

.result-song-name {
  font-family: 'Instrument Serif', serif;
  font-size: 1.5rem;
  color: var(--parchment);
  margin-bottom: 20px;
}

.result-stats {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}

.result-stat {
  background: rgba(255,255,255,0.05);
  padding: 10px 20px;
  border-radius: 8px;
}

.result-stat-value {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
}

.result-stat-label {
  font-size: 0.6rem;
  color: var(--warm-gray);
}

.result-breakdown {
  display: flex;
  gap: 30px;
  margin-bottom: 25px;
  font-size: 0.85rem;
}

.result-breakdown span { display: flex; align-items: center; gap: 5px; }
.result-breakdown .perfect { color: var(--neon-green); }

.milestone-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
  border: 2px solid var(--accent);
  border-radius: 20px;
  padding: 40px 60px;
  text-align: center;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.milestone-popup.active {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
  pointer-events: auto;
}

.milestone-icon { font-size: 4rem; margin-bottom: 15px; }

.milestone-title { 
  font-family: 'Instrument Serif', serif; 
  font-size: 1.8rem; 
  color: var(--accent); 
  margin-bottom: 8px; 
}

.milestone-desc { 
  font-size: 0.95rem; 
  color: #888; 
}

.milestone-close {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 30px;
  height: 30px;
  background: #333;
  border: none;
  border-radius: 50%;
  color: #888;
  font-size: 1rem;

  align-items: center;

/* ══════════════════════════════════════════════════════════════

.confetti-container {
  position: fixed;

  z-index: 1999;

}

.confetti {
  position: absolute;

  height: 10px;

}

@keyframes confettiFall {

// ═══════════════════════════════════════════════════════════════
// UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════════════
function formatNumber(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toLocaleString();
}

function formatMoney(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(2);
}

function randomChoice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateSongName(topic) {
  const parts = SONG_NAME_PARTS[topic];
  return randomChoice(parts.prefixes) + ' ' + randomChoice(parts.suffixes);
}

function getQualityGrade(quality) {
  if (quality >= 90) return 'S';
  if (quality >= 75) return 'A';
  if (quality >= 60) return 'B';
  if (quality >= 45) return 'C';
  if (quality >= 30) return 'D';
  return 'F';
}

// ═══════════════════════════════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════════════════════════════
function saveGame() {
  gameState.lastSave = Date.now();
  localStorage.setItem('rapperTycoonV2', JSON.stringify(gameState));
}

function loadGame() {
  const saved = localStorage.getItem('rapperTycoonV2');
  if (saved) {
    const loaded = JSON.parse(saved);
    gameState = { ...defaultState, ...loaded };
    
    // Calculate offline progress (50% efficiency)
    const offlineTime = (Date.now() - gameState.lastUpdate) / 1000;
    if (offlineTime > 0 && gameState.streamIncomePerSec > 0) {
      const offlineEarnings = (gameState.streamIncomePerSec + gameState.merchIncomePerSec) * offlineTime * 0.5;
      gameState.balance += offlineEarnings;
    }
    
    gameState.lastUpdate = Date.now();
    gameState.displayBalance = gameState.balance;
    gameState.displayFans = gameState.fans;
    
    applyVisualUpgrades();
    return true;
  }
  return false;
}

function resetGame() {
  if (confirm('Reset all progress? This cannot be undone!')) {
    localStorage.removeItem('rapperTycoonV2');
    location.reload();
  }
}

// CALENDAR WIDGET
// ═══════════════════════════════════════════════════════════════
function renderCalendarWidget() {
  // Map game days to a fake calendar starting Jan 1
  const startDate = new Date(2026, 0, 1); // Jan 1 2026
  const currentDate = new Date(startDate);
  currentDate.setDate(currentDate.getDate() + gameState.gameDay - 1);
  
  const month = currentDate.toLocaleString('en', { month: 'long' });
  const year = currentDate.getFullYear();
  const todayDate = currentDate.getDate();
  
  // Get first day and total days of current month
  const firstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
  const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  
  // Days of week header
  const dayLabels = ['S','M','T','W','T','F','S'].map(d => 
    `<div class="cal-day-label">${d}</div>`
  ).join('');
  
  // Day grid
  let daysHtml = '';
  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    daysHtml += '<div class="cal-day"></div>';
  }
  
  // Some fake event days based on game progress
  const eventDays = new Set();
  if (gameState.releasedSongs.length > 0) eventDays.add(Math.min(todayDate + 2, daysInMonth));
  if (gameState.contract) eventDays.add(Math.min(todayDate + 5, daysInMonth));
  if (gameState.fans > 5000) eventDays.add(Math.min(todayDate + 7, daysInMonth));
  
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === todayDate;
    const hasEvent = eventDays.has(d);
    daysHtml += `<div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}">${d}</div>`;
  }
  
  // Upcoming events
  const events = [];
  if (gameState.releasedSongs.length > 0) {
    events.push({ color: '#1DB954', text: 'Release day promo' });
  }
  if (gameState.contract) {
    events.push({ color: '#FFD700', text: `${gameState.contract.label} deadline` });
  }
  if (gameState.fans > 5000) {
    events.push({ color: '#E1306C', text: 'Fan meetup' });
  }
  if (events.length === 0) {
    events.push({ color: '#555', text: 'No upcoming events' });
  }
  
  const eventsHtml = events.slice(0, 3).map(e => `
    <div class="cal-event">
      <div class="cal-event-dot" style="background:${e.color}"></div>
      <span class="cal-event-text">${e.text}</span>
    </div>
  `).join('');
  
  return `
    <div class="calendar-widget">
      <div class="cal-header">
        <span class="cal-month">${month} ${year}</span>
      </div>
      <div class="cal-grid">
        ${dayLabels}
        ${daysHtml}
      </div>
      <div class="cal-events">
        ${eventsHtml}
      </div>
    </div>
  `;
}

function openApp(appName) {
  const screen = document.getElementById('osScreen');
  
  // Remove existing windows
  screen.querySelectorAll('.app-window').forEach(w => w.remove());
  
  const window = document.createElement('div');
  window.className = 'app-window active';
  
  let content = '';
  let title = '';
  
  switch (appName) {
    case 'mlstudio':
      title = '🥕 ML Studio';
      content = renderMLStudio();
      break;
    case 'spootify':
      title = '🎧 Spootify';
      content = renderSpootify();
      break;
    case 'z':
      title = '𝕏 Z';
      content = renderZ();
      break;
    case 'mikeazon':
      title = '📦 Mikeazon';
      content = renderMikeazon();
      break;
    case 'merchdrop':
      title = '👕 MerchDrop';
      content = renderMerchDrop();
      break;
    case 'contracts':
      title = '📁 Contracts';
      content = renderContracts();
      break;
    case 'dms':
      title = `💬 DMs ${gameState.dms.length > 0 ? `(${gameState.dms.length})` : ''}`;
      content = renderDMs();
      break;
    case 'settings':
      title = '⚙️ Settings';
      content = renderSettings();
      break;
  }
  
  window.innerHTML = `
    <div class="app-header">
      <div class="window-controls">
        <button class="window-btn window-close clickable"></button>
        <button class="window-btn window-minimize clickable"></button>
        <button class="window-btn window-maximize clickable"></button>
      </div>
      <span class="app-title">${title}</span>
    </div>
    <div class="app-content">${content}</div>
  `;
  
  screen.appendChild(window);
  
  // Close button
  window.querySelector('.window-close')?.addEventListener('click', () => {
    window.classList.remove('active');
    setTimeout(() => window.remove(), 200);
    // Stop rhythm game if closing beatmaker
    if (appName === 'mlstudio') {
      stopRhythmGame();
    }
  });
  
  // Bind app-specific events
  bindAppEvents(appName, window);
}

function bindAppEvents(appName, window) {
  switch (appName) {
    case 'mlstudio':
      window.querySelector('#startSongBtn')?.addEventListener('click', startRhythmGame);
      window.querySelector('#sleepBtn')?.addEventListener('click', sleepEnergy);
      window.querySelector('#releaseNowBtn')?.addEventListener('click', releaseCurrentSong);
      window.querySelector('#saveLaterBtn')?.addEventListener('click', saveCurrentSong);
      break;
      
    case 'spootify':
      window.querySelectorAll('.release-btn').forEach(btn => {
        btn.addEventListener('click', () => releaseSong(btn.dataset.song));
      });
      break;
      
    case 'z':
      window.querySelector('#postBtn')?.addEventListener('click', makePost);
      window.querySelector('#postBtn2')?.addEventListener('click', makePost);
      break;
      
    case 'mikeazon':
      window.querySelectorAll('.mikeazon-buy-btn').forEach(btn => {
        btn.addEventListener('click', () => buyUpgrade(btn.dataset.upgrade));
      });
      break;
      
    case 'merchdrop':
      window.querySelector('#createMerchBtn')?.addEventListener('click', createMerch);
      break;
      
    case 'dms':
      window.querySelectorAll('.dm-choice').forEach(btn => {
        btn.addEventListener('click', () => handleDM(parseInt(btn.dataset.dm), btn.dataset.choice));
      });
      break;
    
    case 'settings':
      window.querySelectorAll('.settings-avatar-option').forEach(el => {
        el.addEventListener('click', () => {
          const av = AVATARS.find(a => a.id === el.dataset.avatarId);
          if (!av) return;
          gameState.avatar = av.id;
          gameState.avatarSvg = av.svg;
          saveGame();
          openApp('settings'); // re-render
        });
      });
      break;
  }
}

// ═══════════════════════════════════════════════════════════════
// RHYTHM GAME
// ═══════════════════════════════════════════════════════════════
function startRhythmGame() {
  if (gameState.energy < 20) return;
  
  gameState.energy -= 20;
  
  const topic = document.getElementById('songTopic')?.value || 'flex';
  const style = document.getElementById('songStyle')?.value || 'trap';
  const songName = generateSongName(topic);
  
  rhythmGame = {
    active: true,
    topic,
    style,
    songName,
    beats: [],
    currentBeat: 0,
    totalBeats: 14,
    perfect: 0,
    good: 0,
    miss: 0,
    beatSpeed: 2000, // faster base speed
  };
  
  // Update UI
  document.getElementById('songTitleGen').textContent = `"${songName}"`;
  document.getElementById('beatmakerSetup').style.display = 'none';
  document.getElementById('rhythmGame').classList.add('active');
  document.getElementById('songResult').classList.remove('active');
  
  // Reset counters
  document.getElementById('perfectCount').textContent = '0';
  document.getElementById('goodCount').textContent = '0';
  document.getElementById('missCount').textContent = '0';
  
  // Create progress dots
  const progressEl = document.getElementById('rhythmProgress');
  if (progressEl) progressEl.innerHTML = Array(rhythmGame.totalBeats).fill('<div class="rhythm-progress-dot"></div>').join('');
  
  // Start spawning beats with varying rhythm patterns
  let beatsSpawned = 0;
  // Different rhythm patterns: gaps in ms between beats
  const patterns = [
    [400, 400, 800, 400, 400, 800, 300, 300, 300, 900, 400, 600, 500, 700], // syncopated
    [500, 500, 500, 300, 300, 800, 400, 400, 600, 600, 350, 350, 700, 500], // swing
    [300, 700, 300, 700, 500, 500, 400, 400, 300, 300, 800, 400, 600, 400], // offbeat
  ];
  const pattern = patterns[Math.floor(Math.random() * patterns.length)];
  
  function spawnNextBeat() {
    if (beatsSpawned >= rhythmGame.totalBeats || !rhythmGame.active) return;
    spawnBeat();
    beatsSpawned++;
    if (beatsSpawned < rhythmGame.totalBeats) {
      setTimeout(spawnNextBeat, pattern[beatsSpawned % pattern.length]);
    }
  }
  spawnNextBeat();
  
  // Input handlers
  document.addEventListener('keydown', handleRhythmInput);
  document.getElementById('rhythmTrack')?.addEventListener('click', handleRhythmInput);
}

function spawnBeat() {
  const track = document.getElementById('rhythmTrack');
  if (!track) return;
  
  const beat = document.createElement('div');
  beat.className = 'beat-marker';
  beat.dataset.id = Date.now() + '_' + Math.random();
  
  // Random vertical lane (5 lanes matching piano keys)
  const lanes = [10, 28, 46, 64, 82]; // % from top
  const colors = [
    'linear-gradient(90deg, #5a9fd4, #4a8bc2)',
    'linear-gradient(90deg, #d45a5a, #c24a4a)',
    'linear-gradient(90deg, #5ad4a0, #4ac28a)',
    'linear-gradient(90deg, #d4b85a, #c2a64a)',
    'linear-gradient(90deg, #9d5ad4, #8a4ac2)',
  ];
  const laneIdx = Math.floor(Math.random() * lanes.length);
  beat.style.top = lanes[laneIdx] + '%';
  beat.style.background = colors[laneIdx];
  
  // Start from right edge
  const trackWidth = track.offsetWidth;
  beat.style.left = trackWidth + 'px';
  
  track.appendChild(beat);
  rhythmGame.beats.push({
    element: beat,
    id: beat.dataset.id,
    hit: false
  });
  
  // Animate left across track
  const startTime = performance.now();
  const startX = trackWidth;
  const endX = -60;
  const playheadX = 80; // matches .hit-zone left
  
  const animate = () => {
    if (!rhythmGame.active) {
      beat.remove();
      return;
    }
    
    const elapsed = performance.now() - startTime;
    const progress = elapsed / rhythmGame.beatSpeed;
    const x = startX + (endX - startX) * progress;
    
    if (x < endX) {
      // Missed — went past left edge
      const b = rhythmGame.beats.find(b => b.id === beat.dataset.id);
      if (b && !b.hit) {
        recordHit('miss');
      }
      beat.remove();
      return;
    }
    
    beat.style.left = x + 'px';
    requestAnimationFrame(animate);
  };
  
  requestAnimationFrame(animate);
}

function handleRhythmInput(e) {
  if (!rhythmGame.active) return;
  if (e.type === 'keydown' && e.code !== 'Space') return;
  if (e.type === 'keydown') e.preventDefault();
  
  const playheadX = 80; // matches .hit-zone left in CSS
  
  // Find closest unhit beat near the playhead
  let closestBeat = null;
  let closestDist = Infinity;
  
  rhythmGame.beats.forEach(b => {
    if (b.hit) return;
    const beatLeft = parseFloat(b.element.style.left) || 0;
    const beatCenter = beatLeft + 25; // half of 50px width
    const dist = Math.abs(beatCenter - playheadX);
    
    if (dist < 60 && dist < closestDist) {
      closestDist = dist;
      closestBeat = b;
    }
  });
  
  if (closestBeat) {
    closestBeat.hit = true;
    
    if (closestDist < 15) {
      recordHit('perfect');
    } else if (closestDist < 35) {
      recordHit('good');
    } else {
      recordHit('miss');
    }
    
    closestBeat.element.remove();
  }
}

function recordHit(type) {
  const track = document.getElementById('rhythmTrack');
  
  if (type === 'perfect') {
    rhythmGame.perfect++;
    document.getElementById('perfectCount').textContent = rhythmGame.perfect;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-perfect');
    showHitFeedback('PERFECT!', 'perfect');
  } else if (type === 'good') {
    rhythmGame.good++;
    document.getElementById('goodCount').textContent = rhythmGame.good;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-good');
    showHitFeedback('GOOD', 'good');
  } else {
    rhythmGame.miss++;
    document.getElementById('missCount').textContent = rhythmGame.miss;
    track?.classList.remove('flash-perfect', 'flash-good', 'flash-miss');
    void track?.offsetWidth;
    track?.classList.add('flash-miss');
    showHitFeedback('MISS', 'miss');
  }
  
  // Update progress
  rhythmGame.currentBeat++;
  const dots = document.querySelectorAll('.rhythm-progress-dot');
  if (dots[rhythmGame.currentBeat - 1]) {
    dots[rhythmGame.currentBeat - 1].classList.add(type === 'perfect' ? 'hit' : type);
  }
  
  // Check if done
  if (rhythmGame.currentBeat >= rhythmGame.totalBeats) {
    setTimeout(finishRhythmGame, 500);
  }
}

function showHitFeedback(text, type) {
  const track = document.getElementById('rhythmTrack');
  if (!track) return;
  
  const feedback = document.createElement('div');
  feedback.className = `hit-feedback ${type}`;
  feedback.textContent = text;
  track.appendChild(feedback);
  
  setTimeout(() => feedback.remove(), 500);
}

function finishRhythmGame() {
  rhythmGame.active = false;
  document.removeEventListener('keydown', handleRhythmInput);
  
  // Calculate quality
  const baseQuality = (rhythmGame.perfect * 3 + rhythmGame.good * 1 - rhythmGame.miss * 2);
  const maxQuality = rhythmGame.totalBeats * 3;
  const performanceRatio = Math.max(0, baseQuality) / maxQuality;
  
  // Apply stat multipliers
  const statMultiplier = 1 + ((gameState.bars + gameState.flow + gameState.production) / 300);
  const quality = Math.min(100, Math.max(10, Math.round(performanceRatio * 100 * statMultiplier)));
  const grade = getQualityGrade(quality);
  
  // Store current song
  rhythmGame.currentSong = {
    name: rhythmGame.songName,
    topic: rhythmGame.topic,
    style: rhythmGame.style,
    quality,
    grade,
    created: Date.now()
  };
  
  // Show result
  document.getElementById('rhythmGame').classList.remove('active');
  document.getElementById('songResult').classList.add('active');
  
  const gradeEl = document.getElementById('resultGrade');
  gradeEl.textContent = grade;
  gradeEl.className = `result-grade ${grade}`;
  
  document.getElementById('resultSongName').textContent = rhythmGame.songName;
  document.getElementById('resultQuality').textContent = quality;
  
  const estStreams = Math.floor((quality / 100) * (1 + gameState.fans / 1000) * 50);
  document.getElementById('resultStreams').textContent = `~${formatNumber(estStreams)}`;
  
  document.getElementById('resultBreakdown').innerHTML = `
    <span class="perfect">✨ ${rhythmGame.perfect} Perfect</span>
    <span class="good">👍 ${rhythmGame.good} Good</span>
    <span class="miss">❌ ${rhythmGame.miss} Miss</span>
  `;
}

function stopRhythmGame() {
  rhythmGame.active = false;
  clearInterval(rhythmGame.spawnInterval);
  document.removeEventListener('keydown', handleRhythmInput);
}

function releaseCurrentSong() {
  if (!rhythmGame.currentSong) return;
  if (gameState.energy < 10) { alert('Not enough energy to release! (10⚡)'); return; }
  gameState.energy -= 10;
  
  const song = rhythmGame.currentSong;
  song.streams = 0;
  song.releaseDate = Date.now();
  gameState.releasedSongs.push(song);
  
  // Fan boost (boosted rates)
  let fanBoost = Math.floor(song.quality * (gameState.hype / 100) * 15 + 50);
  if (gameState.contract) {
    fanBoost = Math.floor(fanBoost * gameState.contract.promoMultiplier);
    gameState.contract.songsRemaining--;
    
    // Check if contract ended
    if (gameState.contract.songsRemaining <= 0) {
      gameState.dms.push({
        type: 'notification',
        sender: `🏢 ${gameState.contract.label}`,
        text: `Your contract with us has ended. You\'re now independent! Keep grinding.`,
        positive: true
      });
      gameState.contract = null;
    }
  }
  
  gameState.fans += fanBoost;
  gameState.hype = Math.min(100, gameState.hype + 8);
  
  rhythmGame.currentSong = null;
  
  recalculateIncome();
  checkMilestoneEvents();
  saveGame();
  
  openApp('spootify');
}

function saveCurrentSong() {
  if (!rhythmGame.currentSong) return;
  
  gameState.songs.push(rhythmGame.currentSong);
  rhythmGame.currentSong = null;
  
  checkMilestoneEvents();
  saveGame();
  
  // Reset ML Studio
  document.getElementById('beatmakerSetup').style.display = 'flex';
  document.getElementById('songResult').classList.remove('active');
  document.getElementById('songTitleGen').textContent = '';
  
  openApp('mlstudio');
}

function handleDM(dmIndex, choice) {
  const dm = gameState.dms[dmIndex];
  if (!dm) return;
  
  if (dm.type === 'contract') {
    if (choice === 'sign') {
      gameState.contract = {
        label: dm.label,
        songsRemaining: dm.songs,
        songsTotal: dm.songs,
        cut: dm.cut,
        promoMultiplier: dm.promoMultiplier
      };
      gameState.balance += dm.upfront;
    }
    // Mark as triggered so it doesn't show again
    const eventKey = Object.keys(MILESTONE_EVENTS).find(k => {
      const e = MILESTONE_EVENTS[k].event;
      return e.type === 'contract' && e.label === dm.label;
    });
    if (eventKey) gameState.triggeredEvents[eventKey] = true;
  } else if (dm.type === 'choice') {
    const choiceData = dm.choices[parseInt(choice)];
    if (choiceData?.effect) {
      Object.entries(choiceData.effect).forEach(([key, value]) => {
        gameState[key] = Math.max(0, gameState[key] + value);
      });
    }
  } else if (dm.type === 'notification' && dm.reward) {
    Object.entries(dm.reward).forEach(([key, value]) => {
      gameState[key] = Math.max(0, gameState[key] + value);
    });
  }
  
  gameState.dms.splice(dmIndex, 1);
  checkMilestones();
  saveGame();
  renderOS();
  
  if (gameState.dms.length > 0) {
    openApp('dms');
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME TIME SYSTEM (1 real second = 10 game minutes)
// ═══════════════════════════════════════════════════════════════
const GAME_TIME_SPEED = 1; // 1 real second = 1 game minute

function getAvatarSvg() {
  if (gameState.avatarSvg) return gameState.avatarSvg;
  const found = AVATARS.find(a => a.id === gameState.avatar);
  return found ? found.svg : '🎵';
}

function formatMenuTime() {
  const totalMs = gameState.gameTimeMs;
  const totalMinutes = Math.floor(totalMs / (60 * 1000));
  let hours = Math.floor(totalMinutes / 60) % 24;
  const minutes = totalMinutes % 60;
  const ampm = hours >= 12 ? 'PM' : 'AM';
  const displayHours = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
  return `Day ${gameState.gameDay}  ·  ${displayHours}:${String(minutes).padStart(2, '0')} ${ampm}`;
}

function getGameTimeStr() {
  const totalMs = gameState.gameTimeMs;
  const totalMinutes = Math.floor(totalMs / (60 * 1000));
  let hours = Math.floor(totalMinutes / 60) % 24;
  const minutes = totalMinutes % 60;
  const ampm = hours >= 12 ? 'PM' : 'AM';
  const displayHours = hours === 0 ? 12 : hours > 12 ? hours - 12 : hours;
  return `Day ${gameState.gameDay} ${displayHours}:${String(minutes).padStart(2, '0')} ${ampm}`;
}

function advanceGameTime(realDeltaSec) {
  const gameMinutesElapsed = realDeltaSec * GAME_TIME_SPEED;
  gameState.gameTimeMs += gameMinutesElapsed * 60 * 1000;
  
  // Check for day rollover
  const totalHours = gameState.gameTimeMs / (60 * 60 * 1000);
  if (totalHours >= 24) {
    gameState.gameDay += Math.floor(totalHours / 24);
    gameState.gameTimeMs = gameState.gameTimeMs % (24 * 60 * 60 * 1000);
  }
}

  gameState.energy = 100;

  gameState.gameDay++;

}

// ═══════════════════════════════════════════════════════════════
// INCOME CALCULATION (boosted rates)
// ═══════════════════════════════════════════════════════════════
function recalculateIncome() {
  // Income is directly tied to stream rate: ~$0.004 per stream (like real Spotify)
  let streamIncome = 0;
  
  gameState.releasedSongs.forEach(song => {
    const streamRate = (song.quality / 100) * (1 + gameState.fans / 500) * 25;
    // $0.004 per stream
    streamIncome += streamRate * 0.004;
  });
  
  // Merch income
  let merchIncome = 0;
  if (gameState.merch.length > 0) {
    const merchSalesRate = gameState.merch.length * (gameState.fans / 5000) * 0.3;
    // ~$25 per merch item sold
    merchIncome = merchSalesRate * 25;
  }
  
  gameState.streamIncomePerSec = streamIncome;
  gameState.merchIncomePerSec = merchIncome;
}

// ═══════════════════════════════════════════════════════════════
// EVENT SYSTEM
// ═══════════════════════════════════════════════════════════════
function checkMilestoneEvents() {
  Object.entries(MILESTONE_EVENTS).forEach(([key, milestone]) => {
    if (milestone.trigger() && !gameState.triggeredEvents[key]) {
      gameState.triggeredEvents[key] = true;
      gameState.dms.push({ ...milestone.event });
      renderOS();
    }
  });
}

function checkMilestones() {
  Object.entries(MILESTONES).forEach(([id, m]) => {
    const achieved = m.fans ? gameState.fans >= m.fans : gameState.totalStreams >= m.streams;
    if (!gameState.triggeredEvents[`milestone_${id}`] && achieved) {
      gameState.triggeredEvents[`milestone_${id}`] = true;
      showMilestone(m);
    }
  });
}

function showMilestone(milestone) {
  const popup = document.getElementById('milestonePopup');
  document.getElementById('milestoneIcon').textContent = milestone.icon;
  document.getElementById('milestoneTitle').textContent = milestone.title;
  document.getElementById('milestoneDesc').textContent = milestone.desc;
  
  popup.classList.add('active');
  spawnConfetti();
  
  document.getElementById('milestoneClose')?.addEventListener('click', () => {
    popup.classList.remove('active');
  });
  
  setTimeout(() => popup.classList.remove('active'), 4000);
}

function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#ff8e3d', '#1DB954', '#E1306C', '#FFD700', '#8B5CF6', '#00d4ff'];
  
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.background = randomChoice(colors);
      confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
      confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
      container.appendChild(confetti);
      setTimeout(() => confetti.remove(), 4000);
    }, i * 25);
  }
}

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
function gameLoop() {
  const now = Date.now();
  const delta = (now - gameState.lastUpdate) / 1000;
  gameState.lastUpdate = now;
  
  // Advance game time
  advanceGameTime(delta);
  
  // Income
  const labelCut = gameState.contract ? (gameState.streamIncomePerSec * (gameState.contract.cut / 100)) : 0;
  const netIncome = gameState.streamIncomePerSec + gameState.merchIncomePerSec - labelCut;
  gameState.balance += netIncome * delta;
  
  // Stream counts (boosted)
  gameState.releasedSongs.forEach(song => {
    const streamRate = (song.quality / 100) * (1 + gameState.fans / 500) * 25;
    song.streams = (song.streams || 0) + streamRate * delta;
    gameState.totalStreams += streamRate * delta;
  });
  
  // Merch sales (boosted)
  gameState.merch.forEach(m => {
    m.sales = (m.sales || 0) + (gameState.fans / 5000) * delta * 0.3;
  });
  
  // Hype decay
  gameState.hype = Math.max(0, gameState.hype - 0.003 * delta);
  
  // No passive energy regen — must sleep to recover
  
  // Smooth display values
  gameState.displayBalance += (gameState.balance - gameState.displayBalance) * 0.15;
  gameState.displayFans += (gameState.fans - gameState.displayFans) * 0.15;
  
  // Real-time UI updates
  const menuBalanceEl = document.getElementById('menuBalance');
  if (menuBalanceEl) menuBalanceEl.textContent = formatMoney(gameState.displayBalance);
  
  const bankBalanceEl = document.querySelector('.bank-balance-value');
  if (bankBalanceEl) bankBalanceEl.textContent = formatMoney(gameState.displayBalance);
  
  const fansEl = document.getElementById('dockFans');
  if (fansEl) fansEl.textContent = formatNumber(Math.floor(gameState.displayFans));
  
  const hypeEl = document.getElementById('dockHype');
  if (hypeEl) hypeEl.textContent = Math.round(gameState.hype);
  
  const energyEl = document.getElementById('dockEnergy');
  if (energyEl) energyEl.textContent = Math.round(gameState.energy);
  
  // Update game clock
  const timeEl = document.getElementById('menuTime');
  if (timeEl) timeEl.textContent = formatMenuTime();
  
  // Update wall clock hands
  const totalMinutes = gameState.gameTimeMs / 60000;
  const hours = totalMinutes / 60;
  const mins = totalMinutes % 60;
  const hourHand = document.getElementById('clockHour');
  const minHand = document.getElementById('clockMinute');
  if (hourHand) hourHand.style.transform = `translateX(-50%) rotate(${(hours % 12) * 30 + mins * 0.5}deg)`;
  if (minHand) minHand.style.transform = `translateX(-50%) rotate(${mins * 6}deg)`;
  
  // Check events
  checkMilestoneEvents();
  checkMilestones();
  
  // Auto-save
  if (now - gameState.lastSave > 10000) {
    saveGame();
  }
  
  requestAnimationFrame(gameLoop);
}

function bootSequence() {
  const screen = document.getElementById('osScreen');
  if (!screen) return;
  
  // Show boot animation — MikeBook Pro with ML monogram
  screen.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#000;">
      <img src="../logo.svg" style="width:48px;height:48px;opacity:0.7;margin-bottom:18px;" alt="ML">
      <div style="font-size:0.7rem;color:#555;font-family:'Space Grotesk',monospace;letter-spacing:0.5px;margin-bottom:10px;">MikeBook Pro</div>
      <div style="width:200px;height:3px;background:#222;border-radius:2px;overflow:hidden;">
        <div style="width:0%;height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s;" id="bootBar"></div>
      </div>
      <div style="font-size:0.6rem;color:#444;font-family:'Space Grotesk',monospace;margin-top:10px;" id="bootText">Booting RapperOS...</div>
    </div>
  `;
  
  const bar = document.getElementById('bootBar');
  const text = document.getElementById('bootText');
  
  const isReturning = !!gameState.rapperName;
  const steps = isReturning
    ? [
        [20, 'Loading kernel...'],
        [40, 'Mounting beats...'],
        [60, 'Initializing ML Studio...'],
        [80, 'Loading your tracks...'],
        [100, `Welcome back, ${gameState.rapperName}.`],
      ]
    : [
        [25, 'Loading kernel...'],
        [50, 'Mounting beats...'],
        [75, 'First time? Setting up...'],
        [100, 'Ready.'],
      ];
  
  steps.forEach(([pct, msg], i) => {
    setTimeout(() => {
      if (bar) bar.style.width = pct + '%';
      if (text) text.textContent = msg;
      if (pct === 100) {
        setTimeout(() => {
          if (isReturning) {
            renderOS();
            applyVisualUpgrades();
          } else {
            showLoginScreen();
          }
        }, 400);
      }
    }, (i + 1) * 350);
  });
}

function showLoginScreen() {
  const screen = document.getElementById('osScreen');
  if (!screen) return;
  
  let selectedAvatar = AVATARS[0];
  
  screen.innerHTML = `
    <div class="login-screen">
      <div class="login-selected-avatar" id="loginBigAvatar">${selectedAvatar.svg}</div>
      <div class="login-avatar-row" id="avatarRow">
        ${AVATARS.map((a, i) => `<div class="login-avatar clickable ${i === 0 ? 'selected' : ''}" data-avatar-idx="${i}">${a.svg}</div>`).join('')}
      </div>
      <div class="login-fields">
        <input class="login-input" id="loginName" type="text" placeholder="Rapper name" maxlength="20" autocomplete="off" spellcheck="false">
        <input class="login-input" id="loginPass" type="password" placeholder="Password" autocomplete="off">
        <button class="login-btn clickable" id="loginBtn" disabled>Log In</button>
      </div>
    </div>
  `;
  
  const nameInput = screen.querySelector('#loginName');
  const passInput = screen.querySelector('#loginPass');
  const loginBtn = screen.querySelector('#loginBtn');
  const bigAvatar = screen.querySelector('#loginBigAvatar');
  
  // Avatar selection
  screen.querySelectorAll('.login-avatar').forEach(el => {
    el.addEventListener('click', () => {
      screen.querySelectorAll('.login-avatar').forEach(a => a.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = AVATARS[parseInt(el.dataset.avatarIdx)];
      bigAvatar.innerHTML = selectedAvatar.svg;
    });
  });
  
  // Enable button when name is filled
  nameInput.addEventListener('input', () => {
    loginBtn.disabled = !nameInput.value.trim();
  });
  
  // Enter key on password field triggers login
  passInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && nameInput.value.trim()) doLogin();
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') passInput.focus();
  });
  
  loginBtn.addEventListener('click', doLogin);
  
  // Auto-focus name input
  setTimeout(() => nameInput.focus(), 100);
  
  function doLogin() {
    const name = nameInput.value.trim();
    if (!name) return;
    
    gameState.rapperName = name;
    gameState.avatar = selectedAvatar.id;
    gameState.avatarSvg = selectedAvatar.svg;
    saveGame();
    
    // Brief "logging in" animation
    screen.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;background:#000;">
        <div style="width:64px;height:64px;margin-bottom:12px;">${selectedAvatar.svg}</div>
        <div style="font-size:0.9rem;color:var(--parchment);font-weight:500;">Welcome, ${name}.</div>
        <div style="font-size:0.6rem;color:#444;margin-top:8px;">Loading desktop...</div>
      </div>
    `;
    
    setTimeout(() => {
      renderOS();
      applyVisualUpgrades();
    }, 800);
  }
}

function init() {
  const hadSave = loadGame();
  recalculateIncome();
  bootSequence();
  requestAnimationFrame(gameLoop);
}

document.addEventListener('DOMContentLoaded', init);
</script>
