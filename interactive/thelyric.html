<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lyric — ML</title>
<link rel="icon" href="../img/all/ml.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'din-2014-rounded-variable';
    src: url('../fonts/din-2014-rounded-variable.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #06060a;
    font-family: 'Space Grotesk', sans-serif;
    color: #e0e0e0;
    cursor: url('../img/all/cursor.svg') 4 4, default;
  }
  a, button, [role="button"] {
    cursor: url('../img/all/crosshair.svg') 12 12, pointer;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .header a {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .header img {
    width: 32px; height: 32px;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .header img:hover { opacity: 1; }
  .title-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
    transition: opacity 1.5s ease;
  }
  .title-overlay.hidden { opacity: 0; }
  .title-overlay h1 {
    font-family: 'din-2014-rounded-variable', 'Space Grotesk', sans-serif;
    font-size: clamp(36px, 8vw, 72px);
    font-weight: 700;
    color: #c4a35a;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .title-overlay p {
    font-size: 14px;
    color: rgba(196,163,90,0.5);
    margin-top: 8px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .controls {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .play-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(196,163,90,0.4);
    background: rgba(196,163,90,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(4px);
  }
  .play-btn:hover {
    background: rgba(196,163,90,0.15);
    border-color: rgba(196,163,90,0.7);
  }
  .play-btn svg {
    width: 16px; height: 16px;
    fill: rgba(196,163,90,0.8);
  }
  .play-btn .pause-icon { display: none; }
  .play-btn.playing .play-icon { display: none; }
  .play-btn.playing .pause-icon { display: block; }
  .song-info {
    font-size: 11px;
    color: rgba(196,163,90,0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .footer {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-size: 9px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="header">
  <a href="../index.html">
    <img src="../img/all/ml.svg" alt="ML">
  </a>
</div>

<div class="title-overlay" id="titleOverlay">
  <h1>The Lyric</h1>
  <p>lyrics visualizer</p>
</div>

<div class="controls">
  <button class="play-btn" id="playBtn">
    <svg class="play-icon" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
    <svg class="pause-icon" viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12" rx="0.5"/><rect x="9.5" y="2" width="3.5" height="12" rx="0.5"/></svg>
  </button>
  <div class="song-info">Limits &middot; Fucius</div>
</div>

<div class="footer">ML &middot; 2025</div>

<audio id="audio" preload="auto" src="../img/all/Limits.mp3"></audio>

<script>
(function() {
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  var titleOverlay = document.getElementById('titleOverlay');

  var W, H;
  var dpr = window.devicePixelRatio || 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Lyrics ---
  var lyrics = [
    { time: 0, text: "" },
    { time: 8, text: "Wondering if ima ever reach the ceiling" },
    { time: 11, text: "I don't fuck with critics" },
    { time: 12.5, text: "lemme tell you bout my limits" },
    { time: 14.5, text: "Flexing on your former brethren" },
    { time: 16, text: "just ain't appealing" },
    { time: 17.5, text: "I'm feeling the heat that I'm concealing" },
    { time: 20, text: "is a light jab" },
    { time: 21.5, text: "Controversy gonna follow when you like that" },
    { time: 24, text: "Tryna tell me what the key is" },
    { time: 25.5, text: "you can type that" },
    { time: 27, text: "If that's how ima make it thrilling" },
    { time: 28.5, text: "then I'm Mike Jack" },
    { time: 30, text: "When I'm talking bout a plug" },
    { time: 31.5, text: "I mean the mic jack" },
    { time: 33, text: "Punching in to bring the action" },
    { time: 34.5, text: "like it's IMAX" },
    { time: 36, text: "If they sleeping on the sound" },
    { time: 37.5, text: "then it's night class" },
    { time: 39, text: "Try and break the stride" },
    { time: 40.5, text: "then I'll put you in a nice cast" },
    { time: 42, text: "If I'm blowing up in Texas" },
    { time: 43.5, text: "then I'm like Dak" },
    { time: 45, text: "Push me to the ground" },
    { time: 46, text: "and I'm right back" },
    { time: 47, text: "Never scared to fight back" },
    { time: 48.5, text: "South Beach is where the lights at" },
    { time: 50, text: "I'm going blind from the bright flash" },
    { time: 52, text: "I cross the strip like a live match" },
    { time: 53.5, text: "Watch me fly past" },
    { time: 55, text: "these up and comers are plain" },
    { time: 57, text: "Scared to navigate the scene" },
    { time: 58.5, text: "but I know the terrain" },
    { time: 60, text: "Getting dirty in the game" },
    { time: 61, text: "it's official" },
    { time: 62.5, text: "Never fold bring it home for the gold" },
    { time: 64, text: "like I'm Kittle" },
    { time: 65, text: "For my dogs got the kibble" },
    { time: 66.5, text: "I haven't been writing" },
    { time: 67.5, text: "I just scribble" },
    { time: 69, text: "They yelling at me Mike drop" },
    { time: 70.5, text: "I don't ever tote a gun" },
    { time: 72, text: "But the bump stock is beneficial" },
    { time: 74, text: "for the hitmen" },
    { time: 75, text: "Catch me writing lines" },
    { time: 76.5, text: "I'm live when I'm in Whitman" },
    { time: 78, text: "All about that wine and dine" },
    { time: 79.5, text: "I'm too lit man" },
    { time: 81, text: "I may not align with times" },
    { time: 82.5, text: "but who's ticking" },
    { time: 84, text: "Tick tick tick tick tick" },
    { time: 86, text: "Pyromaniacs craniums get elated" },
    { time: 88, text: "when I'm spitting" },
    { time: 89, text: "Gassing me up I'm filling up" },
    { time: 91, text: "for the mission" },
    { time: 92, text: "Money's a plus but not the sum" },
    { time: 94, text: "an addition" },
    { time: 95.5, text: "Admiration when I'm static" },
    { time: 97, text: "You know my image holographic" },
    { time: 99, text: "limited edition" }
  ];

  // --- Audio analysis ---
  var audioCtx = null;
  var analyser = null;
  var freqData = null;
  var isPlaying = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var src = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  }

  function getBass() {
    if (!analyser || !freqData) return 0;
    analyser.getByteFrequencyData(freqData);
    var sum = 0;
    for (var i = 0; i < 10; i++) sum += freqData[i];
    return sum / (10 * 255);
  }
  function getMid() {
    if (!analyser || !freqData) return 0;
    var sum = 0;
    for (var i = 10; i < 60; i++) sum += freqData[i];
    return sum / (50 * 255);
  }
  function getHigh() {
    if (!analyser || !freqData) return 0;
    var sum = 0;
    var count = freqData.length - 60;
    if (count <= 0) return 0;
    for (var i = 60; i < freqData.length; i++) sum += freqData[i];
    return sum / (count * 255);
  }

  // --- Mouse ---
  var mouseX = -9999, mouseY = -9999;
  var mouseActive = false;
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    mouseActive = true;
  });
  document.addEventListener('mouseleave', function() {
    mouseActive = false;
    mouseX = -9999;
    mouseY = -9999;
  });

  // --- Particle classes ---
  // Active lyric particles
  var particles = [];
  // Dying particles (old lyric dissolving)
  var dyingParticles = [];
  // Background dust
  var dustParticles = [];
  // Idle title particles
  var idleParticles = [];

  var FONT_SIZE = 28;
  var DUST_SIZE = 8;
  var MOUSE_RADIUS = 120;
  var MOUSE_FORCE = 8;

  function measureText(text, fontSize) {
    ctx.font = fontSize + 'px Georgia, serif';
    var widths = [];
    var total = 0;
    for (var i = 0; i < text.length; i++) {
      var w = ctx.measureText(text[i]).width;
      widths.push(w);
      total += w;
    }
    return { widths: widths, total: total };
  }

  function createParticlesForText(text, fontSize) {
    if (!text || text.length === 0) return [];
    var m = measureText(text, fontSize);
    var startX = (W - m.total) / 2;
    var baseY = H / 2;
    var arr = [];
    var cx = startX;
    for (var i = 0; i < text.length; i++) {
      var targetX = cx + m.widths[i] / 2;
      var targetY = baseY;
      // Spawn from random position
      var angle = Math.random() * Math.PI * 2;
      var dist = 200 + Math.random() * 300;
      var p = {
        x: targetX + Math.cos(angle) * dist,
        y: targetY + Math.sin(angle) * dist,
        targetX: targetX,
        targetY: targetY,
        vx: 0,
        vy: 0,
        char: text[i],
        opacity: 0,
        scale: 1,
        fontSize: fontSize,
        delay: i * 0.015, // stagger
        age: 0,
        arrived: false
      };
      arr.push(p);
      cx += m.widths[i];
    }
    return arr;
  }

  function createIdleParticles() {
    var title = "LIMITS";
    var m = measureText(title, 48);
    var startX = (W - m.total) / 2;
    var baseY = H / 2;
    idleParticles = [];
    var cx = startX;
    for (var i = 0; i < title.length; i++) {
      var tx = cx + m.widths[i] / 2;
      var ty = baseY;
      idleParticles.push({
        x: tx + (Math.random() - 0.5) * 60,
        y: ty + (Math.random() - 0.5) * 60,
        targetX: tx,
        targetY: ty,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        char: title[i],
        opacity: 0.6,
        scale: 1,
        fontSize: 48,
        phase: Math.random() * Math.PI * 2
      });
      cx += m.widths[i];
    }
  }

  function initDust() {
    dustParticles = [];
    var chars = '·.·:·.·:·.';
    for (var i = 0; i < 80; i++) {
      dustParticles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
        char: chars[Math.floor(Math.random() * chars.length)],
        opacity: 0.04 + Math.random() * 0.06,
        fontSize: DUST_SIZE + Math.random() * 4
      });
    }
  }
  initDust();
  createIdleParticles();

  // --- Lyric tracking ---
  var currentLyricIndex = -1;
  var hasStarted = false;

  function getCurrentLyricIndex() {
    var t = audio.currentTime;
    var idx = -1;
    for (var i = 0; i < lyrics.length; i++) {
      if (t >= lyrics[i].time) idx = i;
      else break;
    }
    return idx;
  }

  function transitionToLyric(newIndex) {
    // Move current particles to dying
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var angle = Math.random() * Math.PI * 2;
      var speed = 2 + Math.random() * 5;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      // Add some spin tendency
      if (Math.random() > 0.5) {
        p.spinVx = (Math.random() - 0.5) * 3;
        p.spinVy = -1 - Math.random() * 3;
      }
      p.dying = true;
      p.fadeSpeed = 0.01 + Math.random() * 0.02;
      dyingParticles.push(p);
    }
    particles = [];

    var text = (newIndex >= 0 && newIndex < lyrics.length) ? lyrics[newIndex].text : "";
    if (text) {
      // Determine font size based on text length to fit screen
      var fs = FONT_SIZE;
      // Quick check: if text is long, shrink font
      ctx.font = fs + 'px Georgia, serif';
      var tw = ctx.measureText(text).width;
      var maxW = W * 0.85;
      if (tw > maxW) {
        fs = Math.floor(fs * (maxW / tw));
        if (fs < 16) fs = 16;
      }
      particles = createParticlesForText(text, fs);
    }
  }

  // --- Play/Pause ---
  playBtn.addEventListener('click', function() {
    initAudio();
    if (isPlaying) {
      audio.pause();
      isPlaying = false;
      playBtn.classList.remove('playing');
    } else {
      audio.play();
      isPlaying = true;
      playBtn.classList.add('playing');
      if (!hasStarted) {
        hasStarted = true;
        titleOverlay.classList.add('hidden');
        // Scatter idle particles
        for (var i = 0; i < idleParticles.length; i++) {
          var p = idleParticles[i];
          var angle = Math.random() * Math.PI * 2;
          p.vx = Math.cos(angle) * (3 + Math.random() * 5);
          p.vy = Math.sin(angle) * (3 + Math.random() * 5);
          p.dying = true;
          p.fadeSpeed = 0.015;
          dyingParticles.push(p);
        }
        idleParticles = [];
      }
    }
  });

  audio.addEventListener('ended', function() {
    isPlaying = false;
    playBtn.classList.remove('playing');
    currentLyricIndex = -1;
    // Dissolve remaining
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.vx = (Math.random() - 0.5) * 4;
      p.vy = (Math.random() - 0.5) * 4;
      p.dying = true;
      p.fadeSpeed = 0.008;
      dyingParticles.push(p);
    }
    particles = [];
  });

  // --- Bass tracking for pulse detection ---
  var prevBass = 0;
  var bassImpulse = 0;

  // --- Main loop ---
  var lastTime = 0;

  function frame(timestamp) {
    requestAnimationFrame(frame);

    var dt = Math.min((timestamp - lastTime) / 16.67, 3); // normalize to ~60fps
    if (lastTime === 0) dt = 1;
    lastTime = timestamp;

    // Audio data
    var bass = getBass();
    var mid = getMid();
    var high = getHigh();

    // Detect bass hit
    var bassDelta = bass - prevBass;
    if (bassDelta > 0.15) {
      bassImpulse = Math.min(bassDelta * 3, 1.5);
    }
    prevBass = bass;
    bassImpulse *= 0.92;

    // Check lyric changes
    if (isPlaying) {
      var idx = getCurrentLyricIndex();
      if (idx !== currentLyricIndex) {
        currentLyricIndex = idx;
        transitionToLyric(idx);
      }
    }

    // --- Draw ---
    // Motion blur clear
    ctx.fillStyle = 'rgba(6,6,10,0.18)';
    ctx.fillRect(0, 0, W, H);

    // Draw dust
    for (var i = 0; i < dustParticles.length; i++) {
      var d = dustParticles[i];
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      // Wrap around
      if (d.x < -10) d.x = W + 10;
      if (d.x > W + 10) d.x = -10;
      if (d.y < -10) d.y = H + 10;
      if (d.y > H + 10) d.y = -10;

      var dustOp = d.opacity + mid * 0.03;
      ctx.font = d.fontSize + 'px Georgia, serif';
      ctx.fillStyle = 'rgba(196,163,90,' + dustOp + ')';
      ctx.fillText(d.char, d.x, d.y);
    }

    // Draw idle particles (before play)
    if (!hasStarted) {
      var now = timestamp / 1000;
      for (var i = 0; i < idleParticles.length; i++) {
        var p = idleParticles[i];
        // Gentle drift around target
        var floatX = Math.sin(now * 0.5 + p.phase) * 15;
        var floatY = Math.cos(now * 0.3 + p.phase * 1.7) * 10;
        p.x += (p.targetX + floatX - p.x) * 0.02 * dt;
        p.y += (p.targetY + floatY - p.y) * 0.02 * dt;
        // Pulse opacity
        var pulse = 0.5 + 0.2 * Math.sin(now * 1.5 + p.phase);
        ctx.font = p.fontSize + 'px Georgia, serif';
        ctx.fillStyle = 'rgba(196,163,90,' + pulse + ')';
        ctx.shadowColor = 'rgba(196,163,90,0.15)';
        ctx.shadowBlur = 6;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.char, p.x, p.y);
        ctx.shadowBlur = 0;
      }
    }

    // Draw active particles
    var centerX = W / 2;
    var centerY = H / 2;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.age += dt / 60;

      // Wait for stagger delay
      if (p.age < p.delay) continue;

      // Fade in
      if (p.opacity < 1) {
        p.opacity = Math.min(p.opacity + 0.04 * dt, 1);
      }

      // Spring toward target
      var dx = p.targetX - p.x;
      var dy = p.targetY - p.y;
      p.vx += dx * 0.045 * dt;
      p.vy += dy * 0.045 * dt;

      // Damping
      p.vx *= Math.pow(0.85, dt);
      p.vy *= Math.pow(0.85, dt);

      // Bass impulse - push outward from center
      if (bassImpulse > 0.05) {
        var fromCenterX = p.targetX - centerX;
        var fromCenterY = p.targetY - centerY;
        var distFromCenter = Math.sqrt(fromCenterX * fromCenterX + fromCenterY * fromCenterY) || 1;
        p.vx += (fromCenterX / distFromCenter) * bassImpulse * 6 * dt;
        p.vy += (fromCenterY / distFromCenter) * bassImpulse * 6 * dt;
      }

      // High frequency jitter
      if (high > 0.1) {
        p.vx += (Math.random() - 0.5) * high * 2 * dt;
        p.vy += (Math.random() - 0.5) * high * 2 * dt;
      }

      // Mouse repulsion
      if (mouseActive) {
        var mx = p.x - mouseX;
        var my = p.y - mouseY;
        var mDist = Math.sqrt(mx * mx + my * my);
        if (mDist < MOUSE_RADIUS && mDist > 0) {
          var force = (1 - mDist / MOUSE_RADIUS) * MOUSE_FORCE;
          p.vx += (mx / mDist) * force * dt;
          p.vy += (my / mDist) * force * dt;
        }
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Distance from target for rendering
      var distToTarget = Math.sqrt(dx * dx + dy * dy);
      var nearTarget = Math.max(0, 1 - distToTarget / 100);

      // Brightness modulated by mid
      var brightness = 0.6 + nearTarget * 0.4 + mid * 0.2;
      var alpha = p.opacity * Math.min(brightness, 1);

      // Scale: slight enlargement on bass
      var s = 1 + bassImpulse * 0.15;

      ctx.font = Math.round(p.fontSize * s) + 'px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Glow when near target
      if (nearTarget > 0.3) {
        ctx.shadowColor = 'rgba(196,163,90,' + (nearTarget * 0.3) + ')';
        ctx.shadowBlur = 8 * nearTarget;
      }

      ctx.fillStyle = 'rgba(196,163,90,' + alpha.toFixed(3) + ')';
      ctx.fillText(p.char, p.x, p.y);
      ctx.shadowBlur = 0;
    }

    // Draw dying particles
    for (var i = dyingParticles.length - 1; i >= 0; i--) {
      var p = dyingParticles[i];
      if (p.spinVx !== undefined) {
        p.vx += p.spinVx * 0.01 * dt;
        p.vy += p.spinVy * 0.01 * dt;
      }
      p.vx *= Math.pow(0.97, dt);
      p.vy *= Math.pow(0.97, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.opacity -= (p.fadeSpeed || 0.015) * dt;

      if (p.opacity <= 0) {
        dyingParticles.splice(i, 1);
        continue;
      }

      var alpha = Math.max(0, p.opacity);
      ctx.font = (p.fontSize || FONT_SIZE) + 'px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(196,163,90,' + alpha.toFixed(3) + ')';
      ctx.fillText(p.char, p.x, p.y);
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
