<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <!-- mPod in cream/white like the actual app -->
  <g transform="translate(200,200) scale(1.2)">
    <!-- Body — cream like the iPod -->
    <rect x="-75" y="-130" width="150" height="260" rx="16" fill="#E8E0D4" stroke="#c8c0b4" stroke-width="1"/>
    <!-- Screen -->
    <rect x="-58" y="-115" width="116" height="85" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <!-- Screen content: now playing -->
    <rect x="-40" y="-95" width="28" height="28" rx="2" fill="#333"/>
    <rect x="-5" y="-95" width="50" height="4" rx="2" fill="#E8E0D4" opacity="0.7"/>
    <rect x="-5" y="-84" width="34" height="3" rx="1.5" fill="#8a8580" opacity="0.5"/>
    <!-- Progress bar -->
    <rect x="-40" y="-55" width="80" height="2" rx="1" fill="#333"/>
    <rect x="-40" y="-55" width="48" height="2" rx="1" fill="#ff8e3d"/>
    <!-- Click wheel — cream tones -->
    <circle cx="0" cy="50" r="48" fill="#d8d0c4" stroke="#c0b8ac" stroke-width="1"/>
    <circle cx="0" cy="50" r="16" fill="#E8E0D4" stroke="#c8c0b4" stroke-width="0.5"/>
    <!-- Wheel labels -->
    <rect x="-2" y="8" width="4" height="6" rx="1" fill="#8a8580" opacity="0.4"/>
    <rect x="-2" y="86" width="4" height="6" rx="1" fill="#8a8580" opacity="0.4"/>
    <rect x="-36" y="48" width="6" height="4" rx="1" fill="#8a8580" opacity="0.4"/>
    <rect x="30" y="48" width="6" height="4" rx="1" fill="#8a8580" opacity="0.4"/>
  </g>
</svg>
