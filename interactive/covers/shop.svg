<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <g transform="translate(200,200) scale(1.2)">
    <!-- Browser frame -->
    <rect x="-120" y="-110" width="240" height="220" rx="8" fill="#131313" stroke="#333" stroke-width="0.8"/>
    <!-- Top bar (clipped to frame) -->
    <clipPath id="topClip"><rect x="-120" y="-110" width="240" height="22" rx="8"/></clipPath>
    <rect x="-120" y="-110" width="240" height="22" fill="#1a1a1a" clip-path="url(#topClip)"/>
    <!-- Window dots -->
    <circle cx="-104" cy="-99" r="3" fill="#FF4466" opacity="0.7"/>
    <circle cx="-93" cy="-99" r="3" fill="#FFD700" opacity="0.7"/>
    <circle cx="-82" cy="-99" r="3" fill="#44FF66" opacity="0.7"/>
    <!-- Product card 1 -->
    <rect x="-100" y="-72" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/>
    <rect x="-90" y="-64" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.85"/>
    <rect x="-90" y="-20" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/>
    <rect x="-90" y="-12" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/>
    <!-- Product card 2 (selected) -->
    <rect x="10" y="-72" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#ff8e3d" stroke-width="0.6"/>
    <rect x="20" y="-64" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.9"/>
    <rect x="20" y="-20" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/>
    <rect x="20" y="-12" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/>
    <!-- Product card 3 -->
    <rect x="-100" y="10" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/>
    <rect x="-90" y="18" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.8"/>
    <rect x="-90" y="62" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/>
    <rect x="-90" y="70" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/>
    <!-- Product card 4 -->
    <rect x="10" y="10" width="90" height="70" rx="4" fill="#1a1a1a" stroke="#222" stroke-width="0.5"/>
    <rect x="20" y="18" width="70" height="36" rx="2" fill="#E8E0D4" opacity="0.75"/>
    <rect x="20" y="62" width="44" height="3" rx="1.5" fill="#E8E0D4" opacity="0.4"/>
    <rect x="20" y="70" width="26" height="3" rx="1.5" fill="#ff8e3d" opacity="0.7"/>
    <!-- Cart icon -->
    <rect x="80" y="-103" width="24" height="3" rx="1.5" fill="#ff8e3d" opacity="0.5"/>
  </g>
</svg>