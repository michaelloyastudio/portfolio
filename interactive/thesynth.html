<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Synth — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
* { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --cell: #1a1a1a;
  --cell-hover: #222;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

body:focus, body *:focus { outline: none !important; }

a, button, .clickable, input, select, input[type="range"], label, [onclick], .pad, .wave-btn, .arp-pattern-btn, .key-btn {
  cursor: url('crosshair.svg') 8 10, pointer !important;
}
input[type="range"]::-webkit-slider-thumb { cursor: url('crosshair.svg') 8 10, pointer !important; }

h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem 2rem;
  z-index: 100;
  background: linear-gradient(180deg, rgba(10,10,10,0.95) 0%, transparent 100%);
}

.header-logo-link {
  display: block;
  height: 32px;
  position: relative;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 100px 20px 40px;
  gap: 24px;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}

.title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 3rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── CONTROLS PANEL ── */
.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 12px;
  padding: 16px 20px;
  width: 100%;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.control-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Key selector */
.key-selector {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.key-btn {
  width: 32px;
  height: 28px;
  border: 1px solid #333;
  border-radius: 4px;
  background: var(--cell);
  color: var(--text-muted);
  font-size: 0.65rem;
  font-family: 'Space Grotesk', sans-serif;
  transition: all 0.15s;
}

.key-btn:hover { background: var(--cell-hover); border-color: #444; }
.key-btn.active { background: rgba(255,142,61,0.2); border-color: var(--accent); color: var(--accent); }

/* Octave control */
.octave-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.octave-btn {
  width: 28px;
  height: 28px;
  border: 1px solid #333;
  border-radius: 4px;
  background: var(--cell);
  color: var(--text-muted);
  font-size: 1rem;
  font-family: 'Space Grotesk', sans-serif;
  transition: all 0.15s;
}

.octave-btn:hover { background: var(--cell-hover); border-color: #444; }

.octave-value {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent);
  min-width: 24px;
  text-align: center;
}

/* Waveform selector */
.wave-selector {
  display: flex;
  gap: 6px;
}

.wave-btn {
  width: 48px;
  height: 32px;
  border: 1px solid #333;
  border-radius: 6px;
  background: var(--cell);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.wave-btn:hover { background: var(--cell-hover); border-color: #444; }
.wave-btn.active { background: rgba(255,142,61,0.15); border-color: var(--accent); }

.wave-btn svg { width: 28px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 1.5; }
.wave-btn.active svg { stroke: var(--accent); }

/* Knobs / Sliders */
.knob-group {
  display: flex;
  gap: 20px;
}

.knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.knob-dial {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
  border: 2px solid #333;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.knob-dial::before {
  content: '';
  position: absolute;
  width: 4px;
  height: 14px;
  background: var(--accent);
  border-radius: 2px;
  top: 6px;
  transform-origin: center 18px;
}

.knob-dial::after {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  border: 1px solid #444;
}

.knob input[type="range"] {
  position: absolute;
  width: 48px;
  height: 48px;
  opacity: 0;
  cursor: pointer;
}

.knob-value {
  font-size: 0.6rem;
  color: var(--accent);
  font-family: 'Space Grotesk', monospace;
}

/* Sliders */
.slider-vertical {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.slider-track {
  width: 6px;
  height: 60px;
  background: #222;
  border-radius: 3px;
  position: relative;
}

.slider-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--accent);
  border-radius: 3px;
  transition: height 0.05s;
}

.slider-vertical input[type="range"] {
  width: 60px;
  height: 24px;
  transform: rotate(-90deg);
  transform-origin: 30px 30px;
  position: absolute;
  opacity: 0;
  cursor: pointer;
}

/* Toggle switches */
.toggle-group {
  display: flex;
  gap: 12px;
}

.toggle {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.toggle-switch {
  width: 40px;
  height: 22px;
  border-radius: 11px;
  background: #222;
  border: 1px solid #333;
  position: relative;
  cursor: pointer;
  transition: all 0.2s;
}

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--text-muted);
  top: 2px;
  left: 2px;
  transition: all 0.2s;
}

.toggle-switch.active { background: rgba(255,142,61,0.2); border-color: var(--accent); }
.toggle-switch.active::after { left: 20px; background: var(--accent); }

/* Arpeggiator */
.arp-controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.arp-pattern-btns {
  display: flex;
  gap: 4px;
}

.arp-pattern-btn {
  padding: 4px 8px;
  border: 1px solid #333;
  border-radius: 4px;
  background: var(--cell);
  color: var(--text-muted);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}

.arp-pattern-btn:hover { background: var(--cell-hover); }
.arp-pattern-btn.active { background: rgba(255,142,61,0.15); border-color: var(--accent); color: var(--accent); }

.arp-speed {
  display: flex;
  align-items: center;
  gap: 6px;
}

.arp-speed input[type="range"] {
  width: 60px;
  height: 4px;
  -webkit-appearance: none;
  background: #333;
  border-radius: 2px;
}

.arp-speed input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
}

.arp-speed-value {
  font-size: 0.6rem;
  color: var(--accent);
  min-width: 40px;
}

/* Volume */
.volume-slider {
  width: 80px;
  height: 4px;
  -webkit-appearance: none;
  background: #333;
  border-radius: 2px;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
}

/* ── VISUALIZER ── */
.visualizer {
  width: 100%;
  height: 60px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 8px;
  overflow: hidden;
}

.visualizer canvas {
  width: 100%;
  height: 100%;
}

/* ── CHORD PAD GRID ── */
.pad-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pad-row-label {
  display: flex;
  align-items: center;
  gap: 12px;
}

.row-label-text {
  font-size: 0.6rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  min-width: 60px;
  text-align: right;
}

.pad-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  flex: 1;
}

.pad {
  aspect-ratio: 1;
  min-height: 70px;
  border-radius: 10px;
  background: var(--cell);
  border: 1px solid #2a2a2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform 0.08s, background 0.12s, box-shadow 0.12s, border-color 0.12s;
  position: relative;
  overflow: hidden;
}

.pad:hover {
  background: var(--cell-hover);
  border-color: #3a3a3a;
}

.pad:active, .pad.active {
  transform: scale(0.95);
  background: rgba(255,142,61,0.15);
  border-color: var(--accent);
  box-shadow: 0 0 20px rgba(255,142,61,0.3), inset 0 0 20px rgba(255,142,61,0.1);
}

.pad-chord {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  transition: color 0.1s;
}

.pad.active .pad-chord { color: var(--accent); }

.pad-key {
  font-size: 0.5rem;
  color: #444;
  text-transform: uppercase;
}

.pad-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,142,61,0.4);
  transform: scale(0);
  animation: ripple 0.6s ease-out forwards;
  pointer-events: none;
}

@keyframes ripple {
  to { transform: scale(2.5); opacity: 0; }
}

/* ── KEYBOARD HINTS ── */
.keyboard-hints {
  font-size: 0.55rem;
  color: #444;
  text-align: center;
  margin-top: 8px;
}

.keyboard-hints kbd {
  display: inline-block;
  padding: 2px 6px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 3px;
  font-family: 'Space Grotesk', monospace;
  margin: 0 2px;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .main { padding: 90px 12px 30px; gap: 16px; }
  .title { font-size: 2.5rem; }
  .controls { padding: 12px; gap: 12px; }
  .pad { min-height: 60px; }
  .pad-chord { font-size: 0.85rem; }
  .row-label-text { min-width: 45px; font-size: 0.5rem; }
  .keyboard-hints { display: none; }
  .knob-dial { width: 40px; height: 40px; }
  .knob-dial::before { height: 12px; top: 5px; transform-origin: center 15px; }
}

/* Hide on very small screens */
@media (max-width: 380px) {
  .row-label-text { display: none; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <a href="../index.html" class="header-logo-link">
    <img src="logo-gray.svg" alt="ML" class="header-logo logo-default">
    <img src="logo-orange.svg" alt="ML" class="header-logo logo-hover">
  </a>
</header>

<!-- Main Content -->
<main class="main">
  <div class="title-row">
    <h1 class="title">The Synth</h1>
    <p class="subtitle">Chord Synthesizer</p>
  </div>

  <!-- Controls Panel -->
  <div class="controls">
    <!-- Key Selector -->
    <div class="control-group">
      <span class="control-label">Key</span>
      <div class="key-selector" id="keySelector"></div>
    </div>

    <!-- Octave -->
    <div class="control-group">
      <span class="control-label">Octave</span>
      <div class="octave-control">
        <button class="octave-btn" id="octaveDown">-</button>
        <span class="octave-value" id="octaveValue">4</span>
        <button class="octave-btn" id="octaveUp">+</button>
      </div>
    </div>

    <!-- Waveform -->
    <div class="control-group">
      <span class="control-label">Wave</span>
      <div class="wave-selector" id="waveSelector">
        <button class="wave-btn active" data-wave="sine" title="Sine">
          <svg viewBox="0 0 28 16"><path d="M0 8 Q7 0, 14 8 Q21 16, 28 8"/></svg>
        </button>
        <button class="wave-btn" data-wave="triangle" title="Triangle">
          <svg viewBox="0 0 28 16"><path d="M0 8 L7 2 L21 14 L28 8"/></svg>
        </button>
        <button class="wave-btn" data-wave="sawtooth" title="Sawtooth">
          <svg viewBox="0 0 28 16"><path d="M0 14 L14 2 L14 14 L28 2"/></svg>
        </button>
        <button class="wave-btn" data-wave="square" title="Square">
          <svg viewBox="0 0 28 16"><path d="M0 12 L0 4 L7 4 L7 12 L14 12 L14 4 L21 4 L21 12 L28 12"/></svg>
        </button>
      </div>
    </div>

    <!-- Attack/Release Knobs -->
    <div class="control-group">
      <span class="control-label">Envelope</span>
      <div class="knob-group">
        <div class="knob">
          <div class="knob-dial" id="attackDial">
            <input type="range" min="0" max="100" value="10" id="attackKnob">
          </div>
          <span class="knob-value" id="attackValue">ATK 10</span>
        </div>
        <div class="knob">
          <div class="knob-dial" id="releaseDial">
            <input type="range" min="0" max="100" value="30" id="releaseKnob">
          </div>
          <span class="knob-value" id="releaseValue">REL 30</span>
        </div>
      </div>
    </div>

    <!-- Reverb/Delay Toggles -->
    <div class="control-group">
      <span class="control-label">Effects</span>
      <div class="toggle-group">
        <div class="toggle">
          <div class="toggle-switch" id="reverbToggle"></div>
          <span class="control-label">Reverb</span>
        </div>
        <div class="toggle">
          <div class="toggle-switch" id="delayToggle"></div>
          <span class="control-label">Delay</span>
        </div>
      </div>
    </div>

    <!-- Volume -->
    <div class="control-group">
      <span class="control-label">Volume</span>
      <input type="range" min="0" max="100" value="70" class="volume-slider" id="volumeSlider">
    </div>

    <!-- Arpeggiator -->
    <div class="control-group">
      <span class="control-label">Arpeggiator</span>
      <div class="arp-controls">
        <div class="toggle-switch" id="arpToggle"></div>
        <div class="arp-pattern-btns">
          <button class="arp-pattern-btn active" data-pattern="up">Up</button>
          <button class="arp-pattern-btn" data-pattern="down">Down</button>
          <button class="arp-pattern-btn" data-pattern="updown">U/D</button>
          <button class="arp-pattern-btn" data-pattern="random">Rnd</button>
        </div>
        <div class="arp-speed">
          <input type="range" min="50" max="300" value="120" id="arpSpeed">
          <span class="arp-speed-value" id="arpSpeedValue">120ms</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Visualizer -->
  <div class="visualizer">
    <canvas id="visualizer"></canvas>
  </div>

  <!-- Chord Pad Grid -->
  <div class="pad-container" id="padContainer"></div>

  <!-- Keyboard Hints -->
  <div class="keyboard-hints">
    Keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> / <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════
// SYNTH ENGINE
// ═══════════════════════════════════════════════════

const KEYS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

// Chord definitions (semitones from root)
const CHORD_TYPES = {
  // Major row
  'maj': [0, 4, 7],
  'maj7': [0, 4, 7, 11],
  '6': [0, 4, 7, 9],
  'add9': [0, 4, 7, 14],
  // Minor row
  'min': [0, 3, 7],
  'min7': [0, 3, 7, 10],
  'min9': [0, 3, 7, 10, 14],
  'min6': [0, 3, 7, 9],
  // Seventh row
  '7': [0, 4, 7, 10],
  '9': [0, 4, 7, 10, 14],
  '7#9': [0, 4, 7, 10, 15],
  '13': [0, 4, 7, 10, 14, 21],
  // Color row
  'dim': [0, 3, 6],
  'aug': [0, 4, 8],
  'sus4': [0, 5, 7],
  'sus2': [0, 2, 7]
};

const CHORD_LAYOUT = [
  { label: 'Major', chords: ['maj', 'maj7', '6', 'add9'] },
  { label: 'Minor', chords: ['min', 'min7', 'min9', 'min6'] },
  { label: 'Seventh', chords: ['7', '9', '7#9', '13'] },
  { label: 'Color', chords: ['dim', 'aug', 'sus4', 'sus2'] }
];

const KEYBOARD_MAP = [
  ['1', '2', '3', '4'],
  ['q', 'w', 'e', 'r'],
  ['a', 's', 'd', 'f'],
  ['z', 'x', 'c', 'v']
];

// State
let audioCtx = null;
let masterGain = null;
let analyser = null;
let convolverNode = null;
let delayNode = null;
let delayFeedback = null;

let currentKey = 0; // C
let currentOctave = 4;
let currentWave = 'sine';
let attack = 0.01;
let release = 0.3;
let volume = 0.7;
let reverbOn = false;
let delayOn = false;
let arpOn = false;
let arpPattern = 'up';
let arpSpeed = 120;
let arpInterval = null;
let currentArpNotes = [];
let arpIndex = 0;
let arpDirection = 1;
let activeOscillators = new Map();

// Initialize Audio Context
function initAudio() {
  if (audioCtx) return;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Master gain
  masterGain = audioCtx.createGain();
  masterGain.gain.value = volume;

  // Analyser for visualization
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;

  // Delay effect
  delayNode = audioCtx.createDelay(1);
  delayNode.delayTime.value = 0.3;
  delayFeedback = audioCtx.createGain();
  delayFeedback.gain.value = 0.4;

  // Create reverb (simple convolution)
  convolverNode = audioCtx.createConvolver();
  createReverbImpulse();

  // Routing
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);

  // Delay routing (parallel)
  delayNode.connect(delayFeedback);
  delayFeedback.connect(delayNode);
  delayNode.connect(masterGain);

  startVisualizer();
}

// Create reverb impulse response
function createReverbImpulse() {
  const sampleRate = audioCtx.sampleRate;
  const length = sampleRate * 2;
  const impulse = audioCtx.createBuffer(2, length, sampleRate);

  for (let channel = 0; channel < 2; channel++) {
    const data = impulse.getChannelData(channel);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
    }
  }

  convolverNode.buffer = impulse;
}

// Note frequency calculation
function noteFreq(semitone, octave) {
  // A4 = 440Hz, semitone 9 (A is 9 semitones from C)
  const a4 = 440;
  const semitonesFromA4 = (octave - 4) * 12 + (semitone - 9);
  return a4 * Math.pow(2, semitonesFromA4 / 12);
}

// Play a single note
function playNote(semitone, octave, duration = null) {
  const freq = noteFreq(semitone, octave);

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = currentWave;
  osc.frequency.value = freq;

  // ADSR envelope
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.3, now + attack);

  osc.connect(gain);

  // Route through effects if enabled
  if (reverbOn) {
    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.3;
    gain.connect(convolverNode);
    convolverNode.connect(reverbGain);
    reverbGain.connect(masterGain);
  }

  if (delayOn) {
    const delayWet = audioCtx.createGain();
    delayWet.gain.value = 0.3;
    gain.connect(delayWet);
    delayWet.connect(delayNode);
  }

  gain.connect(masterGain);

  osc.start(now);

  if (duration !== null) {
    gain.gain.setValueAtTime(0.3, now + duration);
    gain.gain.linearRampToValueAtTime(0, now + duration + release);
    osc.stop(now + duration + release + 0.1);
  }

  return { osc, gain };
}

// Play chord
function playChord(chordType, release = true) {
  initAudio();

  const intervals = CHORD_TYPES[chordType];
  const root = currentKey;

  const notes = intervals.map(interval => {
    let semitone = (root + interval) % 12;
    let octave = currentOctave + Math.floor((root + interval) / 12);
    return { semitone, octave };
  });

  if (arpOn) {
    startArpeggio(notes);
  } else {
    // Play all notes simultaneously
    const oscs = notes.map(n => playNote(n.semitone, n.octave));
    activeOscillators.set(chordType, oscs);
  }
}

// Release chord
function releaseChord(chordType) {
  if (arpOn) {
    stopArpeggio();
    return;
  }

  const oscs = activeOscillators.get(chordType);
  if (oscs) {
    const now = audioCtx.currentTime;
    oscs.forEach(({ osc, gain }) => {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0, now + release);
      osc.stop(now + release + 0.1);
    });
    activeOscillators.delete(chordType);
  }
}

// Arpeggiator
function startArpeggio(notes) {
  stopArpeggio();
  currentArpNotes = [...notes];
  arpIndex = 0;
  arpDirection = 1;

  playArpNote();
  arpInterval = setInterval(playArpNote, arpSpeed);
}

function stopArpeggio() {
  if (arpInterval) {
    clearInterval(arpInterval);
    arpInterval = null;
  }
  currentArpNotes = [];
}

function playArpNote() {
  if (currentArpNotes.length === 0) return;

  let note;

  switch (arpPattern) {
    case 'up':
      note = currentArpNotes[arpIndex % currentArpNotes.length];
      arpIndex++;
      break;
    case 'down':
      note = currentArpNotes[currentArpNotes.length - 1 - (arpIndex % currentArpNotes.length)];
      arpIndex++;
      break;
    case 'updown':
      note = currentArpNotes[arpIndex];
      arpIndex += arpDirection;
      if (arpIndex >= currentArpNotes.length - 1) arpDirection = -1;
      if (arpIndex <= 0) arpDirection = 1;
      break;
    case 'random':
      note = currentArpNotes[Math.floor(Math.random() * currentArpNotes.length)];
      break;
  }

  playNote(note.semitone, note.octave, arpSpeed / 1000 * 0.8);
}

// ═══════════════════════════════════════════════════
// VISUALIZER
// ═══════════════════════════════════════════════════

function startVisualizer() {
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  function resize() {
    canvas.width = canvas.offsetWidth * window.devicePixelRatio;
    canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  }
  resize();
  window.addEventListener('resize', resize);

  function draw() {
    requestAnimationFrame(draw);

    analyser.getByteTimeDomainData(dataArray);

    ctx.fillStyle = '#131313';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 2 * window.devicePixelRatio;
    ctx.strokeStyle = '#ff8e3d';
    ctx.beginPath();

    const sliceWidth = canvas.width / bufferLength;
    let x = 0;

    for (let i = 0; i < bufferLength; i++) {
      const v = dataArray[i] / 128.0;
      const y = v * canvas.height / 2;

      if (i === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }

      x += sliceWidth;
    }

    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }

  draw();
}

// ═══════════════════════════════════════════════════
// UI SETUP
// ═══════════════════════════════════════════════════

function setupUI() {
  // Key selector
  const keySel = document.getElementById('keySelector');
  KEYS.forEach((key, i) => {
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (i === 0 ? ' active' : '');
    btn.textContent = key;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.key-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentKey = i;
      updatePadLabels();
    });
    keySel.appendChild(btn);
  });

  // Octave controls
  document.getElementById('octaveDown').addEventListener('click', () => {
    if (currentOctave > 2) {
      currentOctave--;
      document.getElementById('octaveValue').textContent = currentOctave;
    }
  });
  document.getElementById('octaveUp').addEventListener('click', () => {
    if (currentOctave < 6) {
      currentOctave++;
      document.getElementById('octaveValue').textContent = currentOctave;
    }
  });

  // Waveform selector
  document.querySelectorAll('.wave-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentWave = btn.dataset.wave;
    });
  });

  // Knobs
  const attackKnob = document.getElementById('attackKnob');
  const releaseKnob = document.getElementById('releaseKnob');
  const attackDial = document.getElementById('attackDial');
  const releaseDial = document.getElementById('releaseDial');

  function updateKnob(input, dial, valueEl, prefix, isAttack) {
    const val = parseInt(input.value);
    const rotation = (val / 100) * 270 - 135;
    dial.style.setProperty('--rotation', rotation + 'deg');
    dial.querySelector('::before')?.style.transform = `rotate(${rotation}deg)`;
    valueEl.textContent = prefix + ' ' + val;

    if (isAttack) {
      attack = 0.001 + (val / 100) * 0.5;
    } else {
      release = 0.01 + (val / 100) * 1;
    }
  }

  attackKnob.addEventListener('input', () => {
    const val = parseInt(attackKnob.value);
    const rotation = (val / 100) * 270 - 135;
    attackDial.style.cssText = `--rot: ${rotation}deg`;
    document.getElementById('attackValue').textContent = 'ATK ' + val;
    attack = 0.001 + (val / 100) * 0.5;
  });

  releaseKnob.addEventListener('input', () => {
    const val = parseInt(releaseKnob.value);
    const rotation = (val / 100) * 270 - 135;
    releaseDial.style.cssText = `--rot: ${rotation}deg`;
    document.getElementById('releaseValue').textContent = 'REL ' + val;
    release = 0.01 + (val / 100) * 1;
  });

  // Apply CSS for knob rotation
  const style = document.createElement('style');
  style.textContent = `
    .knob-dial::before { transform: rotate(var(--rot, -135deg)); }
  `;
  document.head.appendChild(style);

  // Toggles
  document.getElementById('reverbToggle').addEventListener('click', function() {
    this.classList.toggle('active');
    reverbOn = this.classList.contains('active');
  });

  document.getElementById('delayToggle').addEventListener('click', function() {
    this.classList.toggle('active');
    delayOn = this.classList.contains('active');
  });

  document.getElementById('arpToggle').addEventListener('click', function() {
    this.classList.toggle('active');
    arpOn = this.classList.contains('active');
    if (!arpOn) stopArpeggio();
  });

  // Arp pattern
  document.querySelectorAll('.arp-pattern-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.arp-pattern-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      arpPattern = btn.dataset.pattern;
    });
  });

  // Arp speed
  const arpSpeedSlider = document.getElementById('arpSpeed');
  arpSpeedSlider.addEventListener('input', () => {
    arpSpeed = parseInt(arpSpeedSlider.value);
    document.getElementById('arpSpeedValue').textContent = arpSpeed + 'ms';
  });

  // Volume
  const volumeSlider = document.getElementById('volumeSlider');
  volumeSlider.addEventListener('input', () => {
    volume = parseInt(volumeSlider.value) / 100;
    if (masterGain) masterGain.gain.value = volume;
  });

  // Create pad grid
  createPadGrid();
}

function createPadGrid() {
  const container = document.getElementById('padContainer');
  container.innerHTML = '';

  CHORD_LAYOUT.forEach((row, rowIndex) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'pad-row-label';

    const labelEl = document.createElement('span');
    labelEl.className = 'row-label-text';
    labelEl.textContent = row.label;
    rowEl.appendChild(labelEl);

    const padsEl = document.createElement('div');
    padsEl.className = 'pad-row';

    row.chords.forEach((chord, colIndex) => {
      const pad = document.createElement('div');
      pad.className = 'pad';
      pad.dataset.chord = chord;
      pad.dataset.row = rowIndex;
      pad.dataset.col = colIndex;

      const chordLabel = document.createElement('span');
      chordLabel.className = 'pad-chord';
      chordLabel.textContent = KEYS[currentKey] + chord;
      pad.appendChild(chordLabel);

      const keyHint = document.createElement('span');
      keyHint.className = 'pad-key';
      keyHint.textContent = KEYBOARD_MAP[rowIndex][colIndex];
      pad.appendChild(keyHint);

      // Touch/Mouse events
      const handleStart = (e) => {
        e.preventDefault();
        pad.classList.add('active');
        createRipple(pad, e);
        playChord(chord);
      };

      const handleEnd = () => {
        pad.classList.remove('active');
        releaseChord(chord);
      };

      pad.addEventListener('mousedown', handleStart);
      pad.addEventListener('mouseup', handleEnd);
      pad.addEventListener('mouseleave', handleEnd);
      pad.addEventListener('touchstart', handleStart, { passive: false });
      pad.addEventListener('touchend', handleEnd);
      pad.addEventListener('touchcancel', handleEnd);

      padsEl.appendChild(pad);
    });

    rowEl.appendChild(padsEl);
    container.appendChild(rowEl);
  });
}

function updatePadLabels() {
  document.querySelectorAll('.pad').forEach(pad => {
    const chord = pad.dataset.chord;
    pad.querySelector('.pad-chord').textContent = KEYS[currentKey] + chord;
  });
}

function createRipple(pad, e) {
  const ripple = document.createElement('div');
  ripple.className = 'pad-ripple';

  const rect = pad.getBoundingClientRect();
  let x, y;

  if (e.touches) {
    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;
  } else {
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
  }

  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = x - size / 2 + 'px';
  ripple.style.top = y - size / 2 + 'px';

  pad.appendChild(ripple);
  ripple.addEventListener('animationend', () => ripple.remove());
}

// ═══════════════════════════════════════════════════
// KEYBOARD CONTROLS
// ═══════════════════════════════════════════════════

const keyToPad = {};
KEYBOARD_MAP.forEach((row, rowIndex) => {
  row.forEach((key, colIndex) => {
    keyToPad[key.toLowerCase()] = { row: rowIndex, col: colIndex };
  });
});

const pressedKeys = new Set();

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;

  const key = e.key.toLowerCase();
  const mapping = keyToPad[key];

  if (mapping && !pressedKeys.has(key)) {
    pressedKeys.add(key);
    const chord = CHORD_LAYOUT[mapping.row].chords[mapping.col];
    const pad = document.querySelector(`.pad[data-row="${mapping.row}"][data-col="${mapping.col}"]`);

    if (pad) {
      pad.classList.add('active');
      const rect = pad.getBoundingClientRect();
      createRipple(pad, { clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 });
      playChord(chord);
    }
  }
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  const mapping = keyToPad[key];

  if (mapping) {
    pressedKeys.delete(key);
    const chord = CHORD_LAYOUT[mapping.row].chords[mapping.col];
    const pad = document.querySelector(`.pad[data-row="${mapping.row}"][data-col="${mapping.col}"]`);

    if (pad) {
      pad.classList.remove('active');
      releaseChord(chord);
    }
  }
});

// ═══════════════════════════════════════════════════
// PAGE TRANSITIONS
// ═══════════════════════════════════════════════════

(function() {
  const overlay = document.createElement('div');
  overlay.id = 'pageTransition';
  Object.assign(overlay.style, {
    position: 'fixed', inset: '0', background: '#0a0a0a', zIndex: '99999',
    opacity: '1', transition: 'opacity 0.4s ease', pointerEvents: 'none'
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(() => { overlay.style.opacity = '0'; });

  document.querySelector('.header-logo-link').addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.href;
    overlay.style.pointerEvents = 'all';
    overlay.style.opacity = '1';
    setTimeout(() => { window.close(); if (!window.closed) window.location.href = href; }, 400);
  });
})();

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', setupUI);

// Initialize audio on first interaction
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('keydown', initAudio, { once: true });
</script>
