<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Pack — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../logo-cream.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --card-bg: #111;
  --card-border: #222;
  --silver: #b8b8b8;
  --silver-glow: rgba(184, 184, 184, 0.3);
  --gold: #d4a843;
  --gold-glow: rgba(212, 168, 67, 0.35);
  --platinum: #e5e4e2;
  --platinum-glow: rgba(229, 228, 226, 0.4);
  --diamond: #b9f2ff;
  --diamond-glow: rgba(185, 242, 255, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { display: none; }
html { scrollbar-width: none; overflow-y: scroll; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
}

a, button, .clickable, [onclick] { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3rem 2.5rem;
  z-index: 100;
}

.header-logo-link {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  height: 32px;
}
.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN LAYOUT ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 120px 20px 60px;
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  margin-bottom: 1.5rem;
}
.title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 3rem;
  letter-spacing: 0.05em;
}
.subtitle {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 2rem;
  margin-bottom: 2.5rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}
.stat-item span { color: var(--text); font-weight: 600; }

/* ── PACK ── */
.pack-area {
  position: relative;
  width: 260px;
  height: 380px;
  margin-bottom: 5rem;
  perspective: 1200px;
}

.pack-wrapper {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.3s ease;
}
.pack-wrapper:hover { transform: translateY(-6px) rotateX(2deg); }

.pack {
  width: 100%;
  height: 100%;
  background: linear-gradient(160deg, #1c1c1c 0%, #0e0e0e 100%);
  border: 1.5px solid #2a2a2a;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
}

.pack::before {
  content: '';
  position: absolute;
  top: -100%;
  left: -100%;
  width: 300%;
  height: 300%;
  background: linear-gradient(
    45deg,
    transparent 40%,
    rgba(255,142,61,0.04) 44%,
    rgba(255,142,61,0.08) 50%,
    rgba(255,142,61,0.04) 56%,
    transparent 60%
  );
  animation: foilSheen 5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes foilSheen {
  0%, 100% { transform: translateX(-20%) translateY(-20%) rotate(45deg); }
  50% { transform: translateX(20%) translateY(20%) rotate(45deg); }
}

.pack-accent-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 10%, var(--accent) 50%, transparent 90%);
  opacity: 0.3;
}
.pack-accent-line.top { top: 60px; }
.pack-accent-line.bottom { bottom: 60px; }

.pack-label {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2rem;
  letter-spacing: 0.08em;
  color: var(--text);
  position: relative;
  z-index: 2;
}
.pack-label-sub {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-top: 0.5rem;
}
.pack-count {
  position: absolute;
  bottom: 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  color: #333;
  letter-spacing: 0.1em;
}

.rip-btn {
  position: absolute;
  bottom: -55px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 0.6rem 2.2rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: all 0.3s;
  border-radius: 2px;
}
.rip-btn:hover { background: var(--accent); color: var(--bg); }
.rip-btn:disabled { opacity: 0.3; pointer-events: none; }

/* ── PACK OPEN ANIMATION ── */
/* Phase 1: everything fades out, pack zooms to center */
.pack-wrapper.opening {
  animation: packZoomCenter 0.6s ease forwards;
}
@keyframes packZoomCenter {
  0% { transform: scale(1); }
  100% { transform: scale(1.08); }
}

.main.fading-out .title-row,
.main.fading-out .stats-bar,
.main.fading-out .collection-section,
.main.fading-out .rip-btn {
  transition: opacity 0.4s ease;
  opacity: 0;
  pointer-events: none;
}

/* Phase 2: shake */
.pack-wrapper.shaking {
  animation: packShake 0.5s ease;
}
@keyframes packShake {
  0% { transform: scale(1.08) rotate(0deg); }
  15% { transform: scale(1.08) rotate(-3deg) translateX(-4px); }
  30% { transform: scale(1.08) rotate(3deg) translateX(4px); }
  45% { transform: scale(1.08) rotate(-2deg) translateX(-3px); }
  60% { transform: scale(1.08) rotate(2deg) translateX(3px); }
  75% { transform: scale(1.08) rotate(-1deg) translateX(-1px); }
  100% { transform: scale(1.08) rotate(0deg); }
}

/* Phase 3: top tears off */
.pack-top-half, .pack-bottom-half {
  position: absolute;
  left: 0; right: 0;
  overflow: hidden;
  border-radius: 14px;
}
.pack-top-half {
  top: 0;
  height: 35%;
  background: linear-gradient(160deg, #1c1c1c 0%, #0e0e0e 100%);
  border: 1.5px solid #2a2a2a;
  border-bottom: none;
  border-radius: 14px 14px 0 0;
  transform-origin: top center;
  z-index: 5;
  display: none;
}
.pack-top-half.tearing {
  display: block;
  animation: tearOff 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes tearOff {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  30% { transform: translateY(-10px) rotate(-3deg); opacity: 1; }
  100% { transform: translateY(-200px) rotate(-15deg); opacity: 0; }
}

/* Torn edge effect */
.pack-top-half::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: -5px;
  right: -5px;
  height: 12px;
  background: 
    radial-gradient(circle 6px at 8px 6px, transparent 5px, #1a1a1a 5.5px),
    radial-gradient(circle 4px at 22px 4px, transparent 3px, #1a1a1a 3.5px),
    radial-gradient(circle 5px at 38px 5px, transparent 4px, #1a1a1a 4.5px),
    radial-gradient(circle 6px at 56px 6px, transparent 5px, #1a1a1a 5.5px),
    radial-gradient(circle 4px at 70px 3px, transparent 3px, #1a1a1a 3.5px),
    radial-gradient(circle 5px at 88px 5px, transparent 4px, #1a1a1a 4.5px),
    radial-gradient(circle 6px at 105px 6px, transparent 5px, #1a1a1a 5.5px),
    radial-gradient(circle 5px at 120px 4px, transparent 4px, #1a1a1a 4.5px),
    radial-gradient(circle 4px at 138px 5px, transparent 3px, #1a1a1a 3.5px),
    radial-gradient(circle 6px at 155px 6px, transparent 5px, #1a1a1a 5.5px),
    radial-gradient(circle 5px at 172px 4px, transparent 4px, #1a1a1a 4.5px),
    radial-gradient(circle 4px at 190px 5px, transparent 3px, #1a1a1a 3.5px),
    radial-gradient(circle 6px at 208px 6px, transparent 5px, #1a1a1a 5.5px),
    radial-gradient(circle 5px at 225px 4px, transparent 4px, #1a1a1a 4.5px),
    radial-gradient(circle 4px at 245px 5px, transparent 3px, #1a1a1a 3.5px);
}

/* Inner glow from inside the pack */
.pack-inner-glow {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 150px;
  height: 150px;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
  filter: blur(30px);
}
.pack-inner-glow.glowing {
  animation: innerGlow 1s ease forwards;
}
@keyframes innerGlow {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
}

/* Cards sliding out */
.cards-emerging {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 310px;
  z-index: 4;
  display: none;
}
.cards-emerging.active { display: block; }

.emerging-card {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
  border: 1.5px solid #2a2a2a;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(40px);
}
.emerging-card .card-back-text {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.4rem;
  color: #2a2a2a;
}
.emerging-card .card-back-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,0.008) 8px, rgba(255,255,255,0.008) 16px),
    repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(255,255,255,0.008) 8px, rgba(255,255,255,0.008) 16px);
  pointer-events: none;
  border-radius: 12px;
}

/* ── CARD REVEAL FULLSCREEN ── */
.card-reveal-area {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 500;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.95);
}
.card-reveal-area.active { display: flex; }

/* Card stack container */
.card-stack {
  position: relative;
  width: 300px;
  height: 420px;
  margin-bottom: 1.5rem;
}

/* Each stacked card */
.stack-card {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  border-radius: 14px;
  overflow: hidden;
  transition: transform 0.3s ease, opacity 0.3s ease, box-shadow 0.3s ease;
  will-change: transform;
  background: var(--card-bg);
  border: 2px solid var(--card-border);
  display: flex;
  flex-direction: column;
}

/* Face-down cards in stack */
.stack-card.face-down {
  background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
  border: 2px solid #2a2a2a;
}
.stack-card.face-down .card-front-content { display: none; }
.stack-card.face-down .card-back-content { display: flex; }
.stack-card .card-back-content {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.card-back-logo {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2rem;
  color: #2a2a2a;
}
.card-back-sub {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.55rem;
  color: #1e1e1e;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-top: 0.3rem;
}
.card-back-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,0.008) 8px, rgba(255,255,255,0.008) 16px),
    repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(255,255,255,0.008) 8px, rgba(255,255,255,0.008) 16px);
  pointer-events: none;
  border-radius: 14px;
}

/* Swipe away animation */
.stack-card.swiping-right {
  animation: swipeRight 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes swipeRight {
  0% { transform: translateX(0) rotate(0deg); opacity: 1; }
  60% { opacity: 1; }
  100% { transform: translateX(420px) rotate(18deg); opacity: 0; }
}
.stack-card.swiping-left {
  animation: swipeLeft 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
@keyframes swipeLeft {
  0% { transform: translateX(0) rotate(0deg); opacity: 1; }
  60% { opacity: 1; }
  100% { transform: translateX(-420px) rotate(-18deg); opacity: 0; }
}

/* Card entering from bottom of stack */
.stack-card.entering {
  animation: cardEnter 0.35s ease forwards;
}
@keyframes cardEnter {
  0% { transform: scale(0.92) translateY(12px); opacity: 0.5; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Stack depth offsets — cards behind peek out slightly */
.stack-card[data-depth="1"] { transform: scale(0.97) translateY(8px); z-index: 4; }
.stack-card[data-depth="2"] { transform: scale(0.94) translateY(16px); z-index: 3; }
.stack-card[data-depth="3"] { transform: scale(0.91) translateY(24px); z-index: 2; }
.stack-card[data-depth="4"] { transform: scale(0.88) translateY(32px); z-index: 1; }
.stack-card[data-depth="0"] { z-index: 5; }

/* Diamond peek glow — visible through stack */
.stack-glow {
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 250px;
  height: 100px;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  filter: blur(20px);
  z-index: 0;
  transition: opacity 1s ease;
}
.stack-glow.visible { opacity: 0.6; }

.card-rarity-strip {
  height: 3px;
  width: 100%;
  flex-shrink: 0;
}
.card-rarity-strip.silver { background: linear-gradient(90deg, transparent, var(--silver), transparent); }
.card-rarity-strip.gold { background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.card-rarity-strip.platinum { background: linear-gradient(90deg, transparent, var(--platinum), var(--platinum), transparent); }
.card-rarity-strip.diamond { background: linear-gradient(90deg, transparent, var(--diamond), white, var(--diamond), transparent); }

.card-image-area {
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #0d0d0d;
  flex-shrink: 0;
}
.card-emoji {
  font-size: 4.5rem;
  position: relative;
  z-index: 2;
}
.card-image-area::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  height: 50px;
  background: linear-gradient(transparent, var(--card-bg));
  z-index: 3;
}

.card-info {
  padding: 0.8rem 1.1rem;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-name {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.15rem;
  margin-bottom: 0.1rem;
}
.card-category {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 0.5rem;
}
.card-category.silver { color: var(--silver); }
.card-category.gold { color: var(--gold); }
.card-category.platinum { color: var(--platinum); }
.card-category.diamond { color: var(--diamond); }

.card-desc {
  font-size: 0.7rem;
  line-height: 1.55;
  color: var(--text-muted);
  flex: 1;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 0.5rem;
  border-top: 1px solid #1e1e1e;
  margin-top: auto;
}
.card-year, .card-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.55rem;
  color: #444;
  letter-spacing: 0.05em;
}
.card-rarity-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.5rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.12rem 0.45rem;
  border-radius: 2px;
}
.card-rarity-badge.silver { color: var(--silver); border: 1px solid rgba(184,184,184,0.3); }
.card-rarity-badge.gold { color: var(--gold); border: 1px solid rgba(212,168,67,0.3); }
.card-rarity-badge.platinum { color: var(--platinum); border: 1px solid rgba(229,228,226,0.3); }
.card-rarity-badge.diamond { color: var(--diamond); border: 1px solid rgba(185,242,255,0.4); }

/* Rarity glow on face-up cards */
.stack-card.silver:not(.face-down) { border-color: rgba(184,184,184,0.2); box-shadow: 0 0 20px var(--silver-glow), 0 8px 30px rgba(0,0,0,0.4); }
.stack-card.gold:not(.face-down) { border-color: rgba(212,168,67,0.25); box-shadow: 0 0 25px var(--gold-glow), 0 8px 30px rgba(0,0,0,0.4); }
.stack-card.platinum:not(.face-down) { border-color: rgba(229,228,226,0.3); box-shadow: 0 0 35px var(--platinum-glow), 0 0 70px rgba(229,228,226,0.12), 0 8px 30px rgba(0,0,0,0.4); }
.stack-card.diamond:not(.face-down) { border-color: rgba(185,242,255,0.4); box-shadow: 0 0 40px var(--diamond-glow), 0 0 90px rgba(185,242,255,0.2), 0 0 140px rgba(185,242,255,0.08), 0 8px 30px rgba(0,0,0,0.4); }

/* Sparkle container */
.sparkle-container {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
  overflow: hidden;
  border-radius: 14px;
}
.sparkle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: sparkleAnim 1.5s ease-in-out infinite;
}
@keyframes sparkleAnim {
  0%, 100% { opacity: 0; transform: scale(0); }
  50% { opacity: 1; transform: scale(1); }
}

/* Diamond sparkles float upward */
.sparkle-float {
  position: absolute;
  width: 2px;
  height: 2px;
  background: var(--diamond);
  border-radius: 50%;
  pointer-events: none;
  z-index: 10;
}
@keyframes sparkleFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(0); }
}

/* Platinum shimmer */
.platinum-shimmer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 14px;
  overflow: hidden;
  pointer-events: none;
  z-index: 5;
}
.platinum-shimmer::before {
  content: '';
  position: absolute;
  top: -100%;
  left: -100%;
  width: 300%;
  height: 300%;
  background: linear-gradient(
    45deg,
    transparent 42%,
    rgba(229,228,226,0.06) 45%,
    rgba(229,228,226,0.12) 50%,
    rgba(229,228,226,0.06) 55%,
    transparent 58%
  );
  animation: platShimmer 3s ease-in-out infinite;
}
@keyframes platShimmer {
  0%, 100% { transform: translateX(-30%) translateY(-30%) rotate(45deg); }
  50% { transform: translateX(30%) translateY(30%) rotate(45deg); }
}

/* Diamond holo */
.holo-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(
    125deg,
    rgba(255,0,0,0.06) 0%,
    rgba(255,154,0,0.06) 10%,
    rgba(208,222,33,0.06) 20%,
    rgba(79,220,74,0.06) 30%,
    rgba(63,218,216,0.06) 40%,
    rgba(47,201,226,0.06) 50%,
    rgba(28,127,238,0.06) 60%,
    rgba(95,21,242,0.06) 70%,
    rgba(186,12,248,0.06) 80%,
    rgba(251,7,217,0.06) 90%,
    rgba(255,0,0,0.06) 100%
  );
  background-size: 200% 200%;
  animation: holoShift 3s ease infinite;
  pointer-events: none;

const RARITY_WEIGHTS = { silver: 50, gold: 30, platinum: 15, diamond: 5 };
const RARITY_ORDER = { silver: 0, gold: 1, platinum: 2, diamond: 3 };
const RARITY_COLORS = {
  silver: 'rgba(184,184,184,0.5)',
  gold: 'rgba(212,168,67,0.5)',
  platinum: 'rgba(229,228,226,0.6)',
  diamond: 'rgba(185,242,255,0.7)'
};

let packsOpened = parseInt(localStorage.getItem('thepack_packs') || '0');
let currentPack = [];
let currentCardIndex = 0;
let isAnimating = false;
let isSwiping = false;
let viewingCollection = false;

updateStats();
renderCollection();

function openPack() {
  if (isAnimating) return;
  isAnimating = true;
  viewingCollection = false;
  
  const btn = document.getElementById('ripBtn');
  const wrapper = document.getElementById('packWrapper');
  const mainArea = document.getElementById('mainArea');
  btn.disabled = true;

  currentPack = generatePack(5);
  currentCardIndex = 0;
  const bestRarity = currentPack[currentPack.length - 1].rarity;

  mainArea.classList.add('fading-out');
  wrapper.classList.add('opening');

  setTimeout(() => {
    wrapper.classList.remove('opening');
    wrapper.classList.add('shaking');

    setTimeout(() => {
      wrapper.classList.remove('shaking');
      wrapper.style.transform = 'scale(1.08)';

      const glow = document.getElementById('packInnerGlow');
      glow.style.background = RARITY_COLORS[bestRarity];
      glow.classList.add('glowing');

      const topHalf = document.getElementById('packTopHalf');
      topHalf.classList.add('tearing');

      setTimeout(() => {
        wrapper.style.transform = '';
        topHalf.classList.remove('tearing');
        glow.classList.remove('glowing');
        showCardReveal();
      }, 800);
    }, 550);
  }, 500);
}

function generatePack(count) {
  const cards = [];
  let hasGoldPlus = false;
  for (let i = 0; i < count; i++) {
    let card;
    if (i === count - 1 && !hasGoldPlus) {
      const pool = CARDS.filter(c => c.rarity !== 'silver');
      card = pool[Math.floor(Math.random() * pool.length)];
    } else {
      card = weightedRandom();
    }
    if (card.rarity !== 'silver') hasGoldPlus = true;
    cards.push(card);
  }
  cards.sort((a, b) => RARITY_ORDER[a.rarity] - RARITY_ORDER[b.rarity]);
  return cards;
}

function weightedRandom() {
  const total = Object.values(RARITY_WEIGHTS).reduce((a, b) => a + b, 0);
  let rand = Math.random() * total;
  for (const [rarity, weight] of Object.entries(RARITY_WEIGHTS)) {
    rand -= weight;
    if (rand <= 0) {
      const pool = CARDS.filter(c => c.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  return CARDS[0];
}

function showCardReveal() {
  const reveal = document.getElementById('cardReveal');
  const stack = document.getElementById('cardStack');
  
  packsOpened++;
  localStorage.setItem('thepack_packs', packsOpened);
  currentPack.forEach(card => addToCollection(card));

  // Build stack: worst at bottom (high depth), best on top (depth 0)
  stack.innerHTML = '<div class="stack-glow" id="stackGlow"></div>';
  
  for (let i = 0; i < currentPack.length; i++) {
    const card = currentPack[i];
    const depth = currentPack.length - 1 - i; // index 0 (worst) -> highest depth, last (best) -> depth 0
    const el = document.createElement('div');
    el.className = 'stack-card face-down ' + card.rarity;
    el.dataset.depth = depth;
    el.dataset.cardIndex = i;
    el.innerHTML = buildCardHTML(card);
    stack.appendChild(el);
  }

  // Reveal top card (depth 0 = best card = last in array)
  const topCard = stack.querySelector('[data-depth="0"]');
  if (topCard) {
    topCard.classList.remove('face-down');
    addRarityEffectsToElement(currentPack[parseInt(topCard.dataset.cardIndex)], topCard);
  }

  // Diamond glow if top card is diamond
  const stackGlow = document.getElementById('stackGlow');
  const topRarity = currentPack[currentPack.length - 1].rarity;
  if (topRarity === 'diamond' || topRarity === 'platinum') {
    stackGlow.style.background = 'radial-gradient(ellipse, ' + RARITY_COLORS[topRarity] + ', transparent 70%)';
    stackGlow.classList.add('visible');
  } else {
    stackGlow.classList.remove('visible');
  }

  currentCardIndex = 0;
  updateCounter();
  reveal.classList.add('active');
  document.getElementById('cardHint').textContent = 'Click or \u2192 to flip through';
}

function updateCounter() {
  document.getElementById('cardCounter').textContent = (currentCardIndex + 1) + ' / ' + currentPack.length;
}

function swipeCard(direction) {
  if (isSwiping) return;
  isSwiping = true;

  const stack = document.getElementById('cardStack');
  const cards = Array.from(stack.querySelectorAll('.stack-card'));
  if (cards.length === 0) { isSwiping = false; return; }

  const topCard = cards.find(c => c.dataset.depth === '0');
  if (!topCard) { isSwiping = false; return; }

  const swipeClass = direction === 'right' ? 'swiping-right' : 'swiping-left';
  topCard.classList.add(swipeClass);

  // Shift all others up
  cards.forEach(c => {
    const d = parseInt(c.dataset.depth);
    if (d > 0) c.dataset.depth = d - 1;
  });

  setTimeout(() => {
    topCard.classList.remove(swipeClass);
    topCard.style.transform = '';
    topCard.style.opacity = '';

    // Send to back
    const maxDepth = cards.length - 1;
    topCard.dataset.depth = maxDepth;
    topCard.classList.add('face-down');
    topCard.querySelectorAll('.sparkle-container, .holo-overlay, .platinum-shimmer').forEach(el => el.remove());

    // Reveal new top
    const newTop = cards.find(c => c !== topCard && c.dataset.depth === '0');
    if (newTop) {
      newTop.classList.remove('face-down');
      newTop.classList.add('entering');
      const cardData = currentPack[parseInt(newTop.dataset.cardIndex)];
      addRarityEffectsToElement(cardData, newTop);

      const stackGlow = document.getElementById('stackGlow');
      if (cardData.rarity === 'diamond' || cardData.rarity === 'platinum') {
        stackGlow.style.background = 'radial-gradient(ellipse, ' + RARITY_COLORS[cardData.rarity] + ', transparent 70%)';
        stackGlow.classList.add('visible');
      } else {
        stackGlow.classList.remove('visible');
      }

      if (cardData.rarity === 'diamond') spawnFloatingSparkles();

      setTimeout(() => newTop.classList.remove('entering'), 350);
    }

    currentCardIndex = (currentCardIndex + 1) % currentPack.length;
    updateCounter();
    isSwiping = false;
  }, 450);
}

function addRarityEffectsToElement(card, el) {
  el.querySelectorAll('.sparkle-container, .holo-overlay, .platinum-shimmer').forEach(e => e.remove());
  
  if (card.rarity === 'diamond') {
    const sc = document.createElement('div');
    sc.className = 'sparkle-container';
    for (let i = 0; i < 15; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 2 + 's';
      s.style.animationDuration = (1 + Math.random()) + 's';
      s.style.background = Math.random() > 0.5 ? 'var(--diamond)' : 'white';
      sc.appendChild(s);
    }
    el.appendChild(sc);
    const holo = document.createElement('div');
    holo.className = 'holo-overlay';
    el.appendChild(holo);
  }

  if (card.rarity === 'platinum') {
    const shimmer = document.createElement('div');
    shimmer.className = 'platinum-shimmer';
    el.appendChild(shimmer);
    const sc = document.createElement('div');
    sc.className = 'sparkle-container';
    for (let i = 0; i < 6; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 3 + 's';
      s.style.animationDuration = (2 + Math.random()) + 's';
      s.style.background = 'rgba(229,228,226,0.8)';
      s.style.width = '2px';
      s.style.height = '2px';
      sc.appendChild(s);
    }
    el.appendChild(sc);
  }
}

function spawnFloatingSparkles() {
  const stack = document.getElementById('cardStack');
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'sparkle-float';
      s.style.left = (Math.random() * 300) + 'px';
      s.style.top = (Math.random() * 420) + 'px';
      s.style.animation = 'sparkleFloat ' + (1 + Math.random() * 1.5) + 's ease forwards';
      s.style.width = (1 + Math.random() * 3) + 'px';
      s.style.height = s.style.width;
      stack.appendChild(s);
      setTimeout(() => s.remove(), 2500);
    }, i * 80);
  }
}

function closeReveal() {
  document.getElementById('cardReveal').classList.remove('active');
  const sg = document.getElementById('stackGlow');
  if (sg) sg.classList.remove('visible');
  document.getElementById('mainArea').classList.remove('fading-out');
  document.getElementById('ripBtn').disabled = false;
  isAnimating = false;
  viewingCollection = false;
  updateStats();
  renderCollection();
}

function addToCollection(card) {
  const existing = collection.find(c => c.id === card.id);
  if (existing) { existing.count++; }
  else { collection.push({ id: card.id, count: 1 }); }
  localStorage.setItem('thepack_collection', JSON.stringify(collection));
}

function updateStats() {
  document.getElementById('packCount').textContent = packsOpened;
  document.getElementById('cardCount').textContent = collection.reduce((sum, c) => sum + c.count, 0);
  document.getElementById('uniqueCount').textContent = collection.length;
  document.getElementById('diamondCount').textContent = collection.filter(c => {
    const card = CARDS.find(cd => cd.id === c.id);
    return card && card.rarity === 'diamond';
  }).length;
}

function renderCollection(filter) {
  filter = filter || 'all';
  const grid = document.getElementById('collectionGrid');
  if (collection.length === 0) {
    grid.innerHTML = '<div class="empty-collection">Rip a pack to start your collection</div>';
    return;
  }
  let items = collection
    .map(c => { const cd = CARDS.find(x => x.id === c.id); return cd ? Object.assign({}, cd, {count: c.count}) : null; })
    .filter(c => c && (filter === 'all' || c.rarity === filter));
  items.sort((a, b) => RARITY_ORDER[b.rarity] - RARITY_ORDER[a.rarity]);
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-collection">No ' + filter + ' cards yet</div>';
    return;
  }
  grid.innerHTML = items.map(card =>
    '<div class="collection-card ' + card.rarity + '" onclick="viewCard(' + card.id + ')" title="' + card.name + ' (x' + card.count + ')">' +
      '<div class="mini-emoji">' + card.emoji + '</div>' +
      '<div class="mini-name">' + card.name + '</div>' +
      '<div class="mini-rarity">' + card.rarity + (card.count > 1 ? ' \u00d7' + card.count : '') + '</div>' +
    '</div>'
  ).join('');
}

function viewCard(id) {
  const card = CARDS.find(c => c.id === id);
  if (!card) return;
  viewingCollection = true;
  currentPack = [card];
  currentCardIndex = 0;

  const reveal = document.getElementById('cardReveal');
  const stack = document.getElementById('cardStack');
  stack.innerHTML = '<div class="stack-glow" id="stackGlow"></div>';

  const el = document.createElement('div');
  el.className = 'stack-card ' + card.rarity;
  el.dataset.depth = '0';
  el.dataset.cardIndex = '0';
  el.innerHTML = buildCardHTML(card);
  stack.appendChild(el);
  addRarityEffectsToElement(card, el);

  const stackGlow = document.getElementById('stackGlow');
  if (card.rarity === 'diamond' || card.rarity === 'platinum') {
    stackGlow.style.background = 'radial-gradient(ellipse, ' + RARITY_COLORS[card.rarity] + ', transparent 70%)';
    stackGlow.classList.add('visible');
  }

  document.getElementById('cardCounter').textContent = '1 / 1';
  document.getElementById('cardHint').textContent = 'ESC to close';
  reveal.classList.add('active');
}

function filterCollection(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCollection(filter);
}

document.getElementById('cardStack').addEventListener('click', function(e) {
  if (e.target.closest('.stack-glow')) return;
  if (viewingCollection) return;
  swipeCard('right');
});

document.addEventListener('keydown', function(e) {
  const reveal = document.getElementById('cardReveal');
  if (!reveal.classList.contains('active')) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); openPack(); }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (!viewingCollection) swipeCard('right'); }
  if (e.key === 'ArrowLeft') { if (!viewingCollection) swipeCard('left'); }
  if (e.key === 'Escape') closeReveal();
});

</script>
</body>
</html>
