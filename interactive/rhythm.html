<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRETS — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --parchment: #E8E0D4;
  --lane1: #FF4466;
  --lane2: #44FF66;
  --lane3: #4488FF;
  --lane4: #FFD700;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: url('cursor.svg') 16 8, default;
  overflow: hidden;
}

a, button, .clickable { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* ── HEADER ── */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.8rem 2rem;
  background: rgba(10, 10, 10, 0.9);
  backdrop-filter: blur(10px);
  z-index: 100;
}

.header-logo-link { display: block; position: relative; height: 24px; }
.header-logo { height: 24px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── GAME WRAPPER ── */
.game-wrapper {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  position: relative;
}

/* ── MENU SCREEN ── */
.menu-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  text-align: center;
}

.menu-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 4rem;
  letter-spacing: 0.15em;
  background: linear-gradient(135deg, var(--accent), #FFD700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}

.menu-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.song-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 340px;
}

.song-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  transition: all 0.2s;
  text-align: left;
}

.song-card:hover {
  background: rgba(255,142,61,0.08);
  border-color: rgba(255,142,61,0.3);
  transform: translateY(-2px);
}

.song-bpm {
  font-size: 0.55rem;
  color: var(--accent);
  font-weight: 600;
  min-width: 45px;
}

.song-info { flex: 1; }
.song-name { font-size: 0.85rem; font-weight: 500; }
.song-diff { font-size: 0.6rem; color: var(--text-muted); margin-top: 2px; }

.song-stars {
  font-size: 0.7rem;
  color: #555;
  letter-spacing: 2px;
}

.song-stars .earned { color: #FFD700; }

.menu-keys {
  font-size: 0.6rem;
  color: #444;
  margin-top: 10px;
}

.menu-keys kbd {
  display: inline-block;
  padding: 2px 7px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 4px;
  font-family: 'Space Grotesk', monospace;
  font-size: 0.6rem;
  color: var(--text-muted);
}

/* ── GAME SCREEN ── */
.game-screen {
  display: none;
  width: 100%;
  height: 100%;
  position: relative;
}

.game-screen.active { display: flex; align-items: center; justify-content: center; }
.menu-screen.hidden { display: none; }

/* Highway */
.highway {
  position: relative;
  width: 320px;
  height: 85vh;
  max-height: 700px;
  background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,30,0.95) 100%);
  border-left: 2px solid rgba(255,255,255,0.06);
  border-right: 2px solid rgba(255,255,255,0.06);
  overflow: hidden;
}

/* Lane lines */
.highway::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 25%;
  width: 1px;
  background: rgba(255,255,255,0.04);
}

.highway::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 75%;
  width: 1px;
  background: rgba(255,255,255,0.04);
}

.lane-line-mid {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
  background: rgba(255,255,255,0.04);
}

/* Speed lines (scrolling bg) */
.highway-bg {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 48px,
    rgba(255,255,255,0.015) 48px,
    rgba(255,255,255,0.015) 50px
  );
  animation: scrollBg 0.8s linear infinite;
}

@keyframes scrollBg {
  to { transform: translateY(50px); }
}

/* Hit zone */
.hit-zone {
  position: absolute;
  bottom: 80px;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, transparent 2%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.15) 80%, transparent 98%);
  z-index: 10;
}

/* Target receptors */
.receptors {
  position: absolute;
  bottom: 72px;
  left: 0;
  right: 0;
  display: flex;
  z-index: 10;
}

.receptor {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 20px;
}

.receptor-key {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-weight: 600;
  color: #555;
  transition: all 0.08s;
}

.receptor-key.pressed {
  transform: scale(0.9);
}

.receptor-key[data-lane="0"] { color: var(--lane1); border-color: var(--lane1); }
.receptor-key[data-lane="1"] { color: var(--lane2); border-color: var(--lane2); }
.receptor-key[data-lane="2"] { color: var(--lane3); border-color: var(--lane3); }
.receptor-key[data-lane="3"] { color: var(--lane4); border-color: var(--lane4); }

.receptor-key.pressed[data-lane="0"] { background: rgba(255,68,102,0.3); box-shadow: 0 0 15px rgba(255,68,102,0.4); }
.receptor-key.pressed[data-lane="1"] { background: rgba(68,255,102,0.3); box-shadow: 0 0 15px rgba(68,255,102,0.4); }
.receptor-key.pressed[data-lane="2"] { background: rgba(68,136,255,0.3); box-shadow: 0 0 15px rgba(68,136,255,0.4); }
.receptor-key.pressed[data-lane="3"] { background: rgba(255,215,0,0.3); box-shadow: 0 0 15px rgba(255,215,0,0.4); }

/* Notes */
.note {
  position: absolute;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  transform: translateX(-50%);
  z-index: 5;
  transition: none;
}

.note[data-lane="0"] { background: var(--lane1); box-shadow: 0 0 8px rgba(255,68,102,0.4); }
.note[data-lane="1"] { background: var(--lane2); box-shadow: 0 0 8px rgba(68,255,102,0.4); }
.note[data-lane="2"] { background: var(--lane3); box-shadow: 0 0 8px rgba(68,136,255,0.4); }
.note[data-lane="3"] { background: var(--lane4); box-shadow: 0 0 8px rgba(255,215,0,0.4); }

.note.hit {
  opacity: 0;
  transform: translateX(-50%) scale(1.5);
  transition: all 0.15s;
}

/* Hold notes (long notes) */
.hold-tail {
  position: absolute;
  width: 12px;
  border-radius: 6px;
  transform: translateX(-50%);
  opacity: 0.5;
  z-index: 4;
}

.hold-tail[data-lane="0"] { background: var(--lane1); }
.hold-tail[data-lane="1"] { background: var(--lane2); }
.hold-tail[data-lane="2"] { background: var(--lane3); }
.hold-tail[data-lane="3"] { background: var(--lane4); }

/* Judgement text */
.judgement {
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
  pointer-events: none;
  animation: judgeFloat 0.5s ease-out forwards;
}

@keyframes judgeFloat {
  0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.2); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(0.8); }
}

.judgement.perfect { color: #FFD700; text-shadow: 0 0 15px rgba(255,215,0,0.6); }
.judgement.great { color: #44FF66; text-shadow: 0 0 15px rgba(68,255,102,0.6); }
.judgement.good { color: #4488FF; }
.judgement.miss { color: #FF4466; }

/* HUD */
.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 20;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
}

.hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
.hud-right { align-items: flex-end; }

.hud-score {
  font-size: 1.6rem;
  font-weight: 700;
  font-family: 'Space Grotesk', monospace;
  letter-spacing: 0.05em;
}

.hud-combo {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.hud-combo .combo-num {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent);
}

.hud-song {
  font-size: 0.65rem;
  color: var(--text-muted);
}

.hud-multiplier {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--accent);
}

/* Progress bar */
.progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(255,255,255,0.06);
  z-index: 20;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s linear;
}

/* Bottom key hints */
.key-hints {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  display: flex;
  z-index: 10;
}

.key-hint {
  flex: 1;
  text-align: center;
  font-size: 0.55rem;
  color: #333;
  letter-spacing: 0.1em;
}

/* ── SIDE PANELS ── */
.side-panel {
  width: 180px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.side-panel-left { align-items: flex-end; text-align: right; }
.side-panel-right { align-items: flex-start; }

.stat-block { display: flex; flex-direction: column; gap: 2px; }
.stat-label { font-size: 0.55rem; color: #444; text-transform: uppercase; letter-spacing: 1px; }
.stat-value { font-size: 1.1rem; font-weight: 600; }
.stat-value.score-val { color: var(--text); font-family: 'Space Grotesk', monospace; }
.stat-value.combo-val { color: var(--accent); }
.stat-value.mult-val { color: #FFD700; }
.stat-value.streak-val { color: var(--lane2); }

.accuracy-ring {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 3px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  margin: 0 auto;
}

.accuracy-pct { font-size: 1.2rem; font-weight: 700; }
.accuracy-label { font-size: 0.5rem; color: #555; }

/* ── RESULTS ── */
.results-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  text-align: center;
}

.results-screen.active { display: flex; }

.results-grade {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 5rem;
  line-height: 1;
}

.results-grade.s { color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.4); }
.results-grade.a { color: var(--lane2); }
.results-grade.b { color: var(--lane3); }
.results-grade.c { color: var(--accent); }
.results-grade.f { color: var(--lane1); }

.results-song { font-size: 1rem; color: var(--text-muted); }

.results-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 30px;
  text-align: left;
}

.result-stat-label { font-size: 0.6rem; color: #555; text-transform: uppercase; }
.result-stat-value { font-size: 1rem; font-weight: 600; }

.results-stars { font-size: 1.5rem; letter-spacing: 6px; }
.results-stars .empty { opacity: 0.2; }

.results-actions { display: flex; gap: 12px; }

.results-btn {
  padding: 10px 24px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem;
  transition: all 0.2s;
}

.results-btn:hover { background: rgba(255,255,255,0.06); }
.results-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.results-btn.primary:hover { opacity: 0.85; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .side-panel { display: none; }
  .highway { width: 100%; max-width: 360px; }
}
</style>
</head>

    <img src="logo-gray.svg" alt="ML" class="header-logo logo-default">

<!-- Game Wrapper -->
<div class="game-wrapper">

  <div class="game-screen" id="gameScreen">

<script>
// ═══════════════════════════════════════════════════
// AUDIO ENGINE (Web Audio API — procedural beats)
// ═══════════════════════════════════════════════════
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playHitSound(lane) {
  if (!audioCtx) return;
  const freq = [260, 330, 390, 520][lane];
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

function playMissSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.value = 100;
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

// Background beat
let beatInterval = null;
function startBeat(bpm) {
  if (!audioCtx) return;
  const msPerBeat = 60000 / bpm;
  let tick = 0;
  beatInterval = setInterval(() => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = tick % 4 === 0 ? 880 : 440;
    gain.gain.setValueAtTime(tick % 4 === 0 ? 0.06 : 0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
    tick++;
  }, msPerBeat);
}

function stopBeat() {
  if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
}

// Bass line
let bassInterval = null;
function startBass(bpm) {
  if (!audioCtx) return;
  const msPerBeat = 60000 / bpm;
  const bassNotes = [65, 73, 82, 73];
  let idx = 0;
  bassInterval = setInterval(() => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = bassNotes[idx % bassNotes.length];
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
    idx++;
  }, msPerBeat * 2);
}

function stopBass() {
  if (bassInterval) { clearInterval(bassInterval); bassInterval = null; }
}

// ═══════════════════════════════════════════════════
// SONG DATA — procedurally generated note charts
// ═══════════════════════════════════════════════════
const SONGS = [
  {
    id: 'warmup',
    name: 'Warm Up',
    artist: 'Tutorial',
    bpm: 100,
    difficulty: 'Easy',
    duration: 30000,
  },
  {
    id: 'midnight',
    name: 'Midnight Drive',
    artist: 'Synthwave',
    bpm: 120,
    difficulty: 'Medium',
    duration: 45000,
  },
  {
    id: 'neon',
    name: 'Neon Rush',
    artist: 'Electronic',
    bpm: 140,
    difficulty: 'Hard',
    duration: 50000,
  },
  {
    id: 'inferno',
    name: 'Inferno',
    artist: 'Metal',
    bpm: 170,
    difficulty: 'Expert',
    duration: 55000,
  },
];

function generateChart(song) {
  const notes = [];
  const msPerBeat = 60000 / song.bpm;
  const totalBeats = Math.floor(song.duration / msPerBeat);
  
  // Density increases with BPM
  const density = song.bpm <= 100 ? 0.4 : song.bpm <= 120 ? 0.55 : song.bpm <= 140 ? 0.7 : 0.8;
  
  let lastLane = -1;
  
  for (let beat = 4; beat < totalBeats - 2; beat++) {
    // On-beat notes
    if (Math.random() < density) {
      let lane = Math.floor(Math.random() * 4);
      // Avoid same lane 3x in a row
      if (lane === lastLane && Math.random() > 0.3) lane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
      
      notes.push({
        time: beat * msPerBeat,
        lane: lane,
        hit: false,
        missed: false,
      });
      lastLane = lane;
      
      // Doubles on harder songs
      if (song.bpm >= 140 && Math.random() < 0.15) {
        let lane2 = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
        notes.push({ time: beat * msPerBeat, lane: lane2, hit: false, missed: false });
      }
    }
    
    // Off-beat notes for harder songs
    if (song.bpm >= 120 && Math.random() < density * 0.3) {
      let lane = Math.floor(Math.random() * 4);
      notes.push({
        time: beat * msPerBeat + msPerBeat / 2,
        lane: lane,
        hit: false,
        missed: false,
      });
    }
  }
  
  return notes.sort((a, b) => a.time - b.time);
}

// ═══════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════
let game = {
  active: false,
  song: null,
  chart: [],
  startTime: 0,
  score: 0,
  combo: 0,
  maxCombo: 0,
  multiplier: 1,
  perfects: 0,
  greats: 0,
  goods: 0,
  misses: 0,
  totalNotes: 0,
  noteElements: [],
};

const LANE_KEYS = ['d', 'f', 'j', 'k'];
const keysDown = new Set();
const TRAVEL_TIME = 1800; // ms for note to travel from top to hit zone
const HIT_Y_PCT = 0.87; // hit zone position as % from top

// Timing windows (ms)
const PERFECT_WINDOW = 45;
const GREAT_WINDOW = 90;
const GOOD_WINDOW = 130;

// High scores
let highScores = JSON.parse(localStorage.getItem('frets_scores') || '{}');

// ═══════════════════════════════════════════════════
// MENU
// ═══════════════════════════════════════════════════
function buildMenu() {
  const list = document.getElementById('songList');
  list.innerHTML = '';
  
  SONGS.forEach(song => {
    const best = highScores[song.id];
    const stars = best ? getStars(best.accuracy) : 0;
    
    const card = document.createElement('div');
    card.className = 'song-card clickable';
    card.innerHTML = `
      <div class="song-bpm">${song.bpm} BPM</div>
      <div class="song-info">
        <div class="song-name">${song.name}</div>
        <div class="song-diff">${song.artist} · ${song.difficulty}</div>
      </div>
      <div class="song-stars">${'★'.split('').map(() => '').join('')}${Array(5).fill(0).map((_, i) => `<span class="${i < stars ? 'earned' : ''}">★</span>`).join('')}</div>
    `;
    card.addEventListener('click', () => startSong(song));
    list.appendChild(card);
  });
}

function getStars(accuracy) {
  if (accuracy >= 98) return 5;
  if (accuracy >= 90) return 4;
  if (accuracy >= 80) return 3;
  if (accuracy >= 65) return 2;
  if (accuracy >= 50) return 1;
  return 0;
}

// ═══════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════
function startSong(song) {
  initAudio();
  
  game = {
    active: true,
    song: song,
    chart: generateChart(song),
    startTime: performance.now() + 2000, // 2s lead-in
    score: 0,
    combo: 0,
    maxCombo: 0,
    multiplier: 1,
    perfects: 0,
    greats: 0,
    goods: 0,
    misses: 0,
    totalNotes: 0,
    noteElements: [],
  };
  
  game.totalNotes = game.chart.length;
  
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  
  // Start music after lead-in
  setTimeout(() => {
    if (game.active) {
      startBeat(song.bpm);
      startBass(song.bpm);
    }
  }, 2000);
  
  requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!game.active) return;
  
  const elapsed = timestamp - game.startTime;
  const highway = document.getElementById('highway');
  const hwHeight = highway.offsetHeight;
  const hitY = hwHeight * HIT_Y_PCT;
  
  // Spawn / update notes
  game.chart.forEach((note, i) => {
    if (note.hit || note.missed) return;
    
    const noteTime = note.time - elapsed;
    const yPos = hitY - (noteTime / TRAVEL_TIME) * hitY;
    
    // Create element if in range
    if (noteTime < TRAVEL_TIME && noteTime > -500) {
      if (!game.noteElements[i]) {
        const el = document.createElement('div');
        el.className = 'note';
        el.dataset.lane = note.lane;
        el.dataset.idx = i;
        const laneX = (note.lane + 0.5) * (320 / 4);
        el.style.left = laneX + 'px';
        highway.appendChild(el);
        game.noteElements[i] = el;
      }
      game.noteElements[i].style.top = yPos + 'px';
    }
    
    // Auto-miss if past window
    if (noteTime < -GOOD_WINDOW) {
      note.missed = true;
      game.misses++;
      game.combo = 0;
      game.multiplier = 1;
      showJudgement('miss');
      playMissSound();
      if (game.noteElements[i]) {
        game.noteElements[i].remove();
        game.noteElements[i] = null;
      }
    }
  });
  
  // Update HUD
  document.getElementById('sideScore').textContent = game.score.toLocaleString();
  document.getElementById('sideCombo').textContent = game.combo;
  document.getElementById('sideMult').textContent = `×${game.multiplier}`;
  document.getElementById('sideStreak').textContent = game.maxCombo;
  document.getElementById('sidePerfect').textContent = game.perfects;
  
  const totalHit = game.perfects + game.greats + game.goods + game.misses;
  const accuracy = totalHit > 0 ? Math.round(((game.perfects * 100 + game.greats * 75 + game.goods * 50) / (totalHit * 100)) * 100) : 100;
  document.getElementById('accuracyPct').textContent = accuracy + '%';
  
  // Progress bar
  const progress = Math.min(100, (elapsed / game.song.duration) * 100);
  document.getElementById('progressFill').style.width = progress + '%';
  
  // Check if song is done
  const allDone = game.chart.every(n => n.hit || n.missed);
  if (elapsed > game.song.duration + 2000 || allDone) {
    endSong();
    return;
  }
  
  requestAnimationFrame(gameLoop);
}

function hitNote(lane) {
  if (!game.active) return;
  
  const elapsed = performance.now() - game.startTime;
  
  // Find closest unhit note in this lane
  let closest = null;
  let closestDiff = Infinity;
  
  game.chart.forEach((note, i) => {
    if (note.lane !== lane || note.hit || note.missed) return;
    const diff = Math.abs(note.time - elapsed);
    if (diff < closestDiff && diff < GOOD_WINDOW) {
      closest = i;
      closestDiff = diff;
    }
  });
  
  if (closest === null) return;
  
  const note = game.chart[closest];
  note.hit = true;
  
  let judgement, points;
  if (closestDiff <= PERFECT_WINDOW) {
    judgement = 'perfect';
    points = 300;
    game.perfects++;
  } else if (closestDiff <= GREAT_WINDOW) {
    judgement = 'great';
    points = 200;
    game.greats++;
  } else {
    judgement = 'good';
    points = 100;
    game.goods++;
  }
  
  game.combo++;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;
  game.multiplier = Math.min(8, 1 + Math.floor(game.combo / 10));
  game.score += points * game.multiplier;
  
  showJudgement(judgement);
  playHitSound(lane);
  
  // Animate note out
  if (game.noteElements[closest]) {
    game.noteElements[closest].classList.add('hit');
    setTimeout(() => {
      game.noteElements[closest]?.remove();
      game.noteElements[closest] = null;
    }, 150);
  }
}

function showJudgement(type) {
  const highway = document.getElementById('highway');
  const el = document.createElement('div');
  el.className = `judgement ${type}`;
  el.textContent = type.toUpperCase();
  highway.appendChild(el);
  setTimeout(() => el.remove(), 500);
}

function endSong() {
  game.active = false;
  stopBeat();
  stopBass();
  
  // Clean up notes
  document.querySelectorAll('.note, .judgement').forEach(el => el.remove());
  game.noteElements = [];
  
  const totalHit = game.perfects + game.greats + game.goods + game.misses;
  const accuracy = totalHit > 0 ? Math.round(((game.perfects * 100 + game.greats * 75 + game.goods * 50) / (totalHit * 100)) * 100) : 100;
  
  // Grade
  let grade, gradeClass;
  if (accuracy >= 95) { grade = 'S'; gradeClass = 's'; }
  else if (accuracy >= 85) { grade = 'A'; gradeClass = 'a'; }
  else if (accuracy >= 70) { grade = 'B'; gradeClass = 'b'; }
  else if (accuracy >= 50) { grade = 'C'; gradeClass = 'c'; }
  else { grade = 'F'; gradeClass = 'f'; }
  
  const stars = getStars(accuracy);
  
  // Save high score
  const prev = highScores[game.song.id];
  if (!prev || game.score > prev.score) {
    highScores[game.song.id] = { score: game.score, accuracy };
    localStorage.setItem('frets_scores', JSON.stringify(highScores));
  }
  
  // Show results
  document.getElementById('gameScreen').classList.remove('active');
  const results = document.getElementById('resultsScreen');
  results.classList.add('active');
  
  document.getElementById('resultsGrade').textContent = grade;
  document.getElementById('resultsGrade').className = `results-grade ${gradeClass}`;
  document.getElementById('resultsSong').textContent = `${game.song.name} — ${game.song.difficulty}`;
  document.getElementById('resultsStars').innerHTML = Array(5).fill(0).map((_, i) => `<span class="${i >= stars ? 'empty' : ''}">${i < stars ? '★' : '☆'}</span>`).join('');
  
  document.getElementById('resultsStats').innerHTML = `
    <div><div class="result-stat-label">Score</div><div class="result-stat-value">${game.score.toLocaleString()}</div></div>
    <div><div class="result-stat-label">Accuracy</div><div class="result-stat-value">${accuracy}%</div></div>
    <div><div class="result-stat-label">Perfect</div><div class="result-stat-value" style="color:#FFD700;">${game.perfects}</div></div>
    <div><div class="result-stat-label">Great</div><div class="result-stat-value" style="color:#44FF66;">${game.greats}</div></div>
    <div><div class="result-stat-label">Good</div><div class="result-stat-value" style="color:#4488FF;">${game.goods}</div></div>
    <div><div class="result-stat-label">Miss</div><div class="result-stat-value" style="color:#FF4466;">${game.misses}</div></div>
    <div><div class="result-stat-label">Max Combo</div><div class="result-stat-value" style="color:var(--accent);">${game.maxCombo}</div></div>
    <div><div class="result-stat-label">Max Mult</div><div class="result-stat-value" style="color:#FFD700;">×${game.multiplier}</div></div>
  `;
}

function backToMenu() {
  game.active = false;
  stopBeat();
  stopBass();
  document.querySelectorAll('.note, .judgement').forEach(el => el.remove());
  game.noteElements = [];
  
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('menuScreen').classList.remove('hidden');
  buildMenu();
}

// ═══════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  
  if (key === 'escape') { backToMenu(); return; }
  
  const laneIdx = LANE_KEYS.indexOf(key);
  if (laneIdx === -1) return;
  
  keysDown.add(key);
  
  // Visual feedback
  const receptor = document.querySelector(`.receptor-key[data-lane="${laneIdx}"]`);
  if (receptor) receptor.classList.add('pressed');
  
  if (game.active) hitNote(laneIdx);
});

document.addEventListener('keyup', (e) => {
  const key = e.key.toLowerCase();
  keysDown.delete(key);
  
  const laneIdx = LANE_KEYS.indexOf(key);
  if (laneIdx === -1) return;
  
  const receptor = document.querySelector(`.receptor-key[data-lane="${laneIdx}"]`);
  if (receptor) receptor.classList.remove('pressed');
});

// Button bindings
document.getElementById('retryBtn').addEventListener('click', () => {
  if (game.song) startSong(game.song);
});
document.getElementById('menuBtn').addEventListener('click', backToMenu);

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
buildMenu();
</script>
</body>
</html>
