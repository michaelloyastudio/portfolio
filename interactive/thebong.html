<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bong — Mike vs Stank</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #E8E0D4;
    font-family: 'Space Grotesk', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; text-align: center; position: absolute; inset: 0; }
  .screen.active { display: flex; }

  /* INTRO */
  #intro h1 { font-size: 4.5rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  .sub { font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase; color: #8a8580; margin-bottom: 3.5rem; }
  .vs-row { display: flex; align-items: center; gap: 2.5rem; margin-bottom: 3.5rem; }
  .pcard { width: 130px; padding: 1.25rem 1rem; border: 1px solid rgba(232,224,212,0.1); border-radius: 12px; }
  .pcard .pn { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.06em; }
  .cta { background: none; border: 1px solid rgba(232,224,212,0.18); color: #8a8580; font-family: inherit; font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase; padding: 0.7rem 2.2rem; border-radius: 999px; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
  .cta:hover { border-color: rgba(232,224,212,0.45); color: #E8E0D4; }

  /* GAME */
  #game { position: relative; justify-content: flex-start; padding-top: 3rem; }

  /* Scoreboard at top */
  .scoreboard {
    display: flex;
    gap: 0;
    width: 100%;
    max-width: 460px;
    margin-bottom: 2.5rem;
    border: 1px solid rgba(232,224,212,0.08);
    border-radius: 12px;
    overflow: hidden;
  }
  .sb-player {
    flex: 1;
    padding: 1rem;
    text-align: center;
    transition: background 0.3s;
  }
  .sb-player.active-turn { background: rgba(255,142,61,0.07); }
  .sb-player + .sb-player { border-left: 1px solid rgba(232,224,212,0.08); }
  .sb-name { font-size: 0.6rem; letter-spacing: 0.28em; text-transform: uppercase; color: #8a8580; margin-bottom: 0.5rem; }
  .sb-name.active { color: #ff8e3d; }
  .sb-hits { font-size: 2rem; font-weight: 600; line-height: 1; margin-bottom: 0.2rem; }
  .sb-hits-label { font-size: 0.55rem; letter-spacing: 0.22em; text-transform: uppercase; color: #8a8580; margin-bottom: 0.5rem; }
  .sb-time { font-size: 0.8rem; color: rgba(232,224,212,0.5); }
  .sb-time span { color: #E8E0D4; font-weight: 500; }

  /* Center section */
  .center-area { display: flex; flex-direction: column; align-items: center; }

  .now-label { font-size: 0.65rem; letter-spacing: 0.32em; text-transform: uppercase; color: #8a8580; margin-bottom: 0.3rem; }
  .player-name { font-size: 2.5rem; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 1rem; }

  .big-timer { font-size: 6.5rem; font-weight: 500; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; transition: color 0.3s; }
  .big-timer.low { color: #ff8e3d; animation: shk 0.12s ease-in-out infinite; }
  @keyframes shk { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  .secs-label { font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase; color: #8a8580; margin-bottom: 1rem; }

  /* Bong */
  .bong-area { position: relative; width: 80px; height: 115px; margin: 0 auto 1rem; }
  .smoke-wrap { position: absolute; top: -65px; left: 50%; transform: translateX(-50%); width: 60px; height: 65px; pointer-events: none; }
  .puff { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(232,224,212,0.5) 0%, transparent 70%); pointer-events: none; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0.7; transform: scale(0.25) translateY(0); } 100% { opacity: 0; transform: scale(2.6) translateY(-50px); } }
  .bong-water { transition: fill 0.25s; }
  .bong-water.on { fill: rgba(100,180,255,0.5); animation: bub 0.3s ease-in-out infinite alternate; }
  @keyframes bub { from { transform: scaleY(1); } to { transform: scaleY(1.07); transform-origin: bottom; } }

  .tap-hint { font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; border: 1px solid rgba(232,224,212,0.18); border-radius: 8px; padding: 0.55rem 1.5rem; color: rgba(232,224,212,0.6); animation: blip 1.4s ease-in-out infinite; }
  @keyframes blip { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* RESULTS */
  #results h2 { font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase; color: #8a8580; margin-bottom: 2.5rem; }
  .res-row { display: flex; align-items: center; gap: 3rem; margin-bottom: 2.5rem; }
  .res-p { text-align: center; }
  .res-p .rn { font-size: 1.8rem; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
  .res-p .rstat { font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: #8a8580; line-height: 1.8; }
  .res-p .rstat span { color: #E8E0D4; font-weight: 600; letter-spacing: 0; font-size: 0.9rem; }
  .res-p.winner .rn { color: #ff8e3d; }
  .res-p.winner .rstat span { color: #ff8e3d; }
  .res-p.loser .rn { opacity: 0.4; }
  .res-div { font-size: 0.75rem; letter-spacing: 0.3em; color: rgba(138,133,128,0.25); }
  .win-line { font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.35rem; }
  .win-line span { color: #ff8e3d; font-weight: 600; }
  .win-sub { font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: #8a8580; margin-bottom: 2.5rem; }
</style>
</head>
<body>

<!-- INTRO -->
<div class="screen active" id="intro">
  <h1>The Bong</h1>
  <p class="sub">keep passing. tap space when you're done. whoever taps out loses.</p>
  <div class="vs-row">
    <div class="pcard"><div class="pn">MIKE</div></div>
    <div class="vs-txt" style="font-size:0.75rem;letter-spacing:0.3em;color:#8a8580;">VS</div>
    <div class="pcard"><div class="pn">STANK</div></div>
  </div>
  <button class="cta" onclick="startGame()">Press Space to Start</button>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="sb-player" id="sbMike">
      <div class="sb-name" id="sbMikeName">MIKE</div>
      <div class="sb-hits" id="sbMikeHits">0</div>
      <div class="sb-hits-label">hits</div>
      <div class="sb-time">total: <span id="sbMikeTime">0s</span></div>
    </div>
    <div class="sb-player" id="sbStank">
      <div class="sb-name" id="sbStankName">STANK</div>
      <div class="sb-hits" id="sbStankHits">0</div>
      <div class="sb-hits-label">hits</div>
      <div class="sb-time">total: <span id="sbStankTime">0s</span></div>
    </div>
  </div>

  <div class="center-area">
    <div class="now-label">hitting now</div>
    <div class="player-name" id="playerName">—</div>

    <div class="big-timer" id="bigTimer">60</div>
    <div class="secs-label">seconds</div>

    <div class="bong-area">
      <div class="smoke-wrap" id="smokeWrap"></div>
      <svg width="80" height="115" viewBox="0 0 80 115" fill="none">
        <rect x="25" y="38" width="30" height="65" rx="5" fill="rgba(232,224,212,0.05)" stroke="rgba(232,224,212,0.18)" stroke-width="1.5"/>
        <rect class="bong-water" id="bongWater" x="26.5" y="76" width="27" height="25" rx="3" fill="rgba(100,180,255,0.2)"/>
        <line x1="38" y1="85" x2="18" y2="100" stroke="rgba(232,224,212,0.22)" stroke-width="1.5" stroke-linecap="round"/>
        <ellipse cx="16" cy="101" rx="6" ry="3.5" fill="rgba(232,224,212,0.08)" stroke="rgba(232,224,212,0.25)" stroke-width="1.5"/>
        <ellipse cx="16" cy="100" rx="3.5" ry="2" id="bowlGlow" fill="rgba(255,142,61,0)"/>
        <rect x="30" y="8" width="20" height="33" rx="10" fill="rgba(232,224,212,0.05)" stroke="rgba(232,224,212,0.18)" stroke-width="1.5"/>
        <path d="M25 54 L32 50 M55 54 L48 50" stroke="rgba(232,224,212,0.1)" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="tap-hint">SPACE — done hitting, pass it</div>
  </div>
</div>

<!-- RESULTS -->
<div class="screen" id="results">
  <h2>Game Over</h2>
  <div class="res-row">
    <div class="res-p" id="resMike">
      <div class="rn">MIKE</div>
      <div class="rstat">hits: <span id="rMikeHits">0</span><br>total: <span id="rMikeTime">0s</span></div>
    </div>
    <div class="res-div">VS</div>
    <div class="res-p" id="resStank">
      <div class="rn">STANK</div>
      <div class="rstat">hits: <span id="rStankHits">0</span><br>total: <span id="rStankTime">0s</span></div>
    </div>
  </div>
  <div class="win-line" id="winLine"></div>
  <div class="win-sub" id="winSub"></div>
  <button class="cta" onclick="resetGame()">Rematch</button>
</div>

<script>
const ROUND = 60;

let order = [];
let turn = 0;
let stats = { MIKE: { hits: 0, total: 0 }, STANK: { hits: 0, total: 0 } };
let timeLeft = ROUND;
let interval = null;
let smokeLoop = null;
let phase = 'intro';
let turnStartTime = 0;

function shuffle(a) { return Math.random() < 0.5 ? [...a] : [...a].reverse(); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function startGame() {
  order = shuffle(['MIKE', 'STANK']);
  stats = { MIKE: { hits: 0, total: 0 }, STANK: { hits: 0, total: 0 } };
  turn = 0;
  updateScoreboard();
  show('game');
  startTurn();
}

function startTurn() {
  clearInterval(interval);
  timeLeft = ROUND;
  phase = 'going';
  turnStartTime = Date.now();

  const player = order[turn];
  document.getElementById('playerName').textContent = player;
  document.getElementById('bigTimer').textContent = ROUND;
  document.getElementById('bigTimer').classList.remove('low');

  // Highlight active player
  document.getElementById('sbMike').classList.toggle('active-turn', player === 'MIKE');
  document.getElementById('sbStank').classList.toggle('active-turn', player === 'STANK');
  document.getElementById('sbMikeName').classList.toggle('active', player === 'MIKE');
  document.getElementById('sbStankName').classList.toggle('active', player === 'STANK');

  setLit(true);

  interval = setInterval(function() {
    timeLeft--;
    const el = document.getElementById('bigTimer');
    el.textContent = timeLeft;
    if (timeLeft <= 10) el.classList.add('low');
    if (timeLeft <= 0) {
      // Timer ran out — this player tapped out (couldn't pass it)
      clearInterval(interval);
      setLit(false);
      endGame(order[turn]); // loser = current player
    }
  }, 1000);
}

function passIt() {
  if (phase !== 'going') return;
  clearInterval(interval);
  setLit(false);

  const player = order[turn];
  const held = ROUND - timeLeft;
  stats[player].hits++;
  stats[player].total += held;
  updateScoreboard();

  // Next player
  turn = (turn + 1) % 2;
  setTimeout(startTurn, 400);
}

function endGame(loser) {
  phase = 'over';
  setLit(false);

  const winner = loser === 'MIKE' ? 'STANK' : 'MIKE';
  const ms = stats['MIKE'];
  const ss = stats['STANK'];

  document.getElementById('rMikeHits').textContent = ms.hits;
  document.getElementById('rMikeTime').textContent = ms.total + 's';
  document.getElementById('rStankHits').textContent = ss.hits;
  document.getElementById('rStankTime').textContent = ss.total + 's';

  document.getElementById('resMike').classList.remove('winner','loser');
  document.getElementById('resStank').classList.remove('winner','loser');

  if (loser === 'MIKE') {
    document.getElementById('resMike').classList.add('loser');
    document.getElementById('resStank').classList.add('winner');
    document.getElementById('winLine').innerHTML = '<span>STANK</span> wins';
    document.getElementById('winSub').textContent = 'mike tapped out.';
  } else {
    document.getElementById('resStank').classList.add('loser');
    document.getElementById('resMike').classList.add('winner');
    document.getElementById('winLine').innerHTML = '<span>MIKE</span> wins';
    document.getElementById('winSub').textContent = 'stank tapped out.';
  }

  show('results');
}

function resetGame() {
  clearInterval(interval);
  stopSmoke();
  setLit(false);
  phase = 'intro';
  show('intro');
}

function updateScoreboard() {
  document.getElementById('sbMikeHits').textContent = stats['MIKE'].hits;
  document.getElementById('sbStankHits').textContent = stats['STANK'].hits;
  document.getElementById('sbMikeTime').textContent = stats['MIKE'].total + 's';
  document.getElementById('sbStankTime').textContent = stats['STANK'].total + 's';
}

// Bong visuals
function setLit(on) {
  document.getElementById('bongWater').classList.toggle('on', on);
  document.getElementById('bowlGlow').style.fill = on ? 'rgba(255,142,61,0.7)' : 'rgba(255,142,61,0)';
  if (on) startSmoke(); else stopSmoke();
}
function startSmoke() {
  stopSmoke();
  smokeLoop = setInterval(function() {
    const c = document.getElementById('smokeWrap');
    const p = document.createElement('div');
    p.className = 'puff';
    const sz = 10 + Math.random() * 16;
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${14+Math.random()*22}px;top:8px;animation-duration:${0.8+Math.random()*0.6}s`;
    c.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }, 150);
}
function stopSmoke() { clearInterval(smokeLoop); smokeLoop = null; }

// Input
document.addEventListener('keydown', function(e) {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (phase === 'intro') { startGame(); return; }
  if (phase === 'going') { passIt(); return; }
  if (phase === 'over') { resetGame(); return; }
});
document.addEventListener('touchstart', function(e) {
  if (e.target.tagName === 'BUTTON') return;
  if (phase === 'intro') { startGame(); return; }
  if (phase === 'going') { passIt(); return; }
  if (phase === 'over') { resetGame(); return; }
}, { passive: true });
</script>
</body>
</html>
