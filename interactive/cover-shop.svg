<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <!-- Abstract price tags / hanging cards -->
  <g opacity="0.8">
    <!-- Tag 1 -->
    <line x1="120" y1="40" x2="120" y2="100" stroke="#3d2b1f" stroke-width="1"/>
    <rect x="90" y="100" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#3d2b1f" stroke-width="0.5"/>
    <circle cx="120" cy="108" r="4" fill="none" stroke="#3d2b1f" stroke-width="0.5"/>
    <rect x="100" y="130" width="40" height="3" rx="1.5" fill="#ff8e3d" opacity="0.6"/>
    <rect x="105" y="140" width="30" height="2" rx="1" fill="#8a8580" opacity="0.4"/>
    <rect x="108" y="150" width="24" height="2" rx="1" fill="#8a8580" opacity="0.3"/>
  </g>
  <g opacity="0.9">
    <!-- Tag 2 (center, larger) -->
    <line x1="200" y1="20" x2="200" y2="110" stroke="#3d2b1f" stroke-width="1"/>
    <rect x="160" y="110" width="80" height="110" rx="5" fill="#1a1a1a" stroke="#ff8e3d" stroke-width="0.8" opacity="1"/>
    <circle cx="200" cy="120" r="5" fill="none" stroke="#ff8e3d" stroke-width="0.5"/>
    <rect x="174" y="148" width="52" height="4" rx="2" fill="#ff8e3d" opacity="0.8"/>
    <rect x="180" y="162" width="40" height="2.5" rx="1" fill="#8a8580" opacity="0.5"/>
    <rect x="184" y="174" width="32" height="2.5" rx="1" fill="#8a8580" opacity="0.35"/>
    <rect x="178" y="196" width="44" height="12" rx="3" fill="#ff8e3d" opacity="0.15"/>
    <text x="200" y="205" text-anchor="middle" fill="#ff8e3d" font-family="'Space Grotesk',sans-serif" font-size="7" font-weight="600" opacity="0.7">$</text>
  </g>
  <g opacity="0.7">
    <!-- Tag 3 -->
    <line x1="290" y1="60" x2="290" y2="130" stroke="#3d2b1f" stroke-width="1"/>
    <rect x="260" y="130" width="60" height="80" rx="4" fill="#1a1a1a" stroke="#3d2b1f" stroke-width="0.5"/>
    <circle cx="290" cy="138" r="4" fill="none" stroke="#3d2b1f" stroke-width="0.5"/>
    <rect x="270" y="160" width="40" height="3" rx="1.5" fill="#ff8e3d" opacity="0.5"/>
    <rect x="275" y="170" width="30" height="2" rx="1" fill="#8a8580" opacity="0.4"/>
    <rect x="278" y="180" width="24" height="2" rx="1" fill="#8a8580" opacity="0.3"/>
  </g>
  <!-- Scattered dots -->
  <circle cx="70" cy="300" r="2" fill="#ff8e3d" opacity="0.2"/>
  <circle cx="340" cy="280" r="1.5" fill="#ff8e3d" opacity="0.15"/>
  <circle cx="150" cy="340" r="1" fill="#8a8580" opacity="0.2"/>
  <circle cx="250" cy="320" r="1.5" fill="#8a8580" opacity="0.15"/>
  <!-- Title -->
  <text x="200" y="370" text-anchor="middle" fill="#8a8580" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="500" letter-spacing="0.15em">THE SHOP</text>
</svg>
