<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f0ece4;font-family:'Space Grotesk',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;cursor:url('cursor.svg') 15 12, auto}

/* HEADER */
.header{height:48px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #1a1a1a;flex-shrink:0;z-index:10}
.logo{width:28px;height:28px;opacity:.7}
.header-title{margin-left:12px;font-size:13px;font-weight:500;color:#f0ece488;letter-spacing:.5px}
.header-balance{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:14px;color:#4ade80}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden}

/* GAME AREA */
.game-area{flex:1;position:relative;overflow:hidden}
.game-area canvas{display:block;width:100%;height:100%}

/* SIDEBAR */
.sidebar{width:260px;border-left:1px solid #1a1a1a;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-header{padding:16px 18px;border-bottom:1px solid #1a1a1a}
.sidebar-header h2{font-family:'Press Start 2P',monospace;font-size:10px;color:#f0ece488;letter-spacing:1px}
.stats{padding:14px 18px;border-bottom:1px solid #1a1a1a;display:flex;flex-direction:column;gap:6px}
.stat{display:flex;justify-content:space-between;font-size:13px;color:#f0ece4aa}
.stat .val{color:#f0ece4;font-weight:600;font-variant-numeric:tabular-nums}
.upgrades{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.upgrade{background:#111;border:1px solid #222;border-radius:8px;padding:14px;cursor:url('crosshair.svg') 13 13, crosshair;transition:all .15s}
.upgrade:hover{border-color:#333;background:#151515}
.upgrade.maxed{opacity:.5;cursor:not-allowed}
.upgrade.cant-afford{opacity:.6}
.upgrade-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.upgrade-name{font-size:13px;font-weight:600}
.upgrade-level{font-family:'Press Start 2P',monospace;font-size:9px;color:#f0ece466}
.upgrade-desc{font-size:12px;color:#f0ece466;margin-bottom:10px;line-height:1.5}
.upgrade-cost{display:flex;align-items:center;gap:6px}
.upgrade-cost .price{font-family:'Press Start 2P',monospace;font-size:11px;color:#4ade80}
.upgrade-cost .label{font-size:11px;color:#f0ece444}
.upgrade.cant-afford .price{color:#ef4444}

/* FOOTER */
.footer{height:36px;display:flex;align-items:center;justify-content:center;border-top:1px solid #1a1a1a;flex-shrink:0}
.footer span{font-size:11px;color:#f0ece433;letter-spacing:.5px}

/* CLICK EFFECT */
.click-pop{position:absolute;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:12px;color:#4ade80;z-index:5;animation:popUp .6s ease-out forwards}
.click-pop.golden{color:#fbbf24;font-size:14px}
@keyframes popUp{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-40px) scale(1.2)}
}

/* TOAST */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#4ade80;color:#0a0a0a;font-family:'Press Start 2P',monospace;font-size:10px;padding:10px 20px;border-radius:6px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <img class="logo" src="logo.svg" alt="ML" onerror="this.style.display='none'">
  <span class="header-title">Cash Machine</span>
  <span class="header-balance" id="balanceDisplay">$0</span>
</div>

<div class="main">
  <div class="game-area" id="gameArea">
    <canvas id="canvas"></canvas>
  </div>
  <div class="sidebar">
    <div class="sidebar-header"><h2>UPGRADES</h2></div>
    <div class="stats">
      <div class="stat"><span>Bills Collected</span><span class="val" id="statCollected">0</span></div>
      <div class="stat"><span>Golden Bills</span><span class="val" id="statGolden">0</span></div>
      <div class="stat"><span>Total Earned</span><span class="val" id="statEarned">$0</span></div>
    </div>
    <div class="upgrades" id="upgradesContainer"></div>
  </div>
</div>

<div class="footer"><span>© Mike Industries</span></div>
<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────
const state = {
  balance: 0,
  totalEarned: 0,
  collected: 0,
  goldenCollected: 0,
  upgrades: {
    maxBills:    { level: 1, base: 1 },
    billValue:   { level: 1, base: 1 },
    goldenChance:{ level: 0, base: 0 },
    billSpeed:   { level: 1, base: 1 },
  }
};

// ── UPGRADE DEFINITIONS ────────────────────
const upgradeDefs = [
  {
    key: 'maxBills',
    name: 'Bill Count',
    desc: 'Max bills floating at once',
    maxLevel: 20,
    cost: lvl => Math.floor(15 * Math.pow(1.6, lvl - 1)),
    effect: lvl => lvl,
    display: lvl => lvl + ' bills'
  },
  {
    key: 'billValue',
    name: 'Bill Value',
    desc: 'How much each bill is worth',
    maxLevel: 30,
    cost: lvl => Math.floor(25 * Math.pow(1.5, lvl - 1)),
    effect: lvl => lvl,
    display: lvl => '$' + lvl
  },
  {
    key: 'goldenChance',
    name: 'Golden Bills',
    desc: '10x value, faster, despawn',
    maxLevel: 15,
    cost: lvl => Math.floor(80 * Math.pow(1.7, lvl)),
    effect: lvl => Math.min(lvl * 5, 60),
    display: lvl => lvl === 0 ? 'Locked' : (Math.min(lvl * 5, 60)) + '% chance'
  },
  {
    key: 'billSpeed',
    name: 'Slow Motion',
    desc: 'Slows bills down (easier clicks)',
    maxLevel: 10,
    cost: lvl => Math.floor(50 * Math.pow(1.8, lvl - 1)),
    effect: lvl => Math.max(1 - (lvl - 1) * 0.07, 0.4),
    display: lvl => lvl === 1 ? 'Normal' : '-' + Math.round((1 - Math.max(1 - (lvl - 1) * 0.07, 0.4)) * 100) + '% speed'
  }
];

// ── BILLS ──────────────────────────────────
const bills = [];
const BILL_W = 96;
const BILL_H = 44;
const GOLDEN_W = 96;
const GOLDEN_H = 44;
const GOLDEN_DESPAWN = 4000; // ms

class Bill {
  constructor(isGolden = false) {
    this.golden = isGolden;
    this.w = this.golden ? GOLDEN_W : BILL_W;
    this.h = this.golden ? GOLDEN_H : BILL_H;
    this.x = Math.random() * (canvas.width - this.w);
    this.y = Math.random() * (canvas.height - this.h);
    const baseSpeed = 1.5 + Math.random() * 1.5;
    const speedMult = this.golden ? 2.5 : 1;
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * baseSpeed * speedMult;
    this.vy = Math.sin(angle) * baseSpeed * speedMult;
    this.spawnTime = Date.now();
    this.alive = true;
    this.opacity = 1;
    this.flash = 0;
  }

  update(speedMult) {
    this.x += this.vx * speedMult;
    this.y += this.vy * speedMult;

    // Bounce off walls
    if (this.x <= 0) { this.x = 0; this.vx *= -1; }
    if (this.x + this.w >= canvas.width) { this.x = canvas.width - this.w; this.vx *= -1; }
    if (this.y <= 0) { this.y = 0; this.vy *= -1; }
    if (this.y + this.h >= canvas.height) { this.y = canvas.height - this.h; this.vy *= -1; }

    // Golden despawn
    if (this.golden) {
      const age = Date.now() - this.spawnTime;
      if (age > GOLDEN_DESPAWN - 1000) {
        this.opacity = Math.max(0, 1 - (age - (GOLDEN_DESPAWN - 1000)) / 1000);
        this.flash = Math.sin(age / 80) * 0.5 + 0.5;
      }
      if (age > GOLDEN_DESPAWN) {
        this.alive = false;
      }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    
    const x = Math.floor(this.x);
    const y = Math.floor(this.y);

    if (this.golden) {
      // Golden bill — bright gold, pixel style
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(x, y, this.w, this.h);
      // Inner
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(x + 2, y + 2, this.w - 4, this.h - 4);
      // Shine
      ctx.fillStyle = '#fde68a';
      ctx.fillRect(x + 4, y + 4, this.w - 8, 2);
      // $ symbol
      ctx.fillStyle = '#92400e';
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', x + this.w / 2, y + this.h / 2 + 1);
      // Border
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, this.w, this.h);

      // Flash effect when about to despawn
      if (this.flash > 0) {
        ctx.globalAlpha = this.flash * 0.3;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x, y, this.w, this.h);
      }
    } else {
      // Normal bill — green, pixel style
      ctx.fillStyle = '#166534';
      ctx.fillRect(x, y, this.w, this.h);
      // Inner lighter area
      ctx.fillStyle = '#15803d';
      ctx.fillRect(x + 2, y + 2, this.w - 4, this.h - 4);
      // Pattern lines
      ctx.fillStyle = '#166534';
      ctx.fillRect(x + 4, y + 4, this.w - 8, 1);
      ctx.fillRect(x + 4, y + this.h - 5, this.w - 8, 1);
      // $ symbol
      ctx.fillStyle = '#bbf7d0';
      ctx.font = '14px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', x + this.w / 2, y + this.h / 2 + 1);
      // Border
      ctx.strokeStyle = '#14532d';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, this.w, this.h);
    }
    
    ctx.restore();
  }

  hitTest(mx, my) {
    const pad = 16;
    return mx >= this.x - pad && mx <= this.x + this.w + pad && my >= this.y - pad && my <= this.y + this.h + pad;
  }
}

// ── CANVAS SETUP ───────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const gameArea = document.getElementById('gameArea');

function resize() {
  canvas.width = gameArea.clientWidth;
  canvas.height = gameArea.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ── CLICK HANDLING ─────────────────────────
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  // Check bills in reverse order (top-most first)
  for (let i = bills.length - 1; i >= 0; i--) {
    const b = bills[i];
    if (b.alive && b.hitTest(mx, my)) {
      const value = b.golden 
        ? state.upgrades.billValue.level * 10 
        : state.upgrades.billValue.level;
      
      state.balance += value;
      state.totalEarned += value;
      state.collected++;
      if (b.golden) state.goldenCollected++;

      b.alive = false;
      showClickPop(e.clientX, e.clientY, value, b.golden);
      updateUI();
      break;
    }
  }
});

// ── CLICK POPUP ────────────────────────────
function showClickPop(x, y, value, golden) {
  const pop = document.createElement('div');
  pop.className = 'click-pop' + (golden ? ' golden' : '');
  pop.textContent = '+$' + value;
  pop.style.left = x + 'px';
  pop.style.top = (y - 10) + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 600);
}

// ── TOAST ──────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1500);
}

// ── SPAWN LOGIC ────────────────────────────
function getMaxBills() { return state.upgrades.maxBills.level; }
function getGoldenChance() { return state.upgrades.goldenChance.level === 0 ? 0 : Math.min(state.upgrades.goldenChance.level * 5, 60); }
function getSpeedMult() { return Math.max(1 - (state.upgrades.billSpeed.level - 1) * 0.07, 0.4); }

function spawnIfNeeded() {
  const alive = bills.filter(b => b.alive).length;
  const max = getMaxBills();
  while (bills.filter(b => b.alive).length < max) {
    const golden = Math.random() * 100 < getGoldenChance();
    bills.push(new Bill(golden));
  }
}

// ── GAME LOOP ──────────────────────────────
function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw subtle grid
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  const speed = getSpeedMult();

  // Remove dead bills
  for (let i = bills.length - 1; i >= 0; i--) {
    if (!bills[i].alive) bills.splice(i, 1);
  }

  spawnIfNeeded();

  for (const b of bills) {
    b.update(speed);
    b.draw(ctx);
  }

  requestAnimationFrame(gameLoop);
}

// ── UI ─────────────────────────────────────
function formatMoney(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'K';
  return '$' + n;
}

function updateUI() {
  document.getElementById('balanceDisplay').textContent = formatMoney(state.balance);
  document.getElementById('statCollected').textContent = state.collected;
  document.getElementById('statGolden').textContent = state.goldenCollected;
  document.getElementById('statEarned').textContent = formatMoney(state.totalEarned);
  renderUpgrades();
}

function renderUpgrades() {
  const container = document.getElementById('upgradesContainer');
  container.innerHTML = '';
  
  for (const def of upgradeDefs) {
    const up = state.upgrades[def.key];
    const isMaxed = up.level >= def.maxLevel;
    const cost = isMaxed ? 0 : def.cost(up.level);
    const canAfford = state.balance >= cost;

    const div = document.createElement('div');
    div.className = 'upgrade' + (isMaxed ? ' maxed' : (!canAfford ? ' cant-afford' : ''));
    
    div.innerHTML = `
      <div class="upgrade-top">
        <span class="upgrade-name">${def.name}</span>
        <span class="upgrade-level">Lv ${up.level}${isMaxed ? ' MAX' : ''}</span>
      </div>
      <div class="upgrade-desc">${def.desc} → ${def.display(up.level)}</div>
      ${isMaxed ? '' : `<div class="upgrade-cost"><span class="price">${formatMoney(cost)}</span><span class="label">to upgrade</span></div>`}
    `;

    if (!isMaxed) {
      div.addEventListener('click', () => {
        const currentCost = def.cost(up.level);
        if (state.balance >= currentCost) {
          state.balance -= currentCost;
          up.level++;
          showToast(def.name + ' → Lv ' + up.level);
          updateUI();
          saveGame();
        }
      });
    }

    container.appendChild(div);
  }
}

// ── SAVE / LOAD ────────────────────────────
function saveGame() {
  localStorage.setItem('cash-machine-save', JSON.stringify(state));
}

function loadGame() {
  const saved = localStorage.getItem('cash-machine-save');
  if (saved) {
    const s = JSON.parse(saved);
    Object.assign(state, s);
  }
}

// Auto-save every 10s
setInterval(saveGame, 10000);

// ── INIT ───────────────────────────────────
loadGame();
updateUI();
spawnIfNeeded();
gameLoop();
</script>

</body>
</html>
