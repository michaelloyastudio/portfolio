<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <!-- 4x4 drum pad grid -->
  <g transform="translate(80,80)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.85"/>
    <rect x="60" y="0" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="120" y="0" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.4"/>
    <rect x="180" y="0" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <!-- Row 2 -->
    <rect x="0" y="60" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="60" y="60" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="120" y="60" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.6"/>
    <rect x="180" y="60" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <!-- Row 3 -->
    <rect x="0" y="120" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.3"/>
    <rect x="60" y="120" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.85"/>
    <rect x="120" y="120" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="180" y="120" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.5"/>
    <!-- Row 4 -->
    <rect x="0" y="180" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="60" y="180" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.7"/>
    <rect x="120" y="180" width="50" height="50" rx="6" fill="#1a1a1a"/>
    <rect x="180" y="180" width="50" height="50" rx="6" fill="#ff8e3d" opacity="0.85"/>
  </g>
  <!-- Title -->
  <text x="200" y="370" text-anchor="middle" fill="#8a8580" font-family="'Space Grotesk',sans-serif" font-size="11" font-weight="500" letter-spacing="0.15em">THE GRID</text>
</svg>
