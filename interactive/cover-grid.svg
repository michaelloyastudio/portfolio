<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0a0a0a"/>
  <g transform="translate(200,200) scale(1.55)">
    <!-- Row 1: Kick - red on spots 1 and 3 -->
    <rect x="-88" y="-88" width="38" height="38" rx="4" fill="#FF4466"/>
    <rect x="-42" y="-88" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="4" y="-88" width="38" height="38" rx="4" fill="#FF4466"/>
    <rect x="50" y="-88" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <!-- Row 2: Snare - gold on spots 2 and 4 -->
    <rect x="-88" y="-42" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="-42" y="-42" width="38" height="38" rx="4" fill="#FFD700"/>
    <rect x="4" y="-42" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="50" y="-42" width="38" height="38" rx="4" fill="#FFD700"/>
    <!-- Row 3: Hi-Hat - green on spots 1-3 -->
    <rect x="-88" y="4" width="38" height="38" rx="4" fill="#44FF66"/>
    <rect x="-42" y="4" width="38" height="38" rx="4" fill="#44FF66"/>
    <rect x="4" y="4" width="38" height="38" rx="4" fill="#44FF66"/>
    <rect x="50" y="4" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <!-- Row 4: Open Hat - blue on last spot -->
    <rect x="-88" y="50" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="-42" y="50" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="4" y="50" width="38" height="38" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
    <rect x="50" y="50" width="38" height="38" rx="4" fill="#4488FF"/>
  </g>
</svg>