<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grid — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --cell: #1a1a1a;
  --cell-hover: #222;
  --cell-active: var(--accent);
  --playhead: rgba(255,142,61,0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
}

a, button, .clickable, input, select, input[type="range"], label, [onclick], .step, .row-mute, .row-solo, .mute-all-btn, .group-mute-btn, .transport-btn, .action-btn, .drum-pad { cursor: url('crosshair.svg') 8 10, pointer !important; }
input[type="range"]::-webkit-slider-thumb { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'Instrument Serif', serif; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3rem 2.5rem;
  z-index: 100;
}

.header-logo-link {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  height: 32px;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  padding-top: 40px;
  gap: 20px;
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}

.title {
  font-family: 'Instrument Serif', serif;
  font-size: 3rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── TRANSPORT BAR ── */
.transport {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 10px;
  padding: 10px 20px;
}

.transport-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.transport-btn:hover { background: rgba(255,255,255,0.1); }
.transport-btn.playing { background: var(--accent); color: #000; }

.bpm-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bpm-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.bpm-value {
  font-size: 1.1rem;
  font-weight: 600;
  font-family: 'Space Grotesk', monospace;
  min-width: 40px;
  text-align: center;
  color: var(--accent);
}

.bpm-slider {
  width: 100px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #333;
  border-radius: 2px;
  outline: none;
}

.bpm-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.transport-divider {
  width: 1px;
  height: 24px;
  background: #333;
}

.kit-select {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  padding: 5px 10px;
  outline: none;
}

.kit-select option { background: #1a1a1a; }

.swing-control {
  display: flex;
  align-items: center;
  gap: 6px;
}

.swing-slider {
  width: 60px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #333;
  border-radius: 2px;
  outline: none;
}

.swing-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-muted);
  cursor: pointer;
}

/* ── MODE SWITCHER ── */
.mode-switcher {
  display: flex;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.mode-btn {
  padding: 5px 12px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.2s;
  white-space: nowrap;
}

.mode-btn:hover { color: var(--text); }

.mode-btn.active {
  background: rgba(255,142,61,0.15);
  color: var(--accent);
}

/* ── GRID ── */
.grid-wrapper {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto 1fr;
  user-select: none;
}

.mute-all-row {
  grid-column: 1;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 10px;
}

/* Instrument labels */
.row-labels {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  padding-right: 10px;
}

.mute-all-btn {
  font-size: 0.5rem;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 2px 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
  align-self: flex-end;
  margin: 0;
}
.mute-all-btn:hover { border-color: #ff4444; color: #ff4444; }
.mute-all-btn.active { background: rgba(255,68,68,0.2); border-color: #ff4444; color: #ff4444; }

.group-mute-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: center;
}
.group-mute-btn {
  font-size: 0.5rem;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 3px 8px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.group-mute-btn:hover { border-color: var(--accent); color: var(--accent); }
.group-mute-btn.active { background: rgba(255,142,61,0.15); border-color: var(--accent); color: var(--accent); }

.reverb-indicator {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(19,19,19,0.9);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 200;
  pointer-events: none;
}
.reverb-indicator.visible { opacity: 1; }
.reverb-indicator .reverb-bar {
  width: 80px;
  height: 4px;
  background: #333;
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.reverb-indicator .reverb-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.05s;
}

.row-label {
  height: 39px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding-right: 4px;
}

.row-name {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  min-width: 60px;
  text-align: right;
}

.row-color {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.row-mute {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid #333;
  background: transparent;
  font-size: 0.5rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.row-mute.muted { background: rgba(255,68,68,0.2); border-color: #ff4444; color: #ff4444; }

.row-solo {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid #333;
  background: transparent;
  font-size: 0.5rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.row-solo.soloed { background: rgba(68,255,102,0.2); border-color: #44FF66; color: #44FF66; }

/* Step grid */
.grid {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: visible;
}

.grid-row {
  display: flex;
  overflow: visible;
}

.step {
  width: 39px;
  height: 39px;
  padding: 1.5px;
  background: transparent;
  position: relative;
  transition: none;
}

.step-bg {
  width: 100%;
  height: 100%;
  border-radius: 4px;
  background: var(--cell);
  border: 1px solid transparent;
  transition: background 0.1s, transform 0.1s, border-color 0.1s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step:hover .step-bg { background: var(--cell-hover); }

.step.active .step-bg {
  border-color: transparent;
  transform: scale(0.92);
}

.step.active .step-dot {
  opacity: 1;
  transform: scale(1);
}

.step-dot {
  position: absolute;
  inset: 5px;
  border-radius: 3px;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Beat grouping — every 4 steps */
.step.beat-start .step-bg {
  border-left: 2px solid #2a2a2a;
}

/* Playhead highlight */
.step.current .step-bg {
  background: var(--playhead) !important;
}

.step.active.current .step-dot {
  filter: brightness(1.3);
}

/* Beat numbers */
.beat-numbers {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  margin-bottom: 4px;
}

.beat-num {
  width: 39px;
  text-align: center;
  font-size: 0.5rem;
  color: #333;
}

.beat-num.downbeat { color: var(--text-muted); }

/* ── ACTIONS ── */
.actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid #222;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}

.action-btn:hover { border-color: var(--text-muted); color: var(--text); }

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.footer.loaded { opacity: 1; }

/* ── BOOT SCREEN ── */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s ease;
}

.boot-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.boot-waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 40px;
}

.boot-bar {
  width: 4px;
  background: var(--accent);
  border-radius: 2px;
  animation: waveBar 0.8s ease-in-out infinite alternate;
}

@keyframes waveBar {
  0% { height: 8px; opacity: 0.3; }
  100% { height: 36px; opacity: 1; }
}

.boot-text {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.boot-title {
  font-family: 'Instrument Serif', serif;
  font-size: 2.2rem;
  opacity: 0;
  transform: translateY(10px);
  animation: bootTitleIn 0.6s ease forwards 0.8s;
}

@keyframes bootTitleIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── LOAD-IN ANIMATIONS ── */
.main { opacity: 0; }
.main.loaded { animation: mainFadeIn 0.8s ease forwards; }

@keyframes mainFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.title-row {
  opacity: 0;
  transform: translateY(-15px);
}

.title-row.loaded {
  animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes slideDown {
  to { opacity: 1; transform: translateY(0); }
}

.transport {
  opacity: 0;
  transform: scale(0.95);
}

.transport.loaded {
  animation: scaleIn 0.4s ease forwards;
}

@keyframes scaleIn {
  to { opacity: 1; transform: scale(1); }
}

.grid-wrapper {
  opacity: 0;
}

.grid-wrapper.loaded {
  opacity: 1;
}

/* Staggered cell entrance */
.step {
  opacity: 0;
  transform: scale(0) rotate(10deg);
}

.step.entered {
  opacity: 1;
  transform: scale(1) rotate(0deg);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.row-label {
  opacity: 0;
  transform: translateX(-20px);
}

.row-label.entered {
  opacity: 1;
  transform: translateX(0);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.actions {
  opacity: 0;
}

.actions.loaded {
  animation: mainFadeIn 0.5s ease forwards;
}

/* ── HIT RIPPLE ── */
.ripple-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}

.hit-ripple {
  position: absolute;
  border-radius: 6px;
  border: 2px solid;
  opacity: 0;
  pointer-events: none;
  animation: rippleOut 0.4s ease-out forwards;
}

@keyframes rippleOut {
  0% { opacity: 0.8; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.5); }
}

/* ── CELL GLOW ON HOVER ── */
.step.entered:hover .step-bg {
  box-shadow: 0 0 12px rgba(255,255,255,0.06);
}

.step.active.entered:hover .step-bg {
  box-shadow: 0 0 15px rgba(255,142,61,0.2);
}

/* ── TRIGGERED BOUNCE ── */
.step.triggered .step-dot {
  animation: dotBounce 0.2s ease;
}

@keyframes dotBounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

/* ── COLUMN GLOW ── */
.step.current.entered .step-bg {
  box-shadow: 0 0 8px rgba(255,142,61,0.15);
}

/* ── TOGGLE POP ── */
.step.pop .step-bg {
  animation: cellPop 0.25s ease;
}

@keyframes cellPop {
  0% { transform: scale(0.92); }
  40% { transform: scale(1.1); }
  100% { transform: scale(0.92); }
}

.step:not(.active).pop .step-bg {
  animation: cellPopOff 0.2s ease;
}

@keyframes cellPopOff {
  0% { transform: scale(1); }
  50% { transform: scale(0.85); }
  100% { transform: scale(1); }
}

/* ═══════════════════════════════════════════════════ */
/* DRUM PAD MODE                                      */
/* ═══════════════════════════════════════════════════ */

.drumpad-wrapper {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  user-select: none;
}

.drumpad-wrapper.visible {
  display: flex;
}

.drumpad-bank-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.drumpad-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 380px;
  width: 100%;
}

.drum-pad {
  position: relative;
  width: 86px;
  height: 86px;
  border-radius: 8px;
  background: #111;
  border: 2px solid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform 0.08s ease, background 0.12s ease, box-shadow 0.12s ease;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

.drum-pad .pad-name {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  pointer-events: none;
  z-index: 2;
  transition: color 0.1s;
}

.drum-pad .pad-key {
  font-size: 0.5rem;
  color: #444;
  font-family: 'Space Grotesk', monospace;
  pointer-events: none;
  z-index: 2;
  transition: color 0.1s;
}

.drum-pad.empty {
  border-color: #1a1a1a;
  background: #0d0d0d;
  cursor: default !important;
}

.drum-pad.empty .pad-name,
.drum-pad.empty .pad-key {
  color: #1a1a1a;
}

/* Pad hit state */
.drum-pad.hit {
  transform: scale(0.93);
}

.drum-pad.hit .pad-name {
  color: #fff;
}

.drum-pad.hit .pad-key {
  color: rgba(255,255,255,0.6);
}

/* Pad ripple */
.drum-pad .pad-ripple {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

@keyframes padPulse {
  0% { opacity: 0.5; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.15); }
}

.drum-pad .pad-ripple.active {
  animation: padPulse 0.35s ease-out forwards;
}

/* Drumpad entrance animation */
.drum-pad {
  opacity: 0;
  transform: scale(0) rotate(5deg);
}

.drum-pad.entered {
  opacity: 1;
  transform: scale(1) rotate(0deg);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .step { width: 31px; height: 31px; }
  .beat-num { width: 31px; }
  .row-label { height: 31px; }
  .transport { flex-wrap: wrap; justify-content: center; }
  .row-name { min-width: 45px; font-size: 0.55rem; }

  .drumpad-grid {
    max-width: 300px;
    gap: 8px;
  }
  .drum-pad {
    width: 68px;
    height: 68px;
    border-radius: 6px;
  }
  .drum-pad .pad-name { font-size: 0.48rem; }
  .drum-pad .pad-key { font-size: 0.42rem; }
}

@media (max-width: 420px) {
  .drumpad-grid {
    max-width: 260px;
    gap: 6px;
  }
  .drum-pad {
    width: 58px;
    height: 58px;
  }
}
</style>
</head>
<body>

<!-- Boot Screen -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-waveform" id="bootWaveform"></div>
  <div class="boot-text">Loading instruments...</div>
</div>

<header class="header">
  <a href="../index.html" class="header-logo-link clickable">
    <img src="logo-gray.svg" alt="ML" class="header-logo logo-default">
    <img src="logo-orange.svg" alt="ML" class="header-logo logo-hover">
  </a>
</header>

<div class="main">
  <div class="title-row">
    <div class="title">The Grid</div>
    <div class="subtitle-text" id="subtitleText" style="font-size:0.85rem;color:#8a8580;letter-spacing:0.15em;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;">Beat maker</div>
  </div>

  <!-- Transport -->
  <div class="transport">
    <button class="transport-btn clickable" id="playBtn" title="Play/Pause">▶</button>
    <button class="transport-btn clickable" id="stopBtn" title="Stop"><span style="display:block;width:12px;height:12px;background:currentColor;border-radius:2px;"></span></button>
    <div class="transport-divider"></div>
    <div class="bpm-control">
      <span class="bpm-label">BPM</span>
      <input type="range" class="bpm-slider clickable" id="bpmSlider" min="60" max="200" value="120">
      <span class="bpm-value" id="bpmValue">120</span>
    </div>
    <div class="transport-divider"></div>
    <div class="swing-control">
      <span class="bpm-label">Reverb</span>
      <input type="range" class="swing-slider clickable" id="reverbSlider" min="0" max="100" value="0">
    </div>
    <div class="transport-divider"></div>
    <div class="mode-switcher">
      <button class="mode-btn clickable active" id="modeSeqBtn" data-mode="sequencer">Sequencer</button>
      <button class="mode-btn clickable" id="modePadBtn" data-mode="drumpad">Drum Pad</button>
    </div>
  </div>

  <!-- Sequencer Grid -->
  <div class="grid-wrapper" id="sequencerView">
    <div class="mute-all-row"><button class="mute-all-btn clickable" id="muteAllBtn" title="Mute All (M)">Mute All</button></div>
    <div class="beat-numbers" id="beatNumbers"></div>
    <div class="row-labels" id="rowLabels"></div>
    <div class="grid" id="grid"><div class="ripple-overlay" id="rippleOverlay"></div></div>
  </div>

  <!-- Drum Pad View -->
  <div class="drumpad-wrapper" id="drumpadView">
    <div class="drumpad-bank-label">Bank A · 12 Instruments</div>
    <div class="drumpad-grid" id="drumpadGrid"></div>
  </div>

  <!-- Group Mutes -->
  <div class="group-mute-row" id="groupMuteRow">
    <button class="group-mute-btn clickable" id="muteDrumsBtn" title="Mute Drums">Mute Drums</button>
    <button class="group-mute-btn clickable" id="muteVocalsBtn" title="Mute Vocals">Mute Vocals</button>
  </div>

  <!-- Reverb HUD -->
  <div class="reverb-indicator" id="reverbHud">
    Reverb <span id="reverbPct">0%</span>
    <div class="reverb-bar"><div class="reverb-fill" id="reverbFill" style="width:0%"></div></div>
  </div>

  <!-- Actions -->
  <div class="actions" id="seqActions">
    <button class="action-btn clickable" id="clearBtn">Clear All</button>
    <button class="action-btn clickable" id="randomBtn">Random</button>
    <button class="action-btn clickable" id="presetBtn">Preset: Boom Bap</button>
  </div>
</div>

<div class="footer">Make some noise · Built with Web Audio</div>

<script>
// ═══════════════════════════════════════════════════
// INSTRUMENTS
// ═══════════════════════════════════════════════════
const INSTRUMENTS = [
  { id: 'kick',    name: 'Kick',     color: '#FF4466', type: 'kick',    p: { start: 150, end: 30, decay: 0.3 } },
  { id: 'snare',   name: 'Snare',    color: '#FFD700', type: 'snare',   p: { tone: 180, noiseDecay: 0.12 } },
  { id: 'hihat',   name: 'Hi-Hat',   color: '#44FF66', type: 'hihat',   p: { decay: 0.04, hp: 7000 } },
  { id: 'openhat', name: 'Open Hat', color: '#4488FF', type: 'openhat', p: { decay: 0.2, hp: 6000 } },
  { id: 'clap',    name: 'Clap',     color: '#FF69B4', type: 'clap',    p: {} },
  { id: 'tom',     name: 'Tom',      color: '#9B59B6', type: 'tom',     p: { start: 200, end: 80, decay: 0.2 } },
  { id: 'rim',     name: 'Rimshot',  color: '#00BCD4', type: 'rim',     p: { freq: 800 } },
  { id: 'perc',    name: 'Perc',     color: '#ff8e3d', type: 'perc',    p: { start: 3000, end: 500, decay: 0.06 } },
  { id: 'vox1',    name: 'Vox "Ah"', color: '#E879F9', type: 'vocal',   p: { pitch: 340, f1: 800, f2: 1150, f3: 2800, decay: 0.18, wave: 'sawtooth' } },
  { id: 'vox2',    name: 'Vox "Ee"', color: '#C084FC', type: 'vocal',   p: { pitch: 380, f1: 270, f2: 2300, f3: 3000, decay: 0.15, wave: 'sawtooth' } },
  { id: 'vox3',    name: 'Vox "Oh"', color: '#A78BFA', type: 'vocal',   p: { pitch: 320, f1: 500, f2: 800,  f3: 2830, decay: 0.2, wave: 'sawtooth' } },
  { id: 'vox4',    name: 'Vox "Oo"', color: '#818CF8', type: 'vocal',   p: { pitch: 300, f1: 300, f2: 650,  f3: 2700, decay: 0.22, wave: 'sawtooth' } },
];

const STEPS = 16;

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let grid = [];
let muted = new Array(INSTRUMENTS.length).fill(false);
let soloed = new Array(INSTRUMENTS.length).fill(false);
let bpm = 120;
let reverbMix = 0;
let reverbNode = null;
let dryGain = null;
let wetGain = null;
let playing = false;
let currentStep = 0;
let intervalId = null;
let audioCtx = null;
let currentMode = 'sequencer'; // 'sequencer' or 'drumpad'

INSTRUMENTS.forEach(() => {
  grid.push(new Array(STEPS).fill(false));
});

// ═══════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sampleRate = audioCtx.sampleRate;
    const length = sampleRate * 2;
    const impulse = audioCtx.createBuffer(2, length, sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
      }
    }
    reverbNode = audioCtx.createConvolver();
    reverbNode.buffer = impulse;
    const reverbLP = audioCtx.createBiquadFilter();
    reverbLP.type = 'lowpass';
    reverbLP.frequency.value = 2800;
    reverbLP.Q.value = 0.7;
    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();
    dryGain.gain.value = 1;
    wetGain.gain.value = 0;
    dryGain.connect(audioCtx.destination);
    reverbNode.connect(reverbLP).connect(wetGain);
    wetGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function getOutput() {
  const merger = audioCtx.createGain();
  merger.connect(dryGain);
  merger.connect(reverbNode);
  return merger;
}

function playSound(inst) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const p = inst.p || {};

  switch (inst.type) {
    case 'kick': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 150, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 30, t + 0.12);
      gain.gain.setValueAtTime(0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.3));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.3) + 0.01);
      break;
    }
    case 'snare': {
      const dur = p.noiseDecay || 0.12;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.5, t); ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1000;
      noise.connect(hp).connect(ng).connect(getOutput());
      noise.start(t); noise.stop(t + dur + 0.01);
      const osc = audioCtx.createOscillator(); const og = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = p.tone || 180;
      og.gain.setValueAtTime(0.4, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(og).connect(getOutput());
      osc.start(t); osc.stop(t + 0.09);
      break;
    }
    case 'hihat': {
      const dur = p.decay || 0.04;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 7000;
      src.connect(hp).connect(gain).connect(getOutput());
      src.start(t); src.stop(t + dur + 0.01);
      break;
    }
    case 'openhat': {
      const dur = p.decay || 0.2;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.25, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 6000;
      src.connect(hp).connect(gain).connect(getOutput());
      src.start(t); src.stop(t + dur + 0.02);
      break;
    }
    case 'clap': {
      for (let n = 0; n < 3; n++) {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.02, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource(); src.buffer = buf;
        const gain = audioCtx.createGain(); const off = n * 0.012;
        gain.gain.setValueAtTime(0.4, t + off); gain.gain.exponentialRampToValueAtTime(0.001, t + off + 0.03);
        const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2000;
        src.connect(bp).connect(gain).connect(getOutput());
        src.start(t + off); src.stop(t + off + 0.04);
      }
      break;
    }
    case 'tom': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 200, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 80, t + (p.decay || 0.15));
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.2));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.2) + 0.01);
      break;
    }
    case 'rim': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = p.freq || 800;
      gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + 0.04);
      break;
    }
    case 'perc': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 3000, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 500, t + 0.05);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.06));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.06) + 0.01);
      break;
    }
    case 'vocal': {
      const dur = p.decay || 0.2;
      const pitch = p.pitch || 340;
      const formants = [p.f1 || 800, p.f2 || 1200, p.f3 || 2800];
      const formantQ = [12, 10, 8];
      const formantGain = [0.28, 0.18, 0.08];
      const out = getOutput();
      const osc = audioCtx.createOscillator();
      osc.type = p.wave || 'sawtooth';
      osc.frequency.setValueAtTime(pitch, t);
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.97, t + dur);
      formants.forEach((freq, i) => {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = freq;
        bp.Q.value = formantQ[i];
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(formantGain[i], t);
        g.gain.setValueAtTime(formantGain[i], t + dur * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(bp).connect(g).connect(out);
      });
      const noiseDur = dur * 0.6;
      const nBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * noiseDur, audioCtx.sampleRate);
      const nData = nBuf.getChannelData(0);
      for (let i = 0; i < nData.length; i++) nData[i] = Math.random() * 2 - 1;
      const nSrc = audioCtx.createBufferSource(); nSrc.buffer = nBuf;
      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.04, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + noiseDur);
      const nBp = audioCtx.createBiquadFilter();
      nBp.type = 'bandpass'; nBp.frequency.value = formants[1]; nBp.Q.value = 3;
      nSrc.connect(nBp).connect(nGain).connect(out);
      nSrc.start(t); nSrc.stop(t + noiseDur + 0.01);
      osc.start(t); osc.stop(t + dur + 0.01);
      break;
    }
  }
}

// ═══════════════════════════════════════════════════
// SEQUENCER
// ═══════════════════════════════════════════════════
function getStepInterval() {
  return (60 / bpm) / 4 * 1000;
}

function tick() {
  document.querySelectorAll('.step.current').forEach(s => s.classList.remove('current'));
  document.querySelectorAll(`.step[data-step="${currentStep}"]`).forEach(s => s.classList.add('current'));
  
  INSTRUMENTS.forEach((inst, row) => {
    const anySolo = soloed.some(s => s);
    const canPlay = anySolo ? soloed[row] && !muted[row] : !muted[row];
    if (grid[row][currentStep] && canPlay) {
      playSound(inst);
    }
  });
  
  currentStep = (currentStep + 1) % STEPS;
  
  if (playing) {
    intervalId = setTimeout(tick, getStepInterval());
  }
}

function play() {
  initAudio();
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('playBtn').classList.add('playing');
  tick();
}

function pause() {
  playing = false;
  clearTimeout(intervalId);
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('playBtn').classList.remove('playing');
}

function stop() {
  pause();
  currentStep = 0;
  document.querySelectorAll('.step.current').forEach(s => s.classList.remove('current'));
}

// ═══════════════════════════════════════════════════
// BUILD UI
// ═══════════════════════════════════════════════════
function buildGrid() {
  const labelsEl = document.getElementById('rowLabels');
  const gridEl = document.getElementById('grid');
  const beatNumsEl = document.getElementById('beatNumbers');
  
  for (let s = 0; s < STEPS; s++) {
    const num = document.createElement('div');
    num.className = `beat-num ${s % 4 === 0 ? 'downbeat' : ''}`;
    num.textContent = s % 4 === 0 ? (s / 4 + 1) : '·';
    beatNumsEl.appendChild(num);
  }
  
  INSTRUMENTS.forEach((inst, row) => {
    const label = document.createElement('div');
    label.className = 'row-label';
    
    const soloBtn = document.createElement('button');
    soloBtn.className = 'row-solo clickable';
    soloBtn.textContent = 'S';
    soloBtn.title = `Solo ${inst.name}`;
    soloBtn.addEventListener('click', () => {
      soloed[row] = !soloed[row];
      soloBtn.classList.toggle('soloed', soloed[row]);
    });

    const muteBtn = document.createElement('button');
    muteBtn.className = 'row-mute clickable';
    muteBtn.textContent = 'M';
    muteBtn.title = `Mute ${inst.name}`;
    muteBtn.addEventListener('click', () => {
      muted[row] = !muted[row];
      muteBtn.classList.toggle('muted', muted[row]);
    });
    
    const colorDot = document.createElement('div');
    colorDot.className = 'row-color';
    colorDot.style.background = inst.color;
    
    const name = document.createElement('div');
    name.className = 'row-name';
    name.textContent = inst.name;
    
    label.appendChild(soloBtn);
    label.appendChild(muteBtn);
    label.appendChild(name);
    label.appendChild(colorDot);
    labelsEl.appendChild(label);
    
    const rowEl = document.createElement('div');
    rowEl.className = 'grid-row';
    
    for (let s = 0; s < STEPS; s++) {
      const step = document.createElement('div');
      step.className = `step clickable ${s % 4 === 0 ? 'beat-start' : ''}`;
      step.dataset.row = row;
      step.dataset.step = s;
      
      const bg = document.createElement('div');
      bg.className = 'step-bg';
      const dot = document.createElement('div');
      dot.className = 'step-dot';
      dot.style.background = inst.color;
      bg.appendChild(dot);
      step.appendChild(bg);
      
      step.addEventListener('mousedown', (e) => {
        e.preventDefault();
        initAudio();
        grid[row][s] = !grid[row][s];
        step.classList.toggle('active', grid[row][s]);
        step.dataset.dragMode = grid[row][s] ? 'on' : 'off';
        isDragging = true;
        dragMode = grid[row][s];
        dragRow = row;
      });
      
      step.addEventListener('mouseenter', () => {
        if (isDragging && dragRow === row) {
          grid[row][s] = dragMode;
          step.classList.toggle('active', dragMode);
        }
      });
      
      rowEl.appendChild(step);
    }
    
    gridEl.appendChild(rowEl);
  });
}

let isDragging = false;
let dragMode = false;
let dragRow = -1;

document.addEventListener('mouseup', () => { isDragging = false; });

// ═══════════════════════════════════════════════════
// DRUM PAD MODE
// ═══════════════════════════════════════════════════
// Keyboard mapping: 4x4 grid
// Row 1: Q W E R
// Row 2: A S D F
// Row 3: Z X C V
// Row 4: 1 2 3 4
const PAD_KEYS = [
  'q', 'w', 'e', 'r',
  'a', 's', 'd', 'f',
  'z', 'x', 'c', 'v',
  '1', '2', '3', '4'
];

const PAD_KEY_LABELS = [
  'Q', 'W', 'E', 'R',
  'A', 'S', 'D', 'F',
  'Z', 'X', 'C', 'V',
  '1', '2', '3', '4'
];

// Map 16 pads: first 12 = instruments, last 4 = empty
const PAD_MAP = [];
for (let i = 0; i < 16; i++) {
  PAD_MAP.push(i < INSTRUMENTS.length ? i : -1);
}

let padElements = [];

function buildDrumPads() {
  const container = document.getElementById('drumpadGrid');
  
  for (let i = 0; i < 16; i++) {
    const pad = document.createElement('div');
    const instIdx = PAD_MAP[i];
    const inst = instIdx >= 0 ? INSTRUMENTS[instIdx] : null;
    const color = inst ? inst.color : '#1a1a1a';
    
    pad.className = `drum-pad clickable${inst ? '' : ' empty'}`;
    pad.dataset.padIndex = i;
    
    if (inst) {
      pad.style.borderColor = color;
      pad.style.boxShadow = `0 0 12px ${color}33, inset 0 0 8px ${color}11`;
    }
    
    // Ripple element
    const ripple = document.createElement('div');
    ripple.className = 'pad-ripple';
    if (inst) ripple.style.background = color;
    pad.appendChild(ripple);
    
    // Name label
    const nameEl = document.createElement('div');
    nameEl.className = 'pad-name';
    nameEl.textContent = inst ? inst.name : '';
    pad.appendChild(nameEl);
    
    // Key label
    const keyEl = document.createElement('div');
    keyEl.className = 'pad-key';
    keyEl.textContent = PAD_KEY_LABELS[i];
    pad.appendChild(keyEl);
    
    // Touch/mouse events
    if (inst) {
      const triggerPad = (e) => {
        e.preventDefault();
        initAudio();
        playSound(inst);
        hitPad(i);
      };
      
      const releasePad = (e) => {
        e.preventDefault();
        pad.classList.remove('hit');
      };
      
      pad.addEventListener('mousedown', triggerPad);
      pad.addEventListener('mouseup', releasePad);
      pad.addEventListener('mouseleave', releasePad);
      pad.addEventListener('touchstart', triggerPad, { passive: false });
      pad.addEventListener('touchend', releasePad, { passive: false });
      pad.addEventListener('touchcancel', releasePad, { passive: false });
    }
    
    container.appendChild(pad);
    padElements.push(pad);
  }
}

function hitPad(index) {
  const pad = padElements[index];
  if (!pad || pad.classList.contains('empty')) return;
  
  const instIdx = PAD_MAP[index];
  const inst = instIdx >= 0 ? INSTRUMENTS[instIdx] : null;
  if (!inst) return;
  
  const color = inst.color;
  
  // Hit visual
  pad.classList.add('hit');
  pad.style.background = color;
  pad.style.boxShadow = `0 0 30px ${color}88, 0 0 60px ${color}44, inset 0 0 20px ${color}44`;
  
  // Ripple
  const ripple = pad.querySelector('.pad-ripple');
  ripple.classList.remove('active');
  void ripple.offsetWidth;
  ripple.classList.add('active');
  
  // Release after short duration
  setTimeout(() => {
    pad.classList.remove('hit');
    pad.style.background = '#111';
    pad.style.boxShadow = `0 0 12px ${color}33, inset 0 0 8px ${color}11`;
  }, 120);
  
  setTimeout(() => {
    ripple.classList.remove('active');
  }, 350);
}

// ═══════════════════════════════════════════════════
// MODE SWITCHING
// ═══════════════════════════════════════════════════
function switchMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  
  const seqView = document.getElementById('sequencerView');
  const padView = document.getElementById('drumpadView');
  const seqActions = document.getElementById('seqActions');
  const groupMutes = document.getElementById('groupMuteRow');
  const subtitleText = document.getElementById('subtitleText');
  const modeSeqBtn = document.getElementById('modeSeqBtn');
  const modePadBtn = document.getElementById('modePadBtn');
  
  if (mode === 'sequencer') {
    seqView.style.display = '';
    padView.classList.remove('visible');
    seqActions.style.display = '';
    groupMutes.style.display = '';
    subtitleText.textContent = 'Beat maker';
    modeSeqBtn.classList.add('active');
    modePadBtn.classList.remove('active');
  } else {
    seqView.style.display = 'none';
    padView.classList.add('visible');
    seqActions.style.display = 'none';
    groupMutes.style.display = 'none';
    subtitleText.textContent = 'Drum pad';
    modeSeqBtn.classList.remove('active');
    modePadBtn.classList.add('active');
    
    // Entrance animation for pads
    padElements.forEach((pad, i) => {
      pad.classList.remove('entered');
      const row = Math.floor(i / 4);
      const col = i % 4;
      const delay = row * 40 + col * 30;
      setTimeout(() => pad.classList.add('entered'), delay);
    });
  }
}

document.getElementById('modeSeqBtn').addEventListener('click', () => switchMode('sequencer'));
document.getElementById('modePadBtn').addEventListener('click', () => switchMode('drumpad'));

// ═══════════════════════════════════════════════════
// PRESETS
// ═══════════════════════════════════════════════════

const presetNames = Object.keys(PRESETS);
let presetIndex = 0;

function loadPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  preset.forEach((pattern, row) => {
    for (let s = 0; s < STEPS; s++) grid[row][s] = !!pattern[s];
  });
  updateGridUI();
}

function clearGrid() {
  grid.forEach(row => row.fill(false));
  updateGridUI();
}

function randomize() {
  INSTRUMENTS.forEach((inst, row) => {
    const density = inst.type === 'kick' ? 0.25 : inst.type === 'hihat' ? 0.5 : inst.type === 'vocal' ? 0.12 : 0.15;
    for (let s = 0; s < STEPS; s++) {
      grid[row][s] = Math.random() < density;
    }
  });
  updateGridUI();
}

function updateGridUI() {
  document.querySelectorAll('.step').forEach(step => {
    const row = parseInt(step.dataset.row);
    const s = parseInt(step.dataset.step);
    step.classList.toggle('active', grid[row][s]);
  });
}

// Mute All
let allMuted = false;
function toggleMuteAll() {
  allMuted = !allMuted;
  const btn = document.getElementById('muteAllBtn');
  btn.classList.toggle('active', allMuted);
  btn.textContent = allMuted ? 'Unmute' : 'Mute All';
  muted.fill(allMuted);
  soloed.fill(false);
  document.querySelectorAll('.row-mute').forEach(b => b.classList.toggle('muted', allMuted));
  document.querySelectorAll('.row-solo').forEach(b => b.classList.remove('soloed'));
}

document.getElementById('muteAllBtn').addEventListener('click', toggleMuteAll);

// ── ARROW KEY REVERB ──
let arrowReverbInterval = null;
let arrowHeld = null;
const REVERB_STEP = 0.0075;
const REVERB_INTERVAL = 50;

function updateReverbHud() {
  const pct = Math.round(reverbMix * 100);
  document.getElementById('reverbPct').textContent = pct + '%';
  document.getElementById('reverbFill').style.width = pct + '%';
  document.getElementById('reverbSlider').value = pct;
  const hud = document.getElementById('reverbHud');
  hud.classList.add('visible');
}

function hideReverbHud() {
  document.getElementById('reverbHud').classList.remove('visible');
}

function setReverb(val, rampTime) {
  initAudio();
  reverbMix = Math.max(0, Math.min(1, val));
  const now = audioCtx.currentTime;
  if (rampTime && rampTime > 0) {
    dryGain.gain.cancelScheduledValues(now);
    wetGain.gain.cancelScheduledValues(now);
    dryGain.gain.setTargetAtTime(1 - reverbMix * 0.5, now, rampTime / 3);
    wetGain.gain.setTargetAtTime(reverbMix, now, rampTime / 3);
  } else {
    dryGain.gain.value = 1 - reverbMix * 0.5;
    wetGain.gain.value = reverbMix;
  }
  updateReverbHud();
}

function nudgeReverb(dir) {
  setReverb(reverbMix + dir * REVERB_STEP, 0);
}

// ── GROUP MUTE ──
let drumsMuted = false;
let vocalsMuted = false;

function toggleGroupMute(type) {
  const isDrums = type === 'drums';
  if (isDrums) drumsMuted = !drumsMuted; else vocalsMuted = !vocalsMuted;
  const active = isDrums ? drumsMuted : vocalsMuted;
  const btn = document.getElementById(isDrums ? 'muteDrumsBtn' : 'muteVocalsBtn');
  btn.classList.toggle('active', active);
  btn.textContent = active ? (isDrums ? 'Unmute Drums' : 'Unmute Vocals') : (isDrums ? 'Mute Drums' : 'Mute Vocals');
  INSTRUMENTS.forEach((inst, i) => {
    const match = isDrums ? inst.type !== 'vocal' : inst.type === 'vocal';
    if (match) {
      muted[i] = active;
      const muteBtn = document.querySelectorAll('.row-mute')[i];
      if (muteBtn) muteBtn.classList.toggle('muted', active);
    }
  });
}

document.getElementById('muteDrumsBtn').addEventListener('click', () => toggleGroupMute('drums'));
document.getElementById('muteVocalsBtn').addEventListener('click', () => toggleGroupMute('vocals'));

// Track which pad keys are currently held (prevent repeat triggers)
const padKeysHeld = new Set();

document.addEventListener('keydown', (e) => {
  // Drum pad keyboard triggering
  if (currentMode === 'drumpad' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const key = e.key.toLowerCase();
    const padIndex = PAD_KEYS.indexOf(key);
    if (padIndex >= 0 && PAD_MAP[padIndex] >= 0 && !padKeysHeld.has(key)) {
      e.preventDefault();
      padKeysHeld.add(key);
      initAudio();
      playSound(INSTRUMENTS[PAD_MAP[padIndex]]);
      hitPad(padIndex);
      return;
    }
  }

  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  
  // Only process sequencer-specific shortcuts in sequencer mode
  if (currentMode === 'sequencer') {
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMuteAll(); }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); soloed.fill(false); document.querySelectorAll('.row-solo').forEach(b => b.classList.remove('soloed')); }
    if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleGroupMute('drums'); }
    if (e.key === 'v' || e.key === 'V') { e.preventDefault(); toggleGroupMute('vocals'); }
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setReverb(0, 3.5); updateReverbHud(); setTimeout(hideReverbHud, 3500); }
  }
  
  // Arrow keys for reverb (both modes)
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.repeat) {
    e.preventDefault();
    const dir = e.key === 'ArrowUp' ? 1 : -1;
    arrowHeld = dir;
    nudgeReverb(dir);
    arrowReverbInterval = setInterval(() => nudgeReverb(dir), REVERB_INTERVAL);
  }
});

document.addEventListener('keyup', (e) => {
  // Release pad key tracking
  const key = e.key.toLowerCase();
  padKeysHeld.delete(key);
  
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    arrowHeld = null;
    clearInterval(arrowReverbInterval);
    arrowReverbInterval = null;
    setTimeout(hideReverbHud, 800);
  }
});

// Boot sequence

  const boot = document.getElementById('bootScreen');
  boot.classList.add('fade-out');
  
  const main = document.querySelector('.main');
  setTimeout(() => { main.classList.add('loaded'); }, 300);
  
  setTimeout(() => {
    boot.style.display = 'none';
    
    setTimeout(() => document.querySelector('.title-row').classList.add('loaded'), 100);
    setTimeout(() => document.querySelector('.transport').classList.add('loaded'), 250);
    setTimeout(() => {
      document.querySelector('.grid-wrapper').classList.add('loaded');
      
      const steps = document.querySelectorAll('.step');
      steps.forEach((step, i) => {
        const row = parseInt(step.dataset.row);
        const col = parseInt(step.dataset.step);
        const delay = row * 30 + col * 20;
        setTimeout(() => step.classList.add('entered'), delay);
      });
      
      document.querySelectorAll('.row-label').forEach((label, i) => {
        setTimeout(() => label.classList.add('entered'), i * 40);
      });
    }, 400);
    
    setTimeout(() => document.querySelector('.actions').classList.add('loaded'), 800);
    setTimeout(() => document.querySelector('.footer').classList.add('loaded'), 1200);
    
  }, 600);
}, 2000);

// ═══════════════════════════════════════════════════
// HIT RIPPLE + TRIGGERED BOUNCE
// ═══════════════════════════════════════════════════
const _origTick = tick;
const origTickRef = tick;
function enhancedTick() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.step.active.current').forEach(step => {
      step.classList.add('triggered');
      setTimeout(() => step.classList.remove('triggered'), 200);
      
      const overlay = document.getElementById('rippleOverlay');
      const grid = document.getElementById('grid');
      const ripple = document.createElement('div');
      ripple.className = 'hit-ripple';
      const row = parseInt(step.dataset.row);
      ripple.style.borderColor = INSTRUMENTS[row]?.color || 'var(--accent)';
      const stepRect = step.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();
      ripple.style.left = (stepRect.left - gridRect.left) + 'px';
      ripple.style.top = (stepRect.top - gridRect.top) + 'px';
      ripple.style.width = stepRect.width + 'px';
      ripple.style.height = stepRect.height + 'px';
      overlay.appendChild(ripple);
      setTimeout(() => ripple.remove(), 400);
    });
  });
}

const _realTick = tick;
tick = function() {
  _realTick();
  enhancedTick();
};

// ═══════════════════════════════════════════════════
// TOGGLE POP ANIMATION
// ═══════════════════════════════════════════════════
document.querySelector('.grid').addEventListener('mousedown', (e) => {
  const step = e.target.closest('.step');
  if (!step) return;
  step.classList.remove('pop');
  void step.offsetWidth;
  step.classList.add('pop');
  setTimeout(() => step.classList.remove('pop'), 250);
}, true);

// ═══════════════════════════════════════════════════
// PAGE TRANSITIONS
// ═══════════════════════════════════════════════════
(function() {
  const overlay = document.createElement('div');
  overlay.id = 'pageTransition';
  Object.assign(overlay.style, {
    position: 'fixed', inset: '0', background: '#0a0a0a', zIndex: '99999',
    opacity: '1', transition: 'opacity 0.4s ease', pointerEvents: 'none'
  });
  document.body.appendChild(overlay);
  requestAnimationFrame(() => { overlay.style.opacity = '0'; });
  document.querySelector('.header-logo-link').addEventListener('click', function(e) {
    e.preventDefault();
    const href = this.href;
    overlay.style.pointerEvents = 'all';
    overlay.style.opacity = '1';
    setTimeout(() => { window.close(); if (!window.closed) window.location.href = href; }, 400);
  });
})();
