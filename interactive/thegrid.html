<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grid — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
    /* Prevent blue tap highlights on mobile (via Sonny Cirasuolo / prof K) */
    * { -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --cell: #1a1a1a;
  --cell-hover: #222;
  --cell-active: var(--accent);
  --playhead: rgba(255,142,61,0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

body:focus, body *:focus {
  outline: none !important;
}

a, button, .clickable, input, select, input[type="range"], label, [onclick], .step, .row-mute, .row-solo, .mute-all-btn, .group-mute-btn, .transport-btn, .action-btn, .drum-pad { cursor: url('crosshair.svg') 8 10, pointer !important; }
input[type="range"]::-webkit-slider-thumb { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3rem 2.5rem;
  z-index: 100;
}

.header-logo-link {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  height: 32px;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 30px 20px;
  padding-top: 100px;
  gap: 20px;
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
}

.title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 3.3rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── TRANSPORT BAR ── */
.transport {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 10px;
  padding: 10px 20px;
}

.transport-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.05);
  color: var(--text);
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.transport-btn:hover { background: rgba(255,255,255,0.1); }
.transport-btn.playing { background: var(--accent); color: #000; }

.bpm-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bpm-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.bpm-value {
  font-size: 1.1rem;
  font-weight: 600;
  font-family: 'Space Grotesk', monospace;
  min-width: 40px;
  text-align: center;
  color: var(--accent);
}

.bpm-edit {
  font-size: 1.1rem;
  font-weight: 600;
  font-family: 'Space Grotesk', monospace;
  width: 44px;
  text-align: center;
  color: var(--accent);
  background: rgba(255,142,61,0.1);
  border: 1px solid var(--accent);
  border-radius: 4px;
  outline: none;
  padding: 1px 2px;
}

.bpm-slider {
  width: 100px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #333;
  border-radius: 2px;
  outline: none;
}

.bpm-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.transport-divider {
  width: 1px;
  height: 24px;
  background: #333;
}

.kit-select {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  padding: 5px 10px;
  outline: none;
}

.kit-select option { background: #1a1a1a; }

.swing-control {
  display: flex;
  align-items: center;
  gap: 6px;
}

.swing-slider {
  width: 60px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #333;
  border-radius: 2px;
  outline: none;
}

.swing-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-muted);
  cursor: pointer;
}

/* ── MODE SWITCHER ── */
.mode-switcher {
  display: flex;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}

.mode-btn {
  padding: 5px 12px;
  border-radius: 5px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: color 0.2s;
  white-space: nowrap;
  position: relative;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.active {
  background: rgba(255,142,61,0.15);
  color: var(--accent);
}

/* ── GRID ── */
.grid-wrapper {
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-rows: auto 1fr;
  user-select: none;
}

/* Instrument labels */
.row-labels {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  padding-right: 10px;
}

.mute-all-btn {
  font-size: 0.5rem;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 2px 6px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
  margin: 0;
}
.mute-all-btn:hover { border-color: #ff4444; color: #ff4444; }
.mute-all-btn.active { background: rgba(255,68,68,0.2); border-color: #ff4444; color: #ff4444; }

.group-mute-btn kbd, .mute-all-btn kbd {
  display: inline-block;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.4rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid #444;
  border-radius: 3px;
  padding: 0px 3px;
  margin-right: 3px;
  line-height: 1.4;
  vertical-align: middle;
}

.group-mute-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: center;
}
.group-mute-btn {
  font-size: 0.5rem;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 3px 8px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.group-mute-btn:hover { border-color: #ff4444; color: #ff4444; }
.group-mute-btn.active { background: rgba(255,68,68,0.2); border-color: #ff4444; color: #ff4444; }

.reverb-indicator {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(19,19,19,0.9);
  border: 1px solid #333;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 200;
  pointer-events: none;
}
.reverb-indicator.visible { opacity: 1; }
.reverb-indicator .reverb-bar {
  width: 80px;
  height: 4px;
  background: #333;
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}
.reverb-indicator .reverb-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.05s;
}

.row-label {
  height: 39px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding-right: 4px;
}

.row-name {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  min-width: 60px;
  text-align: right;
}

.row-color {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.row-mute {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid #333;
  background: transparent;
  font-size: 0.5rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.row-mute.muted { background: rgba(255,68,68,0.2); border-color: #ff4444; color: #ff4444; }

.row-solo {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1px solid #333;
  background: transparent;
  font-size: 0.5rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}
.row-solo.soloed { background: rgba(68,255,102,0.2); border-color: #44FF66; color: #44FF66; }

/* Step grid */
.grid {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: visible;
}

.grid-row {
  display: flex;
  overflow: visible;
}

.step {
  width: 39px;
  height: 39px;
  padding: 1.5px;
  background: transparent;
  position: relative;
  transition: none;
}

.step-bg {
  width: 100%;
  height: 100%;
  border-radius: 4px;
  background: var(--cell);
  border: 1px solid transparent;
  transition: background 0.1s, transform 0.1s, border-color 0.1s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step:hover .step-bg { background: var(--cell-hover); }

.step.active .step-bg {
  border-color: transparent;
  transform: scale(0.92);
}

.step.active .step-dot {
  opacity: 1;
  transform: scale(1);
}

.step-dot {
  position: absolute;
  inset: 5px;
  border-radius: 3px;
  opacity: 0;
  transform: scale(0.5);
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Beat grouping — every 4 steps */
.step.beat-start .step-bg {
  border-left: 2px solid #2a2a2a;
}

/* Playhead highlight */
.step.current .step-bg {
  background: var(--playhead) !important;
}

.step.active.current .step-dot {
  filter: brightness(1.3);
}

/* Beat numbers */
.beat-numbers {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  margin-bottom: 4px;
}

.beat-num {
  width: 39px;
  text-align: center;
  font-size: 0.5rem;
  color: #333;
}

.beat-num.downbeat { color: var(--text-muted); }

/* ── ACTIONS ── */
.actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: 1px solid #222;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.5px;
  transition: color 0.15s;
  position: relative;
}
.action-btn { transition: color 0.25s ease; }

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.footer.loaded { opacity: 1; }

/* ── BOOT SCREEN ── */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s ease;
}

.boot-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.boot-waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 40px;
}

.boot-bar {
  width: 4px;
  background: var(--accent);
  border-radius: 2px;
  animation: waveBar 0.8s ease-in-out infinite alternate;
}

@keyframes waveBar {
  0% { height: 8px; opacity: 0.3; }
  100% { height: 36px; opacity: 1; }
}

.boot-text {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.boot-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.2rem;
  opacity: 0;
  transform: translateY(10px);
  animation: bootTitleIn 0.6s ease forwards 0.8s;
}

@keyframes bootTitleIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── LOAD-IN ANIMATIONS ── */
.main { opacity: 0; }
.main.loaded { animation: mainFadeIn 0.8s ease forwards; }

@keyframes mainFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.title-row {
  opacity: 0;
  transform: translateY(-15px);
}

.title-row.loaded {
  animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes slideDown {
  to { opacity: 1; transform: translateY(0); }
}

.transport {
  opacity: 0;
  transform: scale(0.95);
}

.transport.loaded {
  animation: scaleIn 0.4s ease forwards;
}

@keyframes scaleIn {
  to { opacity: 1; transform: scale(1); }
}

.grid-wrapper {
  opacity: 0;
}

.grid-wrapper.loaded {
  opacity: 1;
}

/* Staggered cell entrance */
.step {
  opacity: 0;
  transform: scale(0) rotate(10deg);
}

.step.entered {
  opacity: 1;
  transform: scale(1) rotate(0deg);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.row-label {
  opacity: 0;
  transform: translateX(-20px);
}

.row-label.entered {
  opacity: 1;
  transform: translateX(0);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.actions {
  opacity: 0;
}

.actions.loaded {
  animation: mainFadeIn 0.5s ease forwards;
}

/* ── HIT RIPPLE ── */
.ripple-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}

.hit-ripple {
  position: absolute;
  border-radius: 6px;
  border: 2px solid;
  opacity: 0;
  pointer-events: none;
  animation: rippleOut 0.4s ease-out forwards;
}

@keyframes rippleOut {
  0% { opacity: 0.8; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.5); }
}

/* ── CELL GLOW ON HOVER ── */
.step.entered:hover .step-bg {
  box-shadow: 0 0 12px rgba(255,255,255,0.06);
}

.step.active.entered:hover .step-bg {
  box-shadow: 0 0 15px rgba(255,142,61,0.2);
}

/* ── TRIGGERED BOUNCE ── */
.step.triggered .step-dot {
  animation: dotBounce 0.2s ease;
}

@keyframes dotBounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

/* ── COLUMN GLOW ── */
.step.current.entered .step-bg {
  box-shadow: 0 0 8px rgba(255,142,61,0.15);
}

/* ── TOGGLE POP ── */
.step.pop .step-bg {
  animation: cellPop 0.25s ease;
}

@keyframes cellPop {
  0% { transform: scale(0.92); }
  40% { transform: scale(1.1); }
  100% { transform: scale(0.92); }
}

.step:not(.active).pop .step-bg {
  animation: cellPopOff 0.2s ease;
}

@keyframes cellPopOff {
  0% { transform: scale(1); }
  50% { transform: scale(0.85); }
  100% { transform: scale(1); }
}

/* ═══════════════════════════════════════════════════ */
/* DRUM PAD MODE                                      */
/* ═══════════════════════════════════════════════════ */

/* Content area — both views overlap so swapping doesn't shift title/transport */
.content-area {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  min-height: 500px;
}

.content-area > * {
  position: absolute;
  top: 0;
}

.grid-wrapper.hidden {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
}

.drumpad-wrapper {
  display: flex;
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  user-select: none;
}

.drumpad-wrapper.visible {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
}

.drumpad-bank-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.drumpad-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  max-width: 480px;
  width: 100%;
}

.drum-pad {
  position: relative;
  width: 110px;
  height: 110px;
  border-radius: 8px;
  background: #111;
  border: 2px solid;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform 0.08s ease, background 0.12s ease, box-shadow 0.12s ease;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}

.drum-pad .pad-name {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  pointer-events: none;
  z-index: 2;
  transition: color 0.1s;
}

.drum-pad .pad-key {
  font-size: 0.5rem;
  color: #444;
  font-family: 'Space Grotesk', monospace;
  pointer-events: none;
  z-index: 2;
  transition: color 0.1s;
}

.drum-pad.empty {
  border-color: #1a1a1a;
  background: #0d0d0d;
  cursor: default !important;
}

.drum-pad.empty .pad-name,
.drum-pad.empty .pad-key {
  color: #1a1a1a;
}

/* Pad hit state */
.drum-pad.hit {
  transform: scale(0.93);
}

.drum-pad.hit .pad-name {
  color: #fff;
}

.drum-pad.hit .pad-key {
  color: rgba(255,255,255,0.6);
}

/* Pad ripple */
.drum-pad .pad-ripple {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  opacity: 0;
  pointer-events: none;
  z-index: 1;
}

@keyframes padPulse {
  0% { opacity: 0.5; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.15); }
}

.drum-pad .pad-ripple.active {
  animation: padPulse 0.35s ease-out forwards;
}

/* Drumpad entrance animation */
.drum-pad {
  opacity: 0;
  transform: scale(0) rotate(5deg);
}

.drum-pad.entered {
  opacity: 1;
  transform: scale(1) rotate(0deg);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ── DRUM PAD LAYOUT ── */
.drumpad-content {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  gap: 16px;
}

/* ── LOOP PANEL (vertical column, left of pads) ── */
.loop-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: #0d0d0d;
  border: 1px solid #1a1a1a;
  border-radius: 10px;
  padding: 10px 10px;
  flex-shrink: 0;
  align-self: stretch;
  width: 72px;
  justify-content: space-between;
}

.loop-panel-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  gap: 4px;
}

.loop-panel-label {
  font-size: 0.45rem;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.loop-playhead-bar {
  width: 100%;
  height: 3px;
  background: #1a1a1a;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.loop-playhead-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.05s linear;
}

.loop-track-col {
  display: flex;
  flex-direction: column;
  gap: 0;
  align-items: center;
  flex: 1;
  justify-content: space-between;
}

.loop-circle {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 2px solid #222;
  background: #111;
  transition: all 0.2s ease;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.loop-circle:hover {
  border-color: #444;
  background: #161616;
}

.loop-circle.armed {
  border-color: #ff4444;
  background: #111;
  animation: armPulse 1s ease-in-out infinite;
}

.loop-circle.counting {
  border-color: #ff4444;
  background: rgba(255,68,68,0.1);
}

.loop-circle.counting .loop-count-text {
  font-size: 0.7rem;
  font-weight: 600;
  color: #ff4444;
  font-family: 'Space Grotesk', sans-serif;
}

.loop-circle.recording {
  border-color: #ff4444;
  background: rgba(255,68,68,0.2);
  box-shadow: 0 0 16px rgba(255,68,68,0.3);
}

.loop-circle.recording::after {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  animation: recBlink 0.6s ease-in-out infinite;
}

.loop-circle.has-data {
  border-color: var(--accent);
  background: rgba(255,142,61,0.1);
  box-shadow: 0 0 10px rgba(255,142,61,0.15);
}

/* ── KIT SELECTOR ── */
.kit-selector {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: center;
}

.kit-selector-label {
  font-size: 0.5rem;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.kit-selector-name {
  font-size: 0.75rem;
  color: var(--text);
  font-weight: 500;
  min-width: 80px;
  text-align: center;
}

.kit-arrow {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid #333;
  background: transparent;
  color: #555;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.kit-arrow:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── FX KNOBS ── */
.fx-row {
  display: flex;
  align-items: center;
  gap: 20px;
  width: 100%;
  justify-content: center;
  flex: 1;
}

.fx-knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.fx-knob-dial {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 2px solid #333;
  background: radial-gradient(circle at 40% 35%, #222, #111);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fx-knob-dial::after {
  content: '';
  width: 2px;
  height: 16px;
  background: #555;
  border-radius: 1px;
  position: absolute;
  top: 5px;
  transform-origin: bottom center;
}

.fx-knob-label {
  font-size: 0.55rem;
  color: #444;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.fx-led {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #1a1a1a;
  border: 1px solid #222;
}

.fx-led.on {
  background: #ff4444;
  box-shadow: 0 0 8px rgba(255,68,68,0.5);
}

@keyframes armPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.4); }
  50% { box-shadow: 0 0 14px 4px rgba(255,68,68,0.2); }
}

@keyframes recBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ── ADD STEPS BUTTON ── */
.steps-toggle {
  display: flex;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: 1px solid #333;
  border-radius: 4px;
  padding: 2px 8px;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.55rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.steps-toggle:hover { border-color: var(--accent); color: var(--accent); }
.steps-toggle .steps-label { font-weight: 600; }
.steps-toggle .steps-unit { opacity: 0.7; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .step { width: 31px; height: 31px; }
  .beat-num { width: 31px; }
  .row-label { height: 31px; }
  .transport { flex-wrap: wrap; justify-content: center; }
  .row-name { min-width: 45px; font-size: 0.55rem; }

  .drumpad-grid {
    max-width: 300px;
    gap: 8px;
  }
  .drum-pad {
    width: 68px;

    border-radius: 6px;
  }
  .drum-pad .pad-name { font-size: 0.48rem; }

  .loop-circle { width: 30px; height: 30px; }
  .loop-circle.counting .loop-count-text { font-size: 0.6rem; }
  .loop-track-col { flex-direction: column; gap: 3px; }
  .drumpad-content { flex-direction: column; align-items: center; gap: 10px; }
  .loop-panel { width: 100%; max-width: 300px; padding: 10px 12px 8px; flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .fx-row { gap: 10px; }
  .fx-knob-dial { width: 22px; height: 22px; }
}

@media (max-width: 420px) {
  .drumpad-grid {
    max-width: 260px;
    gap: 6px;
  }
  .drum-pad {
    width: 58px;
    height: 58px;
  }
}

<script>
// ═══════════════════════════════════════════════════
// INSTRUMENTS
// ═══════════════════════════════════════════════════
const INSTRUMENTS = [
  { id: 'kick',    name: 'Kick',     color: '#FF4466', type: 'kick',    p: { start: 150, end: 30, decay: 0.3 } },
  { id: 'snare',   name: 'Snare',    color: '#FFD700', type: 'snare',   p: { tone: 180, noiseDecay: 0.12 } },
  { id: 'hihat',   name: 'Hi-Hat',   color: '#44FF66', type: 'hihat',   p: { decay: 0.04, hp: 7000 } },
  { id: 'openhat', name: 'Open Hat', color: '#4488FF', type: 'openhat', p: { decay: 0.2, hp: 6000 } },
  { id: 'clap',    name: 'Clap',     color: '#FF69B4', type: 'clap',    p: {} },
  { id: 'tom',     name: 'Tom',      color: '#9B59B6', type: 'tom',     p: { start: 200, end: 80, decay: 0.2 } },
  { id: 'rim',     name: 'Rimshot',  color: '#00BCD4', type: 'rim',     p: { freq: 800 } },
  { id: 'perc',    name: 'Perc',     color: '#ff8e3d', type: 'perc',    p: { start: 3000, end: 500, decay: 0.06 } },
  { id: 'vox1',    name: 'Vox "Ah"', color: '#E879F9', type: 'vocal',   p: { pitch: 340, f1: 800, f2: 1150, f3: 2800, decay: 0.18, wave: 'sawtooth' } },
  { id: 'vox2',    name: 'Vox "Ee"', color: '#C084FC', type: 'vocal',   p: { pitch: 380, f1: 270, f2: 2300, f3: 3000, decay: 0.15, wave: 'sawtooth' } },
  { id: 'vox3',    name: 'Vox "Oh"', color: '#A78BFA', type: 'vocal',   p: { pitch: 320, f1: 500, f2: 800,  f3: 2830, decay: 0.2, wave: 'sawtooth' } },
  { id: 'vox4',    name: 'Vox "Oo"', color: '#818CF8', type: 'vocal',   p: { pitch: 300, f1: 300, f2: 650,  f3: 2700, decay: 0.22, wave: 'sawtooth' } },
];

let STEPS = 16;
const MAX_STEPS = 32;

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let grid = [];
let muted = new Array(INSTRUMENTS.length).fill(false);
let soloed = new Array(INSTRUMENTS.length).fill(false);
let bpm = 120;
let reverbMix = 0;
let reverbNode = null;
let dryGain = null;
let wetGain = null;
let playing = false;
let currentStep = 0;
let intervalId = null;
let audioCtx = null;
let currentMode = 'sequencer'; // 'sequencer' or 'drumpad'

INSTRUMENTS.forEach(() => {
  grid.push(new Array(STEPS).fill(false));
});

// ═══════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sampleRate = audioCtx.sampleRate;
    const length = sampleRate * 2;
    const impulse = audioCtx.createBuffer(2, length, sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
      }
    }
    reverbNode = audioCtx.createConvolver();
    reverbNode.buffer = impulse;
    const reverbLP = audioCtx.createBiquadFilter();
    reverbLP.type = 'lowpass';
    reverbLP.frequency.value = 2800;
    reverbLP.Q.value = 0.7;
    // Master compressor so all instruments stay audible together
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 12;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.4;
    compressor.connect(masterGain).connect(audioCtx.destination);

    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();
    dryGain.gain.value = 1;
    wetGain.gain.value = 0;
    dryGain.connect(compressor);
    reverbNode.connect(reverbLP).connect(wetGain);
    wetGain.connect(compressor);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function getOutput() {
  const merger = audioCtx.createGain();
  merger.connect(dryGain);
  merger.connect(reverbNode);
  return merger;
}

// Utility: create noise buffer
function makeNoise(dur) {
  const buf = audioCtx.createBuffer(2, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = buf.getChannelData(ch);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

// Utility: soft-clip waveshaper
function makeSaturation(amount) {
  const ws = audioCtx.createWaveShaper();
  const n = 256; const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n/2)) - 1;
    curve[i] = Math.tanh(x * amount);
  }
  ws.curve = curve; ws.oversample = '2x';
  return ws;
}

function playSound(inst) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const p = inst.p || {};
  const out = getOutput();

  switch (inst.type) {
    case 'kick': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 150, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 30, t + 0.12);
      gain.gain.setValueAtTime(0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.3));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.3) + 0.01);
      break;
    }
    case 'snare': {
      const dur = p.noiseDecay || 0.12;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource(); noise.buffer = buf;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.5, t); ng.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1000;
      noise.connect(hp).connect(ng).connect(getOutput());
      noise.start(t); noise.stop(t + dur + 0.01);
      const osc = audioCtx.createOscillator(); const og = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = p.tone || 180;
      og.gain.setValueAtTime(0.4, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(og).connect(getOutput());
      osc.start(t); osc.stop(t + 0.09);
      break;
    }
    case 'hihat': {
      const dur = p.decay || 0.04;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.55, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 7000;
      src.connect(hp).connect(gain).connect(getOutput());
      src.start(t); src.stop(t + dur + 0.01);
      break;
    }
    case 'openhat': {
      const dur = p.decay || 0.2;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 6000;
      src.connect(hp).connect(gain).connect(getOutput());
      src.start(t); src.stop(t + dur + 0.02);
      break;
    }
    case 'clap': {
      for (let n = 0; n < 3; n++) {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.02, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        const src = audioCtx.createBufferSource(); src.buffer = buf;
        const gain = audioCtx.createGain(); const off = n * 0.012;
        gain.gain.setValueAtTime(0.6, t + off); gain.gain.exponentialRampToValueAtTime(0.001, t + off + 0.03);
        const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2000;
        src.connect(bp).connect(gain).connect(getOutput());
        src.start(t + off); src.stop(t + off + 0.04);
      }
      break;
    }
    case 'tom': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 200, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 80, t + (p.decay || 0.15));
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.2));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.2) + 0.01);
      break;
    }
    case 'rim': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.value = p.freq || 800;
      gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + 0.04);
      break;
    }
    case 'perc': {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(p.start || 3000, t);
      osc.frequency.exponentialRampToValueAtTime(p.end || 500, t + 0.05);
      gain.gain.setValueAtTime(0.45, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + (p.decay || 0.06));
      osc.connect(gain).connect(getOutput());
      osc.start(t); osc.stop(t + (p.decay || 0.06) + 0.01);
      break;
    }
    case 'vocal': {
      // Formant synthesis — creates vowel-like sounds via bandpass-filtered oscillators
      const dur = p.decay || 0.2;
      const pitch = p.pitch || 340;
      const formants = [p.f1 || 800, p.f2 || 1200, p.f3 || 2800];
      const formantQ = [12, 10, 8];
      const formantGain = [0.55, 0.35, 0.18];
      const out = getOutput();
      
      // Base oscillator (rich harmonics)
      const osc = audioCtx.createOscillator();
      osc.type = p.wave || 'sawtooth';
      osc.frequency.setValueAtTime(pitch, t);
      // Slight pitch drop for natural feel
      osc.frequency.exponentialRampToValueAtTime(pitch * 0.97, t + dur);
      
      // Route through formant filters
      formants.forEach((freq, i) => {
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = freq;
        bp.Q.value = formantQ[i];
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(formantGain[i], t);
        g.gain.setValueAtTime(formantGain[i], t + dur * 0.1);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(bp).connect(g).connect(out);
      });
      
      // Add breathy noise layer
      const noiseDur = dur * 0.6;
      const nBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * noiseDur, audioCtx.sampleRate);
      const nData = nBuf.getChannelData(0);
      for (let i = 0; i < nData.length; i++) nData[i] = Math.random() * 2 - 1;
      const nSrc = audioCtx.createBufferSource(); nSrc.buffer = nBuf;
      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.08, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + noiseDur);
      const nBp = audioCtx.createBiquadFilter();
      nBp.type = 'bandpass'; nBp.frequency.value = formants[1]; nBp.Q.value = 3;
      nSrc.connect(nBp).connect(nGain).connect(out);
      nSrc.start(t); nSrc.stop(t + noiseDur + 0.01);
      
      osc.start(t); osc.stop(t + dur + 0.01);
      break;
    }
    case 'crash': {
      const dur = p.decay || 0.8;
      const vol = p.vol || 0.35;
      
      // Layered noise
      const nBuf = makeNoise(dur);
      const noise = audioCtx.createBufferSource(); noise.buffer = nBuf;
      const noiseG = audioCtx.createGain();
      noiseG.gain.setValueAtTime(vol, t);
      noiseG.gain.setValueAtTime(vol * 0.7, t + 0.05);
      noiseG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      
      // Metallic shimmer (6 detuned square waves)
      const metalG = audioCtx.createGain();
      metalG.gain.setValueAtTime(vol * 0.3, t);
      metalG.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.7);
      [2043, 3411, 4517, 5765, 6898, 8259].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'square'; osc.frequency.value = f;
        osc.connect(metalG);
        osc.start(t); osc.stop(t + dur * 0.7 + 0.01);
      });
      
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 4000;
      const peak = audioCtx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = p.peak || 8000; peak.Q.value = 1.5; peak.gain.value = 5;
      
      const mix = audioCtx.createGain();
      noise.connect(mix); metalG.connect(mix);
      mix.connect(hp).connect(peak).connect(noiseG).connect(out);
      
      noise.start(t); noise.stop(t + dur + 0.01);
      break;
    }
    case 'ride': {
      const dur = p.decay || 0.5;
      
      // Metallic body — inharmonic partials
      const metalG = audioCtx.createGain();
      metalG.gain.setValueAtTime(0.08, t);
      metalG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      [2903, 3677, 4501, 5818, 7348].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'square'; osc.frequency.value = f;
        osc.connect(metalG);
        osc.start(t); osc.stop(t + dur + 0.01);
      });
      
      // Noise wash
      const nBuf = makeNoise(dur);
      const noise = audioCtx.createBufferSource(); noise.buffer = nBuf;
      const noiseG = audioCtx.createGain();
      noiseG.gain.setValueAtTime(0.15, t);
      noiseG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = p.hp || 5000;
      const bell = audioCtx.createBiquadFilter(); bell.type = 'peaking'; bell.frequency.value = p.bell || 10000; bell.Q.value = p.q || 2; bell.gain.value = 6;
      
      // Ping
      const ping = audioCtx.createOscillator();
      const pingG = audioCtx.createGain();
      ping.type = 'sine'; ping.frequency.value = p.ping || 4500;
      pingG.gain.setValueAtTime(p.pingVol || 0.08, t);
      pingG.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.3);
      
      const mix = audioCtx.createGain();
      metalG.connect(mix); noise.connect(mix);
      mix.connect(hp).connect(bell).connect(noiseG).connect(out);
      ping.connect(pingG).connect(out);
      
      noise.start(t); noise.stop(t + dur + 0.01);
      ping.start(t); ping.stop(t + dur * 0.3 + 0.01);
      break;
    }
    case 'china': {
      const dur = p.decay || 0.6;
      
      // Trashy metallic — dense inharmonic oscillators
      const metalG = audioCtx.createGain();
      metalG.gain.setValueAtTime(0.15, t);
      metalG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      [1847, 2903, 3581, 4799, 5903, 7103].forEach(f => {
        const osc = audioCtx.createOscillator();
        osc.type = 'square'; osc.frequency.value = f;
        osc.connect(metalG);
        osc.start(t); osc.stop(t + dur + 0.01);
      });
      
      // Noise
      const nBuf = makeNoise(dur);
      const noise = audioCtx.createBufferSource(); noise.buffer = nBuf;
      
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      const mid = audioCtx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 5000; mid.Q.value = 2; mid.gain.value = 8;
      const sat = makeSaturation(3);
      const noiseG = audioCtx.createGain();
      noiseG.gain.setValueAtTime(0.3, t);
      noiseG.gain.exponentialRampToValueAtTime(0.001, t + dur);
      
      const mix = audioCtx.createGain();
      metalG.connect(mix); noise.connect(mix);
      mix.connect(hp).connect(mid).connect(sat).connect(noiseG).connect(out);
      
      noise.start(t); noise.stop(t + dur + 0.01);
      break;
    }
    case 'crossstick': {
      const freq = p.freq || 1200;
      
      // Sharp click
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.45, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
      
      // Resonant body
      const osc2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 0.6, t);
      osc2.frequency.exponentialRampToValueAtTime(freq * 0.2, t + 0.015);
      g2.gain.setValueAtTime(0.3, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
      
      // Noise burst
      const nBuf = makeNoise(0.006);
      const noise = audioCtx.createBufferSource(); noise.buffer = nBuf;
      const nG = audioCtx.createGain();
      nG.gain.setValueAtTime(0.35, t);
      nG.gain.exponentialRampToValueAtTime(0.001, t + 0.006);
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2000;
      
      osc.connect(g).connect(out);
      osc2.connect(g2).connect(out);
      noise.connect(hp).connect(nG).connect(out);
      
      osc.start(t); osc.stop(t + 0.025);
      osc2.start(t); osc2.stop(t + 0.02);
      noise.start(t); noise.stop(t + 0.008);
      break;
    }
    case 'snaredrag': {
      // Buzz roll — 6 rapid micro-hits
      for (let n = 0; n < 6; n++) {
        const off = n * 0.015;
        const vol = 0.2 * (1 - n * 0.1);
        
        const nBuf = makeNoise(0.05);
        const src = audioCtx.createBufferSource(); src.buffer = nBuf;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol, t + off);
        g.gain.exponentialRampToValueAtTime(0.001, t + off + 0.05);
        const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
        const peak = audioCtx.createBiquadFilter(); peak.type = 'peaking'; peak.frequency.value = 3000; peak.Q.value = 2; peak.gain.value = 3;
        src.connect(hp).connect(peak).connect(g).connect(out);
        src.start(t + off); src.stop(t + off + 0.055);
      }
      // Body resonance
      const osc = audioCtx.createOscillator();
      const og = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.value = 170;
      og.gain.setValueAtTime(0.25, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(og).connect(out);
      osc.start(t); osc.stop(t + 0.13);
      break;
    }
  }
}

// SEQUENCER
// ═══════════════════════════════════════════════════
function getStepInterval() {
  return (60 / bpm) / 4 * 1000;
}

function tick() {
  lastTickTime = performance.now();
  document.querySelectorAll('.step.current').forEach(s => s.classList.remove('current'));
  document.querySelectorAll(`.step[data-step="${currentStep}"]`).forEach(s => s.classList.add('current'));
  
  INSTRUMENTS.forEach((inst, row) => {
    const anySolo = soloed.some(s => s);
    const canPlay = anySolo ? soloed[row] && !muted[row] : !muted[row];
    if (grid[row][currentStep] && canPlay) {
      playSound(inst);
    }
  });
  
  // Loop system — synced to sequencer clock
  if (typeof loopTick === 'function') loopTick();
  
  // Update loop playhead visualizer
  const phFill = document.getElementById('loopPlayheadFill');
  if (phFill) phFill.style.width = ((currentStep / STEPS) * 100) + '%';
  
  lastSoundedStep = currentStep;
  currentStep = (currentStep + 1) % STEPS;
  if (currentStep >= STEPS) currentStep = 0;
  
  if (playing) {
    intervalId = setTimeout(tick, getStepInterval());
  }
}

function play() {
  initAudio();
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('playBtn').classList.add('playing');
  tick();
}

function pause() {
  playing = false;
  clearTimeout(intervalId);
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('playBtn').classList.remove('playing');
}

function stop() {
  pause();
  currentStep = 0;
  document.querySelectorAll('.step.current').forEach(s => s.classList.remove('current'));
  const phFill = document.getElementById('loopPlayheadFill');
  if (phFill) phFill.style.width = '0%';
}

// BUILD UI
// ═══════════════════════════════════════════════════
function buildGrid() {
  const labelsEl = document.getElementById('rowLabels');
  const gridEl = document.getElementById('grid');
  const beatNumsEl = document.getElementById('beatNumbers');
  
  for (let s = 0; s < STEPS; s++) {
    const num = document.createElement('div');
    num.className = `beat-num ${s % 4 === 0 ? 'downbeat' : ''}`;
    num.textContent = s % 4 === 0 ? (s / 4 + 1) : '·';
    beatNumsEl.appendChild(num);
  }
  
  INSTRUMENTS.forEach((inst, row) => {
    const label = document.createElement('div');
    label.className = 'row-label';
    
    const soloBtn = document.createElement('button');
    soloBtn.className = 'row-solo clickable';
    soloBtn.textContent = 'S';
    soloBtn.title = `Solo ${inst.name}`;
    soloBtn.addEventListener('click', () => {
      soloed[row] = !soloed[row];
      soloBtn.classList.toggle('soloed', soloed[row]);
    });

    const muteBtn = document.createElement('button');
    muteBtn.className = 'row-mute clickable';
    muteBtn.textContent = 'M';
    muteBtn.title = `Mute ${inst.name}`;
    muteBtn.addEventListener('click', () => {
      muted[row] = !muted[row];
      muteBtn.classList.toggle('muted', muted[row]);
    });
    
    const colorDot = document.createElement('div');
    colorDot.className = 'row-color';
    colorDot.style.background = inst.color;
    
    const name = document.createElement('div');
    name.className = 'row-name clickable';
    name.textContent = inst.name;
    
    // Fill cycle: click to cycle through fill patterns
    let fillState = 0; // 0=empty, 1=all, 2=every-2, 3=every-4
    name.addEventListener('click', () => {
      const hasAny = grid[row].some(v => v);
      
      if (hasAny && fillState === 0) {
        // External state (user drew something) — clear it
        grid[row].fill(false);
        fillState = 0;
      } else if (fillState === 0) {
        // Empty → fill all
        grid[row].fill(true);
        fillState = 1;
      } else if (fillState === 1) {
        // All → every other
        for (let s = 0; s < STEPS; s++) grid[row][s] = (s % 2 === 0);
        fillState = 2;
      } else if (fillState === 2) {
        // Every other → every 4
        for (let s = 0; s < STEPS; s++) grid[row][s] = (s % 4 === 0);
        fillState = 3;
      } else if (fillState === 3) {
        // Every 4 → every 8
        for (let s = 0; s < STEPS; s++) grid[row][s] = (s % 8 === 0);
        fillState = 4;
      } else {
        // Every 8 → clear
        grid[row].fill(false);
        fillState = 0;
      }
      
      updateGridUI();
    });
    
    label.appendChild(soloBtn);
    label.appendChild(muteBtn);
    label.appendChild(name);
    label.appendChild(colorDot);
    labelsEl.appendChild(label);
    
    const rowEl = document.createElement('div');
    rowEl.className = 'grid-row';
    
    for (let s = 0; s < STEPS; s++) {
      const step = document.createElement('div');
      step.className = `step clickable ${s % 4 === 0 ? 'beat-start' : ''}`;
      step.dataset.row = row;
      step.dataset.step = s;
      
      const bg = document.createElement('div');
      bg.className = 'step-bg';
      const dot = document.createElement('div');
      dot.className = 'step-dot';
      dot.style.background = inst.color;
      bg.appendChild(dot);
      step.appendChild(bg);
      
      step.addEventListener('mousedown', (e) => {
        e.preventDefault();
        initAudio();
        grid[row][s] = !grid[row][s];
        step.classList.toggle('active', grid[row][s]);
        step.dataset.dragMode = grid[row][s] ? 'on' : 'off';
        isDragging = true;
        dragMode = grid[row][s];
        dragRow = row;
      });
      
      step.addEventListener('mouseenter', () => {
        if (isDragging && dragRow === row) {
          grid[row][s] = dragMode;
          step.classList.toggle('active', dragMode);
        }
      });
      
      rowEl.appendChild(step);
    }
    
    gridEl.appendChild(rowEl);
  });
}

let expanded = false;

function toggleSteps() {
  const btn = document.getElementById('addStepsBtn');
  
  if (!expanded) {
    // Expand from 16 to 32
    const oldSteps = STEPS;
    STEPS = MAX_STEPS;
    expanded = true;
    document.getElementById('stepsLabel').textContent = '8';
    btn.title = 'Switch to 4 beats';
    
    // Extend grid arrays
    grid.forEach(row => {
      for (let i = oldSteps; i < STEPS; i++) row.push(false);
    });
    
    // Add beat number labels
    const beatNumsEl = document.getElementById('beatNumbers');
    for (let s = oldSteps; s < STEPS; s++) {
      const num = document.createElement('div');
      num.className = `beat-num ${s % 4 === 0 ? 'downbeat' : ''}`;
      num.textContent = s % 4 === 0 ? (s / 4 + 1) : '·';
      beatNumsEl.appendChild(num);
    }
    
    // Add new step cells to each row
    const gridRows = document.querySelectorAll('.grid-row');
    gridRows.forEach((rowEl, row) => {
      const inst = INSTRUMENTS[row];
      for (let s = oldSteps; s < STEPS; s++) {
        const step = document.createElement('div');
        step.className = `step clickable ${s % 4 === 0 ? 'beat-start' : ''}`;
        step.dataset.row = row;
        step.dataset.step = s;
        
        const bg = document.createElement('div');
        bg.className = 'step-bg';
        const dot = document.createElement('div');
        dot.className = 'step-dot';
        dot.style.background = inst.color;
        bg.appendChild(dot);
        step.appendChild(bg);
        
        const stepIdx = s;
        step.addEventListener('mousedown', (e) => {
          e.preventDefault();
          initAudio();
          grid[row][stepIdx] = !grid[row][stepIdx];
          step.classList.toggle('active', grid[row][stepIdx]);
          isDragging = true;
          dragMode = grid[row][stepIdx];
          dragRow = row;
        });
        
        step.addEventListener('mouseenter', () => {
          if (isDragging && dragRow === row) {
            grid[row][stepIdx] = dragMode;
            step.classList.toggle('active', dragMode);
          }
        });
        
        rowEl.appendChild(step);
        
        // Cascade entrance
        const delay = row * 30 + (s - oldSteps) * 20;
        setTimeout(() => step.classList.add('entered'), delay);
      }
    });
  } else {
    // Collapse back to 16
    if (playing && currentStep >= 16) {
      currentStep = 0;
      document.querySelectorAll('.step.current').forEach(s => s.classList.remove('current'));
    }
    
    STEPS = 16;
    expanded = false;
    document.getElementById('stepsLabel').textContent = '4';
    btn.title = 'Switch to 8 beats';
    
    // Trim grid arrays
    grid.forEach(row => row.length = 16);
    
    // Remove extra beat numbers
    const beatNumsEl = document.getElementById('beatNumbers');
    while (beatNumsEl.children.length > 16) {
      beatNumsEl.removeChild(beatNumsEl.lastChild);
    }
    
    // Remove extra steps from each row
    const gridRows = document.querySelectorAll('.grid-row');
    gridRows.forEach(rowEl => {
      while (rowEl.children.length > 16) {
        rowEl.removeChild(rowEl.lastChild);
      }
    });
  }
}

document.getElementById('addStepsBtn').addEventListener('click', toggleSteps);

let isDragging = false;
let dragMode = false;
let dragRow = -1;

document.addEventListener('mouseup', () => { isDragging = false; });

const DRUM_KITS = {

  ],
};

const PAD_INSTRUMENTS = DRUM_KITS['Standard'];

let padElements = [];

function buildDrumPads() {
  const container = document.getElementById('drumpadGrid');
  
  for (let i = 0; i < 16; i++) {
    const pad = document.createElement('div');
    const inst = PAD_INSTRUMENTS[i] || null;
    const color = inst ? inst.color : '#1a1a1a';
    
    pad.className = 'drum-pad clickable';
    pad.dataset.padIndex = i;
    
    if (inst) {
      pad.style.borderColor = color;
      pad.style.boxShadow = `0 0 12px ${color}33, inset 0 0 8px ${color}11`;
    }
    
    // Ripple element
    const ripple = document.createElement('div');
    ripple.className = 'pad-ripple';
    if (inst) ripple.style.background = color;
    pad.appendChild(ripple);
    
    // Name label
    const nameEl = document.createElement('div');
    nameEl.className = 'pad-name';
    nameEl.textContent = inst ? inst.name : '';
    pad.appendChild(nameEl);
    
    // Key label
    const keyEl = document.createElement('div');
    keyEl.className = 'pad-key';
    keyEl.textContent = PAD_KEY_LABELS[i];
    pad.appendChild(keyEl);
    
    // Touch/mouse events
    if (inst) {
      const triggerPad = (e) => {
        e.preventDefault();
        initAudio();
        playSound(inst);
        hitPad(i);
        if (typeof recordHit === 'function') recordHit(i);
      };
      
      const releasePad = (e) => {
        e.preventDefault();
        pad.classList.remove('hit');
      };
      
      pad.addEventListener('mousedown', triggerPad);
      pad.addEventListener('mouseup', releasePad);
      pad.addEventListener('mouseleave', releasePad);
      pad.addEventListener('touchstart', triggerPad, { passive: false });
      pad.addEventListener('touchend', releasePad, { passive: false });
      pad.addEventListener('touchcancel', releasePad, { passive: false });
    }
    
    container.appendChild(pad);
    padElements.push(pad);
  }
}

function hitPad(index) {
  const pad = padElements[index];
  if (!pad || pad.classList.contains('empty')) return;
  
  const inst = PAD_INSTRUMENTS[index] || null;
  if (!inst) return;
  
  const color = inst.color;
  
  // Hit visual
  pad.classList.add('hit');
  pad.style.background = color;
  pad.style.boxShadow = `0 0 30px ${color}88, 0 0 60px ${color}44, inset 0 0 20px ${color}44`;
  
  // Ripple
  const ripple = pad.querySelector('.pad-ripple');
  ripple.classList.remove('active');
  void ripple.offsetWidth;
  ripple.classList.add('active');
  
  // Release after short duration
  setTimeout(() => {
    pad.classList.remove('hit');
    pad.style.background = '#111';
    pad.style.boxShadow = `0 0 12px ${color}33, inset 0 0 8px ${color}11`;
  }, 120);
  
  setTimeout(() => {
    ripple.classList.remove('active');
  }, 350);
}

// LOOP RECORDING SYSTEM (independent clock — not tied to sequencer)
// ═══════════════════════════════════════════════════
const LOOP_COUNT = 8;
const loops = [];

function playClick(freq) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.06);
}

function buildLoopCircles() {
  const col = document.getElementById('loopTrackCol');
  for (let i = 0; i < LOOP_COUNT; i++) {
    const circle = document.createElement('div');
    circle.className = 'loop-circle clickable';
    
    const countText = document.createElement('div');
    countText.className = 'loop-count-text';
    circle.appendChild(countText);
    
    col.appendChild(circle);
    loops.push({ state: 'idle', hits: [], el: circle, countText: countText, countVal: 0, recordedSteps: 0 });
    circle.addEventListener('click', () => handleLoopClick(i));
  }
}

function handleLoopClick(index) {
  const loop = loops[index];
  
  if (loop.state === 'has-data') {
    // Clear
    loop.hits = [];
    loop.state = 'idle';
    loop.el.className = 'loop-circle clickable';
    loop.countText.textContent = '';
    return;
  }
  
  if (loop.state === 'armed' || loop.state === 'counting' || loop.state === 'recording') {
    // Cancel
    loop.state = 'idle';
    loop.hits = [];
    loop.el.className = 'loop-circle clickable';
    loop.countText.textContent = '';
    return;
  }
  
  // Arm — will start count-in at next beat 1 (step 0)
  initAudio();
  loop.state = 'armed';
  loop.hits = [];
  loop.countVal = 0;
  loop.recordedSteps = 0;
  loop.el.className = 'loop-circle clickable armed';
  loop.countText.textContent = '';
  
  // Make sure sequencer is playing so we can sync
  if (!playing) {
    currentStep = 0;
    play();
  }
}

// The step that last sounded (currentStep gets incremented after tick, so async events see the wrong value)
let lastSoundedStep = 0;
let lastTickTime = 0;

// Called from pad triggers when any loop is recording
function recordHit(padIndex) {
  loops.forEach(loop => {
    if (loop.state === 'recording') {
      // Use lastSoundedStep — the step that actually played, not the already-incremented currentStep
      const now = performance.now();
      const stepMs = getStepInterval();
      const elapsed = now - lastTickTime;
      // If closer to the next step, snap forward
      let step = lastSoundedStep;
      if (elapsed > stepMs * 0.5) {
        step = (lastSoundedStep + 1) % STEPS;
      }
      loop.hits.push({ step: step, padIndex: padIndex });
    }
  });
}

// Called every tick from the sequencer — single clock source
function loopTick() {
  loops.forEach(loop => {
    // Armed → start counting at beat 1
    if (loop.state === 'armed' && currentStep === 0) {
      loop.state = 'counting';
      loop.countVal = 0;
      loop.el.className = 'loop-circle clickable counting';
    }
    
    // Count-in: 4 beats (16 steps) synced to sequencer
    if (loop.state === 'counting') {
      if (currentStep % 4 === 0) {
        loop.countVal++;
        loop.countText.textContent = loop.countVal;
        playClick(loop.countVal === 4 ? 1200 : 900);
      }
      // After 4 beats (16 steps of count), start recording
      if (loop.countVal >= 4 && currentStep === 0) {
        loop.state = 'recording';
        loop.hits = [];
        loop.recordedSteps = 0;
        loop.el.className = 'loop-circle clickable recording';
        loop.countText.textContent = '';
      }
    }
    
    // Recording: metronome + track duration
    if (loop.state === 'recording') {
      // Metronome on every beat, emphasis on beat 4
      if (currentStep % 4 === 0) {
        const beatNum = (currentStep / 4) % 4;
        playClick(beatNum === 3 ? 1200 : 900);
      }
      
      loop.recordedSteps++;
      
      if (loop.recordedSteps >= STEPS) {
        loop.state = 'has-data';
        loop.el.className = 'loop-circle clickable has-data';
        loop.countText.textContent = '';
      }
    }
    
    // Playback: fire hits synced to sequencer step
    if (loop.state === 'has-data') {
      loop.hits.forEach(hit => {
        if (hit.step === currentStep) {
          const inst = PAD_INSTRUMENTS[hit.padIndex];
          if (inst) {
            playSound(inst);
            hitPad(hit.padIndex);
          }
        }
      });
    }
  });
  
  // Update REC LED
  const recLed = document.getElementById('fxLedRec');
  if (recLed) {
    const anyRecording = loops.some(l => l.state === 'recording' || l.state === 'counting');
    recLed.classList.toggle('on', anyRecording);
  }
}

// FX KNOB ROTATION (decorative)
// ═══════════════════════════════════════════════════
document.querySelectorAll('.fx-knob-dial').forEach(dial => {
  let angle = 220; // start near 7 o'clock (~middle)
  dial.style.transform = `rotate(${angle}deg)`;
  let dragging = false;
  let lastY = 0;

  function onDown(e) {
    dragging = true;
    lastY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const y = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    const delta = (lastY - y) * 1.5;
    angle = Math.max(30, Math.min(330, angle + delta));
    dial.style.transform = `rotate(${angle}deg)`;
    lastY = y;
  }
  function onUp() { dragging = false; }

  dial.addEventListener('mousedown', onDown);
  dial.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
});

function cascadeSequencerEntrance() {
  // Remove entered class from all sequencer elements
  document.querySelectorAll('.step').forEach(s => s.classList.remove('entered'));
  document.querySelectorAll('.row-label').forEach(l => l.classList.remove('entered'));
  
  // Re-add with staggered timing
  document.querySelectorAll('.step').forEach((step) => {
    const row = parseInt(step.dataset.row);
    const col = parseInt(step.dataset.step);
    const delay = row * 30 + col * 20;
    setTimeout(() => step.classList.add('entered'), delay);
  });
  
  document.querySelectorAll('.row-label').forEach((label, i) => {
    setTimeout(() => label.classList.add('entered'), i * 40);
  });
}

function switchMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  
  const seqView = document.getElementById('sequencerView');
  const padView = document.getElementById('drumpadView');
  const seqActions = document.getElementById('seqActions');
  const groupMutes = document.getElementById('groupMuteRow');
  const modeSeqBtn = document.getElementById('modeSeqBtn');
  const modePadBtn = document.getElementById('modePadBtn');
  
  if (mode === 'sequencer') {
    // Show sequencer, hide drumpad
    seqView.classList.remove('hidden');
    padView.classList.remove('visible');
    seqActions.style.display = '';
    groupMutes.style.display = '';
    document.getElementById('randomBtn').style.display = '';
    document.getElementById('presetBtn').style.display = '';
    modeSeqBtn.classList.add('active');
    modePadBtn.classList.remove('active');
    
    // Remove entered from drum pads
    padElements.forEach(pad => pad.classList.remove('entered'));
    
    // Cascade entrance animation for sequencer
    cascadeSequencerEntrance();
  } else {
    // Hide sequencer, show drumpad
    seqView.classList.add('hidden');
    padView.classList.add('visible');
    groupMutes.style.display = 'none';
    document.getElementById('randomBtn').style.display = 'none';
    document.getElementById('presetBtn').style.display = 'none';
    modeSeqBtn.classList.remove('active');
    modePadBtn.classList.add('active');
    
    // Remove entered from sequencer elements
    document.querySelectorAll('.step').forEach(s => s.classList.remove('entered'));
    document.querySelectorAll('.row-label').forEach(l => l.classList.remove('entered'));
    
    // Entrance animation for pads
    padElements.forEach((pad, i) => {
      pad.classList.remove('entered');
      const row = Math.floor(i / 4);
      const col = i % 4;
      const delay = row * 40 + col * 30;
      setTimeout(() => pad.classList.add('entered'), delay);
    });
  }
}

document.getElementById('modeSeqBtn').addEventListener('click', () => switchMode('sequencer'));
document.getElementById('modePadBtn').addEventListener('click', () => switchMode('drumpad'));

const presetNames = Object.keys(PRESETS);
let presetIndex = 0;

function loadPreset(name) {
  const preset = PRESETS[name];
  if (!preset) return;
  preset.forEach((pattern, row) => {
    for (let s = 0; s < STEPS; s++) {
      grid[row][s] = !!pattern[s % pattern.length];
    }
  });
  updateGridUI();
}

function clearGrid() {
  grid.forEach(row => row.fill(false));
  updateGridUI();
}

function randomize() {
  INSTRUMENTS.forEach((inst, row) => {
    const density = inst.type === 'kick' ? 0.25 : inst.type === 'hihat' ? 0.5 : inst.type === 'vocal' ? 0.12 : 0.15;
    for (let s = 0; s < STEPS; s++) {
      grid[row][s] = Math.random() < density;
    }
  });
  updateGridUI();
}

function updateGridUI() {
  document.querySelectorAll('.step').forEach(step => {
    const row = parseInt(step.dataset.row);
    const s = parseInt(step.dataset.step);
    step.classList.toggle('active', grid[row][s]);
  });
}

function commitBpmEdit() {
  const span = document.getElementById('bpmValue');
  const input = document.getElementById('bpmEdit');
  let val = parseInt(input.value);
  if (isNaN(val) || val < 20) val = 20;
  if (val > 300) val = 300;
  bpm = val;
  span.textContent = bpm;
  document.getElementById('bpmSlider').value = Math.min(200, Math.max(60, bpm));
  input.style.display = 'none';
  span.style.display = '';
}

  if (e.key === 'Enter') { e.preventDefault(); commitBpmEdit(); }
  if (e.key === 'Escape') {
    document.getElementById('bpmEdit').value = bpm;
    commitBpmEdit();
  }
});

// ── ARROW KEY REVERB ──
let arrowReverbInterval = null;
let arrowHeld = null;
const REVERB_STEP = 0.0075;
const REVERB_INTERVAL = 50;

function updateReverbHud() {
  const pct = Math.round(reverbMix * 100);
  document.getElementById('reverbPct').textContent = pct + '%';
  document.getElementById('reverbFill').style.width = pct + '%';
  document.getElementById('reverbSlider').value = pct;
  const hud = document.getElementById('reverbHud');
  hud.classList.add('visible');
}

function hideReverbHud() {
  document.getElementById('reverbHud').classList.remove('visible');
}

function setReverb(val, rampTime) {
  initAudio();
  reverbMix = Math.max(0, Math.min(1, val));
  const now = audioCtx.currentTime;
  if (rampTime && rampTime > 0) {
    dryGain.gain.cancelScheduledValues(now);
    wetGain.gain.cancelScheduledValues(now);
    dryGain.gain.setTargetAtTime(1 - reverbMix * 0.5, now, rampTime / 3);
    wetGain.gain.setTargetAtTime(reverbMix, now, rampTime / 3);
  } else {
    dryGain.gain.value = 1 - reverbMix * 0.5;
    wetGain.gain.value = reverbMix;
  }
  updateReverbHud();
}

function nudgeReverb(dir) {
  setReverb(reverbMix + dir * REVERB_STEP, 0);
}

// ── GROUP MUTE ──
let drumsMuted = false;
let vocalsMuted = false;

function toggleGroupMute(type) {
  const isDrums = type === 'drums';
  if (isDrums) drumsMuted = !drumsMuted; else vocalsMuted = !vocalsMuted;
  const active = isDrums ? drumsMuted : vocalsMuted;
  const btn = document.getElementById(isDrums ? 'muteDrumsBtn' : 'muteVocalsBtn');
  btn.classList.toggle('active', active);
  const key = isDrums ? 'D' : 'V';
  btn.innerHTML = active ? '<kbd>' + key + '</kbd> Unmute ' + (isDrums ? 'Drums' : 'Vocals') : '<kbd>' + key + '</kbd> Mute ' + (isDrums ? 'Drums' : 'Vocals');
  INSTRUMENTS.forEach((inst, i) => {
    const match = isDrums ? inst.type !== 'vocal' : inst.type === 'vocal';
    if (match) {
      muted[i] = active;
      const muteBtn = document.querySelectorAll('.row-mute')[i];
      if (muteBtn) muteBtn.classList.toggle('muted', active);
    }
  });
}

document.getElementById('muteDrumsBtn').addEventListener('click', () => toggleGroupMute('drums'));
document.getElementById('muteVocalsBtn').addEventListener('click', () => toggleGroupMute('vocals'));

// Track which pad keys are currently held (prevent repeat triggers)
const padKeysHeld = new Set();

document.addEventListener('keydown', (e) => {
  // Drum pad keyboard triggering
  if (currentMode === 'drumpad' && !e.metaKey && !e.ctrlKey && !e.altKey && document.activeElement.tagName !== 'INPUT') {
    const key = e.key.toLowerCase();
    const padIndex = PAD_KEYS.indexOf(key);
    if (padIndex >= 0 && PAD_INSTRUMENTS[padIndex] && !padKeysHeld.has(key)) {
      e.preventDefault();
      padKeysHeld.add(key);
      initAudio();
      playSound(PAD_INSTRUMENTS[padIndex]);
      hitPad(padIndex);
      if (typeof recordHit === 'function') recordHit(padIndex);
      return;
    }
  }

  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  
  // Only process sequencer-specific shortcuts in sequencer mode
  if (currentMode === 'sequencer') {
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); toggleMuteAll(); }
    if (e.key === 's' || e.key === 'S') { e.preventDefault(); soloed.fill(false); document.querySelectorAll('.row-solo').forEach(b => b.classList.remove('soloed')); }
    if (e.key === 'd' || e.key === 'D') { e.preventDefault(); toggleGroupMute('drums'); }
    if (e.key === 'v' || e.key === 'V') { e.preventDefault(); toggleGroupMute('vocals'); }
    if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) { e.preventDefault(); setReverb(0, 3.5); updateReverbHud(); setTimeout(hideReverbHud, 3500); }
  }
  
  // Arrow keys for reverb (both modes)
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.repeat) {
    e.preventDefault();
    const dir = e.key === 'ArrowUp' ? 1 : -1;
    arrowHeld = dir;
    nudgeReverb(dir);
    arrowReverbInterval = setInterval(() => nudgeReverb(dir), REVERB_INTERVAL);
  }
});

document.addEventListener('keyup', (e) => {
  // Release pad key tracking
  const key = e.key.toLowerCase();
  padKeysHeld.delete(key);
  
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    arrowHeld = null;
    clearInterval(arrowReverbInterval);
    arrowReverbInterval = null;
    setTimeout(hideReverbHud, 800);
  }
});

// ═══════════════════════════════════════════════════
// BOOT + LOAD-IN SEQUENCE
// ═══════════════════════════════════════════════════

const waveformEl = document.getElementById('bootWaveform');
for (let i = 0; i < 16; i++) {

buildGrid();

presetIndex = 0;

// Boot sequence

      const steps = document.querySelectorAll('.step');

// ═══════════════════════════════════════════════════
// HIT RIPPLE + TRIGGERED BOUNCE
// ═══════════════════════════════════════════════════
const _origTick = tick;
const origTickRef = tick;
function enhancedTick() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.step.active.current').forEach(step => {

const _realTick = tick;
tick = function() {

};

// ═══════════════════════════════════════════════════

  Object.assign(overlay.style, {
