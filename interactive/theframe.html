<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Frame — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
* { -webkit-tap-highlight-color: transparent; margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --card: #111;
  --card-border: #222;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  cursor: url('../cursor.svg') 16 8, default;
}

button { cursor: url('../crosshair.svg') 8 10, pointer !important; }
::-webkit-scrollbar { display: none; }

/* ── HEADER ── */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--card-border);
  flex-shrink: 0;
  min-height: 56px;
}
.app-title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
}
.header-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 1rem;
}
.timer-display {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2rem;
  letter-spacing: 0.02em;
  color: var(--text);
  transition: color 0.3s;
  min-width: 80px;
  text-align: center;
}
.timer-display.urgent { color: var(--accent); }
.frame-indicator {
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.header-right { display: flex; align-items: center; gap: 0.5rem; }

/* ── PROGRESS BAR ── */
.progress-bar-wrap {
  height: 2px;
  background: var(--card-border);
  flex-shrink: 0;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* ── SCREENS ── */
.screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* ── SETUP SCREEN ── */
.setup-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2rem;
}
.setup-title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 2.2rem;
  letter-spacing: 0.03em;
  text-align: center;
}
.setup-sub {
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  margin-top: -1.5rem;
}
.setup-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.6rem;
}
.setup-label {
  font-size: 0.6rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.btn-group {
  display: flex;
  gap: 0.4rem;
}
.btn-opt {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.75rem;
  padding: 0.5rem 1.2rem;
  background: transparent;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  color: var(--text-muted);
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.btn-opt:hover { border-color: #555; color: var(--text); }
.btn-opt.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

.start-btn {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1rem;
  letter-spacing: 0.08em;
  padding: 0.8rem 3rem;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: #000;
  transition: opacity 0.15s, transform 0.15s;
  margin-top: 0.5rem;
}
.start-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.start-btn:active { transform: translateY(0); }

/* Canvas preview in setup */
.setup-canvas-wrap {
  position: relative;
}
.canvas-note {
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-align: center;
  margin-top: 0.4rem;
  opacity: 0.6;
}

/* ── GAME SCREEN ── */
.game-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.75rem 1rem 0;
  overflow: hidden;
  gap: 0.75rem;
}

.canvas-area {
  position: relative;
  flex-shrink: 0;
}
.canvas-area canvas {
  display: block;
  border-radius: 4px;
}
#onionCanvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  border-radius: 4px;
}
#drawCanvas {
  position: relative;
  z-index: 1;
}
.canvas-locked-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,10,0.5);
  border-radius: 4px;
}
.canvas-locked-overlay.visible { display: flex; }
.locked-msg {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.5rem;
  color: var(--accent);
  letter-spacing: 0.1em;
}

/* ── TOOLBAR ── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  justify-content: center;
  padding-bottom: 0.75rem;
  flex-shrink: 0;
}
.tool-group {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}
.tool-divider {
  width: 1px;
  height: 24px;
  background: var(--card-border);
  flex-shrink: 0;
}

/* Color swatches */
.color-swatch {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  transition: transform 0.1s, border-color 0.1s;
  flex-shrink: 0;
}
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.active { border-color: var(--text); transform: scale(1.1); }
.color-swatch[data-color="#ffffff"] { border-color: #444; }
.color-swatch[data-color="#ffffff"].active { border-color: var(--text); }
.color-picker-wrap { position: relative; width: 20px; height: 20px; }
.color-picker-swatch {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px dashed var(--text-muted);
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: var(--text-muted);
  transition: border-color 0.1s;
}
.color-picker-swatch.active { border-color: var(--text); }
#colorPickerInput {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%; height: 100%;
  cursor: url('../crosshair.svg') 8 10, pointer !important;
}

/* Brush sizes */
.brush-btn {
  background: none;
  border: 1px solid transparent;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3px;
  transition: border-color 0.1s;
}
.brush-btn.active { border-color: var(--text-muted); }
.brush-dot {
  background: var(--text);
  border-radius: 50%;
}

/* Tool buttons */
.tool-btn {
  background: none;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.3rem 0.6rem;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.tool-btn:hover { color: var(--text); border-color: #555; }
.tool-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.tool-btn.accent-btn { border-color: var(--accent); color: var(--accent); }
.tool-btn.accent-btn:hover { background: var(--accent); color: #000; }
.tool-btn:disabled { opacity: 0.3; pointer-events: none; }

/* ── PLAYBACK SCREEN ── */
.playback-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 1.5rem;
}
.playback-title {
  font-family: 'din-2014-rounded-variable', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 0.04em;
}
.playback-canvas-wrap {
  position: relative;
}
#playbackCanvas { border-radius: 4px; display: block; }
.playback-controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
}
.playback-speed-group {
  display: flex; gap: 0.3rem; align-items: center;
}
.speed-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-right: 0.2rem;
}
.action-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  padding: 0.55rem 1.2rem;
  border-radius: 7px;
  border: 1px solid var(--card-border);
  background: transparent;
  color: var(--text);
  transition: all 0.15s;
}
.action-btn:hover { border-color: #555; background: #1a1a1a; }
.action-btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.action-btn.primary:hover { opacity: 0.85; }
.gif-status {
  font-size: 0.6rem;
  color: var(--text-muted);
  letter-spacing: 0.08em;
  min-height: 16px;
  text-align: center;
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="app-header">
  <span class="app-title">The Frame</span>
  <div class="header-center">
    <div id="timerDisplay" class="timer-display" style="display:none"></div>
    <div id="frameIndicator" class="frame-indicator" style="display:none"></div>
  </div>
  <div class="header-right" id="headerRight"></div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>

<!-- ── SETUP SCREEN ── -->
<div class="screen active" id="setupScreen">
  <div class="setup-wrap">
    <div>
      <div class="setup-title">The Frame</div>
      <div class="setup-sub" style="margin-top:0.4rem;">Draw. Race. Animate.</div>
    </div>

    <div class="setup-canvas-wrap">
      <canvas id="previewCanvas" width="220" height="220" style="background:#fff;border-radius:4px;display:block;cursor:crosshair;"></canvas>
      <div class="canvas-note">doodle here before you start</div>
    </div>

    <div class="setup-section">
      <div class="setup-label">Time per frame</div>
      <div class="btn-group" id="timeGroup">
        <button class="btn-opt active" data-time="20">20s</button>
        <button class="btn-opt" data-time="60">1 min</button>
        <button class="btn-opt" data-time="300">5 min</button>
      </div>
    </div>

    <div class="setup-section">
      <div class="setup-label">Number of frames</div>
      <div class="btn-group" id="frameGroup">
        <button class="btn-opt active" data-frames="4">4</button>
        <button class="btn-opt" data-frames="8">8</button>
        <button class="btn-opt" data-frames="16">16</button>
        <button class="btn-opt" data-frames="24">24</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">Start</button>
  </div>
</div>

<!-- ── GAME SCREEN ── -->
<div class="screen" id="gameScreen">
  <div class="game-body">
    <div class="canvas-area" id="canvasArea">
      <canvas id="onionCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
      <div class="canvas-locked-overlay" id="lockedOverlay">
        <div class="locked-msg">NEXT FRAME →</div>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <!-- Colors -->
      <div class="tool-group" id="colorSwatches">
        <button class="color-swatch active" data-color="#000000" style="background:#000000"></button>
        <button class="color-swatch" data-color="#ffffff" style="background:#ffffff"></button>
        <button class="color-swatch" data-color="#e63946" style="background:#e63946"></button>
        <button class="color-swatch" data-color="#2196f3" style="background:#2196f3"></button>
        <button class="color-swatch" data-color="#ffeb3b" style="background:#ffeb3b"></button>
        <button class="color-swatch" data-color="#4caf50" style="background:#4caf50"></button>
        <button class="color-swatch" data-color="#ff9800" style="background:#ff9800"></button>
        <button class="color-swatch" data-color="#9c27b0" style="background:#9c27b0"></button>
        <div class="color-picker-wrap">
          <div class="color-picker-swatch" id="customColorSwatch">+</div>
          <input type="color" id="colorPickerInput" value="#ff8e3d">
        </div>
      </div>

      <div class="tool-divider"></div>

      <!-- Brush sizes -->
      <div class="tool-group">
        <button class="brush-btn active" data-size="3"><div class="brush-dot" style="width:5px;height:5px"></div></button>
        <button class="brush-btn" data-size="8"><div class="brush-dot" style="width:9px;height:9px"></div></button>
        <button class="brush-btn" data-size="16"><div class="brush-dot" style="width:15px;height:15px"></div></button>
        <button class="brush-btn" data-size="28"><div class="brush-dot" style="width:21px;height:21px"></div></button>
      </div>

      <div class="tool-divider"></div>

      <!-- Tool mode -->
      <div class="tool-group">
        <button class="tool-btn active" id="brushBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
          Brush
        </button>
        <button class="tool-btn" id="eraserBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20h15.06c.52 0 .94-.42.94-.94V14.8c0-.25-.1-.49-.29-.67L16.56 3.59C16.16 3.2 15.65 3 15.14 3zm-.14 2l5 5h-5l-5-5h5zm-7.87 7.27L9 10.41l5.59 5.59-1.94 1.94L7.13 12.27z"/></svg>
          Eraser
        </button>
      </div>

      <div class="tool-divider"></div>

      <!-- Onion / Paste / Undo / Clear -->
      <div class="tool-group">
        <button class="tool-btn" id="onionBtn" disabled title="Onion skin (frame 2+)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
          Onion
        </button>
        <button class="tool-btn" id="pasteBtn" disabled title="Paste previous frame (frame 2+)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
          Paste Prev
        </button>
        <button class="tool-btn" id="undoBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
          Undo
        </button>
        <button class="tool-btn accent-btn" id="clearBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Clear
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── PLAYBACK SCREEN ── -->
<div class="screen" id="playbackScreen">
  <div class="playback-wrap">
    <div class="playback-title">Your Animation</div>
    <div class="playback-canvas-wrap">
      <canvas id="playbackCanvas"></canvas>
    </div>
    <div class="playback-controls">
      <div class="playback-speed-group">
        <span class="speed-label">Speed</span>
        <button class="btn-opt" data-fps="4" id="fps4Btn">Slow</button>
        <button class="btn-opt active" data-fps="12" id="fps12Btn">Normal</button>
        <button class="btn-opt" data-fps="24" id="fps24Btn">Fast</button>
      </div>
      <button class="action-btn primary" id="downloadGifBtn">Download GIF</button>
      <button class="action-btn" id="shareBtn">Share</button>
      <button class="action-btn" id="playAgainBtn">Play Again</button>
    </div>
    <div class="gif-status" id="gifStatus"></div>
  </div>
</div>

<script>
// ── STATE ──
var selectedTime = 20;
var selectedFrames = 4;
var currentFrame = 0;
var frames = []; // array of ImageData
var undoStacks = []; // array of arrays of ImageData
var timerInterval = null;
var timeLeft = 0;
var isLocked = false;
var currentColor = '#000000';
var brushSize = 3;
var isEraser = false;
var onionOn = false;
var customColorActive = false;
var playbackFps = 12;
var playbackInterval = null;
var playbackFrameIdx = 0;

// Drawing state
var drawing = false;
var lastX = 0, lastY = 0;
var midX = 0, midY = 0;

// ── CANVAS SETUP ──
var drawCanvas = document.getElementById('drawCanvas');
var drawCtx = drawCanvas.getContext('2d');
var onionCanvas = document.getElementById('onionCanvas');
var onionCtx = onionCanvas.getContext('2d');
var playbackCanvas = document.getElementById('playbackCanvas');
var playbackCtx = playbackCanvas.getContext('2d');
var previewCanvas = document.getElementById('previewCanvas');
var previewCtx = previewCanvas.getContext('2d');

function sizeCanvases() {
  var header = document.querySelector('.app-header');
  var toolbar = document.getElementById('toolbar');
  var progressBar = document.querySelector('.progress-bar-wrap');
  var gameBody = document.querySelector('.game-body');
  if (!gameBody) return;

  var availH = window.innerHeight - header.offsetHeight - progressBar.offsetHeight - toolbar.offsetHeight - 32;
  var availW = gameBody.offsetWidth - 16;
  var size = Math.min(availH, availW, 700);
  size = Math.max(size, 200);

  drawCanvas.width = size; drawCanvas.height = size;
  onionCanvas.width = size; onionCanvas.height = size;
  playbackCanvas.width = size; playbackCanvas.height = size;

  clearCanvasWhite(drawCtx, size, size);
  if (currentFrame > 0) restoreFrame();
  renderOnion();
}

function clearCanvasWhite(ctx, w, h) {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
}

// ── SETUP SCREEN ──
// Time buttons
document.getElementById('timeGroup').querySelectorAll('.btn-opt').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#timeGroup .btn-opt').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    selectedTime = parseInt(btn.dataset.time);
  });
});

// Frame buttons
document.getElementById('frameGroup').querySelectorAll('.btn-opt').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#frameGroup .btn-opt').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    selectedFrames = parseInt(btn.dataset.frames);
  });
});

// Preview canvas drawing (setup)
(function() {
  var pDrawing = false;
  var pLast = null;
  function pPos(e) {
    var r = previewCanvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  previewCanvas.style.cursor = 'crosshair';
  previewCtx.fillStyle = '#fff';
  previewCtx.fillRect(0,0,220,220);
  previewCanvas.addEventListener('mousedown', function(e) { pDrawing=true; pLast=pPos(e); });
  previewCanvas.addEventListener('mousemove', function(e) {
    if(!pDrawing) return;
    var p = pPos(e);
    previewCtx.beginPath();
    previewCtx.strokeStyle = '#222';
    previewCtx.lineWidth = 2;
    previewCtx.lineCap = 'round';
    previewCtx.moveTo(pLast.x, pLast.y);
    previewCtx.lineTo(p.x, p.y);
    previewCtx.stroke();
    pLast = p;
  });
  previewCanvas.addEventListener('mouseup', function(){ pDrawing=false; });
  previewCanvas.addEventListener('mouseleave', function(){ pDrawing=false; });
})();

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  frames = [];
  undoStacks = [];
  currentFrame = 0;
  isLocked = false;
  onionOn = false;
  document.getElementById('onionBtn').classList.remove('active');

  showScreen('gameScreen');
  setTimeout(function() {
    sizeCanvases();
    clearCanvasWhite(drawCtx, drawCanvas.width, drawCanvas.height);
    onionCtx.clearRect(0,0,onionCanvas.width,onionCanvas.height);
    updateUI();
    startTimer();
  }, 50);
}

// ── SCREEN SWITCHING ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── TIMER ──
function startTimer() {
  clearInterval(timerInterval);
  timeLeft = selectedTime;
  isLocked = false;
  document.getElementById('lockedOverlay').classList.remove('visible');
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      lockAndAdvance();
    }
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('timerDisplay');
  var mins = Math.floor(timeLeft / 60);
  var secs = timeLeft % 60;
  el.textContent = mins > 0 ? mins + ':' + (secs < 10 ? '0' : '') + secs : timeLeft + 's';
  el.classList.toggle('urgent', timeLeft <= 5 && timeLeft > 0);
}

function lockAndAdvance() {
  isLocked = true;
  document.getElementById('lockedOverlay').classList.add('visible');
  saveCurrentFrame();
  setTimeout(function() {
    document.getElementById('lockedOverlay').classList.remove('visible');
    if (currentFrame + 1 >= selectedFrames) {
      goToPlayback();
    } else {
      currentFrame++;
      isLocked = false;
      clearCanvasWhite(drawCtx, drawCanvas.width, drawCanvas.height);
      undoStacks[currentFrame] = [];
      renderOnion();
      updateUI();
      startTimer();
    }
  }, 600);
}

function saveCurrentFrame() {
  frames[currentFrame] = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
}

// ── UNDO STACK ──
function pushUndo() {
  if (!undoStacks[currentFrame]) undoStacks[currentFrame] = [];
  var stack = undoStacks[currentFrame];
  stack.push(drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
  if (stack.length > 20) stack.shift();
}

function undo() {
  if (isLocked) return;
  var stack = undoStacks[currentFrame];
  if (!stack || stack.length === 0) return;
  var prev = stack.pop();
  drawCtx.putImageData(prev, 0, 0);
}

function restoreFrame() {
  if (frames[currentFrame]) {
    drawCtx.putImageData(frames[currentFrame], 0, 0);
  }
}

// ── ONION SKIN ──
function renderOnion() {
  onionCtx.clearRect(0,0,onionCanvas.width,onionCanvas.height);
  if (!onionOn || currentFrame === 0 || !frames[currentFrame-1]) return;
  // white bg first
  onionCtx.fillStyle = '#fff';
  onionCtx.fillRect(0,0,onionCanvas.width,onionCanvas.height);
  onionCtx.globalAlpha = 0.2;
  onionCtx.putImageData(frames[currentFrame-1], 0, 0);
  onionCtx.globalAlpha = 1;
}

// ── DRAWING ──
function getPos(e) {
  var r = drawCanvas.getBoundingClientRect();
  var t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

drawCanvas.addEventListener('mousedown', startDraw);
drawCanvas.addEventListener('mousemove', continueDraw);
drawCanvas.addEventListener('mouseup', endDraw);
drawCanvas.addEventListener('mouseleave', endDraw);
drawCanvas.addEventListener('touchstart', function(e){ e.preventDefault(); startDraw(e); }, {passive:false});
drawCanvas.addEventListener('touchmove', function(e){ e.preventDefault(); continueDraw(e); }, {passive:false});
drawCanvas.addEventListener('touchend', function(e){ e.preventDefault(); endDraw(e); }, {passive:false});

function startDraw(e) {
  if (isLocked) return;
  pushUndo();
  drawing = true;
  var p = getPos(e);
  lastX = p.x; lastY = p.y;
  midX = lastX; midY = lastY;
  drawCtx.beginPath();
  drawCtx.moveTo(lastX, lastY);
}

function continueDraw(e) {
  if (!drawing || isLocked) return;
  var p = getPos(e);
  var newMidX = (lastX + p.x) / 2;
  var newMidY = (lastY + p.y) / 2;

  drawCtx.beginPath();
  if (isEraser) {
    drawCtx.globalCompositeOperation = 'destination-out';
    drawCtx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.strokeStyle = currentColor;
  }
  drawCtx.lineWidth = brushSize;
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.moveTo(midX, midY);
  drawCtx.quadraticCurveTo(lastX, lastY, newMidX, newMidY);
  drawCtx.stroke();
  drawCtx.globalCompositeOperation = 'source-over';

  midX = newMidX; midY = newMidY;
  lastX = p.x; lastY = p.y;
}

function endDraw(e) {
  if (!drawing) return;
  drawing = false;
  // Final dot on tap
  drawCtx.beginPath();
  if (isEraser) {
    drawCtx.globalCompositeOperation = 'destination-out';
    drawCtx.fillStyle = 'rgba(0,0,0,1)';
  } else {
    drawCtx.globalCompositeOperation = 'source-over';
    drawCtx.fillStyle = currentColor;
  }
  drawCtx.arc(lastX, lastY, brushSize/2, 0, Math.PI*2);
  drawCtx.fill();
  drawCtx.globalCompositeOperation = 'source-over';
}

// ── TOOLBAR CONTROLS ──
// Colors
document.querySelectorAll('.color-swatch').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.color-swatch').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById('customColorSwatch').classList.remove('active');
    btn.classList.add('active');
    currentColor = btn.dataset.color;
    customColorActive = false;
    isEraser = false;
    updateToolButtons();
  });
});

document.getElementById('colorPickerInput').addEventListener('input', function() {
  currentColor = this.value;
  document.getElementById('customColorSwatch').style.background = this.value;
  document.querySelectorAll('.color-swatch').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('customColorSwatch').classList.add('active');
  customColorActive = true;
  isEraser = false;
  updateToolButtons();
});

// Brush sizes
document.querySelectorAll('.brush-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.brush-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    brushSize = parseInt(btn.dataset.size);
  });
});

// Brush / Eraser
document.getElementById('brushBtn').addEventListener('click', function() {
  isEraser = false;
  updateToolButtons();
});
document.getElementById('eraserBtn').addEventListener('click', function() {
  isEraser = true;
  updateToolButtons();
});

function updateToolButtons() {
  document.getElementById('brushBtn').classList.toggle('active', !isEraser);
  document.getElementById('eraserBtn').classList.toggle('active', isEraser);
}

// Onion skin
document.getElementById('onionBtn').addEventListener('click', function() {
  onionOn = !onionOn;
  this.classList.toggle('active', onionOn);
  renderOnion();
});

// Paste prev
document.getElementById('pasteBtn').addEventListener('click', function() {
  if (isLocked || currentFrame === 0 || !frames[currentFrame-1]) return;
  pushUndo();
  drawCtx.putImageData(frames[currentFrame-1], 0, 0);
});

// Undo
document.getElementById('undoBtn').addEventListener('click', undo);
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

// Clear
document.getElementById('clearBtn').addEventListener('click', function() {
  if (isLocked) return;
  pushUndo();
  clearCanvasWhite(drawCtx, drawCanvas.width, drawCanvas.height);
});

// ── UI UPDATE ──
function updateUI() {
  var total = selectedFrames;
  var current = currentFrame + 1;
  document.getElementById('frameIndicator').textContent = 'Frame ' + current + ' / ' + total;
  document.getElementById('frameIndicator').style.display = '';
  document.getElementById('timerDisplay').style.display = '';
  document.getElementById('progressFill').style.width = ((currentFrame / total) * 100) + '%';

  // Enable/disable onion and paste for frame 2+
  var prevAvail = currentFrame > 0;
  document.getElementById('onionBtn').disabled = !prevAvail;
  document.getElementById('pasteBtn').disabled = !prevAvail;
}

// ── PLAYBACK ──
function goToPlayback() {
  clearInterval(timerInterval);
  showScreen('playbackScreen');
  document.getElementById('timerDisplay').style.display = 'none';
  document.getElementById('frameIndicator').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';

  // Size playback canvas to match draw canvas
  playbackCanvas.width = drawCanvas.width;
  playbackCanvas.height = drawCanvas.height;

  startPlayback();
}

function startPlayback() {
  clearInterval(playbackInterval);
  playbackFrameIdx = 0;
  showPlaybackFrame();
  playbackInterval = setInterval(function() {
    playbackFrameIdx = (playbackFrameIdx + 1) % frames.length;
    showPlaybackFrame();
  }, 1000 / playbackFps);
}

function showPlaybackFrame() {
  if (frames[playbackFrameIdx]) {
    playbackCtx.putImageData(frames[playbackFrameIdx], 0, 0);
  }
}

// Speed buttons
document.querySelectorAll('[data-fps]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-fps]').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    playbackFps = parseInt(btn.dataset.fps);
    startPlayback();
  });
});

// Download GIF
document.getElementById('downloadGifBtn').addEventListener('click', function() {
  var status = document.getElementById('gifStatus');
  status.textContent = 'Generating GIF...';
  this.disabled = true;
  var self = this;

  var gif = new GIF({
    workers: 2,
    quality: 10,
    width: playbackCanvas.width,
    height: playbackCanvas.height,
    workerScript: 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js'
  });

  var delay = Math.round(1000 / playbackFps);
  var tempCanvas = document.createElement('canvas');
  tempCanvas.width = playbackCanvas.width;
  tempCanvas.height = playbackCanvas.height;
  var tempCtx = tempCanvas.getContext('2d');

  frames.forEach(function(frame) {
    tempCtx.putImageData(frame, 0, 0);
    gif.addFrame(tempCanvas, { copy: true, delay: delay });
  });

  gif.on('finished', function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'the-frame-animation.gif';
    a.click();
    status.textContent = 'Downloaded!';
    self.disabled = false;
    setTimeout(function(){ status.textContent = ''; }, 3000);
  });

  gif.render();
});

// Share
document.getElementById('shareBtn').addEventListener('click', function() {
  var text = 'Got a minute? Make your own animation at www.michaelloya.studio today!';
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.getElementById('shareBtn');
    var orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(function(){ btn.textContent = orig; }, 2000);
  });
});

// Play Again
document.getElementById('playAgainBtn').addEventListener('click', function() {
  clearInterval(playbackInterval);
  showScreen('setupScreen');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('timerDisplay').style.display = 'none';
  document.getElementById('frameIndicator').style.display = 'none';
});

// ── RESIZE ──
window.addEventListener('resize', function() {
  if (document.getElementById('gameScreen').classList.contains('active')) {
    var savedFrame = frames[currentFrame] || null;
    sizeCanvases();
    if (savedFrame) {
      // scale imagedata to new canvas size (simple redraw)
      var tmp = document.createElement('canvas');
      tmp.width = savedFrame.width; tmp.height = savedFrame.height;
      tmp.getContext('2d').putImageData(savedFrame, 0, 0);
      drawCtx.drawImage(tmp, 0, 0, drawCanvas.width, drawCanvas.height);
    }
    renderOnion();
  }
});
</script>
</body>
