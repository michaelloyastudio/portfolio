<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Club — Michael Loya Studio</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/vvj5gyy.css">
<style>
* { -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --text: #E8E0D4;
  --text-muted: #8a8580;
  --accent: #ff8e3d;
  --panel: #131313;
  --neon-pink: #ff2d95;
  --neon-cyan: #00f7ff;
  --neon-purple: #b44aff;
  --neon-orange: #ff6b2d;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  cursor: url('cursor.svg') 16 8, default;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body:focus, body *:focus { outline: none !important; }

a, button, .clickable, .upgrade-btn { cursor: url('crosshair.svg') 8 10, pointer !important; }
h1, h2, h3 { font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em; font-weight: 400; }

/* ── HEADER ── */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 3rem 2.5rem;
  z-index: 100;
}

.header-logo-link {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: block;
  height: 32px;
}

.header-logo { height: 32px; transition: opacity 0.2s ease; }
.header-logo-link .logo-hover { position: absolute; top: 0; left: 0; opacity: 0; }
.header-logo-link:hover .logo-default { opacity: 0; }
.header-logo-link:hover .logo-hover { opacity: 1; }

/* ── MAIN ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 20px;
  padding-top: 100px;
  gap: 15px;
  opacity: 0;
}

.main.loaded { animation: mainFadeIn 0.8s ease forwards; }

@keyframes mainFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.title-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  opacity: 0;
  transform: translateY(-15px);
}

.title-row.loaded {
  animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes slideDown {
  to { opacity: 1; transform: translateY(0); }
}

.title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.8rem;
  letter-spacing: 0.05em;
}

.subtitle {
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── GAME CONTAINER ── */
.game-container {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  width: 100%;
  flex-wrap: wrap;
  justify-content: center;
}

/* ── CANVAS WRAPPER ── */
.canvas-wrapper {
  position: relative;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

#gameCanvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 20px;
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 10px;
  padding: 12px 24px;
  flex-wrap: wrap;
  justify-content: center;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.stat-label {
  font-size: 0.55rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent);
}

.stat-value.money {
  font-family: 'Space Grotesk', monospace;
  color: #44ff88;
  text-shadow: 0 0 10px rgba(68, 255, 136, 0.5);
}

.stat-value.rating {
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
}

/* ── UPGRADES PANEL ── */
.upgrades-panel {
  background: var(--panel);
  border: 1px solid #222;
  border-radius: 12px;
  padding: 15px;
  width: 320px;
  max-height: 500px;
  overflow-y: auto;
}

.upgrades-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 1.2rem;
  margin-bottom: 12px;
  text-align: center;
  color: var(--text);
}

.upgrade-item {
  background: rgba(255,255,255,0.02);
  border: 1px solid #222;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  transition: all 0.2s;
}

.upgrade-item:hover {
  border-color: #333;
  background: rgba(255,255,255,0.04);
}

.upgrade-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.upgrade-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
}

.upgrade-tier {
  font-size: 0.6rem;
  color: var(--neon-cyan);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.upgrade-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.upgrade-income {
  font-size: 0.65rem;
  color: #44ff88;
}

.upgrade-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: rgba(255,142,61,0.1);
  color: var(--accent);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  transition: all 0.15s;
}

.upgrade-btn:hover:not(:disabled) {
  background: rgba(255,142,61,0.25);
  transform: scale(1.02);
}

.upgrade-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed !important;
}

.upgrade-btn.maxed {
  border-color: #44ff88;
  color: #44ff88;
  background: rgba(68,255,136,0.1);
}

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 1rem;
  font-size: 0.65rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.footer.loaded { opacity: 1; }

/* ── BOOT SCREEN ── */
.boot-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity 0.6s ease;
}

.boot-screen.fade-out {
  opacity: 0;
  pointer-events: none;
}

.boot-icon {
  font-size: 3rem;
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.1); }
}

.boot-text {
  font-size: 0.7rem;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.boot-title {
  font-family: 'din-2014-rounded-variable', sans-serif; word-spacing: -0.05em;
  font-size: 2.2rem;
  opacity: 0;
  transform: translateY(10px);
  animation: bootTitleIn 0.6s ease forwards 0.8s;
}

@keyframes bootTitleIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── RESET BTN ── */
.reset-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid #333;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
  z-index: 50;
}

.reset-btn:hover {
  border-color: #ff4444;
  color: #ff4444;
}

/* ── AUDIO BTN ── */
.audio-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid #333;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.6rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.15s;
  z-index: 50;
}

.audio-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.audio-btn.active {
  border-color: #44ff88;
  color: #44ff88;
}

/* ── RESPONSIVE ── */
@media (max-width: 800px) {
  .game-container {
    flex-direction: column;
    align-items: center;
  }

  .upgrades-panel {
    width: 100%;
    max-width: 400px;
    max-height: none;
  }

  .canvas-wrapper {
    padding: 10px;
  }

  .header {
    padding: 2rem 1.5rem;
  }

  .main {
    padding-top: 80px;
  }

  .title {
    font-size: 2rem;
  }
}

/* Scrollbar */
.upgrades-panel::-webkit-scrollbar {
  width: 6px;
}

.upgrades-panel::-webkit-scrollbar-track {
  background: transparent;
}

.upgrades-panel::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 3px;
}

.upgrades-panel::-webkit-scrollbar-thumb:hover {
  background: #444;
}
</style>
</head>
<body>

<!-- Boot Screen -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-icon">🎵</div>
  <div class="boot-title">The Club</div>
  <div class="boot-text">Opening doors...</div>
</div>

<!-- Header -->
<header class="header">
  <a href="../index.html" class="header-logo-link">
    <img src="logo-gray.svg" alt="ML" class="header-logo logo-default">
    <img src="logo-orange.svg" alt="ML" class="header-logo logo-hover">
  </a>
</header>

<!-- Main -->
<main class="main" id="main">
  <div class="title-row" id="titleRow">
    <h1 class="title">The Club</h1>
    <p class="subtitle">Nightclub Tycoon</p>
  </div>

  <div class="stats-bar" id="statsBar">
    <div class="stat">
      <span class="stat-label">Cash</span>
      <span class="stat-value money" id="moneyDisplay">$0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Income</span>

    </div>
    <div class="stat">
      <span class="stat-label">Rating</span>

    <div class="stat">
      <span class="stat-label">Patrons</span>

      <span class="stat-label">Lifetime</span>

  <div class="game-container">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="480" height="400"></canvas>

  The Club — A nightclub tycoon experience

<!-- Audio Toggle -->

<!-- Reset Button -->
<button class="reset-btn" id="resetBtn">Reset</button>

<script>
// ═══════════════════════════════════════════════════════════════════
// THE CLUB - Nightclub Tycoon Idle Game
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── GAME STATE ──
let gameState = {
  money: 50,
  lifetime: 0,
  upgrades: {
    floor: 0,
    walls: 0,
    djBooth: 0,
    bar: 0,
    lighting: 0,
    speakers: 0,
    tables: 0,
    danceFloor: 0
  },
  patrons: []
};

// ── UPGRADE DEFINITIONS ──
const upgradeDefs = {
  floor: {
    name: 'Floor',
    tiers: ['Concrete', 'Wood Planks', 'Checkered', 'LED Floor', 'Holographic'],
    costs: [0, 100, 500, 2500, 15000],
    income: [1, 3, 8, 20, 50]
  },
  walls: {
    name: 'Walls',
    tiers: ['Bare Brick', 'Painted', 'Neon Panels', 'Mirror Walls', 'Holographic'],
    costs: [0, 150, 750, 3500, 18000],
    income: [1, 4, 10, 25, 60]
  },
  djBooth: {
    name: 'DJ Booth',
    tiers: ['Laptop Box', 'Turntable', 'CDJ Setup', 'LED Booth', 'Festival Mega'],
    costs: [0, 200, 1000, 5000, 25000],
    income: [2, 6, 15, 40, 100]
  },
  bar: {
    name: 'Bar',
    tiers: ['Folding Table', 'Wooden Bar', 'Granite Bar', 'Neon Bar', 'Premium VIP'],
    costs: [0, 180, 900, 4500, 22000],
    income: [2, 5, 12, 35, 85]
  },
  lighting: {
    name: 'Lighting',
    tiers: ['Bare Bulb', 'Spotlights', 'Disco Ball', 'Lasers', 'Festival Rig'],
    costs: [0, 120, 600, 3000, 16000],
    income: [1, 4, 10, 28, 70]
  },
  speakers: {
    name: 'Speakers',
    tiers: ['Desktop', 'Monitors', 'PA Stacks', 'Sound Wall', 'Line Array'],
    costs: [0, 160, 800, 4000, 20000],
    income: [1, 5, 12, 32, 80]
  },
  tables: {
    name: 'VIP Area',
    tiers: ['Plastic Chairs', 'Basic Tables', 'Booth Seating', 'VIP Rope', 'Luxury VIP'],
    costs: [0, 140, 700, 3500, 17000],
    income: [1, 4, 11, 30, 75]
  },
  danceFloor: {
    name: 'Dance Floor',
    tiers: ['Empty', 'Taped Area', 'Proper Floor', 'Platform', 'Sunken Pit'],
    costs: [0, 130, 650, 3200, 16500],
    income: [1, 4, 10, 26, 65]
  }
};

// ── COLORS ──
const COLORS = {
  neonPink: '#ff2d95',
  neonCyan: '#00f7ff',
  neonPurple: '#b44aff',
  neonOrange: '#ff6b2d',
  neonGreen: '#44ff88',
  neonYellow: '#ffee00'
};

// ── ISOMETRIC HELPERS ──
const TILE_WIDTH = 48;
const TILE_HEIGHT = 24;
const GRID_SIZE = 8;
const OFFSET_X = 240;
const OFFSET_Y = 110;

function isoToScreen(x, y) {
  return {
    x: OFFSET_X + (x - y) * (TILE_WIDTH / 2),
    y: OFFSET_Y + (x + y) * (TILE_HEIGHT / 2)
  };
}

// ── PATRON CLASS ──
class Patron {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = 7;
    this.y = 7;
    this.targetX = Math.random() * 6 + 1;
    this.targetY = Math.random() * 6 + 1;
    this.color = ['#ff6b9d', '#6bff9d', '#9d6bff', '#ffb86b', '#6bd4ff', '#ff6b6b'][Math.floor(Math.random() * 6)];
    this.bobPhase = Math.random() * Math.PI * 2;
    this.isDancing = Math.random() > 0.4;
    this.moveSpeed = 0.02 + Math.random() * 0.02;
  }

  update(dt) {
    this.bobPhase += dt * 8;

    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 0.1) {
      this.x += (dx / dist) * this.moveSpeed;
      this.y += (dy / dist) * this.moveSpeed;
    } else if (Math.random() < 0.005) {
      this.targetX = Math.random() * 6 + 1;
      this.targetY = Math.random() * 6 + 1;
      this.isDancing = Math.random() > 0.3;
    }
  }

  draw() {
    const pos = isoToScreen(this.x, this.y);
    const bobOffset = this.isDancing ? Math.sin(this.bobPhase) * 2 : 0;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y + 2, 4, 2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body (pixel art style)
    ctx.fillStyle = this.color;
    ctx.fillRect(pos.x - 2, pos.y - 8 + bobOffset, 4, 5);

    // Head
    ctx.fillRect(pos.x - 2, pos.y - 12 + bobOffset, 4, 4);
  }
}

// ── AUDIO SYSTEM ──
let audioCtx = null;
let audioEnabled = false;
let bassOsc = null;
let bassGain = null;
let crowdNoise = null;
let crowdGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Bass thump
  bassGain = audioCtx.createGain();
  bassGain.gain.value = 0;
  bassGain.connect(audioCtx.destination);

  // Crowd noise (white noise filtered)
  crowdGain = audioCtx.createGain();
  crowdGain.gain.value = 0;

  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const output = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    output[i] = Math.random() * 2 - 1;
  }

  crowdNoise = audioCtx.createBufferSource();
  crowdNoise.buffer = noiseBuffer;
  crowdNoise.loop = true;

  const crowdFilter = audioCtx.createBiquadFilter();
  crowdFilter.type = 'lowpass';
  crowdFilter.frequency.value = 400;

  crowdNoise.connect(crowdFilter);
  crowdFilter.connect(crowdGain);
  crowdGain.connect(audioCtx.destination);
  crowdNoise.start();
}

function playBassThump() {
  if (!audioEnabled || !audioCtx) return;

  const djLevel = gameState.upgrades.djBooth;
  const t = audioCtx.currentTime;

  // Kick drum — deep sub bass
  const kick = audioCtx.createOscillator();
  const kickGain = audioCtx.createGain();
  kick.type = 'sine';
  kick.frequency.setValueAtTime(150, t);
  kick.frequency.exponentialRampToValueAtTime(40 + djLevel * 3, t + 0.08);
  kickGain.gain.setValueAtTime(0.2 + djLevel * 0.04, t);
  kickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  kick.connect(kickGain);
  kickGain.connect(audioCtx.destination);
  kick.start(t);
  kick.stop(t + 0.25);

  // Hi-hat on off-beats (level 2+)
  if (djLevel >= 2) {
    setTimeout(() => {
      if (!audioEnabled || !audioCtx) return;
      const t2 = audioCtx.currentTime;
      const noise = audioCtx.createBufferSource();
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.04, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      noise.buffer = buf;
      const hihatGain = audioCtx.createGain();
      const hihatFilter = audioCtx.createBiquadFilter();
      hihatFilter.type = 'highpass';
      hihatFilter.frequency.value = 7000;
      hihatGain.gain.setValueAtTime(0.06 + djLevel * 0.01, t2);
      hihatGain.gain.exponentialRampToValueAtTime(0.001, t2 + 0.04);
      noise.connect(hihatFilter);
      hihatFilter.connect(hihatGain);
      hihatGain.connect(audioCtx.destination);
      noise.start(t2);
    }, 250); // off-beat
  }

  // Sub bass layer (level 3+)
  if (djLevel >= 3) {
    const sub = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    sub.type = 'sine';
    sub.frequency.value = 55;
    subGain.gain.setValueAtTime(0.08, t);
    subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    sub.connect(subGain);
    subGain.connect(audioCtx.destination);
    sub.start(t);
    sub.stop(t + 0.4);
  }
}

function playUpgradeSound() {
  if (!audioEnabled || !audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'square';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);

  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

let chatterNodes = [];

function startChatter() {
  if (!audioCtx || chatterNodes.length > 0) return;

  // Create 3 chatter layers at different pitches to simulate voices
  const pitches = [300, 450, 600];
  pitches.forEach((freq, i) => {
    const noise = audioCtx.createBufferSource();
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    // Modulated noise — sounds like murmuring
    for (let j = 0; j < d.length; j++) {
      const mod = Math.sin(j / (audioCtx.sampleRate * (0.15 + i * 0.1))) * 0.5 + 0.5;
      const mod2 = Math.sin(j / (audioCtx.sampleRate * (0.4 + i * 0.2))) * 0.3 + 0.7;
      d[j] = (Math.random() * 2 - 1) * mod * mod2;
    }
    noise.buffer = buf;
    noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = freq;
    filter.Q.value = 2;

    const gain = audioCtx.createGain();
    gain.gain.value = 0;

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();

    chatterNodes.push({ noise, gain, filter });
  });
}

function updateAudio() {
  if (!audioEnabled || !audioCtx || !crowdGain) return;

  const patronCount = gameState.patrons.length;
  // Ambient rumble scales with patrons
  crowdGain.gain.setTargetAtTime(Math.min(patronCount * 0.002, 0.06), audioCtx.currentTime, 0.5);

  // Chatter scales with patrons
  if (chatterNodes.length === 0 && patronCount > 3) startChatter();
  chatterNodes.forEach((node, i) => {
    const vol = Math.min(patronCount * 0.0015, 0.04) * (1 - i * 0.2);
    node.gain.gain.setTargetAtTime(Math.max(0, vol), audioCtx.currentTime, 0.5);
  });
}

// ── DRAWING FUNCTIONS ──
let time = 0;
let lastBeat = 0;

function drawFloor() {
  const level = gameState.upgrades.floor;

  for (let x = 0; x < GRID_SIZE; x++) {
    for (let y = 0; y < GRID_SIZE; y++) {
      const pos = isoToScreen(x, y);

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.lineTo(pos.x + TILE_WIDTH/2, pos.y + TILE_HEIGHT/2);
      ctx.lineTo(pos.x, pos.y + TILE_HEIGHT);
      ctx.lineTo(pos.x - TILE_WIDTH/2, pos.y + TILE_HEIGHT/2);
      ctx.closePath();

      let color;
      switch(level) {
        case 0: // Concrete
          color = `rgb(${50 + ((x+y)%2)*10}, ${50 + ((x+y)%2)*10}, ${55 + ((x+y)%2)*10})`;
          break;
        case 1: // Wood
          color = `rgb(${100 + ((x*3+y)%3)*15}, ${70 + ((x*3+y)%3)*10}, ${45})`;
          break;
        case 2: // Checkered
          color = (x + y) % 2 === 0 ? '#2a2a2a' : '#1a1a1a';
          break;
        case 3: // LED
          const hue = (time * 50 + x * 30 + y * 30) % 360;
          const brightness = 30 + Math.sin(time * 3 + x + y) * 15;
          color = `hsl(${hue}, 80%, ${brightness}%)`;
          break;
        case 4: // Holographic
          const h2 = (time * 100 + x * 45 + y * 45) % 360;
          color = `hsl(${h2}, 100%, ${40 + Math.sin(time * 5 + x * 0.5 + y * 0.5) * 15}%)`;
          break;
      }

      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function drawWalls() {
  const level = gameState.upgrades.walls;

  // Back-left wall (left face — faces right)
  for (let i = 0; i < GRID_SIZE; i++) {
    const base = isoToScreen(i, 0);
    const wallHeight = 60;

    ctx.beginPath();
    ctx.moveTo(base.x - TILE_WIDTH/2, base.y + TILE_HEIGHT/2);
    ctx.lineTo(base.x - TILE_WIDTH/2, base.y + TILE_HEIGHT/2 - wallHeight);
    ctx.lineTo(base.x, base.y - wallHeight);
    ctx.lineTo(base.x, base.y);
    ctx.closePath();

    let color;
    switch(level) {
      case 0: color = `rgb(${70 + i*3}, ${45 + i*2}, ${40})`; break;
      case 1: color = '#252030'; break;
      case 2:
        const glow = Math.sin(time * 2 + i + 1) * 0.5 + 0.5;
        ctx.fillStyle = '#1a1a2a';
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 45, 149, ${0.5 + glow * 0.5})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        continue;
      case 3:
        const shimmer = Math.sin(time * 3 + i * 0.5 + 1) * 0.2 + 0.5;
        color = `rgba(180, 180, 200, ${shimmer})`;
        break;
      case 4:
        const hue = (time * 60 + i * 40 + 180) % 360;
        color = `hsl(${hue}, 70%, 30%)`;
        break;
      default: color = '#2a2a2a';
    }

    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Back-right wall (right face — faces left)
  for (let i = 0; i < GRID_SIZE; i++) {
    const base = isoToScreen(0, i);
    const wallHeight = 60;

    ctx.beginPath();
    ctx.moveTo(base.x + TILE_WIDTH/2, base.y + TILE_HEIGHT/2);
    ctx.lineTo(base.x + TILE_WIDTH/2, base.y + TILE_HEIGHT/2 - wallHeight);
    ctx.lineTo(base.x, base.y - wallHeight);
    ctx.lineTo(base.x, base.y);
    ctx.closePath();

    let color;
    switch(level) {
      case 0: color = `rgb(${80 + i*3}, ${50 + i*2}, ${45})`; break;
      case 1: color = '#2a2535'; break;
      case 2:
        const glow2 = Math.sin(time * 2 + i) * 0.5 + 0.5;
        ctx.fillStyle = '#1a1a2a';
        ctx.fill();
        ctx.strokeStyle = `rgba(0, 247, 255, ${0.5 + glow2 * 0.5})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        continue;
      case 3:
        const shimmer2 = Math.sin(time * 3 + i * 0.5) * 0.2 + 0.6;
        color = `rgba(200, 200, 220, ${shimmer2})`;
        break;
      case 4:
        const hue2 = (time * 60 + i * 40) % 360;
        color = `hsl(${hue2}, 70%, 35%)`;
        break;
      default: color = '#333';
    }

    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawDJBooth() {
  const level = gameState.upgrades.djBooth;
  const pos = isoToScreen(1, 1);

  // Booth base
  const boothWidth = 50 + level * 10;
  const boothHeight = 25 + level * 5;

  // Back
  ctx.fillStyle = level >= 3 ? '#1a1a2a' : '#2a2a2a';
  ctx.fillRect(pos.x - boothWidth/2, pos.y - boothHeight - 20, boothWidth, boothHeight);

  // Front panel
  if (level >= 3) {
    // LED front
    for (let i = 0; i < 5; i++) {
      const hue = (time * 100 + i * 60) % 360;
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.fillRect(pos.x - boothWidth/2 + 5 + i * 9, pos.y - 18, 7, 4);
    }
  }

  // Equipment on top
  ctx.fillStyle = '#111';
  if (level === 0) {
    // Laptop
    ctx.fillRect(pos.x - 10, pos.y - boothHeight - 25, 20, 12);
    ctx.fillStyle = '#3a5a8a';
    ctx.fillRect(pos.x - 8, pos.y - boothHeight - 23, 16, 8);
  } else if (level === 1) {
    // Turntables
    ctx.fillRect(pos.x - 20, pos.y - boothHeight - 28, 15, 15);
    ctx.fillRect(pos.x + 5, pos.y - boothHeight - 28, 15, 15);
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(pos.x - 12, pos.y - boothHeight - 20, 5, 0, Math.PI * 2);
    ctx.arc(pos.x + 12, pos.y - boothHeight - 20, 5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // CDJ/Advanced setup
    ctx.fillRect(pos.x - 25, pos.y - boothHeight - 30, 20, 18);
    ctx.fillRect(pos.x + 5, pos.y - boothHeight - 30, 20, 18);
    ctx.fillRect(pos.x - 8, pos.y - boothHeight - 25, 16, 12);

    // Screens
    const screenGlow = Math.sin(time * 3) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(0, 247, 255, ${screenGlow})`;
    ctx.fillRect(pos.x - 23, pos.y - boothHeight - 28, 8, 6);
    ctx.fillRect(pos.x + 7, pos.y - boothHeight - 28, 8, 6);
  }

  if (level >= 4) {
    // Festival screens behind
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(pos.x - 40, pos.y - 90, 80, 40);

    // Animated visuals
    for (let i = 0; i < 8; i++) {
      const hue = (time * 150 + i * 45) % 360;
      const yOff = Math.sin(time * 4 + i) * 10;
      ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.fillRect(pos.x - 35 + i * 9, pos.y - 85 + yOff, 7, 30 - Math.abs(yOff));
    }
  }
}

function drawBar() {
  const level = gameState.upgrades.bar;
  const pos = isoToScreen(6, 1);

  if (level === 0) {
    // Folding table
    ctx.fillStyle = '#5a5a5a';
    ctx.fillRect(pos.x - 20, pos.y - 20, 40, 5);
    ctx.fillRect(pos.x - 18, pos.y - 15, 3, 15);
    ctx.fillRect(pos.x + 15, pos.y - 15, 3, 15);

    // Bottles
    ctx.fillStyle = '#2a5a2a';
    ctx.fillRect(pos.x - 10, pos.y - 30, 5, 10);
    ctx.fillStyle = '#5a2a2a';
    ctx.fillRect(pos.x, pos.y - 28, 5, 8);
  } else {
    // Bar counter
    const barColor = level === 1 ? '#6a4a2a' : level === 2 ? '#4a4a4a' : '#2a2a3a';

    // Bar front
    ctx.fillStyle = barColor;
    ctx.beginPath();
    ctx.moveTo(pos.x - 30, pos.y - 5);
    ctx.lineTo(pos.x - 30, pos.y - 30);
    ctx.lineTo(pos.x + 20, pos.y - 30);
    ctx.lineTo(pos.x + 30, pos.y - 25);
    ctx.lineTo(pos.x + 30, pos.y);
    ctx.lineTo(pos.x - 20, pos.y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.stroke();

    // Bar top
    ctx.fillStyle = level >= 2 ? '#3a3a3a' : '#5a3a1a';
    ctx.fillRect(pos.x - 30, pos.y - 32, 60, 4);

    if (level >= 3) {
      // Neon strip
      const neonGlow = Math.sin(time * 2) * 0.3 + 0.7;
      ctx.strokeStyle = `rgba(255, 45, 149, ${neonGlow})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pos.x - 28, pos.y - 5);
      ctx.lineTo(pos.x + 28, pos.y - 5);
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    if (level >= 4) {
      // LED underglow
      ctx.shadowColor = COLORS.neonCyan;
      ctx.shadowBlur = 15;
      ctx.fillStyle = COLORS.neonCyan;
      ctx.fillRect(pos.x - 28, pos.y - 2, 56, 2);
      ctx.shadowBlur = 0;

      // Bottle display
      for (let i = 0; i < 4; i++) {
        const hue = (i * 90) % 360;
        ctx.fillStyle = `hsl(${hue}, 60%, 40%)`;
        ctx.fillRect(pos.x - 25 + i * 12, pos.y - 50, 6, 18);
      }
    }

    // Stools (level 2+)
    if (level >= 2) {
      for (let i = 0; i < 3; i++) {
        const stoolPos = isoToScreen(6.5 + i * 0.4, 2 + i * 0.4);
        ctx.fillStyle = '#333';
        ctx.fillRect(stoolPos.x - 5, stoolPos.y - 12, 10, 3);
        ctx.fillRect(stoolPos.x - 1, stoolPos.y - 9, 2, 9);
      }
    }
  }
}

function drawLighting() {
  const level = gameState.upgrades.lighting;

  if (level === 0) {
    // Bare bulb
    const pos = isoToScreen(4, 4);
    ctx.fillStyle = '#ffee88';
    ctx.shadowColor = '#ffee88';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y - 80, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Light pool
    ctx.fillStyle = 'rgba(255, 238, 136, 0.1)';
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y, 40, 20, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (level === 1) {
    // Colored spotlights
    const colors = [COLORS.neonPink, COLORS.neonCyan, COLORS.neonPurple];
    const spots = [[3, 3], [5, 3], [4, 5]];

    spots.forEach((spot, i) => {
      const pos = isoToScreen(spot[0], spot[1]);
      ctx.fillStyle = colors[i] + '30';
      ctx.beginPath();
      ctx.ellipse(pos.x, pos.y, 30, 15, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  } else if (level === 2) {
    // Disco ball
    const centerPos = isoToScreen(4, 4);

    // Ball
    ctx.fillStyle = '#888';
    ctx.beginPath();
    ctx.arc(centerPos.x, centerPos.y - 70, 12, 0, Math.PI * 2);
    ctx.fill();

    // Sparkles
    for (let i = 0; i < 12; i++) {
      const angle = (time * 2 + i * 0.5) % (Math.PI * 2);
      const dist = 60 + Math.sin(time * 3 + i) * 20;
      const x = centerPos.x + Math.cos(angle) * dist * 0.8;
      const y = centerPos.y + Math.sin(angle) * dist * 0.4;

      ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(time * 5 + i) * 0.3})`;
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (level >= 3) {
    // Lasers
    const centerPos = isoToScreen(4, 4);
    const laserColors = [COLORS.neonPink, COLORS.neonCyan, COLORS.neonGreen, COLORS.neonPurple];
    const numLasers = level === 4 ? 8 : 4;

    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 2;

    for (let i = 0; i < numLasers; i++) {
      const angle = (time * (1 + i * 0.2) + i * (Math.PI * 2 / numLasers)) % (Math.PI * 2);
      const endX = centerPos.x + Math.cos(angle) * 150;
      const endY = centerPos.y + Math.sin(angle) * 75 + 30;

      ctx.strokeStyle = laserColors[i % laserColors.length];
      ctx.shadowColor = laserColors[i % laserColors.length];
      ctx.shadowBlur = 10;

      ctx.beginPath();
      ctx.moveTo(centerPos.x, centerPos.y - 70);
      ctx.lineTo(endX, endY);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;

    if (level === 4) {
      // Subtle ambient glow pulse (no strobe)
      const pulse = Math.sin(time * 2) * 0.03 + 0.03;
      ctx.fillStyle = `rgba(180, 120, 255, ${pulse})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
}

function drawSpeakers() {
  const level = gameState.upgrades.speakers;
  const leftPos = isoToScreen(0.5, 2);
  const rightPos = isoToScreen(2, 0.5);

  const positions = [leftPos, rightPos];

  positions.forEach((pos, idx) => {
    if (level === 0) {
      // Desktop speakers
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(pos.x - 5, pos.y - 25, 10, 15);
    } else if (level === 1) {
      // Floor monitors
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(pos.x - 10, pos.y - 30, 20, 25);
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y - 18, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (level === 2) {
      // PA stacks
      for (let i = 0; i < 2; i++) {
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(pos.x - 12, pos.y - 45 - i * 22, 24, 20);
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y - 35 - i * 22, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (level === 3) {
      // Wall of sound
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(pos.x - 15, pos.y - 55 - i * 20, 30, 18);
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(pos.x - 5, pos.y - 46 - i * 20, 5, 0, Math.PI * 2);
        ctx.arc(pos.x + 5, pos.y - 46 - i * 20, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // Line array
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(pos.x - 18, pos.y - 70 - i * 14, 36, 12);

        // LED indicators
        const glow = Math.sin(time * 4 + i) * 0.5 + 0.5;
        ctx.fillStyle = `rgba(68, 255, 136, ${glow})`;
        ctx.fillRect(pos.x - 16, pos.y - 68 - i * 14, 3, 3);
        ctx.fillRect(pos.x + 13, pos.y - 68 - i * 14, 3, 3);
      }
    }
  });
}

function drawTables() {
  const level = gameState.upgrades.tables;
  const pos = isoToScreen(6, 5);

  if (level === 0) {
    // Plastic chairs
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = '#4a4a4a';
      ctx.fillRect(pos.x - 15 + i * 12, pos.y - 12, 8, 3);
      ctx.fillRect(pos.x - 13 + i * 12, pos.y - 9, 4, 9);
    }
  } else if (level === 1) {
    // Basic tables
    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(pos.x - 20, pos.y - 15, 35, 4);
    ctx.fillRect(pos.x - 18, pos.y - 11, 2, 11);
    ctx.fillRect(pos.x + 13, pos.y - 11, 2, 11);

    for (let i = 0; i < 2; i++) {
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(pos.x - 25 + i * 40, pos.y - 10, 8, 3);
    }
  } else if (level === 2) {
    // Booth seating
    ctx.fillStyle = '#3a2a4a';
    ctx.beginPath();
    ctx.moveTo(pos.x - 25, pos.y + 5);
    ctx.lineTo(pos.x - 25, pos.y - 25);
    ctx.lineTo(pos.x + 5, pos.y - 25);
    ctx.lineTo(pos.x + 5, pos.y - 15);
    ctx.lineTo(pos.x - 15, pos.y - 15);
    ctx.lineTo(pos.x - 15, pos.y + 5);
    ctx.closePath();
    ctx.fill();

    // Table
    ctx.fillStyle = '#2a2a2a';
    ctx.fillRect(pos.x - 12, pos.y - 12, 15, 4);
  } else if (level === 3) {
    // VIP with rope
    ctx.fillStyle = '#4a2a5a';
    ctx.fillRect(pos.x - 30, pos.y - 20, 50, 20);

    // Rope posts
    ctx.fillStyle = '#aa8844';
    ctx.fillRect(pos.x - 35, pos.y - 25, 4, 25);
    ctx.fillRect(pos.x + 20, pos.y - 25, 4, 25);

    // Rope
    ctx.strokeStyle = '#cc4444';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pos.x - 33, pos.y - 20);
    ctx.quadraticCurveTo(pos.x - 5, pos.y - 10, pos.x + 22, pos.y - 20);
    ctx.stroke();
    ctx.lineWidth = 1;
  } else {
    // Luxury VIP
    ctx.fillStyle = '#2a1a3a';
    ctx.fillRect(pos.x - 35, pos.y - 25, 60, 30);

    // Glow
    ctx.shadowColor = COLORS.neonPurple;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = COLORS.neonPurple;
    ctx.lineWidth = 2;
    ctx.strokeRect(pos.x - 35, pos.y - 25, 60, 30);
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1;

    // Table with bottles
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(pos.x - 15, pos.y - 18, 25, 8);

    // Champagne glow
    ctx.fillStyle = '#ffdd00';
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 10;
    ctx.fillRect(pos.x - 5, pos.y - 28, 4, 10);
    ctx.shadowBlur = 0;
  }
}

function drawDanceFloor() {
  const level = gameState.upgrades.danceFloor;
  if (level === 0) return;

  const centerX = 4;
  const centerY = 4;

  if (level === 1) {
    // Taped area
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 2;
    for (let x = 2; x <= 6; x++) {
      for (let y = 2; y <= 6; y++) {
        if (x === 2 || x === 6 || y === 2 || y === 6) {
          const pos = isoToScreen(x, y);
          ctx.beginPath();
          ctx.moveTo(pos.x - 5, pos.y);
          ctx.lineTo(pos.x + 5, pos.y);
          ctx.stroke();
        }
      }
    }
    ctx.lineWidth = 1;
  } else if (level >= 2) {
    // Elevated or sunken
    const offset = level === 4 ? 5 : (level === 3 ? -3 : 0);

    for (let x = 2; x <= 5; x++) {
      for (let y = 2; y <= 5; y++) {
        const pos = isoToScreen(x, y);

        // Draw platform edge
        if (level >= 3) {
          ctx.fillStyle = level === 4 ? '#1a1a2a' : '#2a2a2a';
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y + offset);
          ctx.lineTo(pos.x + TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset);
          ctx.lineTo(pos.x + TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset + 5);
          ctx.lineTo(pos.x, pos.y + offset + 5);
          ctx.lineTo(pos.x - TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset + 5);
          ctx.lineTo(pos.x - TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset);
          ctx.closePath();
          ctx.fill();
        }

        if (level === 4) {
          // LED edge glow
          const hue = (time * 80 + x * 30 + y * 30) % 360;
          ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
          ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
          ctx.shadowBlur = 8;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(pos.x - TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset);
          ctx.lineTo(pos.x, pos.y + TILE_HEIGHT + offset);
          ctx.lineTo(pos.x + TILE_WIDTH/2, pos.y + TILE_HEIGHT/2 + offset);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.lineWidth = 1;
        }
      }
    }
  }
}

function drawPatrons() {
  // Sort by Y position for proper layering
  gameState.patrons.sort((a, b) => (a.x + a.y) - (b.x + b.y));
  gameState.patrons.forEach(p => p.draw());
}

// ── MAIN RENDER ──
function render() {
  ctx.fillStyle = '#0a0808';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Ambient glow based on club level
  const totalLevel = Object.values(gameState.upgrades).reduce((a, b) => a + b, 0);
  if (totalLevel > 5) {
    const gradient = ctx.createRadialGradient(240, 200, 0, 240, 200, 250);
    gradient.addColorStop(0, `rgba(180, 74, 255, ${Math.min(totalLevel * 0.005, 0.15)})`);
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  drawFloor();
  drawDanceFloor();
  drawWalls();
  drawDJBooth();
  drawBar();
  drawSpeakers();
  drawTables();
  drawPatrons();
  drawLighting();
}

// ── GAME LOOP ──
let lastTime = 0;
let beatTimer = 0;

function gameLoop(timestamp) {
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;
  time += dt;

  // Beat timer for bass thump
  beatTimer += dt;
  const bpm = 120 + gameState.upgrades.djBooth * 5;
  const beatInterval = 60 / bpm;

  if (beatTimer >= beatInterval) {
    beatTimer = 0;
    playBassThump();
  }

  // Update money
  const income = calculateIncome();
  gameState.money += income * dt;
  gameState.lifetime += income * dt;

  // Update patrons
  const rating = calculateRating();
  const targetPatrons = Math.floor(rating * rating * 3 + 5);

  while (gameState.patrons.length < targetPatrons) {
    gameState.patrons.push(new Patron());
  }
  while (gameState.patrons.length > targetPatrons) {
    gameState.patrons.pop();
  }

  gameState.patrons.forEach(p => p.update(dt));

  // Update audio
  updateAudio();

  // Render
  render();
  updateUI();

  requestAnimationFrame(gameLoop);
}

// ── ECONOMY ──
function calculateIncome() {
  let total = 0;
  for (const [key, level] of Object.entries(gameState.upgrades)) {
    total += upgradeDefs[key].income[level];
  }
  return total;
}

function calculateRating() {
  const total = Object.values(gameState.upgrades).reduce((a, b) => a + b, 0);
  const max = Object.keys(gameState.upgrades).length * 4; // Max is tier 4 for each
  return Math.min(5, (total / max) * 5);
}

// ── UI ──
function formatMoney(n) {
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
  if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'K';
  return '$' + Math.floor(n);
}

function updateUI() {
  document.getElementById('moneyDisplay').textContent = formatMoney(gameState.money);
  document.getElementById('incomeDisplay').textContent = formatMoney(calculateIncome()) + '/s';
  document.getElementById('lifetimeDisplay').textContent = formatMoney(gameState.lifetime);
  document.getElementById('patronsDisplay').textContent = gameState.patrons.length;

  const rating = calculateRating();
  const stars = Math.floor(rating);
  const halfStar = rating % 1 >= 0.5;
  let ratingStr = '★'.repeat(stars) + (halfStar ? '☆' : '') + '☆'.repeat(5 - stars - (halfStar ? 1 : 0));
  document.getElementById('ratingDisplay').textContent = ratingStr;

  // Update upgrade buttons
  document.querySelectorAll('.upgrade-btn').forEach(btn => {
    const key = btn.dataset.upgrade;
    const level = gameState.upgrades[key];
    const def = upgradeDefs[key];

    if (level >= 4) {
      btn.textContent = 'MAXED';
      btn.disabled = true;
      btn.classList.add('maxed');
    } else {
      const cost = def.costs[level + 1];
      btn.textContent = formatMoney(cost);
      btn.disabled = gameState.money < cost;
      btn.classList.remove('maxed');
    }
  });

  // Update tier display
  document.querySelectorAll('.upgrade-tier').forEach(span => {
    const key = span.dataset.upgrade;
    const level = gameState.upgrades[key];
    span.textContent = upgradeDefs[key].tiers[level];
  });

  // Update income display
  document.querySelectorAll('.upgrade-income').forEach(span => {
    const key = span.dataset.upgrade;
    const level = gameState.upgrades[key];
    span.textContent = '+$' + upgradeDefs[key].income[level] + '/s';
  });
}

function buildUpgradesList() {
  const container = document.getElementById('upgradesList');
  container.innerHTML = '';

  for (const [key, def] of Object.entries(upgradeDefs)) {
    const level = gameState.upgrades[key];

    const item = document.createElement('div');
    item.className = 'upgrade-item';
    item.innerHTML = `
      <div class="upgrade-header">
        <span class="upgrade-name">${def.name}</span>
        <span class="upgrade-tier" data-upgrade="${key}">${def.tiers[level]}</span>
      </div>
      <div class="upgrade-info">
        <span class="upgrade-income" data-upgrade="${key}">+$${def.income[level]}/s</span>
        <button class="upgrade-btn" data-upgrade="${key}">${level >= 4 ? 'MAXED' : formatMoney(def.costs[level + 1])}</button>
      </div>
    `;

    container.appendChild(item);
  }

  // Add click handlers
  document.querySelectorAll('.upgrade-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.upgrade;
      const level = gameState.upgrades[key];
      const def = upgradeDefs[key];

      if (level < 4) {
        const cost = def.costs[level + 1];
        if (gameState.money >= cost) {
          gameState.money -= cost;
          gameState.upgrades[key]++;
          playUpgradeSound();
          saveGame();

          // Flash effect
          btn.style.transform = 'scale(1.1)';
          btn.style.background = 'rgba(68, 255, 136, 0.3)';
          setTimeout(() => {
            btn.style.transform = '';
            btn.style.background = '';
          }, 200);
        }
      }
    });
  });
}

// ── SAVE/LOAD ──
function saveGame() {
  const save = {
    money: gameState.money,
    lifetime: gameState.lifetime,
    upgrades: gameState.upgrades,
    timestamp: Date.now()
  };
  localStorage.setItem('theclub_save', JSON.stringify(save));
}

function loadGame() {
  const save = localStorage.getItem('theclub_save');
  if (save) {
    const data = JSON.parse(save);
    gameState.money = data.money || 50;
    gameState.lifetime = data.lifetime || 0;
    gameState.upgrades = { ...gameState.upgrades, ...data.upgrades };

    // Offline earnings
    if (data.timestamp) {
      const offlineSeconds = (Date.now() - data.timestamp) / 1000;
      const offlineEarnings = calculateIncome() * Math.min(offlineSeconds, 3600); // Cap at 1 hour
      if (offlineEarnings > 0) {
        gameState.money += offlineEarnings;
        gameState.lifetime += offlineEarnings;
      }
    }
  }
}

function resetGame() {
  if (confirm('Reset all progress? This cannot be undone.')) {
    localStorage.removeItem('theclub_save');
    gameState = {
      money: 50,
      lifetime: 0,
      upgrades: {
        floor: 0,
        walls: 0,
        djBooth: 0,
        bar: 0,
        lighting: 0,
        speakers: 0,
        tables: 0,
        danceFloor: 0
      },
      patrons: []
    };
    buildUpgradesList();
    updateUI();
  }
}

// ── INIT ──
function init() {
  loadGame();
  buildUpgradesList();
  updateUI();

  // Auto-save every 30 seconds
  setInterval(saveGame, 30000);

  // Save on page close
  window.addEventListener('beforeunload', saveGame);

  // Reset button
  document.getElementById('resetBtn').addEventListener('click', resetGame);

  // Audio toggle
  const audioBtn = document.getElementById('audioBtn');
  audioBtn.addEventListener('click', () => {
    if (!audioEnabled) {
      initAudio();
      audioEnabled = true;
      audioBtn.textContent = 'Sound: On';
      audioBtn.classList.add('active');
    } else {
      audioEnabled = false;
      audioBtn.textContent = 'Sound: Off';
      audioBtn.classList.remove('active');
    }
  });

  // Responsive canvas
  function resizeCanvas() {
    const wrapper = document.querySelector('.canvas-wrapper');
    const maxWidth = Math.min(480, window.innerWidth - 60);
    const scale = maxWidth / 480;
    canvas.style.width = maxWidth + 'px';
    canvas.style.height = (400 * scale) + 'px';
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Boot sequence
  setTimeout(() => {
    document.getElementById('bootScreen').classList.add('fade-out');

    setTimeout(() => {
      document.getElementById('main').classList.add('loaded');
      document.getElementById('titleRow').classList.add('loaded');
      document.getElementById('footer').classList.add('loaded');

      requestAnimationFrame(gameLoop);
    }, 300);
  }, 1500);
}

init();
</script>

<script>
// ── MUSIC NOTE CURSOR TRAIL ──
(function() {
  const notes = ['♪', '♫', '♩', '♬'];
  const pool = [];
  const POOL_SIZE = 60;
  let lastX = 0, lastY = 0, lastSpawn = 0;
  const SPAWN_INTERVAL = 35;
  const MIN_DIST = 6;
  for (let i = 0; i < POOL_SIZE; i++) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;font-size:14px;opacity:0;transition:none;user-select:none;will-change:transform,opacity;';
    el.style.color = '#8a8580';
    document.body.appendChild(el);
    pool.push({ el, active: false });
  }
  function spawn(x, y) {
    const note = pool.find(n => !n.active);
    if (!note) return;
    note.active = true;
    note.el.textContent = notes[Math.random() * notes.length | 0];
    note.el.style.fontSize = (10 + Math.random() * 8) + 'px';
    const offsetX = (Math.random() - 0.5) * 16;
    note.el.style.left = (x + offsetX) + 'px';
    note.el.style.top = y + 'px';
    note.el.style.opacity = '0.7';
    note.el.style.transform = 'translateY(0) rotate(' + ((Math.random() - 0.5) * 30) + 'deg)';
    note.el.style.transition = 'none';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const drift = (Math.random() - 0.5) * 20;
        note.el.style.transition = 'transform 1s ease-out, opacity 1s ease-out';
        note.el.style.transform = 'translateY(-' + (40 + Math.random() * 30) + 'px) rotate(' + ((Math.random() - 0.5) * 60) + 'deg) translateX(' + drift + 'px)';
        note.el.style.opacity = '0';
      });
    });
    setTimeout(() => { note.active = false; }, 1050);
  }
  document.addEventListener('mousemove', function(e) {
    const now = Date.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (now - lastSpawn > SPAWN_INTERVAL && dist > MIN_DIST) {
      spawn(e.clientX, e.clientY);
      lastX = e.clientX; lastY = e.clientY;
      lastSpawn = now;
    }
  });
})();
</script>
